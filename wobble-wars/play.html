/* ---- EQUIP: five slots, and every blob you own to fill them with ---- */
let eqSlot = 0, eqTab = 0;
let eqZones = [], eqCards = [], eqDrag = null;     // drag-and-drop bookkeeping, refilled every frame
function eqDropAt(x, y){ for(const z of eqZones) if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h) return z; return null; }
function eqPickAt(x, y){
  for(const z of eqZones) if(z.k && x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h) return {k:z.k, from:z.i};
  for(const c of eqCards) if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h) return {k:c.k, from:null};
  return null;
}
function eqDrop(x, y){
  const t = eqDropAt(x, y);
  if(eqDrag.from!=null){
    if(t){                                          // slot to slot: they trade places
      const a=save.team[eqDrag.from], b=save.team[t.i]||null;
      save.team[t.i]=a; save.team[eqDrag.from]=b; persist();
    } else { save.team[eqDrag.from]=null; persist(); }   // dragged off the slots: unequipped
  } else if(t){ eqSet(t.i, eqDrag.k); }
}
function eqSet(i, k){
  if(!save.team) save.team = ['blob',null,null,null,null];
  for(let j=0;j<TEAM_SLOTS;j++) if(save.team[j]===k && j!==i) save.team[j]=null;   // a blob can only be in one slot
  save.team[i]=k; persist();
}
function drawEquip(dt){
  drawBG(MENU_L, dt);
  X.fillStyle='rgba(6,22,36,.70)'; X.fillRect(0,0,W,H);
  buttons=[]; eqZones=[]; eqCards=[];
  X.textAlign='center';
  X.font='900 32px ui-rounded, Trebuchet MS, sans-serif';
  X.lineWidth=8; X.strokeStyle='#08192a'; X.strokeText('EQUIP YOUR SQUAD', 500, 50);
  const tg=X.createLinearGradient(0,22,0,56); tg.addColorStop(0,'#ffffff'); tg.addColorStop(1,'#ffd86a');
  X.fillStyle=tg; X.fillText('EQUIP YOUR SQUAD', 500, 50);
  X.fillStyle='#8fb4cd'; X.font='700 13px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText('drag a blob into a slot  ·  drag it off the slots to take it out', 500, 76);
  X.textAlign='left';

  // ---- the five slots ----
  const open = slotCount();
  const sw=140, sh=108, gap=14, tot=5*sw+4*gap, x0=(W-tot)/2, sy=92, rowH=sh+12;
  for(let i=0;i<TEAM_SLOTS;i++){
    const row=Math.floor(i/5), locked = i>=open;
    const x=x0+(i%5)*(sw+gap), sy2=sy+row*rowH;
    if(locked){                                    // the five you have not paid for yet
      X.save();
      X.fillStyle='rgba(4,14,24,.45)'; rr(x, sy2, sw, sh, 14); X.fill();
      X.setLineDash([7,7]); X.strokeStyle='rgba(255,216,106,.35)'; X.lineWidth=2.5;
      rr(x, sy2, sw, sh, 14); X.stroke(); X.setLineDash([]);
      X.textAlign='center';
      X.fillStyle='rgba(255,216,106,.55)'; X.font='900 11px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('SLOT '+(i+1), x+sw/2, sy2+20);
      const next = i === FREE_SLOTS + (save.slots||0);      // only the cheapest one is on sale
      const c = slotCost(i), afford = next && save.xp >= c;
      X.fillStyle= afford? 'rgba(255,216,106,.9)' : 'rgba(255,216,106,.45)';
      rr(x+sw/2-13, sy2+44, 26, 21, 5); X.fill();
      X.strokeStyle= afford? 'rgba(255,216,106,.9)' : 'rgba(255,216,106,.45)'; X.lineWidth=4;
      X.beginPath(); X.arc(x+sw/2, sy2+44, 9, Math.PI, 0); X.stroke();
      X.fillStyle= afford? '#ffd86a' : next? '#ff9a7a' : 'rgba(255,216,106,.45)';
      X.font='900 13px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText(c.toLocaleString()+' XP', x+sw/2, sy2+84);
      X.fillStyle= next? (afford? 'rgba(255,216,106,.75)' : 'rgba(255,154,122,.75)') : 'rgba(255,216,106,.4)';
      X.font='800 9px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText(next? (afford? 'TAP TO BUY' : 'NOT ENOUGH XP') : 'BUY SLOT '+(FREE_SLOTS+(save.slots||0)+1)+' FIRST', x+sw/2, sy2+98);
      X.textAlign='left'; X.restore();
      buttons.push({x, y:sy2, w:sw, h:sh, dis:false, fn:()=>buySlot(i)});
      continue;
    }
    const k=(save.team||[])[i], on=(i===eqSlot);
    const live = owned(k);
    eqZones.push({x, y:sy2, w:sw, h:sh, i, k: live? k : null});
    const hov = mouse.x>=x&&mouse.x<=x+sw&&mouse.y>=sy2&&mouse.y<=sy2+sh;
    buttons.push({x, y:sy2, w:sw, h:sh, dis:false, fn:()=>{ eqSlot=i; if(live) eqSet(i, null); }});
    X.save();
    X.fillStyle='rgba(4,14,24,.55)'; rr(x+3, sy2+5, sw, sh, 14); X.fill();
    const g=X.createLinearGradient(0,sy2,0,sy2+sh);
    if(live){ g.addColorStop(0, shade(ucol(k)[1], hov?20:4)); g.addColorStop(1, ucol(k)[2]); }
    else { g.addColorStop(0,'#2b3a48'); g.addColorStop(1,'#182430'); }
    X.fillStyle=g; rr(x, sy2, sw, sh, 14); X.fill();
    X.strokeStyle= on? '#ffd86a' : (live? shade(ucol(k)[2],-22) : 'rgba(140,200,240,.22)');
    X.lineWidth= on? 4 : 2.5; X.stroke();
    X.textAlign='center';
    X.fillStyle= on? '#ffd86a' : 'rgba(255,255,255,.45)';
    X.font='800 11px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText('SLOT '+(i+1), x+sw/2, sy2+17);
    if(live){
      X.save(); rr(x, sy2, sw, sh, 14); X.clip();
      drawMini(k, x+sw/2, sy2+50, 16*Math.min(1, U[k].r/26), 1, i*4+2);
      X.restore();
      const nm=uname(k);
      X.fillStyle='#ffffff';
      X.font='800 '+(nm.length>13? 9 : 11)+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText(nm, x+sw/2, sy2+84);
      X.fillStyle='rgba(255,255,255,.75)'; X.font='800 9px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('\u00a4'+U[k].cost+'  \u00b7  drag to move', x+sw/2, sy2+98);
    } else {
      X.strokeStyle='rgba(255,255,255,.22)'; X.lineWidth=2.5; X.setLineDash([6,6]);
      rr(x+22, sy2+28, sw-44, sh-50, 12); X.stroke(); X.setLineDash([]);
      X.fillStyle='rgba(255,255,255,.35)'; X.font='900 28px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('+', x+sw/2, sy2+64);
      X.fillStyle='rgba(255,255,255,.35)'; X.font='800 10px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('empty', x+sw/2, sy2+90);
    }
    X.textAlign='left'; X.restore();
  }

  // ---- everything you own ----
  if(!save.cheat) eqTab = 0;
  const own = eqTab===1 ? SHADOW_KEYS : unlockedUnits();
  const rosterY = sy + 2*rowH + 12;
  X.fillStyle='#ffd86a'; X.font='800 13px ui-rounded, Trebuchet MS, sans-serif';
  if(save.cheat){                                       // DEV MODE: pick between your blobs and the shadows
    btn(x0, rosterY-30, 118, 24, 'YOUR BLOBS', ()=>{ eqTab=0; }, {fs:11, r:8, c1: eqTab===0?'#ffd86a':'#5f7d94', c2: eqTab===0?'#a0700c':'#2b3f52'});
    btn(x0+126, rosterY-30, 160, 24, 'DEV: SHADOWS', ()=>{ eqTab=1; }, {fs:11, r:8, c1: eqTab===1?'#b58cff':'#5f7d94', c2: eqTab===1?'#4a2f86':'#2b3f52'});
  } else
  X.fillText('YOUR BLOBS', x0, rosterY - 8);
  if(slotCount() < TEAM_SLOTS){
    X.textAlign='right';
    X.fillStyle='rgba(255,216,106,.75)'; X.font='800 11px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText('buy squad slots one at a time \u2014 next: '+slotCost(slotCount()).toLocaleString()+' XP', x0+tot, rosterY-8);
    X.textAlign='left';
  }
  const cw=84, ch = eqTab===1 ? 72 : 84, cg2=9, shTab = eqTab===1;   // shadow cards are shorter: 16 of them
  const rowMax = Math.max(1, Math.floor((W-2*x0+cg2)/(cw+cg2)));
  own.forEach((k,i)=>{
    const cxp = x0 + (i%rowMax)*(cw+cg2), cyp = rosterY + Math.floor(i/rowMax)*(ch+cg2);
    const inTeam = (save.team||[]).indexOf(k) >= 0;
    const hov = mouse.x>=cxp&&mouse.x<=cxp+cw&&mouse.y>=cyp&&mouse.y<=cyp+ch;
    eqCards.push({x:cxp, y:cyp, w:cw, h:ch, k});
    buttons.push({x:cxp, y:cyp, w:cw, h:ch, dis:false, fn:()=>{ eqSet(eqSlot, k); eqSlot=(eqSlot+1)%slotCount(); }});
    X.save();
    X.fillStyle='rgba(4,14,24,.5)'; rr(cxp+3, cyp+4, cw, ch, 12); X.fill();
    const g=X.createLinearGradient(0,cyp,0,cyp+ch);
    g.addColorStop(0, shade(ucol(k)[1], hov?22:4)); g.addColorStop(1, ucol(k)[2]);
    X.fillStyle=g; rr(cxp, cyp-(hov?2:0), cw, ch, 12); X.fill();
    X.strokeStyle= inTeam? '#8affc9' : shade(ucol(k)[2],-24); X.lineWidth= inTeam? 3.5 : 2.5; X.stroke();
    X.save(); rr(cxp, cyp, cw, ch, 12); X.clip();
    drawMini(k, cxp+cw/2, cyp+(shTab? 30 : 36), 13*Math.min(1, U[k].r/26), 1, i*3+5);
    if(isShadow(k)){ X.globalAlpha=0.62; X.fillStyle='#160b28'; X.fillRect(cxp, cyp, cw, ch); }   // it's a shadow
    X.restore();
    X.textAlign='center';
    const nm = isShadow(k) ? U[U[k].shadowOf].nm.replace(/^THE /,'') : uname(k);   // the tint already says shadow
    X.fillStyle='#ffffff'; X.font='800 '+(nm.length>12? 8 : 9)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(nm, cxp+cw/2, cyp+(shTab? 55 : 62));
    X.fillStyle='rgba(255,255,255,.8)'; X.font='800 9px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText('¤'+U[k].cost, cxp+cw/2, cyp+(shTab? 66 : 76));
    if(inTeam){ X.fillStyle='#8affc9'; X.font='900 8px ui-rounded, Trebuchet MS, sans-serif';
                X.fillText('EQUIPPED', cxp+cw/2, cyp+15); }
    X.textAlign='left'; X.restore();
  });

  btn(300, H-58, 190, 44, 'HOW TO PLAY', ()=>{ SFX.click(); scene='how'; }, {fs:15, c1:'#5f7d94', c2:'#2b3f52'});
  btn(510, H-58, 190, 44, 'BACK', ()=>{ SFX.click(); scene='menu'; }, {fs:17, c1:'#5f7d94', c2:'#2b3f52'});

  if(eqDrag && eqDrag.moved>=8){                    // the blob riding the cursor
    const t = eqDropAt(mouse.x, mouse.y);
    if(t){                                          // and the slot it would land in
      X.save(); X.globalAlpha=0.55+0.2*Math.sin(T*6);
      X.strokeStyle='#ffd86a'; X.lineWidth=4; rr(t.x-2, t.y-2, t.w+4, t.h+4, 16); X.stroke(); X.restore();
    }
    X.save(); X.globalAlpha=0.92;
    X.fillStyle='rgba(4,14,24,.45)';
    X.beginPath(); X.ellipse(mouse.x, mouse.y+30, 26, 8, 0, 0, 7); X.fill();
    drawMini(eqDrag.k, mouse.x, mouse.y, 19*Math.min(1, U[eqDrag.k].r/26), 1, 7);
    X.restore();
  }
}

/* ---- battlefield picker: a grid, five to a row ---- */
let selTab = 0;                                  // 0 = campaign, 1 = xp levels
let selScroll = 0, selMax = 0, selDrag = null;   // the picker is one long draggable row
function drawSelect(dt){
  drawBG(MENU_L, dt);
  X.fillStyle='rgba(6,22,36,.66)'; X.fillRect(0,0,W,H);
  X.textAlign='center'; X.font='900 30px ui-rounded, Trebuchet MS, sans-serif';
  X.lineWidth=7; X.strokeStyle='#0c2438'; X.strokeText('CHOOSE A BATTLEFIELD', 500, 44);
  X.fillStyle='#ffffff'; X.fillText('CHOOSE A BATTLEFIELD', 500, 44); X.textAlign='left';

  buttons=[];
  xpPill(14, 10);

  (function(){                                   // section tabs
    const names=['CAMPAIGN','XP LEVELS'], tw=150, gap=10;
    const x0=(W - (names.length*tw + (names.length-1)*gap))/2, y=58, h=28;
    names.forEach((nm,i)=>{
      const x=x0+i*(tw+gap), on=(i===selTab);
      const hov = mouse.x>=x&&mouse.x<=x+tw&&mouse.y>=y&&mouse.y<=y+h;
      buttons.push({x,y,w:tw,h,fn:()=>{ SFX.click(); selTab=i; selScroll=0; },dis:false});
      X.save();
      X.fillStyle = on? 'rgba(255,200,80,.92)' : (hov? 'rgba(20,46,70,.95)' : 'rgba(10,30,50,.85)');
      rr(x,y,tw,h,9); X.fill();
      X.strokeStyle = on? '#ffe9a8' : 'rgba(140,200,240,.28)'; X.lineWidth=2; X.stroke();
      X.fillStyle = on? '#3a2606' : '#9dc4de';
      X.font='800 13px ui-rounded, Trebuchet MS, sans-serif';
      X.textAlign='center'; X.fillText(nm, x+tw/2, y+19); X.textAlign='left';
      X.restore();
    });
  })();

  const LIST = selTab? XP_LEVELS : LEVELS;
  const n=LIST.length;
  const gx=14, cw=190, ch=250, k=1;
  const PAD=40;                                   // the row runs off both edges and you drag it
  const totW=n*cw+(n-1)*gx;
  selMax = Math.max(0, totW - (W - PAD*2));
  selScroll = Math.max(0, Math.min(selMax, selScroll));
  const x0 = (totW < W-PAD*2) ? (W-totW)/2 : PAD - selScroll;
  const y0 = 108, totH = ch;

  LIST.forEach((L,i)=>{
    const x=x0+i*(cw+gx), y=y0;
    if(x > W+20 || x+cw < -20) return;             // off the edge of the screen
    const locked = selTab? false : (i>save.best);
    const hov = !locked && mouse.x>=x&&mouse.x<=x+cw&&mouse.y>=y&&mouse.y<=y+ch;
    if(!locked) buttons.push({x,y,w:cw,h:ch,fn:()=>{ SFX.click(); newBattle(i, selTab===1); scene='battle'; },dis:false});
    const lift = hov?3:0;
    X.save();
    X.fillStyle='rgba(4,14,24,.5)'; rr(x+4,y+6,cw,ch,14); X.fill();
    const g=X.createLinearGradient(0,y,0,y+ch);
    if(locked){ g.addColorStop(0,'#3b4b59'); g.addColorStop(1,'#1b242c'); }
    else { g.addColorStop(0, hov?'#2f7fbd':'#245f92'); g.addColorStop(1,'#10314e'); }
    X.fillStyle=g; rr(x,y-lift,cw,ch,14); X.fill();
    X.strokeStyle= locked?'#141c23':'#0a2138'; X.lineWidth=3; X.stroke();
    // scene strip
    const sh=Math.round(ch*0.44);
    X.save(); rr(x,y-lift,cw,ch,14); X.clip();
    const sg=X.createLinearGradient(0,y-lift,0,y-lift+sh);
    sg.addColorStop(0,L.sky[0]); sg.addColorStop(1,L.sky[1]);
    X.fillStyle=sg; X.fillRect(x,y-lift-6,cw,sh+6);
    X.fillStyle=L.hill; X.beginPath(); X.moveTo(x,y-lift+sh);
    for(let px=0;px<=cw;px+=10) X.lineTo(x+px, y-lift+sh-16-Math.sin(px*0.05+i)*8);
    X.lineTo(x+cw,y-lift+sh); X.closePath(); X.fill();
    if(locked){
      X.fillStyle='rgba(6,14,20,.62)'; X.fillRect(x,y-lift-6,cw,sh+6);
      X.textAlign='center'; X.fillStyle='#8fa6b8';
      X.font='900 '+Math.round(13*Math.max(0.8,k))+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('CLEAR LEVEL '+i, x+cw/2, y-lift+sh*0.6); X.textAlign='left';
    } else {
      const kinds = L.xpMode ? [L.xpMode.k]
                  : [...new Set(L.list.map(e=>e[1]))].slice(0,2);
      if(!L.xpMode){
        if(L.boss) kinds.push(L.boss);
        else if(L.bossWaves) kinds.push(L.bossWaves[L.bossWaves.length-1][0]);
      }
      const lvTraits = [...new Set(kinds.concat(L.xpMode? [] : (L.pool||[])).flatMap(kk => U[kk].traits||[]))];
      lvTraits.forEach((t,j)=> traitIcon(t, x+14+j*16, y-lift+10, 6.5));   // the traits in this level
      X.save();                                    // nothing hangs off the card
      X.beginPath(); X.rect(x, y-lift-6, cw, sh+6); X.clip();
      kinds.forEach((kk,j2)=>{                     // size the portrait by the unit's own size
        const scl = Math.max(0.75, Math.min(1.32, U[kk].r/28)) * (U[kk].boss? 1.06 : 1);
        drawMini(kk, x+cw*(kinds.length>1?0.26:0.46)+j2*cw*0.25,
          y-lift+sh-20-Math.abs(Math.sin(T*3+j2))*4 - 3*(scl-1),
          12.5*scl*Math.max(0.8,k), -1, j2*4+i);
      });
      X.restore();
    }
    X.restore();
    X.textAlign='center';
    X.fillStyle= locked?'#7f94a6':'#ffffff';
    X.font='900 '+Math.round(19*Math.max(0.8,k))+'px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(selTab? 'XP '+(i+1) : 'LEVEL '+(i+1), x+cw/2, y-lift+sh+24);
    X.font='800 '+Math.round(11*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
    X.fillStyle= locked?'#65798a':'#a8dcff';
    X.fillText(L.nm, x+cw/2, y-lift+sh+42);
    X.font='800 '+Math.round(10*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
    X.fillStyle= locked?'#54687a':'#cfeeff';
    X.fillText((!selTab && i<save.best)? 'NEST '+L.bhp+'  ·  REWARD CLAIMED'
                                       : 'NEST '+L.bhp+'  ·  +'+L.xp.toLocaleString()+' XP', x+cw/2, y-lift+sh+58);
    if(selTab){
      X.fillStyle='#ffd86a'; X.font='800 '+Math.round(10*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('FARM  ·  NO PROGRESS', x+cw/2, y-lift+sh+74);
    } else if(i<save.best){
      X.fillStyle='#8ce03e'; X.font='800 '+Math.round(10*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('✓ CLEARED  ·  FIRST CLEAR ONLY', x+cw/2, y-lift+sh+74);
    } else if(L.rareTicket && !locked){
      X.fillStyle='#ffd86a'; X.font='800 '+Math.round(10*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('★ RARE TICKET', x+cw/2, y-lift+sh+74);
    } else if(L.ticket && !locked){
      X.fillStyle='#ffd86a'; X.font='800 '+Math.round(10*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('★ BLOB TICKET', x+cw/2, y-lift+sh+74);
    } else {
      X.fillStyle= locked?'#54687a' : (i<save.best?'#8ce03e':'#ffd86a');
      X.font='800 '+Math.round(10*Math.max(0.82,k))+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText(locked? 'LOCKED' : (i<save.best?'✓ CLEARED':'READY'), x+cw/2, y-lift+sh+74);
    }
    X.textAlign='left'; X.restore();
  });
  if(selMax>0){                                    // a rail, and a nudge either way
    X.save();
    X.fillStyle='rgba(6,22,36,.55)'; rr(PAD, y0+totH+10, W-PAD*2, 6, 3); X.fill();
    const fw=(W-PAD*2)*((W-PAD*2)/totW);
    X.fillStyle='rgba(255,216,106,.75)';
    rr(PAD + (W-PAD*2-fw)*(selScroll/selMax), y0+totH+10, fw, 6, 3); X.fill();
    X.restore();
    btn(6, y0+ch/2-34, 34, 68, '\u2039', ()=>{ selScroll=Math.max(0, selScroll-(cw+gx)); },
        {fs:26, r:10, c1:'#5f7d94', c2:'#2b3f52', disabled:selScroll<=0});
    btn(W-40, y0+ch/2-34, 34, 68, '\u203a', ()=>{ selScroll=Math.min(selMax, selScroll+(cw+gx)); },
        {fs:26, r:10, c1:'#5f7d94', c2:'#2b3f52', disabled:selScroll>=selMax});
  }
  const by = Math.min(H-60, y0+totH+30);
  btn(300, by, 190, 44, 'BLOB LAB', ()=>{ SFX.click(); scene='upg'; }, {fs:17, c1:'#b07dff', c2:'#5a2ba0'});
  btn(510, by, 190, 44, 'BACK', ()=>{ SFX.click(); scene='menu'; }, {fs:17, c1:'#5f7d94', c2:'#2b3f52'});
}

function drawHow(dt){
  drawBG(MENU_L, dt);
  X.fillStyle='rgba(6,22,36,.62)'; X.fillRect(0,0,W,H);
  X.textAlign='center'; X.fillStyle='#ffffff'; X.font='900 40px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText('HOW TO PLAY', 500, 60); X.textAlign='left';
  // the blob list writes itself from the unit table, so it can never go stale
  const COL = {blob:'#3fb0f5', chonk:'#ff9236', sword:'#ff5a46', dino:'#35b36a', boom:'#2fc0ad', jumper:'#ff6fae',
               fierce:'#7b88f0', golden:'#e2b64a', baby:'#6fd8ef', mage:'#8a6fd6', doctor:'#5fd47a', hitman:'#8f9bb3'};
  const f1 = n => (n%1)? n.toFixed(1) : String(n);
  const unitLine = (k)=>{
    const d=U[k], hit = d.bolts? d.bolts.n+' BOLTS' : d.coin? 'OUT + BACK' : d.aoe? 'AREA' : 'SINGLE';
    const tag = d.once? ' · once a battle'
              : (UPG[k] && UPG[k].capsule)? ' · capsule only'
              : (UPG[k] && UPG[k].gate>1)? ' · clears level '+UPG[k].gate : '';
    return [COL[k]||'#3fb0f5',
            U[k].nm+' — ¤'+d.cost+' · '+f1(d.hp)+' HP · '+f1(d.dmg)+' dmg/'+f1(d.rate)+'s · '+hit+tag];
  };
  const lines=[
    ['#7ef3ff', 'BLOB JUICE fills on its own — spend it to deploy. WEALTHY BLOB (button, or W) raises'],
    ['',        'your flow and your cap mid-battle. Permanent upgrades live in the BLOB LAB.'],
    unitLine('blob'), unitLine('chonk'), unitLine('sword'), unitLine('dino'), unitLine('boom'), unitLine('jumper'),
    unitLine('fierce'), unitLine('golden'), unitLine('baby'), unitLine('mage'),
    ['#ffd86a', 'Max a blob at LV 5, then EVOLVE it. EQUIP picks the five (or ten) you take in.'],
    ['#8ce03e', 'SLIME '+f1(U.slime.hp)+' · CYAN '+f1(U.cyan.hp)+' wall · MAGMA '+f1(U.magma.hp)+
                ' blows itself up · BLUE '+f1(U.blue.hp)+' · BRUTE '+f1(U.brute.hp)+' long reach'],
    ['#b9a6ff', 'BLOB CANNON (SPACE) charges, then sweeps a beam down the lane. Knockback launches a'],
    ['',        'unit every so much health lost — and everything is launched once when it dies.'],
    ['#ff9a7a', 'Smash the nest to 0 to win. Keys: 1-9 and 0 deploy · W wealthy · SPACE cannon'],
    ['',        'F speed · P pause · M mute · drag or two-finger scroll the field to look around.']
  ];

/* ================================================================
   XP SLOTS  —  stake up to 5000 XP on three reels
   ================================================================ */
const SLOT_SYM = ['banana','cherry','seven'];
const SLOT_MAX = 5000, SLOT_STEP = 500;
let slotBet = 1000;
let slot = {phase:'idle', t:0, target:[2,2,2], stopAt:[1.0, 1.9, 2.8], payout:0, kind:null};

function slotRoll(){
  if(slot.phase==='spin') return;
  const bet = Math.min(slotBet, SLOT_MAX);
  if(save.xp < bet){ SFX.deny(); return; }
  save.xp -= bet; persist();
  const first = !save.spun;          // the house lets you win the first one
  save.spun = 1;
  const r = first ? 0 : Math.random();
  let target, kind;
  // 30% three-of-a-kind (a third of those sevens, the rest fruit),
  // 30% near miss (first two match), 40% clean miss
  if(r < 0.10){                       // 10% — three sevens, triple
    target = [2,2,2]; kind='triple';
  } else if(r < 0.30){                // 20% — three bananas or three cherries, double
    const k = Math.random()<0.5 ? 0 : 1;
    target = [k,k,k]; kind='double';
  } else if(r < 0.60){                // 30% — so close: first two the same
    kind='none';
    const a = (Math.random()*3)|0;
    let c = (Math.random()*3)|0; if(c===a) c = (a+1)%3;
    target = [a, a, c];
  } else {                            // 40% — nothing lines up at all
    kind='none';
    const a=(Math.random()*3)|0; let b=(Math.random()*3)|0, c=(Math.random()*3)|0;
    if(b===a) b=(a+1)%3;
    if(c===a && c===b) c=(a+2)%3;
    target = [a, b, c];
  }
  slot = {phase:'spin', t:0, target, stopAt:[1.0, 1.9, 2.8], bet,
          payout: kind==='triple'? bet*3 : kind==='double'? bet*2 : 0, kind, paid:false, clicked:[0,0,0]};
  SFX.charge();
}

function slotSymbol(kind, cx, cy, r){
  X.save();
  if(kind===0){                        // a hand of three bananas
    X.save(); X.translate(cx - r*0.04, cy - r*0.62); X.rotate(0.10); X.scale(0.92, 0.92);
    const R=r*0.90, a1=Math.PI*0.10, a2=Math.PI*0.92, thMax=r*0.26, N=28;
    const P=(t)=>{ const a=a1+(a2-a1)*t;
                   return [a, thMax*Math.pow(Math.sin(Math.PI*t), 0.45)]; };   // pointed at both tips
    const tipX=Math.cos(a1)*R, tipY=Math.sin(a1)*R;
    const one=(rot, sc, cols)=>{
      X.save(); X.rotate(rot); X.scale(sc, sc); X.translate(-tipX, -tipY);
      X.beginPath();
      for(let i=0;i<=N;i++){ const [a]=P(i/N); const x=Math.cos(a)*R, y=Math.sin(a)*R; i? X.lineTo(x,y):X.moveTo(x,y); }
      for(let i=N;i>=0;i--){ const [a,th]=P(i/N); X.lineTo(Math.cos(a)*(R-th), Math.sin(a)*(R-th)); }
      X.closePath();
      const g=X.createLinearGradient(0, R*0.28, 0, -R*0.85);
      g.addColorStop(0, cols[0]); g.addColorStop(0.45, cols[1]); g.addColorStop(1, cols[2]);
      X.fillStyle=g; X.fill();
      X.lineWidth=Math.max(1.8, r*0.055); X.strokeStyle='#8a6106'; X.lineJoin='round'; X.stroke();
      X.save(); X.clip();                                    // the pale facet down the outer curve
      X.globalAlpha=0.5; X.strokeStyle='#fff8d0'; X.lineWidth=Math.max(2, r*0.07);
      X.beginPath();
      for(let i=3;i<=N-3;i++){ const [a,th]=P(i/N); const rr2=R-th*0.32;
        const x=Math.cos(a)*rr2, y=Math.sin(a)*rr2; i===3? X.moveTo(x,y):X.lineTo(x,y); }
      X.stroke(); X.restore();
      const [ae,the]=P(1);                                   // dried blossom on the far tip
      X.fillStyle='#4a3205';
      X.beginPath(); X.arc(Math.cos(ae)*(R-the*0.5), Math.sin(ae)*(R-the*0.5), r*0.055, 0, 7); X.fill();
      X.restore();
    };
    const HANG = -Math.PI/2;                                 // swing the fruit below the stalk
    one(HANG-0.36, 0.94, ['#dda413','#f5d03c','#fdeeb4']);
    one(HANG+0.36, 0.94, ['#dda413','#f5d03c','#fdeeb4']);
    one(HANG+0.00, 1.00, ['#f5bf1e','#ffe04e','#fffbe6']);
    X.save(); X.rotate(-0.42);                               // the stalk all three hang from
    X.fillStyle='#6b4a08'; X.strokeStyle='#4a3205'; X.lineWidth=Math.max(1.4, r*0.05);
    rr(-r*0.075, -r*0.34, r*0.15, r*0.42, r*0.07); X.fill(); X.stroke();
    X.fillStyle='#8a6410'; rr(-r*0.10, -r*0.39, r*0.20, r*0.11, r*0.045); X.fill();
    X.restore();
    X.restore();
  } else if(kind===1){                 // cherries
    const lx=-r*0.40, ly=r*0.40, rx2=r*0.40, ry2=r*0.48, cr=r*0.40;
    const knot = [0, -r*0.84];
    // stems
    X.strokeStyle='#4f7d2b'; X.lineWidth=Math.max(2.6, r*0.11); X.lineCap='round';
    X.beginPath(); X.moveTo(cx+knot[0], cy+knot[1]);
    X.quadraticCurveTo(cx-r*0.46, cy-r*0.34, cx+lx, cy+ly-cr*0.86); X.stroke();
    X.beginPath(); X.moveTo(cx+knot[0], cy+knot[1]);
    X.quadraticCurveTo(cx+r*0.52, cy-r*0.30, cx+rx2, cy+ry2-cr*0.86); X.stroke();
    // leaf
    X.save(); X.translate(cx+knot[0]+r*0.06, cy+knot[1]-r*0.02); X.rotate(-0.5);
    const lg=X.createLinearGradient(0,-r*0.14,0,r*0.14);
    lg.addColorStop(0,'#8fd04f'); lg.addColorStop(1,'#4f7d2b');
    X.fillStyle=lg; X.beginPath(); X.ellipse(r*0.28, 0, r*0.32, r*0.15, 0, 0, 7); X.fill();
    X.strokeStyle='#3c6220'; X.lineWidth=Math.max(1.2, r*0.05); X.stroke();
    X.beginPath(); X.moveTo(r*0.02, 0); X.lineTo(r*0.56, 0); X.stroke();
    X.restore();
    // the fruit
    for(const [ox,oy] of [[lx,ly],[rx2,ry2]]){
      const g=X.createRadialGradient(cx+ox-cr*0.34, cy+oy-cr*0.38, cr*0.08, cx+ox, cy+oy, cr*1.15);
      g.addColorStop(0,'#ff8e8e'); g.addColorStop(0.45,'#df2626'); g.addColorStop(1,'#8d1414');
      X.fillStyle=g; X.beginPath(); X.arc(cx+ox, cy+oy, cr, 0, 7); X.fill();
      X.lineWidth=Math.max(1.8, r*0.07); X.strokeStyle='#70100f'; X.stroke();
      X.fillStyle='rgba(255,255,255,.75)';
      X.beginPath(); X.ellipse(cx+ox-cr*0.36, cy+oy-cr*0.40, cr*0.22, cr*0.14, -0.6, 0, 7); X.fill();
      X.fillStyle='rgba(255,255,255,.35)';
      X.beginPath(); X.arc(cx+ox+cr*0.30, cy+oy+cr*0.30, cr*0.10, 0, 7); X.fill();
    }
  } else {                             // lucky seven
    X.font='900 '+Math.round(r*1.9)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.textAlign='center'; X.textBaseline='middle';
    X.lineWidth=Math.max(4, r*0.20); X.lineJoin='round'; X.strokeStyle='#7a1010';
    X.strokeText('7', cx, cy+r*0.06);
    const g=X.createLinearGradient(0, cy-r, 0, cy+r);
    g.addColorStop(0,'#ff6b6b'); g.addColorStop(0.5,'#e02b2b'); g.addColorStop(1,'#a01414');
    X.fillStyle=g; X.fillText('7', cx, cy+r*0.06);
    X.fillStyle='rgba(255,255,255,.55)';
    X.font='900 '+Math.round(r*1.9)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.textAlign='left'; X.textBaseline='alphabetic';
  }
  X.restore();
}

function drawSlots(dt){
  drawBG(MENU_L, dt);
  X.fillStyle='rgba(8,18,34,.82)'; X.fillRect(0,0,W,H);
  X.textAlign='center';
  X.font='900 32px ui-rounded, Trebuchet MS, sans-serif';
  X.lineWidth=8; X.strokeStyle='#08192a'; X.strokeText('XP SLOTS', 500, 50);
  const tg=X.createLinearGradient(0,22,0,56); tg.addColorStop(0,'#ffffff'); tg.addColorStop(1,'#ffd86a');
  X.fillStyle=tg; X.fillText('XP SLOTS', 500, 50);
  X.textAlign='left';

  buttons=[];
  xpPill(16, 14);

  if(slot.phase==='spin') slot.t += dt;
  else if(slot.phase==='done') slot.t += dt;

  // ---- cabinet ----
  const cabX=250, cabY=92, cabW=500, cabH=214;
  X.save();
  X.fillStyle='rgba(4,14,24,.6)'; rr(cabX+6, cabY+10, cabW, cabH, 20); X.fill();
  const cg=X.createLinearGradient(0,cabY,0,cabY+cabH);
  cg.addColorStop(0,'#8a5628'); cg.addColorStop(0.5,'#a9713a'); cg.addColorStop(1,'#6b4019');
  X.fillStyle=cg; rr(cabX, cabY, cabW, cabH, 20); X.fill();
  X.strokeStyle='#3a1f0b'; X.lineWidth=4; X.stroke();
  X.fillStyle='rgba(255,226,170,.18)'; rr(cabX+10, cabY+8, cabW-20, 10, 5); X.fill();
  X.restore();

  // ---- three reels ----
  for(let i=0;i<3;i++){
    const rx0 = cabX+36+i*150, ry0 = cabY+36, rw=128, rh=142;
    X.save();
    X.fillStyle='#1a1208'; rr(rx0-4, ry0-4, rw+8, rh+8, 12); X.fill();
    const wg=X.createLinearGradient(0,ry0,0,ry0+rh);
    wg.addColorStop(0,'#fdf6e6'); wg.addColorStop(0.5,'#fffdf6'); wg.addColorStop(1,'#e8ddc6');
    X.fillStyle=wg; rr(rx0, ry0, rw, rh, 9); X.fill();
    X.save(); rr(rx0, ry0, rw, rh, 9); X.clip();
    const spinning = slot.phase==='spin' && slot.t < slot.stopAt[i];
    if(spinning){
      const speed = 900, off = (slot.t*speed) % (rh*0.9);
      for(let j=-1;j<3;j++){
        const sy = ry0 + rh/2 + j*rh*0.9 - off;
        const symIdx = (((Math.floor(slot.t*speed/(rh*0.9)) + j) % 3) + 3) % 3;
        X.save(); X.globalAlpha=0.55; X.translate(0, 0); X.scale(1, 1.25);
        slotSymbol(symIdx, rx0+rw/2, (sy - ry0*0.25)/1.25, rw*0.28);
        X.restore();
      }
    } else {
      // only while the reels are actually landing — slot.t resets when the spin ends
      const justStopped = slot.phase==='spin'
        ? Math.min(0.22, Math.max(0, 0.22-(slot.t - slot.stopAt[i]))) : 0;
      const sq = 1 + justStopped*1.6;
      X.save(); X.translate(rx0+rw/2, ry0+rh/2); X.scale(1, sq); X.translate(-(rx0+rw/2), -(ry0+rh/2));
      slotSymbol(slot.target[i], rx0+rw/2, ry0+rh/2, rw*0.30);
      X.restore();
      if(slot.phase==='spin' && !slot.clicked[i] && slot.t>=slot.stopAt[i]){
        slot.clicked[i]=1; SFX.click(); tone(420+i*120, 0.08, 'square', 0.12, 260);
      }
    }
    X.restore();
    X.strokeStyle='#4a3218'; X.lineWidth=3; rr(rx0, ry0, rw, rh, 9); X.stroke();
    X.save(); X.globalAlpha=0.18; X.fillStyle='#000000';
    X.fillRect(rx0, ry0, rw, 18); X.fillRect(rx0, ry0+rh-18, rw, 18); X.restore();
    X.restore();
  }

  // finish the spin
  if(slot.phase==='spin' && slot.t >= slot.stopAt[2]+0.25){
    slot.phase='done'; slot.t=0;
    if(!slot.paid){
      slot.paid=true;
      if(slot.payout>0){ save.xp += slot.payout; persist(); SFX.win(); SFX.upgrade(); }
      else { SFX.lose(); }
    }
  }

  // ---- result line ----
  X.textAlign='center';
  if(slot.phase==='done'){
    const pop = 1 + Math.sin(Math.min(1, slot.t/0.4)*Math.PI)*0.12;
    X.save(); X.translate(500, 336); X.scale(pop,pop);
    X.font='900 26px ui-rounded, Trebuchet MS, sans-serif';
    X.fillStyle = slot.payout>0? (slot.kind==='triple'? '#ffd86a' : '#8ce03e') : '#ff9a7a';
    X.fillText(slot.payout>0? '+'+slot.payout.toLocaleString()+' XP'
                            : '\u2212'+slot.bet.toLocaleString()+' XP', 0, 8);
    X.restore();
  } else if(slot.phase==='spin'){
    X.fillStyle='#cfeeff'; X.font='800 18px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText('SPINNING...', 500, 340);
  } else {
    X.fillStyle='#8fb4cd'; X.font='700 14px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText('three bananas or cherries pays double \u00b7 three sevens pays triple', 500, 340);
  }
  X.textAlign='left';

  // ---- stake ----
  const busy = slot.phase==='spin';
  X.save();
  X.fillStyle='rgba(6,22,36,.72)'; rr(330, 362, 340, 46, 12); X.fill();
  X.strokeStyle='rgba(255,216,106,.4)'; X.lineWidth=2; X.stroke(); X.restore();
  X.textAlign='center';
  X.fillStyle='#ffd86a'; X.font='700 10px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText('STAKE', 500, 378);
  X.fillStyle='#ffffff'; X.font='900 22px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText(slotBet.toLocaleString()+' XP', 500, 400);
  X.textAlign='left';
  btn(338, 368, 44, 34, '−', ()=>{ SFX.click(); slotBet=Math.max(SLOT_STEP, slotBet-SLOT_STEP); },
      {fs:20, r:9, disabled:busy, c1:'#5f7d94', c2:'#2b3f52'});
  btn(570, 368, 44, 34, '+', ()=>{ SFX.click(); slotBet=Math.min(SLOT_MAX, slotBet+SLOT_STEP); },
      {fs:20, r:9, disabled:busy, c1:'#5f7d94', c2:'#2b3f52'});
  btn(620, 368, 44, 34, 'MAX', ()=>{ SFX.click(); slotBet=SLOT_MAX; },
      {fs:11, r:9, disabled:busy, c1:'#5f7d94', c2:'#2b3f52'});

  const afford = save.xp >= Math.min(slotBet, SLOT_MAX);
  btn(330, 422, 220, 52, busy? 'SPINNING...' : (afford? 'SPIN' : 'NOT ENOUGH XP'),
      slotRoll, {fs:20, disabled: busy || !afford, c1:'#ffc24d', c2:'#a05a11'});
  btn(566, 422, 150, 52, 'BACK', ()=>{ SFX.click(); slot={phase:'idle',t:0,target:[0,0,0],stopAt:[1.0,1.9,2.8],payout:0,kind:null,clicked:[0,0,0]}; scene='menu'; },
      {fs:18, c1:'#5f7d94', c2:'#2b3f52'});
  X.textAlign='center';
  X.fillStyle='rgba(255,255,255,.4)'; X.font='700 11px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText('stake up to '+SLOT_MAX.toLocaleString()+' XP a spin', 500, 498);
  X.textAlign='left';
}

function isFS(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFS(){
  try{
    if(isFS()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { const el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
  }catch(e){}
}

/* ================================================================
   INPUT + LOOP
   ================================================================ */
function toCv(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
let dragX=null;
const ptrs = new Map();               // live touch points, for the two-finger scroll
let twoX = null;                      // midpoint of the two fingers last frame
function canPan(){ return scene==='battle' && B && FIELD>W; }
function panCam(dx){                  // dx = how far the fingers moved; the field goes the other way
  if(!canPan()) return;
  B.camX = Math.max(0, Math.min(FIELD-W, B.camX - dx));
  B.camT = B.camX; B.camManual = 3.5;
}
function twoMid(){ let s=0; for(const v of ptrs.values()) s+=v; return s/ptrs.size; }
cv.addEventListener('pointermove', e=>{
  const p=toCv(e);
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p.x);
  if(ptrs.size>=2){                   // TWO FINGERS: scroll the map by their midpoint
    dragX=null;
    const mid=twoMid();
    if(twoX!==null) panCam(mid-twoX);
    twoX=mid;
  } else if(eqDrag){
    eqDrag.moved += Math.abs(p.x-eqDrag.x) + Math.abs(p.y-eqDrag.y);
    eqDrag.x=p.x; eqDrag.y=p.y;
  } else if(selDrag){
    const dx = p.x - selDrag.x;
    selDrag.moved += Math.abs(dx);
    selScroll = Math.max(0, Math.min(selMax, selScroll - dx));
    selDrag.x = p.x;
  } else if(dragX!==null && p.y<BAR_Y){
    panCam(p.x-dragX); dragX=p.x;
  }
  mouse.x=p.x; mouse.y=p.y;
});
function dropPtr(e){
  if(eqDrag){                                    // a short hold is still a tap, a long one is a move
    if(eqDrag.moved < 8) onPress(eqDrag.ev);
    else { eqDrop(mouse.x, mouse.y); SFX.click(); }
    eqDrag = null;
  }
  if(selDrag){                                   // let go without sliding? that was a tap
    if(selDrag.moved < 8) onPress(selDrag.ev);
    selDrag = null;
  }
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) twoX = null;
  dragX=null;
  lastPtr = performance.now();                   // a long press must not fire again as a "mouse" click
  if(modal && modal.kind==='cheat' && codeFocus){ try{ codeIn.focus({preventScroll:true}); }catch(err){} }
}
cv.addEventListener('pointerup', dropPtr);
cv.addEventListener('pointercancel', dropPtr);
// trackpad two-finger scroll (and mouse wheel) pans the field too
// A two-finger sideways swipe is the browser's BACK gesture. If the game doesn't claim it, a swipe
// meant to look along the map takes you off the page — so every sideways swipe is the game's.
addEventListener('wheel', e=>{
  if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault();
}, {passive:false});
cv.addEventListener('wheel', e=>{
  if(scene==='select' && selMax>0){
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(d){ e.preventDefault(); selScroll = Math.max(0, Math.min(selMax, selScroll + d*1.1)); }
    return;
  }
  if(!canPan()) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(!d) return;
  e.preventDefault();
  panCam(-d*1.1);
}, {passive:false});
cv.addEventListener('pointerleave', ()=>{ mouse.x=mouse.y=-99; });
let lastPtr=0;
function onPress(e){
  A(); if(!musKind) startMusic(scene==='battle'?'battle':'menu');
  const p=toCv(e); mouse.x=p.x; mouse.y=p.y;
  for(let i=buttons.length-1;i>=0;i--){
    const b=buttons[i];
    if(!b.dis && p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ SFX.click(); b.fn(); return; }
  }
  // a fingertip is fat: a near miss on a touch screen still counts for the closest button
  if(e.pointerType==='touch' || e.pointerType==='pen'){
    let best=null, bd=18;
    for(let i=buttons.length-1;i>=0;i--){
      const b=buttons[i]; if(b.dis) continue;
      const dx=Math.max(b.x-p.x, 0, p.x-(b.x+b.w)), dy=Math.max(b.y-p.y, 0, p.y-(b.y+b.h)), dd=Math.hypot(dx,dy);
      if(dd<bd){ bd=dd; best=b; }
    }
    if(best){ SFX.click(); best.fn(); }
  }
}
cv.addEventListener('pointerdown', e=>{
  lastPtr=performance.now(); const p=toCv(e);
  if(e.pointerType==='touch'){ ptrs.set(e.pointerId, p.x); if(ptrs.size>=2){ twoX=twoMid(); dragX=null; return; } }
  if(scene==='equip'){                             // pick a blob up: from a slot, or off the roster
    const pick = eqPickAt(p.x, p.y);
    if(pick){ eqDrag = {k:pick.k, from:pick.from, x:p.x, y:p.y, moved:0, ev:e};
              mouse.x=p.x; mouse.y=p.y; return; }
  }
  if(scene==='select' && selMax>0 && p.y>90 && p.y<380){
    selDrag = {x:p.x, y:p.y, moved:0, ev:e};        // hold the row; a tap still picks a level
    mouse.x=p.x; mouse.y=p.y;
    return;
  }
  if(p.y<BAR_Y && !modal) dragX=p.x;
  onPress(e);
  if(modal) e.preventDefault();                    // keep the passcode box focused (no stray mouse events)
});
cv.addEventListener('mousedown', e=>{ if(modal) e.preventDefault(); if(performance.now()-lastPtr>350) onPress(e); });
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  A(); if(!musKind) startMusic(scene==='battle'?'battle':'menu');
  if(modal){ modalKey(e); return; }                 // a pop-up is up: keys only type into it
  if(scene==='upg'){
    if(k==='arrowleft'){ e.preventDefault(); if(labIdx>0){ labIdx--; SFX.click(); } }
    if(k==='arrowright'){ e.preventDefault(); if(labIdx<labKeys().length-1){ labIdx++; SFX.click(); } }
    if(k==='arrowup'){ e.preventDefault(); if(labTab>0){ setLabTab(labTab-1); SFX.click(); } }
    if(k==='arrowdown'){ e.preventDefault(); if(labTab<LAB_TABS.length-1){ setLabTab(labTab+1); SFX.click(); } }
    if(k==='enter'){ buyUpg(labKeys()[labIdx]); }
  }
  if(k===' '||e.code==='Space'){ e.preventDefault(); if(scene==='battle') fireCannon(); }
  if(scene==='battle' && B){
    const list=teamUnits();
    if(k==='1' && list[0]) tryDeploy(list[0]);
    if(k==='2' && list[1]) tryDeploy(list[1]);
    if(k==='3' && list[2]) tryDeploy(list[2]);
    if(k==='4' && list[3]) tryDeploy(list[3]);
    if(k==='5' && list[4]) tryDeploy(list[4]);
    if(k==='6' && list[5]) tryDeploy(list[5]);
    if(k==='7' && list[6]) tryDeploy(list[6]);
    if(k==='8' && list[7]) tryDeploy(list[7]);
    if(k==='9' && list[8]) tryDeploy(list[8]);
    if(k==='0' && list[9]) tryDeploy(list[9]);
    if(k==='w') buyWealth();
    if(k==='p'){ if(!B.over) B.paused=!B.paused; }
    if(k==='f'){ fastMode = (fastMode+1) % SPEEDS.length; }
    if(k==='a'){ aiMode = aiMode?0:1; }
    if(k==='escape'){ scene='select'; startMusic('menu'); }
  }
  if(k==='m'){ setMute(!muted); }
});

function fitCanvas(){
  const r = cv.getBoundingClientRect();
  if(!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  const needed = (r.width * dpr) / W;                 // 1:1 with the display
  const mode = QUALITY[Math.min(QUALITY.length-1, save.q|0)];
  let S = mode.s ? Math.max(needed*(mode.mul||1), mode.s) : needed;
  S = Math.max(1, Math.min(qCap, S));
  const px = Math.round(W*S), py = Math.round(H*S);
  if(cv.width!==px || cv.height!==py){
    cv.width=px; cv.height=py; RS=S;
    X.imageSmoothingEnabled = true;
    X.imageSmoothingQuality = 'high';
  }
  X.setTransform(S, 0, 0, S, 0, 0);                   // draw in 1000x560 space
}
addEventListener('resize', fitCanvas);

let last=performance.now();
function tickFrame(now){
  if(save.cheat && save.xp < CHEAT_XP) save.xp = CHEAT_XP;   // infinite XP
  const raw=(now-last)/1000;
  let dt=Math.max(0, raw); last=Math.max(last, now);   // time never runs backwards
  const SPEED = SPEEDS[fastMode] || 1;             // SPEED button: 1x, 1.5x, then 2x
  // if real render frames (not tab throttling) run long, step the resolution down
  if(raw>0.030 && raw<0.20){ qSlow++; } else if(raw<0.020){ qSlow=Math.max(0,qSlow-2); }
  if(qSlow>60 && qCap>1.25){ qCap=Math.max(1.25, qCap-0.8); qSlow=0; }
  fitCanvas();
  dt=Math.min(0.05, dt) * (scene==='battle'? SPEED : 1);
  T += dt;
  if(hitStop>0){ hitStop-=dt; }
  X.save();
  if(shake>0){
    const s=shake; X.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    shake=Math.max(0, shake - dt*46);
  }
  X.fillStyle='#0b1a2a'; X.fillRect(-40,-40,W+80,H+80);
  // step the sim first: a battle that ends mid-update draws its new scene the same frame
  if(scene==='battle' && B && !B.paused && hitStop<=0) updateBattle(dt);
  if(SG) SG.gain.value = ((scene==='cap') ? 0.6 : 1.10) * sfxVol();   // the sliders ride on top
  if(scene==='menu'){ drawMenu(dt); if(musKind && musKind!=='menu') stopMusic(); if(!musKind) startMusic('menu'); }
  else if(scene==='how') drawHow(dt);
  else if(scene==='equip'){ drawEquip(dt); if(musKind && musKind!=='menu') stopMusic(); if(!musKind) startMusic('menu'); }
  else if(scene==='slots'){ drawSlots(dt); if(musKind && musKind!=='casino') stopMusic(); if(!musKind) startMusic('casino'); }
  else if(scene==='credits'){ drawCredits(dt); if(musKind && musKind!=='menu') stopMusic(); if(!musKind) startMusic('menu'); }
  else if(scene==='select'){ drawSelect(dt); if(musKind && musKind!=='menu') stopMusic(); if(!musKind) startMusic('menu'); }
  else if(scene==='upg'){ drawUpg(dt); if(musKind && musKind!=='menu') stopMusic(); if(!musKind) startMusic('menu'); }
  else if(scene==='cap'){ drawCapsule(dt); if(musKind && musKind!=='casino') stopMusic(); if(!musKind) startMusic('casino'); }
  else if(scene==='result' && result) drawResult(dt);
  else if(scene==='battle' && B) drawBattle(dt);
  X.restore();
  if(audioPop) drawAudioPop();
  if(modal){ if(scene==='menu') drawModal(dt); else closeModal(); }
  if(flashScreen>0){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flashScreen*0.55;
    X.fillStyle='#cfeeff'; X.fillRect(0,0,W,H); X.restore();
    flashScreen=Math.max(0, flashScreen-dt*2.2);
  }
}
function frame(now){ tickFrame(now); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>
