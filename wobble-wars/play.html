  X.globalAlpha=0.19; X.fillStyle='#ffffff';
  X.beginPath(); X.ellipse(cx, cy+ry*0.2, rx*0.62, ry*0.44, 0,0,7); X.fill();
  X.globalAlpha=0.35; X.fillStyle=c[0];
  for(let i=0;i<5;i++){
    const bx = cx + Math.sin(T*1.3+i*2.1+u.seed)*rx*0.5;
    const by = cy + ry*0.6 - ((T*24 + i*37 + u.seed*11)%(ry*1.5));
    X.beginPath(); X.arc(bx, by, rx*(0.06+0.03*(i%3)), 0,7); X.fill();
  }
  X.restore();
  // gloss
  X.fillStyle='rgba(255,255,255,.5)';
  X.beginPath(); X.ellipse(cx-rx*0.36, cy-ry*0.50, rx*0.21, ry*0.11, -0.55,0,7); X.fill();
  X.fillStyle='rgba(255,255,255,.32)';
  X.beginPath(); X.ellipse(cx-rx*0.15, cy-ry*0.62, rx*0.07, ry*0.05, -0.4,0,7); X.fill();
  // face
  eyes(cx, cy-ry*0.14, rx, dir, 'slit', u.blink>0, true);
  X.strokeStyle=INK; X.lineWidth=Math.max(2,rx*0.08); X.lineCap='round';
  X.beginPath();
  if(u.sw>0){ X.arc(cx+dir*rx*0.05, cy+ry*0.16, rx*0.26, 1.15*Math.PI, 1.85*Math.PI); }
  else { X.moveTo(cx-rx*0.2, cy+ry*0.26); X.quadraticCurveTo(cx, cy+ry*0.14, cx+rx*0.2, cy+ry*0.26); }
  X.stroke();
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,wob,fq,T,u.seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}


/* ---- GREEN GOOP: a low toxic puddle that bubbles and drips ---- */
function drawGoop(u, cx, cy, rx, ry, dir, flash){
  const c = U[u.k].c, seed=u.seed||1;
  const ryy = ry*0.70, cyy = cy + ry*0.30;
  shadow(cx, rx*1.15, 0.26);
  X.save(); X.globalAlpha=0.55; X.fillStyle=c[2];                       // the spill under it
  X.beginPath(); X.ellipse(cx, GY+1, rx*1.25+Math.sin(T*2.2+seed)*3, rx*0.22, 0,0,7); X.fill(); X.restore();
  const lunge = u.sw>0 ? Math.sin(Math.min(1,(1-u.sw/u.swT)/0.6)*Math.PI) : 0;
  const bx = cx + dir*rx*0.18*lunge;
  gooPath(bx, cyy, rx, ryy*(1+0.12*lunge), 0.12, 6, T*1.4, seed, true);
  const g = X.createRadialGradient(bx-rx*0.3, cyy-ryy*0.5, rx*0.1, bx, cyy, rx*1.3);
  g.addColorStop(0, c[0]); g.addColorStop(0.45, c[1]); g.addColorStop(1, c[2]);
  X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2, rx*0.08); X.strokeStyle=c[2]; X.stroke();
  X.save(); X.clip();                                                    // bubbles rising inside
  for(let i=0;i<4;i++){
    const ph=((T*0.7 + i*0.25 + seed*0.13)%1);
    X.globalAlpha=0.55*(1-ph); X.fillStyle='#eaff9a';
    X.beginPath(); X.arc(bx+(i-1.5)*rx*0.42, cyy+ryy*0.6-ph*ryy*1.4, rx*(0.07+0.04*(i%2)), 0, 7); X.fill();
  }
  X.restore();
  for(let i=0;i<3;i++){                                                  // bubbles popping off the top
    const ph=((T*0.9 + i*0.33 + seed*0.2)%1), px=bx+(i-1)*rx*0.45;
    X.save(); X.globalAlpha=0.8*(1-ph); X.strokeStyle='#c8ff5a'; X.lineWidth=Math.max(1, rx*0.05);
    X.beginPath(); X.arc(px, cyy-ryy*0.95-ph*ry*0.9, rx*(0.06+ph*0.10), 0, 7); X.stroke(); X.restore();
  }
  for(let i=0;i<2;i++){                                                  // drips
    const ph=((T*0.6 + i*0.5 + seed*0.3)%1), dx=bx+(i?1:-1)*rx*0.62;
    X.fillStyle=c[1]; X.beginPath(); X.ellipse(dx, cyy+ryy*0.2+ph*ryy*0.9, rx*0.07, rx*(0.10+ph*0.08), 0, 0, 7); X.fill();
  }
  X.fillStyle='rgba(255,255,255,.45)';
  X.beginPath(); X.ellipse(bx-rx*0.40, cyy-ryy*0.45, rx*0.20, ryy*0.12, -0.5, 0,7); X.fill();
  eyes(bx+dir*rx*0.08, cyy-ryy*0.25, rx*0.85, dir, 'slit', u.blink>0, true);
  X.strokeStyle=INK; X.lineWidth=Math.max(2, rx*0.08); X.lineCap='round';
  X.beginPath(); X.moveTo(bx+dir*rx*0.02-rx*0.18, cyy+ryy*0.28);
  X.quadraticCurveTo(bx+dir*rx*0.06, cyy+ryy*(u.sw>0?0.02:0.14), bx+dir*rx*0.10+rx*0.18, cyy+ryy*0.28); X.stroke();
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(bx, cyy, rx, ryy, 0.12, 6, T*1.4, seed, true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}
/* ---- THE PURPLE SLUDGE: a heaped purple mass, no arms, one enormous jaw and a purple tongue.
   Its head lifts far too high, then slams shut on whatever is in front ---- */
function sludgeOpen(u){
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, ss=x=>x*x*(3-2*x);
  if(p<0) return 0.04 + 0.03*Math.sin(T*1.7+(u.seed||1));            // breathing, jaw just apart
  if(p<0.78) return ss(p/0.78);                                         // up, up, far too far
  if(p<0.88){ const q=(p-0.78)/0.10; return 1 - q*q; }                  // SLAM
  const q=(p-0.88)/0.12; return 0.10*Math.sin(q*Math.PI)*(1-q);         // a little rebound
}
function drawSludge(u, cx, cy, rx, ry, dir, flash){
  const c = U[u.k].c, seed=u.seed||1, op = sludgeOpen(u);
  const dark = 'rgba(58,18,86,.58)', lipC = shade(c[1],-34);
  const wavy = (x0,y0,x1,y1,amp,ph)=>{ X.beginPath(); for(let i=0;i<=10;i++){ const f=i/10;
      const x=x0+(x1-x0)*f, y=y0+(y1-y0)*f + Math.sin(f*Math.PI*2+ph)*amp; if(i) X.lineTo(x,y); else X.moveTo(x,y); } X.stroke(); };
  shadow(cx, rx*1.30, 0.32);
  X.save(); X.globalAlpha=0.62; X.fillStyle=c[2];                                // the puddle it drags along
  X.beginPath(); X.ellipse(cx, GY+2, rx*1.40+Math.sin(T*1.6+seed)*4, rx*0.20, 0,0,7); X.fill(); X.restore();
  const seamY = cy + ry*0.02;                                                      // where the jaws meet
  const lift = op*ry*2.1;                                                          // WAY too high
  const hcx = cx + dir*rx*0.04, hcy = seamY - ry*0.34 - lift;                     // centre of the head
  const bodyG = (y0,y1)=>{ const g=X.createRadialGradient(cx-rx*0.35, y0, rx*0.1, cx, (y0+y1)/2, rx*1.4);
      g.addColorStop(0, c[0]); g.addColorStop(0.45, c[1]); g.addColorStop(1, shade(c[1],-24)); return g; };
  // the gooey back of the head, stretching as it rises (so the head never floats free)
  if(lift>2){
    const bx = cx - dir*rx*0.46, top = hcy, bot = seamY + ry*0.2;
    gooPath(bx, (top+bot)/2, rx*(0.46 - op*0.10), (bot-top)/2 + ry*0.10, 0.05, 4, T, seed+7, true);
    X.fillStyle=bodyG(top, bot); X.fill(); X.lineWidth=Math.max(2, rx*0.06); X.strokeStyle=c[2]; X.stroke();
  }
  // inside the mouth
  if(op>0.04){
    const top = hcy + ry*0.46, bot = seamY + ry*0.04;
    X.fillStyle='#240a33';
    X.beginPath(); X.ellipse(cx+dir*rx*0.18, (top+bot)/2, rx*0.82, (bot-top)/2 + ry*0.08, 0, 0, 7); X.fill();
    X.fillStyle='rgba(120,40,140,.35)';
    X.beginPath(); X.ellipse(cx+dir*rx*0.05, (top+bot)/2, rx*0.40, (bot-top)*0.34, 0, 0, 7); X.fill();
  }
  // the heap (lower jaw and body)
  gooPath(cx, cy+ry*0.36, rx*1.14, ry*0.64, 0.08, 6, T*0.9, seed, true);
  X.fillStyle=bodyG(cy, GY); X.fill(); X.lineWidth=Math.max(2, rx*0.07); X.strokeStyle=c[2]; X.stroke();
  X.save(); X.clip();
  X.strokeStyle=dark; X.lineWidth=Math.max(2, rx*0.085); X.lineCap='round';
  wavy(cx-rx*1.0, cy+ry*0.35, cx-rx*0.30, cy+ry*0.80, ry*0.06, T*0.8+seed);
  wavy(cx-rx*0.15, cy+ry*0.50, cx+rx*0.65, cy+ry*0.82, ry*0.05, T*0.7+seed+2);
  wavy(cx+rx*0.45, cy+ry*0.30, cx+rx*1.05, cy+ry*0.62, ry*0.05, T*0.9+seed+4);
  X.strokeStyle=lipC; X.lineWidth=Math.max(2, rx*0.13);                           // the lower lip
  X.beginPath(); X.ellipse(cx+dir*rx*0.18, seamY+ry*0.02, rx*0.80, ry*0.12, 0, Math.PI*1.05, Math.PI*1.95); X.stroke();
  X.restore();
  // drips off the heap
  for(let i=0;i<3;i++){ const ph=((T*0.45 + i*0.33 + seed*0.1)%1), dx=cx+(i-1)*rx*0.8;
    X.fillStyle=c[1]; X.beginPath(); X.ellipse(dx, cy+ry*0.72+ph*ry*0.22, rx*0.06, ry*(0.06+ph*0.08), 0, 0, 7); X.fill(); }
  // the tongue: big, purple, lolling over the lower lip
  X.save(); X.fillStyle='#c257d6'; X.strokeStyle='#6f2386'; X.lineWidth=Math.max(1.5, rx*0.045);
  const tip = cx + dir*rx*(0.62 + op*0.25), tipY = seamY + ry*(0.22 + op*0.08);
  X.beginPath(); X.moveTo(cx-dir*rx*0.30, seamY-ry*0.02);
  X.quadraticCurveTo(cx+dir*rx*0.25, seamY - ry*(0.16+op*0.30), tip, tipY);
  X.quadraticCurveTo(cx+dir*rx*0.40, seamY + ry*0.30, cx-dir*rx*0.10, seamY + ry*0.10);
  X.closePath(); X.fill(); X.stroke();
  X.strokeStyle='rgba(111,35,134,.75)';
  X.beginPath(); X.moveTo(cx-dir*rx*0.05, seamY+ry*0.02); X.quadraticCurveTo(cx+dir*rx*0.30, seamY-ry*(0.04+op*0.16), tip-dir*rx*0.08, tipY-ry*0.03); X.stroke();
  X.restore();
  // goo strings from the roof of the mouth
  if(op>0.10){
    X.save(); X.strokeStyle=c[1]; X.lineCap='round';
    for(let i=0;i<4;i++){ const sx = cx + dir*rx*(-0.10+i*0.26), len = Math.min(1, op*1.4)*(seamY-hcy-ry*0.36)*(0.35+0.2*(i%2));
      X.globalAlpha=0.85; X.lineWidth=Math.max(1, rx*(0.05-i*0.008));
      X.beginPath(); X.moveTo(sx, hcy+ry*0.50); X.lineTo(sx, hcy+ry*0.50+len); X.stroke();
      X.fillStyle=c[1]; X.beginPath(); X.arc(sx, hcy+ry*0.50+len, rx*0.035, 0, 7); X.fill(); }
    X.restore();
  }
  // the head / upper jaw
  X.save();
  const tilt = -dir*op*0.22;
  X.translate(hcx - dir*rx*0.4, hcy); X.rotate(tilt); X.translate(-(hcx - dir*rx*0.4), -hcy);
  gooPath(hcx, hcy, rx*0.94, ry*0.70, 0.06, 5, T*0.8, seed+3, true);
  X.fillStyle=bodyG(hcy-ry*0.5, hcy+ry*0.5); X.fill(); X.lineWidth=Math.max(2, rx*0.07); X.strokeStyle=c[2]; X.stroke();
  X.save(); X.clip();
  X.strokeStyle=dark; X.lineWidth=Math.max(2, rx*0.08); X.lineCap='round';
  wavy(hcx-dir*rx*0.95, hcy-ry*0.05, hcx-dir*rx*0.35, hcy-ry*0.45, ry*0.05, T*0.6+seed);
  wavy(hcx-dir*rx*0.80, hcy+ry*0.25, hcx-dir*rx*0.15, hcy-ry*0.05, ry*0.04, T*0.7+seed+3);
  X.strokeStyle=lipC; X.lineWidth=Math.max(2, rx*0.14);                             // the thick upper lip
  X.beginPath(); X.ellipse(hcx+dir*rx*0.14, hcy+ry*0.62, rx*0.84, ry*0.18, 0, Math.PI*0.02, Math.PI*0.98); X.stroke();
  X.restore();
  X.fillStyle='rgba(255,255,255,.45)';
  X.beginPath(); X.ellipse(hcx-rx*0.40, hcy-ry*0.28, rx*0.22, ry*0.09, -0.4, 0,7); X.fill();
  eyes(hcx+dir*rx*0.20, hcy-ry*0.22, rx*0.74, dir, 'slit', u.blink>0, true);
  X.restore();
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.7;
    gooPath(cx, cy+ry*0.36, rx*1.14, ry*0.64, 0.08, 6, T*0.9, seed, true); X.fillStyle='#ffffff'; X.fill();
    gooPath(hcx, hcy, rx*0.94, ry*0.70, 0.06, 5, T*0.8, seed+3, true); X.fill(); X.restore(); }
}

/* ---- FROG ELITE: a frog behind a round wooden shield, spear held over it ---- */
function drawFrog(u, cx, cy, rx, ry, dir, flash){
  const c = U[u.k].c, seed=u.seed||1, stab = u.sw>0 ? (u.stab||0) : 0;
  const by = cy + ry*0.18, bry = ry*0.78;
  shadow(cx, rx*1.0, 0.26);
  // back leg
  X.fillStyle=shade(c[1],-12); X.beginPath(); X.ellipse(cx-dir*rx*0.55, GY-ry*0.18, rx*0.42, ry*0.24, 0, 0, 7); X.fill();
  // body
  gooPath(cx, by, rx, bry, 0.03, 3, T, seed, true);
  const g = X.createRadialGradient(cx-rx*0.3, by-bry*0.5, rx*0.1, cx, by, rx*1.2);
  g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, shade(c[1],-18));
  X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2, rx*0.08); X.strokeStyle=c[2]; X.stroke();
  X.save(); X.clip(); X.fillStyle='rgba(255,255,220,.45)';                     // pale belly
  X.beginPath(); X.ellipse(cx+dir*rx*0.15, by+bry*0.55, rx*0.62, bry*0.45, 0, 0, 7); X.fill(); X.restore();
  // bulging eyes on top
  for(const sgn of [-1,1]){
    const ex = cx + dir*rx*0.18 + sgn*rx*0.36, ey = by - bry*0.92;
    X.fillStyle=c[1]; X.beginPath(); X.arc(ex, ey, rx*0.30, 0, 7); X.fill(); X.lineWidth=Math.max(1.5, rx*0.06); X.strokeStyle=c[2]; X.stroke();
    X.fillStyle='#fffbe8'; X.beginPath(); X.arc(ex, ey-rx*0.02, rx*0.21, 0, 7); X.fill();
    X.fillStyle='#1d2a18'; X.beginPath(); X.ellipse(ex+dir*rx*0.05, ey, rx*0.07, rx*(u.blink>0?0.02:0.13), 0, 0, 7); X.fill();
    X.strokeStyle=c[2]; X.lineWidth=Math.max(2, rx*0.07);                      // a stern brow
    X.beginPath(); X.moveTo(ex-rx*0.22, ey-rx*0.26+sgn*dir*rx*0.04); X.lineTo(ex+rx*0.22, ey-rx*0.26-sgn*dir*rx*0.04); X.stroke();
  }
  // wide frog mouth
  X.strokeStyle=INK; X.lineWidth=Math.max(2, rx*0.07); X.lineCap='round';
  X.beginPath(); X.moveTo(cx-dir*rx*0.30, by-bry*0.30); X.quadraticCurveTo(cx+dir*rx*0.30, by-bry*0.05, cx+dir*rx*0.85, by-bry*0.38); X.stroke();
  // the spear, held level over the shield
  X.save();
  const sx = cx + dir*rx*(0.10 + Math.max(-0.35, stab)*0.55), sy = by - bry*0.12, L = rx*2.4;
  X.translate(sx, sy); X.scale(dir, 1);
  X.strokeStyle='#7a5228'; X.lineWidth=Math.max(2, rx*0.10);
  X.beginPath(); X.moveTo(-L*0.45, 0); X.lineTo(L*0.52, 0); X.stroke();
  X.fillStyle='#d5dde4'; X.strokeStyle='#6b7680'; X.lineWidth=Math.max(1, rx*0.04);
  X.beginPath(); X.moveTo(L*0.50, -rx*0.14); X.lineTo(L*0.72, 0); X.lineTo(L*0.50, rx*0.14); X.closePath(); X.fill(); X.stroke();
  X.fillStyle='#b8412e'; X.beginPath(); X.moveTo(L*0.46, 0); X.lineTo(L*0.40, rx*0.22); X.lineTo(L*0.36, 0); X.closePath(); X.fill();   // a pennant
  X.restore();
  // the shield (gone once broken)
  if(u.shield>0 || u.mini){
    const shx = cx + dir*rx*0.62, shy = by + bry*0.15, sr = rx*0.62, crack = u.shieldMax? 1 - u.shield/u.shieldMax : 0;
    X.save();
    const sg = X.createRadialGradient(shx-sr*0.3, shy-sr*0.3, sr*0.1, shx, shy, sr);
    sg.addColorStop(0,'#d9a765'); sg.addColorStop(1,'#8a5a2a');
    X.fillStyle=sg; X.beginPath(); X.arc(shx, shy, sr, 0, 7); X.fill();
    X.strokeStyle='#9aa4ad'; X.lineWidth=Math.max(2, rx*0.11); X.stroke();
    X.strokeStyle='rgba(90,55,20,.6)'; X.lineWidth=Math.max(1, rx*0.04);
    for(const k of [-0.45, 0, 0.45]){ X.beginPath(); X.moveTo(shx+k*sr, shy-sr*0.9); X.lineTo(shx+k*sr, shy+sr*0.9); X.stroke(); }
    X.fillStyle='#c9cfd6'; X.beginPath(); X.arc(shx, shy, sr*0.22, 0, 7); X.fill();
    if(crack>0.33){                                  // it cracks as it soaks the hits
      X.strokeStyle='#3a2410'; X.lineWidth=Math.max(1, rx*0.05);
      X.beginPath(); X.moveTo(shx-sr*0.1, shy-sr*0.8); X.lineTo(shx+sr*0.15, shy-sr*0.25); X.lineTo(shx-sr*0.05, shy+sr*0.1);
      if(crack>0.66){ X.lineTo(shx+sr*0.3, shy+sr*0.6); X.moveTo(shx+sr*0.15, shy-sr*0.25); X.lineTo(shx+sr*0.6, shy-sr*0.35); }
      X.stroke();
    }
    X.restore();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.7;
    gooPath(cx, by, rx, bry, 0.03, 3, T, seed, true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}
/* ---- THE TIDE: long white hair and beard, a green cloak over a pale robe, a staff he raises to
   call the water — it glows while he charges (2s), then he swings it down and the tsunami goes (1.5s) ---- */
function drawLord(u, cx, cy, rx, ry, dir, flash){
  const H = ry, R = rx, gy = u.mini ? ry*0.96 : GY - cy;
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, h = U.lord.hitP;
  const charge = p<0 ? 0 : (p<h ? p/h : 0), rel = p>=h ? (p-h)/(1-h) : 0;
  const ss = x => x*x*(3-2*x);
  shadow(cx, R*0.9, 0.3);
  X.save(); X.translate(cx, cy); X.scale(dir, 1); X.lineJoin='round'; X.lineCap='round';
  const sway = Math.sin(T*1.6 + (u.seed||1))*0.05;
  const shY = gy - 2.15*H, waist = gy - 1.15*H;
  // cloak behind, billowing
  X.fillStyle = '#245c3b';
  X.beginPath(); X.moveTo(-0.30*R, shY); X.quadraticCurveTo(-1.05*R - sway*R*3, gy - 1.2*H, -0.95*R - sway*R*4, gy - 0.02*H);
  X.lineTo(0.15*R, gy); X.lineTo(0.25*R, shY); X.closePath(); X.fill();
  // sandals
  X.fillStyle='#6b4423';
  X.beginPath(); X.ellipse(0.22*R, gy-0.04*H, 0.22*R, 0.07*H, 0, 0, 7); X.fill();
  X.beginPath(); X.ellipse(-0.20*R, gy-0.04*H, 0.20*R, 0.07*H, 0, 0, 7); X.fill();
  // pale inner robe
  X.fillStyle = '#d9cba6'; X.strokeStyle = '#8a7a55'; X.lineWidth = Math.max(1.5, R*0.03);
  X.beginPath(); X.moveTo(-0.30*R, shY); X.lineTo(0.32*R, shY); X.lineTo(0.48*R, gy - 0.05*H); X.lineTo(-0.42*R, gy - 0.05*H); X.closePath(); X.fill(); X.stroke();
  X.strokeStyle='rgba(120,100,60,.45)'; X.lineWidth=Math.max(1, R*0.025);
  for(const k of [-0.15, 0.1, 0.3]){ X.beginPath(); X.moveTo(k*R, waist + 0.15*H); X.quadraticCurveTo((k+0.04)*R, gy - 0.5*H, (k+0.08)*R, gy - 0.08*H); X.stroke(); }
  // green cloak over the shoulders and down the front, with a dark and a light stripe
  X.fillStyle = '#2f7a4a';
  X.beginPath(); X.moveTo(-0.42*R, shY - 0.05*H); X.quadraticCurveTo(0, shY - 0.22*H, 0.42*R, shY - 0.05*H);
  X.lineTo(0.30*R, waist); X.lineTo(0.18*R, gy - 0.05*H); X.lineTo(-0.10*R, gy - 0.05*H); X.lineTo(-0.36*R, waist); X.closePath(); X.fill();
  X.strokeStyle = '#163d25'; X.lineWidth = Math.max(2, R*0.06);
  X.beginPath(); X.moveTo(0.20*R, shY + 0.05*H); X.lineTo(0.10*R, gy - 0.08*H); X.stroke();
  X.strokeStyle = '#6cc48a'; X.lineWidth = Math.max(1.5, R*0.03);
  X.beginPath(); X.moveTo(0.27*R, shY + 0.05*H); X.lineTo(0.17*R, gy - 0.08*H); X.stroke();
  X.fillStyle = '#7a4a26'; X.fillRect(-0.34*R, waist - 0.07*H, 0.68*R, 0.14*H);   // sash
  // the staff arm: raised while charging, swung forward on release
  const ang = p<0 ? -0.15 + sway : (p<h ? -0.15 - 0.95*ss(charge) : -1.10 + 2.35*ss(Math.min(1, rel*3)));
  const hx = -0.30*R, hy = shY + 0.12*H;
  const hand = {x: hx + Math.sin(ang+0.6)*0.55*R, y: hy - Math.cos(ang+0.6)*0.55*R - 0.3*H*charge};
  X.strokeStyle = '#2f7a4a'; X.lineWidth = R*0.22;
  X.beginPath(); X.moveTo(hx, hy); X.lineTo(hand.x, hand.y); X.stroke();
  X.fillStyle = '#e7b993'; X.beginPath(); X.arc(hand.x, hand.y, R*0.11, 0, 7); X.fill();
  X.save(); X.translate(hand.x, hand.y); X.rotate(ang);
  X.strokeStyle = '#5a3a1e'; X.lineWidth = R*0.10;
  X.beginPath(); X.moveTo(0, 1.0*H); X.lineTo(0, -1.55*H); X.stroke();
  X.fillStyle = '#6e4826'; X.beginPath(); X.ellipse(0, -1.62*H, R*0.10, R*0.14, 0, 0, 7); X.fill();
  if(charge>0 || rel>0){                                    // it glows as he gathers the sea
    const gl = charge>0 ? charge : Math.max(0, 1-rel*2.5);
    X.globalCompositeOperation='lighter';
    const rg = X.createRadialGradient(0, -1.62*H, 1, 0, -1.62*H, R*(0.25+0.65*gl));
    rg.addColorStop(0,'rgba(230,255,250,.95)'); rg.addColorStop(0.4,'rgba(90,220,200,.6)'); rg.addColorStop(1,'rgba(40,160,150,0)');
    X.fillStyle = rg; X.beginPath(); X.arc(0, -1.62*H, R*(0.25+0.65*gl), 0, 7); X.fill();
    if(gl>0.3){                                              // forks of lightning off the tip
      X.strokeStyle = 'rgba(235,255,250,.9)'; X.lineWidth = 2;

/* ---- MUSHROOM SLIME: a pale stalky slime under a big spotted cap ---- */
function drawShroom(u, cx, cy, rx, ry, dir, flash){

/* ---- THE TOAD KING: a fat green toad with a lavender throat pouch, purple spots, big grumpy eyes
   and a proper crown. Drawn facing +x in local space, then flipped by dir; the tongue does the work ---- */
function toadPath(R, H, gy){
  X.beginPath();
  X.moveTo(-1.08*R, gy);
  X.bezierCurveTo(-1.22*R, gy-0.55*H, -0.98*R, gy-1.08*H, -0.45*R, gy-1.22*H);     // the back hump
  X.bezierCurveTo( 0.05*R, gy-1.40*H,  0.72*R, gy-1.30*H,  0.98*R, gy-0.86*H);     // over the head to the snout
  X.bezierCurveTo( 1.14*R, gy-0.56*H,  1.06*R, gy-0.14*H,  0.88*R, gy);            // chin down to the ground
  X.closePath();
}
function drawToad(u, cx, cy, rx, ry, dir, flash){

    X.strokeStyle='#ff86b2'; X.lineWidth=Math.max(3, rx*0.13);
    X.beginPath(); X.moveTo(mx, my); X.quadraticCurveTo((mx+u.tongueX)/2, midY, u.tongueX, u.tongueY); X.stroke();
    X.fillStyle='#ff86b2'; X.beginPath(); X.arc(u.tongueX, u.tongueY, rx*0.17, 0, 7); X.fill();
    X.strokeStyle='#a8325f'; X.lineWidth=Math.max(2, rx*0.05); X.stroke();
    X.restore();

  shadow(cx, rx*1.15, 0.30);
  X.save(); X.translate(cx, cy); X.scale(dir, 1);
  X.lineJoin='round'; X.lineCap='round';

  X.beginPath(); X.ellipse(-0.92*R, gy-0.06*H, 0.30*R, 0.10*H, 0, 0, 7); X.fill();

  bg.addColorStop(0, shade(c[1],18)); bg.addColorStop(0.55, c[1]); bg.addColorStop(1, shade(c[1],-16));
  X.fillStyle=bg; X.fill();
  X.save(); X.clip();
  X.fillStyle='#d9c6f0';                                         // pale lavender belly
  X.beginPath(); X.ellipse(0.38*R, gy-0.12*H, 0.80*R, 0.46*H, 0, 0, 7); X.fill();
  X.fillStyle='rgba(122,76,170,.55)';                            // a few purple spots on the back
  for(const [sx,sy,sr] of [[-0.62,-0.95,0.12],[-0.30,-1.08,0.09],[-0.78,-0.62,0.08],[-0.12,-0.86,0.07]]){
    X.beginPath(); X.ellipse(sx*R, gy+sy*H, sr*R*1.2, sr*R, -0.3, 0, 7); X.fill(); }

  X.beginPath(); X.moveTo(-0.95*R, gy-0.08*H); X.quadraticCurveTo(-0.95*R, gy-0.62*H, -0.38*R, gy-0.52*H); X.stroke();
  X.fillStyle='rgba(255,255,255,.28)';                           // a shine across the top
  X.beginPath(); X.ellipse(-0.25*R, gy-1.10*H, 0.42*R, 0.10*H, -0.12, 0, 7); X.fill();

  // the throat pouch: puffs while he breathes, empties when the tongue goes

  X.fillStyle='#c8a6ea'; X.strokeStyle='#7c5aa6'; X.lineWidth=Math.max(1.5, rx*0.045);

  }

  X.beginPath(); X.moveTo(m0.x, m0.y); X.quadraticCurveTo(-0.05*R, gy-0.60*H, -0.02*R, gy-0.55*H); X.stroke();   // the corner curl

    X.quadraticCurveTo(ex, ey+er*0.10, ex-er*0.98, ey-er*0.12); X.closePath(); X.fill();
    X.strokeStyle=ink; X.lineWidth=Math.max(1.5, rx*0.05);
    X.beginPath(); X.moveTo(ex-er*0.98, ey-er*0.12); X.quadraticCurveTo(ex, ey+er*0.10, ex+er*0.98, ey-er*0.12); X.stroke();
  };

/* ---- SLIME BRUTE: a muscle-bound slime — torso, pecs, abs, arms, legs, head ---- */
function limb(x1,y1,x2,y2,w,fill,line){

  X.lineWidth=w+5; X.strokeStyle=line; X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2,y2); X.stroke();

// draws facing +x, centred on (0,0) in a 104px-tall body; caller sets the transform

  X.quadraticCurveTo(36+wob(3,3.0), -2, 19, 18);

  for(const sgn of [-1,1]){

    X.strokeStyle='rgba(30,4,50,.45)'; X.lineWidth=2.5;

  limb(sh.x, sh.y, ex, ey, 19, fill, line);                       // bicep
  X.fillStyle='rgba(255,255,255,.18)';                            // bicep shine
  X.beginPath(); X.ellipse((sh.x+ex)/2, (sh.y+ey)/2 - 4, 10, 5, a1, 0, 7); X.fill();
  limb(ex, ey, hx, hy, 15, fill, line);                           // forearm
  X.fillStyle=fill; X.strokeStyle=line; X.lineWidth=4;
  X.beginPath(); X.arc(hx, hy, 13, 0, 7); X.fill(); X.stroke();   // fist
  X.fillStyle='rgba(255,255,255,.35)';
  X.beginPath(); X.arc(hx-4, hy-5, 4.5, 0, 7); X.fill();

  // ---- head ----
  const hd={x:4, y:-40+wob(6,2.0)*0.6};
  X.fillStyle=shade(line,10); X.fillRect(hd.x-9, hd.y+8, 18, 10);   // neck
  gooPath(hd.x, hd.y, 18, 17, 0.05, 5, t, seed+3, true);
  const hg=X.createRadialGradient(hd.x-6, hd.y-7, 3, hd.x, hd.y, 22);
  hg.addColorStop(0, lite); hg.addColorStop(0.5, fill); hg.addColorStop(1, shade(line,12));
  X.fillStyle=hg; X.fill(); X.lineWidth=3.5; X.strokeStyle=line; X.stroke();
  X.fillStyle='rgba(255,255,255,.7)';
  X.beginPath(); X.ellipse(hd.x-7, hd.y-8, 6, 3.2, -0.5, 0, 7); X.fill();
  eyes(hd.x+2, hd.y-1, 17, 1, 'slit', blink, true);
  X.strokeStyle='#3d2f4d'; X.lineWidth=2.6; X.lineCap='round';
  X.beginPath();
  if(arm>0.2) X.arc(hd.x+3, hd.y+6, 6.5, 0.08*Math.PI, 0.92*Math.PI);      // roaring
  else { X.moveTo(hd.x-5, hd.y+8); X.quadraticCurveTo(hd.x+3, hd.y+4, hd.x+10, hd.y+9); }
  X.stroke();

}
function drawBrute(u, cx, cy, rx, ry, dir, flash){
  const d=U.brute;
  const sx = rx/(d.r*(d.wide||1)), sy = ry/(d.r*1.02);
  shadow(cx, 40*sx, 0.3);
  X.save(); X.globalAlpha=0.3; X.fillStyle=d.c[2];
  X.beginPath(); X.ellipse(cx, GY+1, 42*sx+Math.sin(T*2)*2, 9, 0,0,7); X.fill(); X.restore();
  X.save();
  X.translate(cx, cy); X.scale(dir*sx, sy);
  bruteBody({seed:u.seed, arm:u.armA||0, sweep:(u.sw>0? (u.armSweep||0):0), blink:u.blink>0});
  X.restore();
  if(flash>0){
    X.save(); X.globalAlpha=flash*0.55; X.globalCompositeOperation='lighter';
    X.translate(cx, cy); X.scale(dir*sx, sy);
    X.fillStyle='#ffffff';
    X.beginPath(); X.ellipse(0,-6, 38, 46, 0,0,7); X.fill();
    X.restore();
  }
}


/* ---- DINO BLOB: a loch-ness blob — humped body, long neck, snapping jaws ---- */
function drawDino(u, cx, cy, rx, ry, dir, flash){
  const evo = !!(u.evo && EVO.dino);
  const c = evo? EVO.dino.c : U.dino.c;
  const R = rx, open = u.bite||0;                       // 0..1 jaw opening
  const neckLen = R*(evo?1.62:1.42), headR = R*(evo?0.68:0.60);
  shadow(cx, R*1.05, 0.26);
  if(evo){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.24+0.10*Math.sin(T*3+u.seed);
    const ag=X.createRadialGradient(cx,cy,R*0.4,cx,cy,R*2.0);
    ag.addColorStop(0, EVO.dino.aura); ag.addColorStop(0.45, EVO.dino.aura); ag.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=ag; X.beginPath(); X.ellipse(cx,cy,R*2.0,ry*1.7,0,0,7); X.fill(); X.restore();
  }
  // tail humps trailing behind
  X.save();
  for(let i=0;i<3;i++){
    const hx = cx - dir*(R*0.75 + i*R*0.52), hr = R*(0.42-i*0.09);
    const bob = Math.sin(T*3 + u.seed + i*0.9)*R*0.07;
    X.beginPath(); X.ellipse(hx, cy+ry*0.35+bob, hr, hr*0.72, 0, Math.PI, 0);
    const hg=X.createLinearGradient(0, cy, 0, cy+ry*0.5);
    hg.addColorStop(0, c[1]); hg.addColorStop(1, c[2]);
    X.fillStyle=hg; X.fill(); X.lineWidth=3; X.strokeStyle=c[2]; X.stroke();
  }
  X.restore();
  // body
  gooPath(cx, cy+ry*0.10, R, ry*0.86, 0.03, 4, T, u.seed, true);
  const g=X.createRadialGradient(cx-R*0.3, cy-ry*0.2, R*0.15, cx, cy, R*1.3);
  g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, shade(c[1],-11));
  X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2,R*0.09); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='rgba(255,255,255,.4)';
  X.beginPath(); X.ellipse(cx-R*0.32, cy-ry*0.12, R*0.26, ry*0.12, -0.5,0,7); X.fill();
  // flipper
  X.fillStyle=c[2];
  X.beginPath(); X.ellipse(cx+dir*R*0.18, cy+ry*0.55, R*0.36, R*0.16, dir*0.35, 0, 7); X.fill();
  // ---- neck ----
  const bx = cx+dir*R*0.42, by = cy-ry*0.25;
  const hx = bx + dir*neckLen*0.72, hy = by - neckLen*0.66;
  const cpx = bx + dir*neckLen*0.05, cpy = by - neckLen*0.62;
  X.lineCap='round';
  X.lineWidth=R*0.46; X.strokeStyle=c[2];
  X.beginPath(); X.moveTo(bx,by); X.quadraticCurveTo(cpx,cpy,hx,hy); X.stroke();
  X.lineWidth=R*0.34; X.strokeStyle=c[1];
  X.beginPath(); X.moveTo(bx,by); X.quadraticCurveTo(cpx,cpy,hx,hy); X.stroke();
  // ---- head + jaws ----
  X.save(); X.translate(hx,hy); X.scale(dir,1);
  const jaw = open*0.95;                                 // radians
  // lower jaw
  X.save(); X.rotate(jaw*0.75);
  X.fillStyle=c[2]; X.beginPath();
  X.moveTo(-headR*0.5, 0); X.quadraticCurveTo(headR*0.9, headR*0.30, headR*1.62, headR*0.06);
  X.quadraticCurveTo(headR*0.8, headR*0.62, -headR*0.5, headR*0.52); X.closePath(); X.fill();
  X.fillStyle='#ffffff';                                 // teeth
  for(let i=0;i<5;i++){ const tx=headR*(0.15+i*0.30);
    X.beginPath(); X.moveTo(tx, headR*0.16); X.lineTo(tx+headR*0.12, headR*0.16);
    X.lineTo(tx+headR*0.06, headR*-0.16); X.closePath(); X.fill(); }
  X.restore();
  // upper head
  X.save(); X.rotate(-jaw*0.55);
  X.beginPath();
  X.moveTo(-headR*0.6, headR*0.15);
  X.quadraticCurveTo(-headR*0.2, -headR*1.0, headR*0.75, -headR*0.55);
  X.quadraticCurveTo(headR*1.75, -headR*0.25, headR*1.70, headR*0.10);
  X.quadraticCurveTo(headR*0.7, headR*0.28, -headR*0.6, headR*0.15);
  X.closePath();
  const hg2=X.createLinearGradient(0,-headR,0,headR);
  hg2.addColorStop(0, c[0]); hg2.addColorStop(0.5, c[1]); hg2.addColorStop(1, c[2]);
  X.fillStyle=hg2; X.fill(); X.lineWidth=Math.max(2,headR*0.16); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='#ffffff';                                 // upper teeth
  for(let i=0;i<5;i++){ const tx=headR*(0.15+i*0.30);
    X.beginPath(); X.moveTo(tx, headR*0.12); X.lineTo(tx+headR*0.12, headR*0.12);
    X.lineTo(tx+headR*0.06, headR*0.46); X.closePath(); X.fill(); }
  // eye + brow
  X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(headR*0.30, -headR*0.42, headR*0.28, headR*0.30, 0,0,7); X.fill();
  X.fillStyle=INK; X.beginPath(); X.ellipse(headR*0.38, -headR*0.40, headR*0.13, headR*0.19, 0,0,7); X.fill();
  X.strokeStyle=c[2]; X.lineWidth=headR*0.16; X.lineCap='round';
  X.beginPath(); X.moveTo(headR*0.02, -headR*0.80); X.lineTo(headR*0.58, -headR*0.62); X.stroke();
  if(evo){                                               // loch ness crest
    X.fillStyle=c[2];
    for(let i=0;i<3;i++){ const sx=-headR*0.35+i*headR*0.32;
      X.beginPath(); X.moveTo(sx, -headR*0.72); X.lineTo(sx+headR*0.16, -headR*1.25);
      X.lineTo(sx+headR*0.32, -headR*0.66); X.closePath(); X.fill(); }
  }
  X.restore();
  X.restore();
  if(flash>0){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.6;
    X.fillStyle='#ffffff';
    X.beginPath(); X.ellipse(cx, cy, R*1.05, ry*0.95, 0,0,7); X.fill();
    X.restore();
  }
}


// a craggy rock outline — still blobby, but chipped and uneven like cooled lava
function moltenPath(cx, cy, rx, ry, tt, seed){
  X.beginPath();
  const N=48;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const w = 1 + 0.050*Math.sin(a*5 + tt*2.0 + seed)
                + 0.032*Math.sin(a*9 - tt*1.5 + seed*1.4)
                + 0.026*Math.sin(a*15 + seed*2.3);
    const px = cx + Math.cos(a)*rx*w;
    let   py = cy + Math.sin(a)*ry*w;
    if(Math.sin(a)>0) py = cy + Math.sin(a)*ry*w*(1-0.28*Math.sin(a));   // settles onto the ground
    i? X.lineTo(px,py) : X.moveTo(px,py);
  }
  X.closePath();
}

/* ---- MAGMA GOLEM: the XP stage's boss — a quarry of cooled slabs bolted
   around a molten core, hauling one huge arm up and bringing it down twice ---- */
function drawGolem(u, cx, cy, rx, ry, dir, flash){
  const t=T, seed=u.seed, D=dir;
  const heat = 0.70 + 0.30*Math.sin(t*3.2 + seed*2);
  const ga = u.golemA||0;                        // -1 arm overhead … +1 arm through the floor
  const PX=(x)=> cx + D*x*rx, PY=(y)=> cy + y*ry;
  const LINE='#240c04', ROCK='#5b2c1b', ROCK_D='#3d1a0e', ROCK_L='#7d4629';
  const poly=(pts, fill)=>{
    X.beginPath();
    pts.forEach((p,i)=> i? X.lineTo(PX(p[0]), PY(p[1])) : X.moveTo(PX(p[0]), PY(p[1])));
    X.closePath(); X.fillStyle=fill; X.fill();
    X.lineWidth=Math.max(2.5, rx*0.055); X.strokeStyle=LINE; X.stroke();
  };
  // a chunky outlined slab between two points, in screen coords
  const slab=(x0,y0,x1,y1,w,fill)=>{
    X.lineCap='round';
    X.strokeStyle=LINE; X.lineWidth=w+Math.max(4, rx*0.10);
    X.beginPath(); X.moveTo(x0,y0); X.lineTo(x1,y1); X.stroke();
    X.strokeStyle=fill; X.lineWidth=w;
    X.beginPath(); X.moveTo(x0,y0); X.lineTo(x1,y1); X.stroke();
  };

  shadow(cx, rx*1.15, 0.34);
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.16+0.10*heat;
  const gg=X.createRadialGradient(cx, GY+2, 3, cx, GY+2, rx*2.0);
  gg.addColorStop(0,'#ff8a2a'); gg.addColorStop(1,'rgba(255,90,20,0)');
  X.fillStyle=gg; X.beginPath(); X.ellipse(cx, GY+2, rx*2.0, rx*0.42, 0,0,7); X.fill();
  X.restore();

  // ---- back arm, tucked behind the torso ----
  (function(){
    const sx=PX(-0.56), sy=PY(-0.40), sw=Math.sin(t*1.3+seed)*0.06;
    const ex=sx - D*rx*0.14, ey=sy + ry*(0.62+sw);
    slab(sx,sy,ex,ey, rx*0.30, ROCK_D);
    X.fillStyle=ROCK_D; X.strokeStyle=LINE; X.lineWidth=Math.max(2.5, rx*0.055);
    X.beginPath(); X.arc(ex, ey+ry*0.10, rx*0.22, 0, 7); X.fill(); X.stroke();
  })();

  // ---- legs: two squat pillars on slab feet ----
  for(const sgn of [-1,1]){
    poly([[sgn*0.16, 0.06],[sgn*0.56, 0.06],[sgn*0.52, 0.80],[sgn*0.20, 0.80]], sgn===D? ROCK : ROCK_D);
    poly([[sgn*0.10, 0.76],[sgn*0.68, 0.76],[sgn*0.72, 0.96],[sgn*0.06, 0.96]], sgn===D? '#4c2213' : '#3a1709');
  }

  // ---- torso: a broad slab, shoulders well past the hips ----
  const TORSO=[[-0.84,-0.66],[-0.30,-0.78],[0.30,-0.78],[0.84,-0.66],[0.68,-0.18],[0.52,0.22],[-0.52,0.22],[-0.68,-0.18]];
  poly(TORSO, ROCK);
  X.save();
  X.beginPath();
  TORSO.forEach((p,i)=> i? X.lineTo(PX(p[0]),PY(p[1])) : X.moveTo(PX(p[0]),PY(p[1])));
  X.closePath(); X.clip();
  // the melt showing through a split in the chest
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.72;
  const cg=X.createRadialGradient(PX(0), PY(-0.16), rx*0.04, PX(0), PY(-0.16), rx*0.46*(0.94+0.06*heat));
  cg.addColorStop(0,'#fff6d2'); cg.addColorStop(0.32,'#ffa32a');
  cg.addColorStop(0.70,'#e5510a'); cg.addColorStop(1,'rgba(140,40,5,0)');
  X.fillStyle=cg;
  X.beginPath(); X.ellipse(PX(0), PY(-0.16), rx*0.46, ry*0.34, 0,0,7); X.fill();
  X.restore();
  // crust plates laid back over the glow
  const plates=[[-0.62,-0.54,0.26,0.15,-0.22],[-0.16,-0.62,0.26,0.13,0.06],[0.34,-0.56,0.26,0.14,0.20],
                [0.62,-0.34,0.22,0.15,-0.28],[-0.60,-0.12,0.22,0.15,0.18],[0.58,0.02,0.22,0.14,-0.14],
                [-0.30,0.12,0.26,0.11,0.04],[0.24,0.12,0.26,0.11,-0.04]];
  for(let i=0;i<plates.length;i++){
    const [px,py,pw,ph,rot]=plates[i], br=1+Math.sin(t*1.4+seed+i*1.7)*0.035;
    X.fillStyle = i%3? ROCK_D : '#4a2113';
    X.beginPath(); X.ellipse(PX(px), PY(py), pw*rx*br, ph*ry*br, D*rot, 0, 7); X.fill();
    X.fillStyle='rgba(255,255,255,.07)';
    X.beginPath(); X.ellipse(PX(px), PY(py)-ph*ry*0.36, pw*rx*0.6, ph*ry*0.30, D*rot, 0, 7); X.fill();
  }
  // lava seams running out of the split
  X.save(); X.globalCompositeOperation='lighter'; X.lineCap='round';
  const seams=[[[-0.80,-0.30],[-0.44,-0.22],[-0.16,0.02],[0.06,0.16]],
               [[0.80,-0.26],[0.46,-0.14],[0.18,-0.28],[-0.04,-0.50]],
               [[-0.44,0.16],[-0.14,0.08],[0.24,0.14],[0.48,0.04]]];
  for(let i=0;i<seams.length;i++){
    X.globalAlpha=0.50+0.35*Math.sin(t*2.6+seed+i);
    X.strokeStyle='#ff7a1e'; X.lineWidth=Math.max(2.4, rx*0.070);
    X.beginPath(); seams[i].forEach((p,j)=> j? X.lineTo(PX(p[0]),PY(p[1])) : X.moveTo(PX(p[0]),PY(p[1]))); X.stroke();
    X.strokeStyle='#ffe6a0'; X.lineWidth=Math.max(1.2, rx*0.028);
    X.beginPath(); seams[i].forEach((p,j)=> j? X.lineTo(PX(p[0]),PY(p[1])) : X.moveTo(PX(p[0]),PY(p[1]))); X.stroke();
  }
  X.restore();
  X.restore();

  // ---- shoulder crags ----
  for(const sgn of [-1,1]){
    poly([[sgn*0.86,-0.62],[sgn*0.66,-0.92],[sgn*0.48,-0.66]], ROCK_L);
    poly([[sgn*0.56,-0.70],[sgn*0.42,-0.88],[sgn*0.30,-0.68]], ROCK);
  }

  // ---- head: a boulder set down between the shoulders ----
  const hx=PX(0.03), hy=PY(-0.84), hw=rx*0.38, hh=ry*0.30;
  X.beginPath();
  X.moveTo(hx-hw, hy+hh*0.55); X.lineTo(hx-hw*0.86, hy-hh*0.55);
  X.lineTo(hx-hw*0.10, hy-hh); X.lineTo(hx+hw*0.90, hy-hh*0.50);
  X.lineTo(hx+hw, hy+hh*0.60); X.closePath();
  X.fillStyle=ROCK_L; X.fill(); X.lineWidth=Math.max(2.5, rx*0.055); X.strokeStyle=LINE; X.stroke();
  // heavy brow, then two coal eyes under it
  X.fillStyle=ROCK_D;
  X.beginPath();
  X.moveTo(hx-hw*0.92, hy-hh*0.18); X.lineTo(hx+hw*0.94, hy-hh*0.34);
  X.lineTo(hx+hw*0.94, hy-hh*0.72); X.lineTo(hx-hw*0.90, hy-hh*0.50); X.closePath(); X.fill();
  X.save(); X.globalCompositeOperation='lighter';
  for(const sgn of [-1,1]){
    const ex2=hx+sgn*hw*0.44+D*hw*0.06, ey2=hy+hh*0.06;
    X.globalAlpha=0.30+0.12*Math.sin(t*5+seed);
    X.fillStyle='#ff6a12';
    X.beginPath(); X.ellipse(ex2, ey2, hw*0.40, hh*0.30, 0,0,7); X.fill();
    X.globalAlpha=0.90;
    X.fillStyle='#ffd45a';
    X.beginPath(); X.ellipse(ex2, ey2, hw*0.20, hh*0.13, D*sgn*0.10, 0,7); X.fill();
  }
  X.restore();
  X.strokeStyle='#8a4a22'; X.lineWidth=Math.max(1.6, rx*0.030); X.lineCap='round';
  X.beginPath(); X.moveTo(hx-hw*0.50, hy+hh*0.46); X.lineTo(hx+hw*0.52, hy+hh*0.38); X.stroke();

  // ---- the smashing arm ----
  (function(){
    const sx=PX(0.74), sy=PY(-0.48);
    const ang = 0.42 + (ga<0 ? ga*1.66 : ga*0.74);   // hangs at rest, overhead raised, floor slammed
    const ex = sx + D*Math.cos(ang)*rx*0.52, ey = sy + Math.sin(ang)*ry*0.58;
    const fx = ex + D*Math.cos(ang+0.34)*rx*0.46, fy = ey + Math.sin(ang+0.34)*ry*0.52;
    if(u.golemSweep){                                // the arc trailing behind the fist
      X.save(); X.translate(sx, sy); X.scale(D, 1);
      X.globalCompositeOperation='lighter'; X.lineCap='round';
      X.globalAlpha=0.22; X.strokeStyle='#ffb04a'; X.lineWidth=rx*0.24;
      X.beginPath(); X.arc(0, 0, rx*0.92, ang-1.05, ang); X.stroke();
      X.globalAlpha=0.16; X.strokeStyle='#fff0c0'; X.lineWidth=rx*0.09;
      X.beginPath(); X.arc(0, 0, rx*0.92, ang-0.85, ang); X.stroke();
      X.restore();
    }
    slab(sx, sy, ex, ey, rx*0.36, ROCK);            // upper arm
    slab(ex, ey, fx, fy, rx*0.30, ROCK_D);          // forearm
    X.fillStyle=ROCK_L; X.strokeStyle=LINE; X.lineWidth=Math.max(2.5, rx*0.055);
    X.beginPath(); X.arc(fx, fy, rx*0.38, 0, 7); X.fill(); X.stroke();     // boulder fist
    X.fillStyle=ROCK_D;
    X.beginPath(); X.arc(fx+D*rx*0.14, fy+ry*0.10, rx*0.16, 0, 7); X.fill();
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.45+0.3*heat;
    X.strokeStyle='#ff8a2a'; X.lineWidth=Math.max(1.8, rx*0.042); X.lineCap='round';
    X.beginPath(); X.moveTo(fx-rx*0.22, fy-rx*0.10); X.lineTo(fx+rx*0.04, fy+rx*0.02);
    X.lineTo(fx+rx*0.24, fy-rx*0.14); X.stroke(); X.restore();
  })();

  // ---- embers rising off the shoulders ----
  X.save(); X.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){
    const ph=((t*0.55 + i*0.143 + seed*0.1)%1);
    X.globalAlpha=0.5*(1-ph);
    X.fillStyle= i%2? '#ffb24a' : '#ff6a12';
    X.beginPath(); X.arc(cx + (i/3-1)*rx*0.58 + Math.sin(t*2+i)*rx*0.08,
                         PY(-0.72) - ph*ry*1.4, rx*0.05*(1-ph*0.5), 0, 7); X.fill();
  }
  X.restore();

  if(flash>0){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.5;
    X.fillStyle='#ffffff';
    X.beginPath(); X.ellipse(cx, cy-ry*0.20, rx*0.92, ry*0.92, 0,0,7); X.fill();
    X.restore();
  }
}

/* ---- MAGMA SLIME: molten rock — cooled crust plates over a glowing core,
   lava veins in the gaps, embers, smoke and a heat halo ---- */
function drawMagma(u, cx, cy, rx, ry, dir, flash){
  const t=T, seed=u.seed;
  const heat = 0.72 + 0.28*Math.sin(t*5.2 + seed*2);      // it pulses like a coal
  if(!u.mini){                       // card portraits sit off the battlefield: no ground work
    shadow(cx, rx*1.05, 0.30);
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.18+0.10*heat;
    const gg=X.createRadialGradient(cx, GY+2, 2, cx, GY+2, rx*1.8);
    gg.addColorStop(0,'#ff8a2a'); gg.addColorStop(1,'rgba(255,90,20,0)');
    X.fillStyle=gg; X.beginPath(); X.ellipse(cx, GY+2, rx*1.8, rx*0.42, 0,0,7); X.fill();
    X.restore();
  }

  // heat halo
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.13+0.08*heat;
  const hg=X.createRadialGradient(cx, cy, rx*0.3, cx, cy, rx*1.9);
  hg.addColorStop(0,'#ffb24a'); hg.addColorStop(1,'rgba(255,90,20,0)');
  X.fillStyle=hg; X.beginPath(); X.ellipse(cx, cy, rx*1.9, ry*1.7, 0,0,7); X.fill();
  X.restore();

  // ---- body: molten rock — a glowing melt under a broken crust ----
  moltenPath(cx, cy, rx, ry, t, seed);
  const g=X.createRadialGradient(cx, cy+ry*0.34, rx*0.10, cx, cy, rx*1.35);
  g.addColorStop(0,'#fff3c0'); g.addColorStop(0.34,'#ffa32a');
  g.addColorStop(0.66,'#e5510a'); g.addColorStop(1,'#8d2405');
  X.fillStyle=g; X.fill();
  X.lineWidth=Math.max(2, rx*0.085); X.strokeStyle='#380d02'; X.stroke();

  X.save(); moltenPath(cx, cy, rx, ry, t, seed); X.clip();
  // cooled crust plates — the glowing veins are simply the gaps they leave
  const plates=[[-0.55,-0.52,0.40,0.26,-0.3],[0.02,-0.66,0.44,0.24,0.1],[0.58,-0.42,0.34,0.22,0.35],
                [-0.78,-0.10,0.30,0.22,-0.5],[-0.22,-0.22,0.42,0.22,0.06],[0.46,-0.02,0.36,0.22,-0.2],
                [0.84,0.16,0.26,0.20,0.3],[-0.52,0.30,0.34,0.18,0.25],[0.08,0.40,0.38,0.18,-0.1],
                [0.62,0.52,0.26,0.14,0.2],[-0.88,0.44,0.22,0.12,0]];
  for(let i=0;i<plates.length;i++){
    const [px,py,pw,ph,rot]=plates[i];
    const br=1+Math.sin(t*1.4+seed+i*1.7)*0.035;
    X.fillStyle = i%3? '#43130a' : '#55190b';
    X.beginPath(); X.ellipse(cx+px*rx, cy+py*ry, pw*rx*br, ph*ry*br, rot, 0, 7); X.fill();
    X.fillStyle='rgba(255,255,255,.055)';     // faint top light on each plate
    X.beginPath(); X.ellipse(cx+px*rx, cy+py*ry-ph*ry*0.34, pw*rx*0.62, ph*ry*0.30, rot, 0, 7); X.fill();
  }
  // the veins between the plates breathe with the heat
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.30+0.30*heat;
  const vg=X.createRadialGradient(cx, cy+ry*0.30, rx*0.05, cx, cy, rx*1.25);
  vg.addColorStop(0,'#fff0b0'); vg.addColorStop(0.5,'rgba(255,150,40,.45)'); vg.addColorStop(1,'rgba(255,90,20,0)');
  X.fillStyle=vg; X.fillRect(cx-rx*1.2, cy-ry*1.2, rx*2.4, ry*2.4);
  X.restore();
  // short cracks splitting the crust low down, well clear of the face
  X.save(); X.globalCompositeOperation='lighter'; X.lineCap='round';
  for(let i=0;i<3;i++){
    const a0 = 0.55 + i*0.75 + Math.sin(seed+i)*0.16;        // downward arc only
    X.globalAlpha=0.35+0.30*heat; X.strokeStyle='#ffd98a'; X.lineWidth=Math.max(1.4, rx*0.045);
    X.beginPath(); X.moveTo(cx+Math.cos(a0)*rx*0.30, cy+ry*0.44+Math.sin(a0)*ry*0.12);
    for(let j=1;j<=2;j++){
      const a=a0+Math.sin(j*2.1+seed)*0.35, d=0.30+j*0.28;
      X.lineTo(cx+Math.cos(a)*rx*d, cy+ry*0.44+Math.sin(a)*ry*d*0.55);
    }
    X.stroke();
  }
  X.restore();
  // sparks drifting up through the melt
  X.globalAlpha=0.7; X.fillStyle='#ffd88a';
  for(let i=0;i<5;i++){
    const bx=cx+Math.sin(t*1.6+i*2.1+seed)*rx*0.55;
    const by=cy+ry*0.7-((t*46+i*37+seed*11)%(ry*1.8));
    X.beginPath(); X.arc(bx, by, rx*(0.045+0.02*(i%3)), 0, 7); X.fill();
  }
  X.restore();

  // ---- smoke curling off the crust ----
  X.save(); X.globalAlpha=0.22;
  X.fillStyle='#6b6b78';
  for(let i=0;i<3;i++){
    const ph=((t*0.7+i*0.37+seed*0.1)%1);
    const sx=cx+(i-1)*rx*0.42+Math.sin(ph*6+i)*rx*0.16;
    const sy=cy-ry*0.9-ph*ry*1.5;
    X.globalAlpha=0.25*(1-ph);
    X.beginPath(); X.arc(sx, sy, rx*(0.12+ph*0.26), 0, 7); X.fill();
  }
  X.restore();

  // ---- embers popping off the shoulders ----
  X.save(); X.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){
    const ph=((t*1.15+i*0.29+seed*0.2)%1);
    const ex=cx+Math.sin(i*2.6+seed)*rx*0.8+Math.sin(ph*7+i)*rx*0.18;
    const ey=cy-ry*0.5-ph*ry*1.9;
    X.globalAlpha=0.85*(1-ph);
    X.fillStyle= i%2? '#ffd06a' : '#ff7a2a';
    X.beginPath(); X.arc(ex, ey, rx*0.075*(1-ph*0.6), 0, 7); X.fill();
  }
  X.restore();

  // ---- face: white-hot eyes, furious brows, a glowing maw ----
  const ey2=cy-ry*0.16, edx=rx*0.34;
  for(const sgn of [-1,1]){
    const ex=cx+sgn*edx+dir*rx*0.10;
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.55+0.3*heat;
    const eg=X.createRadialGradient(ex, ey2, 1, ex, ey2, rx*0.34);
    eg.addColorStop(0,'#fff6cf'); eg.addColorStop(1,'rgba(255,140,30,0)');
    X.fillStyle=eg; X.beginPath(); X.arc(ex, ey2, rx*0.34, 0, 7); X.fill(); X.restore();
    X.fillStyle='#fff2c0';
    X.beginPath(); X.ellipse(ex, ey2, rx*0.19, rx*0.24, 0,0,7); X.fill();
    X.fillStyle='#4a1102';
    X.beginPath(); X.ellipse(ex+dir*rx*0.05, ey2+rx*0.02, rx*0.07, rx*0.15, 0,0,7); X.fill();
  }
  X.strokeStyle='#2e0b02'; X.lineWidth=Math.max(2.5, rx*0.12); X.lineCap='round';
  for(const sgn of [-1,1]){
    X.beginPath();
    X.moveTo(cx+sgn*rx*0.62, ey2-rx*0.40);
    X.lineTo(cx+sgn*rx*0.16, ey2-rx*0.18);
    X.stroke();
  }
  const open = u.sw>0 ? 1 : 0.45;
  X.fillStyle='#2b0a01';
  X.beginPath(); X.ellipse(cx+dir*rx*0.06, cy+ry*0.40, rx*0.30, rx*0.13*open+rx*0.05, 0,0,7); X.fill();
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.6+0.3*heat;
  X.fillStyle='#ff9a2e';
  X.beginPath(); X.ellipse(cx+dir*rx*0.06, cy+ry*0.40, rx*0.24, rx*0.10*open+rx*0.03, 0,0,7); X.fill();
  X.restore();

  if(flash>0){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    moltenPath(cx,cy,rx,ry,t,seed); X.fillStyle='#ffffff'; X.fill(); X.restore();
  }
}

/* ---- THE BLOWER: an angry thundercloud that inhales, then blows a gale ---- */
function drawBlower(u, cx, cy, rx, ry, dir, flash){
  const c=U.blower.c, t=T, seed=u.seed;
  const puff = u.puff||0, blow = u.blow||0;
  const R = rx*(1+0.10*puff);
  shadow(cx, R*0.9, 0.22);

  // ---- the gale it exhales ----
  if(blow>0){
    X.save(); X.globalAlpha = 0.55*blow;
    const reach = U.blower.aoe*1.2;
    for(let i=0;i<7;i++){
      const ph = (t*3.4 + i*0.9) % 1;
      const gx = cx + dir*(60 + ph*reach);
      const gy = cy + Math.sin(i*2.1 + t*5)*R*0.55;
      const len = 60 + ph*140;
      X.strokeStyle='rgba(255,255,255,'+(0.8*(1-ph))+')';
      X.lineWidth = 3 + (1-ph)*6; X.lineCap='round';
      X.beginPath(); X.moveTo(gx, gy); X.lineTo(gx + dir*len, gy + Math.sin(ph*6+i)*10); X.stroke();
    }
    X.restore();
  }

  // ---- cloud body: overlapping puffs ----
  const lobes=[[-0.86,0.12,0.50],[-0.42,-0.30,0.62],[0.08,-0.42,0.70],[0.56,-0.22,0.58],[0.90,0.14,0.46],[0.18,0.28,0.62],[-0.34,0.30,0.52]];
  X.save();
  const bg=X.createLinearGradient(0, cy-R, 0, cy+R*0.9);
  bg.addColorStop(0, c[0]); bg.addColorStop(0.45, c[1]); bg.addColorStop(1, c[2]);
  const lw=Math.max(3,R*0.06);
  const lobePath=(pad)=>{
    X.beginPath();
    for(const [lx,ly,lr] of lobes){
      const wob = 1 + Math.sin(t*2.2 + seed + lx*3)*0.05;
      const rr2 = lr*R*wob + pad;
      X.moveTo(cx+lx*R + rr2, cy+ly*R);
      X.arc(cx+lx*R, cy+ly*R, rr2, 0, 7);
    }
  };
  // the outline is a fattened copy filled behind the body, so only the silhouette is drawn
  lobePath(lw*0.5); X.fillStyle=c[2]; X.fill();
  lobePath(0);      X.fillStyle=bg;   X.fill();
  // highlight
  X.save(); lobePath(0); X.clip();
  X.globalAlpha=0.35; X.fillStyle='#ffffff';
  X.beginPath(); X.ellipse(cx-R*0.35, cy-R*0.45, R*0.55, R*0.22, -0.3, 0, 7); X.fill();
  X.globalAlpha=0.18; X.fillStyle='#0b1422';
  X.beginPath(); X.ellipse(cx+R*0.1, cy+R*0.42, R*0.85, R*0.3, 0, 0, 7); X.fill();
  X.restore();
  X.restore();

  // ---- lightning under the cloud ----
  if(((t*3+seed)%1) < 0.28){
    X.save(); X.globalAlpha=0.9; X.fillStyle='#ffe98a';
    const bx = cx + Math.sin(seed*3)*R*0.4;
    X.beginPath(); X.moveTo(bx, cy+R*0.5); X.lineTo(bx-R*0.14, cy+R*0.92);
    X.lineTo(bx+R*0.02, cy+R*0.88); X.lineTo(bx-R*0.10, cy+R*1.35);
    X.lineTo(bx+R*0.20, cy+R*0.80); X.lineTo(bx+R*0.04, cy+R*0.84);
    X.lineTo(bx+R*0.18, cy+R*0.46); X.closePath(); X.fill();
    X.restore();
  }

  // ---- angry face ----
  const ey = cy - R*0.08;
  for(const sgn of [-1,1]){
    const ex = cx + sgn*R*0.34 + dir*R*0.05;
    X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(ex, ey, R*0.20, R*0.22, 0,0,7); X.fill();
    X.fillStyle='#3d4655';
    X.beginPath(); X.ellipse(ex+dir*R*0.05, ey+R*0.02, R*0.10, R*0.13, 0,0,7); X.fill();
  }
  X.strokeStyle='#3d4655'; X.lineWidth=Math.max(3,R*0.075); X.lineCap='round';
  for(const sgn of [-1,1]){
    X.beginPath();
    X.moveTo(cx+sgn*R*0.56, ey-R*0.36);
    X.lineTo(cx+sgn*R*0.16, ey-R*0.16);
    X.stroke();
  }
  // mouth: pursed while inhaling, wide open while blowing
  const mw = R*(0.09 + 0.24*blow), mh = R*(0.10 + 0.20*blow - 0.05*puff);
  X.fillStyle='#3d4655';
  X.beginPath(); X.ellipse(cx+dir*R*0.28, cy+R*0.46, mw, mh, 0, 0, 7); X.fill();
  if(flash>0){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.55;
    X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(cx, cy, R*1.15, R*0.85, 0,0,7); X.fill(); X.restore();
  }
}

    X.fillStyle=INK;

function drawEnemyBase(hp, maxhp){
  const x=E_BASE_X, y=GY;
  shadow(x, 74, 0.3);
  // ooze pool
  X.fillStyle='rgba(40,120,30,.45)';
  X.beginPath(); X.ellipse(x, y+2, 92, 16, 0,0,7); X.fill();
  // layered gooey ziggurat
  const layers=[[92,42,0,0],[72,44,-56,-9],[54,38,-102,7],[33,30,-136,-4]];
  for(let i=0;i<layers.length;i++){
    const [rx,ry,oy,ox]=layers[i];
    gooPath(x+ox, y+oy-ry*0.4, rx, ry, 0.075, 5, T*0.8+i, i*2.3, true);
    const g=X.createLinearGradient(0,y+oy-ry,0,y+oy+ry);
    g.addColorStop(0,'#c6ec93'); g.addColorStop(0.5,'#79c355'); g.addColorStop(1,'#3f7f2c');
    X.fillStyle=g; X.fill(); X.lineWidth=4; X.strokeStyle='#3f6a2c'; X.stroke();
    X.save(); X.clip(); X.globalAlpha=0.3; X.fillStyle='#e6ffb0';
    X.beginPath(); X.ellipse(x-rx*0.4, y+oy-ry*0.8, rx*0.4, ry*0.2, -0.4,0,7); X.fill(); X.restore();
  }
  // hanging drips from each layer
  X.fillStyle='#79c355';
  for(let i=0;i<7;i++){
    const px=x-72+i*24, base=y-14;
    const dl=(Math.sin(T*1.5+i*1.3)*0.5+0.5)*16;
    X.beginPath(); X.moveTo(px-5,base); X.quadraticCurveTo(px, base+22+dl, px+5, base); X.closePath(); X.fill();
    X.beginPath(); X.arc(px, base+18+dl, 4.5,0,7); X.fill();
  }
  // cave mouth + glowing core
  X.fillStyle='#0e2f0b'; X.beginPath(); X.ellipse(x, y-24, 30, 26, 0,0,7); X.fill();
  const pulse=0.7+Math.sin(T*3)*0.3;
  X.save(); X.globalCompositeOperation='lighter';
  const cg=X.createRadialGradient(x,y-26,2,x,y-26,34);
  cg.addColorStop(0,'rgba(190,255,120,'+(0.7*pulse)+')'); cg.addColorStop(1,'rgba(120,220,60,0)');
  X.fillStyle=cg; X.beginPath(); X.arc(x,y-26,34,0,7); X.fill(); X.restore();
  X.fillStyle='#d6ff8a'; X.beginPath(); X.arc(x, y-26, 9+pulse*2.5, 0,7); X.fill();
  // spikes / bones
  X.fillStyle='#e8f6d0';
  for(const [sx,sy,h] of [[x-64,y-46,26],[x+66,y-42,22],[x-40,y-118,18],[x+44,y-112,20]]){
    X.beginPath(); X.moveTo(sx-6,sy); X.lineTo(sx, sy-h); X.lineTo(sx+6,sy); X.closePath(); X.fill();
  }
  // crown on top
  X.fillStyle='#ffd84a';
  X.beginPath(); X.moveTo(x-22,y-168); X.lineTo(x-22,y-188); X.lineTo(x-11,y-178); X.lineTo(x,y-194);
  X.lineTo(x+11,y-178); X.lineTo(x+22,y-188); X.lineTo(x+22,y-168); X.closePath(); X.fill();
  X.lineWidth=2.5; X.strokeStyle='#a97c0a'; X.stroke();
}

/* ---- AI MODE ---- the same three decisions a player makes: bank, deploy, fire ---- */
function aiTick(dt){
  B.aiT = (B.aiT||0) - dt;
  if(B.aiT > 0) return;
  B.aiT = 1.0;                                   // it thinks once a second
  const foes = B.units.some(o => o.team<0 && !o.dead && !o.dying);   // never waste a shot on an empty lane
  if(foes && Math.random() < 0.08 && B.cannon.ch>=100) fireCannon();
  // only blobs that are ready right now (off cooldown) and that the tank can actually hold
  const squad = teamUnits().filter(k => !(U[k].once && B.used[k]) && B.cd[k]<=0 && U[k].cost <= B.cap);
  // pick something to save up for — the wealthy blob more often than any one blob
  if(!B.aiPick || (B.aiPick!=='wealth' && squad.indexOf(B.aiPick)<0)
     || (B.aiPick==='wealth' && WEALTH_COST[B.wealth]==null)){
    if(!squad.length){ B.aiPick = null; return; }                    // nothing ready: wait, don't roll
    const wealthLeft = WEALTH_COST[B.wealth]!=null;
    B.aiPick = (wealthLeft && Math.random()<0.20)                      // one pick in five is the bank
             ? 'wealth'
             : squad[(Math.random()*squad.length)|0];
  }
  if(!B.aiPick) return;
  if(B.aiPick==='wealth'){                       // save for it, then buy it and choose again
    const c = WEALTH_COST[B.wealth];
    if(c!=null && B.juice >= c){ buyWealth(); B.aiPick=null; }
    return;
  }
  const d = U[B.aiPick];
  if(B.cd[B.aiPick]<=0 && B.juice >= d.cost){ tryDeploy(B.aiPick); B.aiPick=null; }
}

/* ---- boss bars: one strip per boss on the field, stacked under the title ---- */
function bossBars(dt){
  if(scene==='result') return;                 // the result screen owns the top of the screen
  dt = dt||0;
  const bosses = B.units.filter(u=>u.isBoss && !u.dead).slice(0,3);
  if(!bosses.length) return;
  bosses.forEach((u,i)=>{
    const w=420, h=26, x0=500-w/2, y=56+i*32, p=Math.max(0,Math.min(1,u.hp/u.max));
    const c=U[u.k].c;
    // the chip bar: it hangs where the health was, holds a beat, then drains after it
    if(u.barGhost==null){ u.barGhost=p; u.barLast=p; u.barHold=0; u.barKick=0; }
    const drop = u.barLast - p;                              // kick once per hit, not every frame
    if(drop > 0.0005){ u.barHold = 0.30; u.barKick = Math.min(1, (u.barKick||0) + drop*9 + 0.30); }
    u.barLast = p;
    if(u.barHold>0) u.barHold -= dt;
    else u.barGhost += (p - u.barGhost) * Math.min(1, dt*3.4);
    if(p > u.barGhost) u.barGhost = p;                       // healed: no ghost hanging behind
    u.barKick = Math.max(0, (u.barKick||0) - dt*3.2);
    const kick = u.barKick, x = x0;                          // it glows and sparks on a hit, but never shakes
    X.save();
    X.fillStyle='rgba(6,14,24,.78)'; rr(x-4, y-4, w+8, h+8, 12); X.fill();
    X.strokeStyle= kick>0.05? 'rgba(255,220,150,'+(0.55+0.4*kick)+')' : 'rgba(255,140,120,.55)';
    X.lineWidth= 2+kick*1.6; X.stroke();
    X.fillStyle='#22131a'; rr(x, y, w, h, 8); X.fill();
    if(u.barGhost > p){                                      // the damage that has not drained yet
      X.fillStyle='#ffd86a'; rr(x, y, Math.max(0,w*u.barGhost), h, 8); X.fill();
      X.fillStyle='rgba(255,255,255,.35)';
      rr(x + Math.max(0,w*p) - 2, y, Math.max(0, w*(u.barGhost-p)) + 2, h, 4); X.fill();
    }
    const g=X.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,'#ff8a5a'); g.addColorStop(0.5,'#e8322f'); g.addColorStop(1,'#9c1a20');
    X.fillStyle=g; rr(x, y, Math.max(0,w*p), h, 8); X.fill();
    X.fillStyle='rgba(255,255,255,.28)'; rr(x, y+3, Math.max(0,w*p), h*0.30, 5); X.fill();
    if(kick>0.02){                                           // a spark where the bar just got cut
      const ex = x + w*p;
      X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=Math.min(1,kick);
      const rg=X.createRadialGradient(ex, y+h/2, 1, ex, y+h/2, 26);
      rg.addColorStop(0,'rgba(255,240,190,.95)'); rg.addColorStop(1,'rgba(255,180,90,0)');
      X.fillStyle=rg; X.beginPath(); X.arc(ex, y+h/2, 26, 0, 7); X.fill();
      X.restore();
    }
    if(u.flash>0){ X.save(); X.globalAlpha=u.flash*0.5; X.fillStyle='#ffffff';
      rr(x, y, Math.max(0,w*p), h, 8); X.fill(); X.restore(); }
    // a little portrait on the left cap
    X.save(); X.beginPath(); X.arc(x+4, y+h/2, h*0.62*(1+kick*0.12), 0, 7); X.clip();
    X.fillStyle='rgba(8,18,28,.9)'; X.fill();
    drawMini(u.k, x+4, y+h/2+2, h*0.44*(1+kick*0.12), -1, u.seed||3);
    X.restore();
    X.strokeStyle= kick>0.05? '#ffd86a' : c[2]; X.lineWidth=2; X.beginPath();
    X.arc(x+4, y+h/2, h*0.62*(1+kick*0.12), 0, 7); X.stroke();
    X.textAlign='center';
    X.fillStyle='#ffffff'; X.font='900 14px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(U[u.k].nm, x+w/2, y+h/2+5);

    X.textAlign='right'; X.fillText(Math.ceil(u.hp)+' / '+Math.round(u.max), x+w-10, y+h/2+5);
    X.textAlign='left';
    X.restore();
  });
}

function shade(hex, amt){
  if(!hex) hex='#3fb0f5';
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function espec(k, field){
  const o = B && B.L.enemy && B.L.enemy[k];
  return (o && o[field]!==undefined) ? o[field] : U[k][field];
}
function slotCount(){ return Math.min(TEAM_SLOTS, FREE_SLOTS + (save.slots||0)); }
function slotCost(i){ return SLOT_COST[i-FREE_SLOTS]; }            // i is the slot index, 5..9
function autoEquip(k){
  // your first five blobs walk straight into the squad — after that you pick
  if(!save.team) save.team = [];
  if(save.team.indexOf(k)>=0) return;
  const t = save.team;
  for(let i=0;i<FREE_SLOTS;i++){
    if(!t[i] || save.lv[t[i]]<=0){ t[i]=k; return; }
  }
}
function buySlot(i){                                   // one slot at a time, in order
  const next = FREE_SLOTS + (save.slots||0);
  const c = slotCost(i);
  if(i!==next || c==null || save.xp < c){ SFX.deny(); return; }
  save.xp -= c; save.slots = (save.slots||0) + 1; persist();
  SFX.unlock(); SFX.upgrade();
}
function teamUnits(){
  const t = (save.team||[]).slice(0, slotCount()).filter(k => owned(k));
  return t.length? t : unlockedUnits().slice(0, FREE_SLOTS);
}
function unlockedUnits(){
  const out=['blob'];
  if(save.lv.golden>0) out.push('golden');
  if(save.lv.baby>0) out.push('baby');
  if(save.lv.mage>0) out.push('mage');

const WAVE_GAP = 5;

function nextBossWave(){
  const L=B.L, w=L.bossWaves[B.bossWave];
  if(!w){ B.bossUnits=[]; return; }
  B.bossWave++; B.waveGap = (L.waveGap!=null? L.waveGap : WAVE_GAP);
  B.bossUnits = w.map(k=>spawnUnit(k, !L.bossOnly || L.bossOnly.indexOf(k)>=0));   // bossOnly: just those wear a boss bar
  if(L.qbEvery && !B.qbOn){ B.qbOn = true; B.qbT = L.qbEvery; }

function spawnUnit(k, asBoss, quiet){
  const d=U[k];
  const boss = !quiet && !!(asBoss || (d.boss && B && B.L.boss===k));
  let hp = d.team>0 ? uhp(k) : espec(k,'hp');
  if(boss) hp = Math.max(10, Math.round(hp/10)*10);     // a boss bar reads better in tens
  const u={ k, team:d.team, hp, max:hp, x: d.team>0? P_FRONT+18 : E_FRONT-22,
    atk:0, sw:0, swT:0, dealt:false, dir:d.team, seed:Math.random()*10, ph:Math.random()*6,
    flash:0, dead:false, dt:0, moving:true, blink:0, bt:1+Math.random()*4, spawnA:0,
    rs: (d.team<0 ? (espec(k,'rs')||1) : 1), evo: (d.team>0 && evoOn(k)),
    air:false, dying:false, z:0, vz:0, kvx:0, bounces:0, kbT:0, kbCount:0, squish:0 };
  u.isBoss = boss;                                          // whoever wears the bar at the top
  const sh = d.team<0 ? espec(k,'shield') : d.shield;
  if(sh){ u.shield = u.shieldMax = sh; }                    // a shield soaks every hit until it breaks
  if(d.shadowOf) u.undead = 1;                              // a dev-mode shadow: drawn like a reaped one
  B.units.push(u);
  if(u.isBoss) bossEntry(u);                                  // and makes an entrance
  return u;
}
function buyWealth(){
  if(!B || B.over || B.paused) return;
  if(B.wealth>=WEALTH_COST.length){ SFX.deny(); return; }
  const c = WEALTH_COST[B.wealth];
  if(B.juice < c){ SFX.deny(); return; }
  B.juice -= c; B.wealth++;
  SFX.upgrade();
  ring(P_BASE_X+40, GY-120, '#8affc9', 8, 90, 0.45, 6);
  for(let i=0;i<14;i++) puff(P_BASE_X+40, GY-90, '#8affc9', -120);
}

function tryDeploy(k){
  const d=U[k];
  if(B.over||B.paused) return;
  if(d.once && B.used[k]){ SFX.deny(); return; }   // one of him a battle, and that is that
  if(B.cd[k]>0){ SFX.deny(); return; }
  if(B.juice < d.cost){ SFX.deny(); return; }
  B.juice -= d.cost; B.cd[k]=ucd(k);
  if(d.once) B.used[k]=1;
  const u=spawnUnit(k);
  SFX.spawn();
  for(let i=0;i<10;i++) puff(u.x, GY-14, U[k].c[1]);
  if(d.hitman) launchHitman(u);
  if(B.tut && B.tut.step===0) tutNext();
}
/* ---- HIT MAN BLOB: lights a stick of dynamite, rides the blast to the far side, turns round and shoots ---- */

  SFX.boom(); shake=Math.max(shake,10); flashScreen=Math.max(flashScreen,0.18);

/* ---- the phoenix's beam: one tick of it. Always on the NEAREST foe: if its target is
   launched, dies, or gets shoved back behind someone closer, the beam jumps. The base if nobody is left ---- */
function beamTick(u, d){
  const reach = d.beam.reach!=null ? d.beam.reach : (d.r + d.rng)*(u.rs||1);   // the phoenix's is unlimited
  let near = null, bd = 1e9;
  for(const o of B.units){
    if(o.team===u.team || o.dead || o.dying || o.air) continue;
    const dd = Math.abs(o.x-u.x);
    if(dd <= reach && dd < bd){ bd = dd; near = o; }
  }
  let t = u.beamT;
  const still = t && !t.dead && !t.dying && !t.air && Math.abs(t.x-u.x) <= reach;
  // a little give (16px) so it doesn't flicker between two blobs standing side by side
  if(!still || (near && near!==t && Math.abs(t.x-u.x) - bd > 16)) t = near;
  u.beamT = t;
  const dmg = unitDmg(u);
  if(t){
    dmgUnit(t, dmg, u.team, u);
    u.beamX = t.x; u.beamY = GY - U[t.k].r*0.8*(t.rs||1);
  } else {
    const wall = u.team>0 ? E_FRONT : P_FRONT;
    if(Math.abs(wall-u.x) <= reach){
      if(u.team>0) B.ebHP=Math.max(0,B.ebHP-dmg); else B.pbHP=Math.max(0,B.pbHP-dmg);
      u.beamX = wall + (u.team>0? 10 : -10); u.beamY = GY-60;
    } else { u.beamX = null; }
  }
  if(u.beamX!=null && Math.random()<0.45){
    B.parts.push({x:u.beamX+(Math.random()-0.5)*16, y:u.beamY+(Math.random()-0.5)*16,
      vx:(Math.random()-0.5)*260, vy:-60-Math.random()*200, r:2+Math.random()*3.5,
      life:0.22+Math.random()*0.25, t:0, col: Math.random()<0.5?'#ffffff':'#8fd6ff', g:380});
  }
  if(Math.random()<0.18) tone(900+Math.random()*300, 0.05, 'sawtooth', 0.035, 600);
}

/* ---- knockback: cartoon launch + bounce, Battle-Cats style ---- */
function knockback(u, power, dying){
  if(U[u.k].noKB && !dying) return;          // the magician plants its feet
  if(U[u.k].onKB && !dying && B){            // knock him back and he calls for help
    const o=U[u.k].onKB;
    for(let i=0;i<(o.n||1);i++) B.pendingK.push({t:i*0.35, k:o.k});
  }
  u.air=true; u.kbT=0; u.bounces=0;
  u.vz = 400*power;
  u.kvx = -u.team * 170 * power;
  if(!U[u.k].steady || dying){ u.sw=0; u.dealt=true; }   // a steady caster keeps hold of its charge
  u.moving=false;
  if(dying) u.dying=true;
  SFX.whump();
}
function updateAir(u, dt){
  u.kbT += dt;
  u.vz -= 2500*dt;
  u.z  += u.vz*dt;
  u.x  += u.kvx*dt;
  u.x = Math.max(P_FRONT-34, Math.min(E_FRONT+34, u.x));
  if(u.z<=0){
    u.z=0; u.bounces++; u.squish=1;
    for(let i=0;i<7;i++) puff(u.x+(Math.random()-0.5)*20, GY-4, '#ffffff', -40);
    if(u.bounces>=3 || u.vz>-150){ endAir(u); }
    else { u.vz = -u.vz*0.44; u.kvx *= 0.55; SFX.bounce(); }
  }
}
function endAir(u){
  u.air=false; u.z=0; u.vz=0; u.kvx=0;
  if(u.dying){
    u.dead=true; u.dt=0.45; if(u.team<0) B.kills++;
    if(u.team<0) B.killed[u.k] = (B.killed[u.k]||0) + 1;
    const sp = u.team<0 ? espec(u.k,'splitInto') : U[u.k].splitInto;   // a level can make anything split
    if(sp && !u.noSplit){                             // scrap slimes come apart
      for(let i=0;i<sp.n;i++){
        const h = spawnUnit(sp.k);
        h.x = u.x + (i - (sp.n-1)/2) * 34;
        h.noSplit = true; h.spawnA = 0;
        if(sp.mul){                                   // the pieces carry their own boost and size
          h.hp = h.max = Math.round(U[sp.k].hp*sp.mul*10)/10;
          h.dmgFix = U[sp.k].dmg*sp.mul; h.rs = sp.rs||1;
        }
      }
      ring(u.x, GY-U[u.k].r*0.8, '#ffc89a', 8, 92, 0.42, 6);
      for(let q=0;q<14;q++) puff(u.x+(Math.random()-0.5)*30, GY-14, '#e8a76a', -120);
    }
    if(U[u.k].spores){                                // a mushroom goes up in a cloud
      const sp2 = U[u.k].spores;
      B.spores.push({x:u.x, r:sp2.r, t:0, life:sp2.t, team:u.team, seed:Math.random()*10});
      noise(0.5,0.14,700,200,0.7); for(let q=0;q<12;q++) puff(u.x+(Math.random()-0.5)*40, GY-20, '#d8c98a', -60);
    }
    splat(u.x, GY-U[u.k].r*0.7, U[u.k].c[1], 18, 210);
    SFX.splat();
  } else {
    u.atk = U[u.k].rate*0.6;   // needs a moment to wind up again
  }
}

/* ---- TRAITS and ABILITIES ----------------------------------------------
   Every enemy carries one or two traits. Any unit, on either side, can carry
   abilities; an ability with a `vs` list only works against those traits.
     massive   2x damage          extra     1.5x damage
     massdef   takes half damage  extradef  takes damage / 1.5   weak  takes 1.5x
     kb        a chance per hit to shove the target back a little
     freeze    a chance to lock the target solid for `time` seconds
     slow      a chance to make it move and attack at half speed for `time`
   ------------------------------------------------------------------------ */
const TRAITS = {
  normal: {nm:'NORMAL',  col:'#d8dde2'}, fire:   {nm:'FIRE',    col:'#ff6a2a'},
  dark:   {nm:'DARK',    col:'#8a5cff'}, angelic:{nm:'ANGELIC', col:'#ffd86a'},
  toxic:  {nm:'TOXIC',   col:'#8ee23a'} };
const ABIL_NAMES = { massive:'MASSIVE DMG', extra:'EXTRA DMG', massdef:'RESISTANT', extradef:'EXTRA DEF',
                     weak:'WEAK', kb:'KNOCKBACK', freeze:'FREEZE', slow:'SLOW', immune:'IMMUNE' };
// POISON: a toxic hitter's poison{mul,t} adds mul x the hit as damage spread over t seconds
function immuneTo(tgt, src){ return abilsOf(tgt).some(ab => ab.t==='immune' && abilHits(ab, src)); }
function applyPoison(src, tgt, hit){
  const P = (src.evo && EVO[src.k] && EVO[src.k].poison) || (U[src.k] && U[src.k].poison);   // an evolution can bring its own
  if(!P || tgt.dead || tgt.dying || immuneTo(tgt, src)) return;
  const total = hit * (P.mul||1) + (tgt.poisonT>0 ? tgt.poisonDps*tgt.poisonT : 0);   // a fresh dose tops up what's left
  tgt.poisonT = P.t || 3; tgt.poisonDps = total / tgt.poisonT; tgt.poisonFrom = src.team;
}
function traitsOf(u){ return (u && U[u.k] && U[u.k].traits) || []; }
function abilsOfKey(k, evo){ const a = U[k].abil || []; const e = evo && EVO[k] && EVO[k].abil; return e ? a.concat(e) : a; }
function abilsOf(u){ return abilsOfKey(u.k, !!u.evo); }
function abilHits(ab, other){ return !ab.vs || ab.vs.some(t => traitsOf(other).indexOf(t) >= 0); }
function dmgMultiplier(src, tgt){
  let m = 1;
  for(const ab of abilsOf(src)){ if(!abilHits(ab, tgt)) continue;
    if(ab.t==='massive') m *= 2; else if(ab.t==='extra') m *= 1.5; }
  for(const ab of abilsOf(tgt)){ if(!abilHits(ab, src)) continue;
    if(ab.t==='massdef') m *= 0.5; else if(ab.t==='extradef') m /= 1.5;
    else if(ab.t==='weak') m *= 1.5; }
  return m;
}
function applyProcs(src, tgt){
  for(const ab of abilsOf(src)){
    if(ab.chance==null || !abilHits(ab, tgt) || Math.random() >= ab.chance) continue;
    if(ab.t==='kb'){ if(!U[tgt.k].noKB) tgt.push = Math.min(110, (tgt.push||0) + (ab.dist||44)); }
    else if(ab.t==='freeze'){ tgt.freezeT = Math.max(tgt.freezeT||0, ab.time||1); tgt.sw=0; }
    else if(ab.t==='slow'){ tgt.slowT = Math.max(tgt.slowT||0, ab.time||2); }
  }
}
function traitIcon(t, x, y, r){                       // a coloured disc with a tiny glyph in it
  const T0 = TRAITS[t]; if(!T0) return;
  X.save();
  X.fillStyle='rgba(8,16,26,.85)'; X.beginPath(); X.arc(x, y, r+1.6, 0, 7); X.fill();
  X.fillStyle=T0.col; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill();
  X.fillStyle='rgba(10,18,28,.85)'; X.strokeStyle='rgba(10,18,28,.85)'; X.lineWidth=Math.max(1, r*0.28); X.lineCap='round';
  const q=r*0.55;
  X.beginPath();
  if(t==='normal'){ X.arc(x, y, q*0.55, 0, 7); X.fill(); }                        // a plain dot
  else if(t==='fire'){ X.moveTo(x, y-q); X.quadraticCurveTo(x+q, y, x+q*0.3, y+q); X.lineTo(x-q*0.3, y+q); X.quadraticCurveTo(x-q, y, x, y-q); X.fill(); }
  else if(t==='dark'){ X.arc(x, y, q, 0.6, Math.PI*2-0.6); X.arc(x+q*0.45, y, q*0.7, Math.PI*2-0.9, 0.9, true); X.fill(); }
  else if(t==='angelic'){ X.ellipse(x, y, q, q*0.45, 0, 0, 7); X.stroke(); }
  else if(t==='toxic'){ X.moveTo(x, y-q*1.05); X.quadraticCurveTo(x+q*0.95, y+q*0.15, x, y+q*0.95);    // a drip
                        X.quadraticCurveTo(x-q*0.95, y+q*0.15, x, y-q*1.05); X.fill(); }
  X.restore();
}
function abilText(ab){
  const nm = ABIL_NAMES[ab.t] || ab.t.toUpperCase();
  const vs = ab.vs ? ' vs '+ab.vs.map(t=>TRAITS[t]? TRAITS[t].nm : t).join('/') : '';
  const ch = ab.chance!=null ? ' '+Math.round(ab.chance*100)+'%' : '';
  const tm = ab.time!=null ? ' '+ab.time+'s' : '';
  return nm+ch+tm+vs;
}

/* combat */
function shieldBreak(u){
  SFX.slam(); tone(520,0.12,'square',0.10,180); noise(0.18,0.20,2600,600,1.4);
  const sx = u.x + u.team*U[u.k].r*0.55, sy = GY - U[u.k].r*0.7;
  ring(sx, sy, '#e8d2a0', 6, 60, 0.3, 5);
  for(let q=0;q<14;q++) B.parts.push({x:sx, y:sy, vx:(Math.random()-0.5)*300 + u.team*60, vy:-80-Math.random()*220,
    r:2.5+Math.random()*4, life:0.45+Math.random()*0.4, t:0, col: Math.random()<0.5?'#b07a3c':'#c9cfd6', g:520});
}
/* ---- THE TIDE's tsunami: a wall of water rolls down the lane toward your base. Everything it
   reaches is hit and knocked back — no dodging, no lucky miss. It breaks on your base if it gets there ---- */
function unleashTsunami(u, d){
  const T0 = d.tsunami;
  B.waves.push({x: u.x + u.team*d.r*0.6, dir: u.team, speed: T0.speed, life: T0.life, t: 0,
    dmg: unitDmg(u), kb: T0.kb, hit: new Set(), baseHit: false, src: u});
  SFX.boom(); noise(1.4,0.30,1800,200,0.6); tone(70,0.9,'sine',0.30,34);
  shake = Math.max(shake, 14); flashScreen = Math.max(flashScreen, 0.35);
}
function updateWaves(dt){
  for(const w of B.waves){
    w.t += dt; w.x += w.dir*w.speed*dt;
    const front = w.x, back = w.x - w.dir*90;
    for(const o of B.units){
      if(o.team===w.src.team || o.dead || o.dying || o.air || o.fly || w.hit.has(o)) continue;
      const ins = w.dir<0 ? (o.x >= front - 12 && o.x <= back) : (o.x <= front + 12 && o.x >= back);
      if(!ins) continue;
      w.hit.add(o);
      dmgUnit(o, w.dmg, w.src.team, w.src);
      if(!o.dead && !o.dying && !o.air && !U[o.k].noKB) knockback(o, w.kb, false);   // 100%: every blob it touches
      for(let q=0;q<6;q++) B.parts.push({x:o.x, y:GY-20-Math.random()*40, vx:w.dir*(60+Math.random()*160), vy:-80-Math.random()*180,
        r:2+Math.random()*4, life:0.4+Math.random()*0.3, t:0, col: Math.random()<0.5?'#e8fbff':'#7fd6d0', g:420});
    }
    const wall = w.dir<0 ? P_FRONT : E_FRONT;
    if(!w.baseHit && (w.dir<0 ? w.x <= wall : w.x >= wall)){
      w.baseHit = true;
      if(w.dir<0) B.pbHP = Math.max(0, B.pbHP - w.dmg); else B.ebHP = Math.max(0, B.ebHP - w.dmg);
      SFX.baseHit(); shake = Math.max(shake, 10);
    }
    if(Math.random()<0.8) B.parts.push({x:w.x + (Math.random()-0.3)*40*(-w.dir), y:GY-90-Math.random()*70, vx:w.dir*(80+Math.random()*120),
      vy:-40-Math.random()*120, r:2+Math.random()*4, life:0.35+Math.random()*0.3, t:0, col:'#effcff', g:360});
  }
  B.waves = B.waves.filter(w => w.t < w.life);
}
function drawWaves(){
  for(const w of B.waves){
    const grow = Math.min(1, w.t/0.18), fade = Math.min(1, (w.life - w.t)/0.25);
    const Hh = 175*grow, x = w.x, d = w.dir;            // d = which way it rolls (-1 = toward your base)
    X.save(); X.globalAlpha = 0.92*fade;
    const g = X.createLinearGradient(0, GY-Hh, 0, GY);
    g.addColorStop(0,'#bff3ec'); g.addColorStop(0.25,'#3fb8ad'); g.addColorStop(1,'#14566a');
    X.fillStyle = g;
    X.beginPath();
    X.moveTo(x - d*170, GY);                                         // long back slope
    X.quadraticCurveTo(x - d*110, GY - Hh*0.55, x - d*20, GY - Hh);     // up to the crest
    X.quadraticCurveTo(x + d*40, GY - Hh*1.06, x + d*55, GY - Hh*0.72); // curling over the top
    X.quadraticCurveTo(x + d*20, GY - Hh*0.70, x + d*12, GY - Hh*0.42); // the hollow under the lip
    X.quadraticCurveTo(x + d*30, GY - Hh*0.12, x + d*48, GY);           // front face down to the ground
    X.closePath(); X.fill();
    X.strokeStyle = 'rgba(255,255,255,.85)'; X.lineWidth = 5; X.lineCap='round';      // foam on the crest
    X.beginPath(); X.moveTo(x - d*60, GY - Hh*0.86); X.quadraticCurveTo(x, GY - Hh*1.04, x + d*52, GY - Hh*0.74); X.stroke();

      else if(!u.dealt && (1-u.sw/u.swT) >= hitPoint(u,d) && d.coin){

          let hits=0;

              if(o.team===u.team || o.dead || o.dying) continue;
              if(Math.abs(o.x-ix) <= d.aoe + U[o.k].r*0.5*(o.rs||1)){ dmgUnit(o, dmg, u.team, u); hits++; }
            }
            if(!hits){ dmgUnit(t2, dmg, u.team, u); hits=1; }
          } else {
            dmgUnit(t2, dmg, u.team, u);
          }
          ring(ix, iy, u.team>0?'#bfefff':'#d8ff9a', 4, 26+d.r*0.5, 0.26, 4);
          splat(ix, iy, u.team>0?'#9fdcff':'#b6ee6a', u.k==='chonk'?12:7, u.k==='chonk'?200:120);
          if(u.k==='chonk'){
            SFX.slam();

            if(hits>1){ shake=Math.max(shake,14); }
            for(let q=0;q<22;q++) B.parts.push({x:ix+(Math.random()-0.5)*d.aoe*1.6, y:GY-4,

          } else if(U[u.k].suicide){
            SFX.boom(); shake=Math.max(shake,14); flashScreen=Math.max(flashScreen,0.22);
            ring(ix, iy, '#ffd08a', 10, 130, 0.42, 8);

            for(let q=0;q<26;q++){
              const a2=Math.random()*Math.PI*2;
              B.parts.push({x:ix, y:iy, vx:Math.cos(a2)*(120+Math.random()*320), vy:Math.sin(a2)*(120+Math.random()*320)-60,

            }
            if(!u.dead && !u.dying){ u.hp=0; knockback(u, 1.5, true); }
          } else if(U[u.k].bite){
            SFX.slam(); tone(150,0.16,'square',0.14,60); noise(0.12,0.16,1800,500,1.6);
            ring(ix, iy, '#d8fbe6', 8, 90, 0.32, 6);
            for(let q=0;q<12;q++) B.parts.push({x:ix, y:iy+(Math.random()-0.5)*40,
              vx:u.team*(60+Math.random()*260), vy:(Math.random()-0.5)*260, r:3+Math.random()*5,

          } else if(U[u.k].sword){
            SFX.punch();
            tone(620,0.09,'triangle',0.13,330); noise(0.07,0.07,2600,1200,2.4,0.01);
            ring(ix, iy, '#ffe9e4', 8, 60, 0.26, 4);
            for(let q=0;q<8;q++) B.parts.push({x:ix, y:iy+(Math.random()-0.5)*26,
              vx:u.team*(90+Math.random()*220), vy:(Math.random()-0.5)*220, r:2+Math.random()*4,
              life:0.25+Math.random()*0.3, t:0, col: Math.random()<0.5?'#ffffff':'#ffd6d0', g:300});
          } else if(U[u.k].humanoid){
            SFX.slam();
            ring(ix, iy, '#e8c9ff', 12, d.aoe*1.5, 0.42, 8);
            ring(ix, GY-8, '#c9a2ff', 10, d.aoe*2.0, 0.5, 6);
            if(hits>1) shake=Math.max(shake,15);
            for(let q=0;q<16;q++) B.parts.push({x:ix+(Math.random()-0.5)*50, y:iy+(Math.random()-0.5)*40,

          } else if(U[u.k].jump){
            SFX.slam(); shake=Math.max(shake,11); hitStop=Math.max(hitStop,0.04);
            ring(ix, GY-6, '#ffd6ec', 12, d.aoe*2.0, 0.42, 8);
            ring(ix, GY-6, '#ffffff', 8, d.aoe*1.2, 0.28, 5);
            for(let q=0;q<16;q++) B.parts.push({x:ix+(Math.random()-0.5)*d.aoe*1.4, y:GY-4,
