/* ---- JUMPER BLOB: it never takes a step. It crouches, launches itself down
   the lane and lands on whatever is there. Evolved it rides a pogo spring. ---- */
function pogoSpring(cx, bottomY, topY, w, squash){
  const h = bottomY - topY;
  if(h < 4) return;
  X.save();
  X.strokeStyle='#8f2358'; X.lineCap='round'; X.lineWidth=Math.max(2.5, w*0.22);
  const coils = 5;
  X.beginPath(); X.moveTo(cx, bottomY);
  for(let i=0;i<=coils*2;i++){
    const q=i/(coils*2);
    X.lineTo(cx + ((i%2)? w*0.5 : -w*0.5)*(1+squash*0.5), bottomY - h*q);
  }
  X.stroke();
  X.fillStyle='#c94a86'; X.strokeStyle='#6d1741'; X.lineWidth=Math.max(1.6, w*0.10);
  rr(cx-w*0.85, bottomY-w*0.22, w*1.7, w*0.30, w*0.10); X.fill(); X.stroke();   // foot plate
  X.restore();
}
function drawJumper(u, cx, cy, rx, ry, dir, flash){
  const evo = !!(u.evo && EVO.jumper);
  const c = evo? EVO.jumper.c : U.jumper.c;
  const airborne = (cy + ry*0.72) < GY - 8;
  if(evo) pogoSpring(cx, GY+2, cy + ry*0.58, rx*0.46, airborne? 0 : 0.5);
  // speed lines while it is up in the arc
  if(airborne){
    X.save(); X.globalAlpha=0.30; X.strokeStyle=c[1]; X.lineCap='round';
    X.lineWidth=Math.max(2, rx*0.10);
    for(let i=0;i<3;i++){
      const oy=cy+ry*(0.1+i*0.32);
      X.beginPath(); X.moveTo(cx - dir*rx*(0.9+i*0.25), oy);
      X.lineTo(cx - dir*rx*(1.7+i*0.45), oy + ry*0.16); X.stroke();
    }
    X.restore();
  }
  drawBlob(u, cx, cy, rx, ry, dir, flash);
  // sweatband — the one thing that says athlete
  const bandTop = cy-ry*0.78, bandH = ry*0.15;
  X.save();
  gooPath(cx, cy, rx, ry, 0.022, 3, T, u.seed, true); X.clip();
  X.fillStyle= evo? '#ffd34a' : '#f4f8ff';
  X.fillRect(cx-rx*1.2, bandTop, rx*2.4, bandH);
  X.fillStyle= evo? '#c94a86' : '#7fb6ff';
  X.fillRect(cx-rx*1.2, bandTop+bandH*0.62, rx*2.4, bandH*0.26);
  X.restore();
  X.save();                                     // the tie, flicking behind it
  X.strokeStyle= evo? '#ffd34a' : '#f4f8ff'; X.lineCap='round';
  X.lineWidth=Math.max(2, rx*0.11);
  const tx=cx - dir*rx*0.86, ty=bandTop+bandH*0.5, fl=Math.sin(T*6+u.seed)*ry*0.10;
  X.beginPath(); X.moveTo(tx, ty);
  X.quadraticCurveTo(tx - dir*rx*0.34, ty+ry*0.10+fl, tx - dir*rx*0.52, ty+ry*0.26+fl);
  X.stroke();
  X.restore();
  // dust it kicks up when it is on the ground
  if(!airborne){
    X.save(); X.globalAlpha=0.22; X.fillStyle='#ffffff';
    X.beginPath(); X.ellipse(cx, GY-1, rx*1.15, rx*0.16, 0, 0, 7); X.fill(); X.restore();
  }
}

/* ---- FIERCE BLOB: not a creature so much as a small god. A body of night sky,
   a halo, a ring of light turning around him and shards in orbit. ---- */
function drawFierce(u, cx, cy, rx, ry, dir, flash){
  const d=U.fierce, E=(u.evo && EVO.fierce)? EVO.fierce : null;
  const t=T, seed=u.seed;
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, hp2 = hitPoint(u,d);
  const charge = p<0 ? 0.20 + 0.10*Math.sin(t*2.0+seed)
               : (p<hp2 ? 0.30 + 0.70*(p/hp2) : Math.max(0.3, 1-(p-hp2)/(1-hp2)));
  const spin = t*(0.5 + charge*1.1) + seed;
  // divine palette: violet-and-starlight, or pure gold once he ascends
  const C = E ? {lit:'#fff6cf', mid:'#ffd447', deep:'#8a5c06', ray:'#ffe89a', eye:'#fffbe8'}
              : {lit:'#e8ecff', mid:'#6f78e8', deep:'#1a1b4b', ray:'#b9c6ff', eye:'#f2f6ff'};
  const rgba=(hex,a)=>{ const n=parseInt(hex.slice(1),16);
    return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; };

  // ---- the light he sheds ----
  X.save(); X.globalCompositeOperation='lighter';
  X.globalAlpha=0.30+0.35*charge;
  const ag=X.createRadialGradient(cx, cy-ry*0.15, rx*0.25, cx, cy-ry*0.15, rx*2.5);
  ag.addColorStop(0, rgba(C.mid,0.85)); ag.addColorStop(0.45, rgba(C.mid,0.22)); ag.addColorStop(1, rgba(C.mid,0));
  X.fillStyle=ag; X.beginPath(); X.ellipse(cx, cy-ry*0.15, rx*2.5, ry*2.3, 0,0,7); X.fill();
  for(let i=0;i<12;i++){                                  // rays turning behind him
    const a = spin*0.5 + i*Math.PI/6;
    X.globalAlpha=(0.10+0.10*charge)*(0.6+0.4*Math.sin(t*2.5+i));
    X.strokeStyle=C.ray; X.lineWidth=rx*0.08; X.lineCap='round';
    X.beginPath(); X.moveTo(cx+Math.cos(a)*rx*1.05, cy-ry*0.15+Math.sin(a)*ry*1.0);
    X.lineTo(cx+Math.cos(a)*rx*2.15, cy-ry*0.15+Math.sin(a)*ry*2.0); X.stroke();
  }
  X.restore();
  if(!u.mini) shadow(cx, rx*0.92, 0.30);

  // ---- the ring that turns around him: back half first ----
  const ringR = rx*1.34, ringE = 0.30, ringY = cy + ry*0.12, tilt = -0.14;
  const ringArc = (from, to, w, a)=>{
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=a;
    X.translate(cx, ringY); X.rotate(tilt);
    X.strokeStyle=C.ray; X.lineWidth=w; X.lineCap='round';
    X.beginPath(); X.ellipse(0, 0, ringR, ringR*ringE, 0, from, to); X.stroke();
    X.strokeStyle='#ffffff'; X.lineWidth=w*0.34;
    X.beginPath(); X.ellipse(0, 0, ringR, ringR*ringE, 0, from, to); X.stroke();
    X.restore();
  };
  ringArc(Math.PI, Math.PI*2, rx*0.075, 0.45+0.35*charge);

  // shards orbiting behind him
  const shard=(a0, rad, sc, behind)=>{
    const a = spin*0.9 + a0;
    const sxp = cx + Math.cos(a)*rad, syp = ringY + Math.sin(a)*rad*ringE - ry*0.05;
    if((Math.sin(a) < 0) !== behind) return;
    X.save(); X.globalCompositeOperation='lighter';
    X.globalAlpha=(behind?0.5:0.9)*(0.55+0.45*charge);
    X.translate(sxp, syp); X.rotate(a*1.7);
    const r2=rx*0.13*sc;
    X.fillStyle=C.lit;
    X.beginPath(); X.moveTo(0,-r2); X.lineTo(r2*0.5,0); X.lineTo(0,r2); X.lineTo(-r2*0.5,0); X.closePath(); X.fill();
    X.globalAlpha*=0.5; X.fillStyle=C.ray;
    X.beginPath(); X.moveTo(0,-r2*1.8); X.lineTo(r2*0.9,0); X.lineTo(0,r2*1.8); X.lineTo(-r2*0.9,0); X.closePath(); X.fill();
    X.restore();
  };
  for(let i=0;i<5;i++) shard(i*Math.PI*0.4, rx*1.34, 1-(i%2)*0.25, true);

  // ---- the body: a piece of night sky held in a blob ----
  gooPath(cx, cy, rx, ry, 0.030, 4, t, seed, true);
  const bg=X.createRadialGradient(cx-rx*0.25, cy-ry*0.35, rx*0.10, cx, cy, rx*1.3);
  bg.addColorStop(0, E? C.mid : '#4a4fa8'); bg.addColorStop(0.55, E? '#e0a81f' : '#2a2c6e');
  bg.addColorStop(1, C.deep);
  X.fillStyle=bg; X.fill();
  X.lineWidth=Math.max(3, rx*0.055); X.strokeStyle= E? '#7a5106' : '#121338'; X.stroke();

  X.save(); X.clip();
  // nebula drifting inside him
  X.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    X.globalAlpha=0.16+0.10*Math.sin(t*0.9+i);
    X.fillStyle= i%2? C.mid : C.ray;
    X.beginPath(); X.ellipse(cx + Math.sin(t*0.35+i*2.1+seed)*rx*0.38,
                             cy - ry*0.12 + i*ry*0.26, rx*0.62, ry*0.26,
                             0.3*Math.sin(t*0.3+i), 0, 7); X.fill();
  }
  for(let i=0;i<14;i++){                                   // stars
    const sa = i*2.399 + seed, srad = rx*(0.15 + 0.72*((i*0.137+seed*0.31)%1));
    const stx = cx + Math.cos(sa)*srad, sty = cy + Math.sin(sa)*srad*0.8;
    X.globalAlpha=0.35+0.55*Math.abs(Math.sin(t*2.2 + i*1.7));
    X.fillStyle='#ffffff';
    X.beginPath(); X.arc(stx, sty, rx*0.018*(1+(i%3)*0.4), 0, 7); X.fill();
  }
  // the core, brightening as he draws the storm down
  X.globalAlpha=0.30+0.55*charge;
  const cg=X.createRadialGradient(cx, cy-ry*0.05, rx*0.03, cx, cy-ry*0.05, rx*0.85);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.35, rgba(C.mid,0.75)); cg.addColorStop(1, rgba(C.mid,0));
  X.fillStyle=cg; X.beginPath(); X.ellipse(cx, cy-ry*0.05, rx*0.85, ry*0.72, 0,0,7); X.fill();
  X.restore();

  // glyphs burning on his skin
  X.save(); X.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const a = spin*0.6 + i*2.1, gx2 = cx + Math.cos(a)*rx*0.66, gy2 = cy + Math.sin(a)*ry*0.52;
    X.globalAlpha=(0.30+0.40*charge)*(0.4+0.6*Math.sin(t*2+i*2));
    X.strokeStyle=C.lit; X.lineWidth=Math.max(1.6, rx*0.028); X.lineCap='round';
    X.beginPath();
    X.moveTo(gx2-rx*0.07, gy2-rx*0.07); X.lineTo(gx2+rx*0.07, gy2-rx*0.07);
    X.moveTo(gx2, gy2-rx*0.07); X.lineTo(gx2, gy2+rx*0.07);
    X.moveTo(gx2-rx*0.05, gy2+rx*0.07); X.lineTo(gx2+rx*0.05, gy2+rx*0.07);
    X.stroke();
  }
  X.restore();
  X.fillStyle='rgba(255,255,255,.35)';
  X.beginPath(); X.ellipse(cx-rx*0.36, cy-ry*0.48, rx*0.17, ry*0.08, -0.55, 0, 7); X.fill();

  // ---- the face: eyes of pure light ----
  const ey = cy - ry*0.10, dx = rx*0.29;
  X.save(); X.globalCompositeOperation='lighter';
  for(const sgn of [-1,1]){
    const ex2 = cx+sgn*dx+dir*rx*0.05;
    X.globalAlpha=0.35+0.35*charge;
    X.fillStyle=C.ray;
    X.beginPath(); X.ellipse(ex2, ey, rx*0.24, ry*0.17, 0,0,7); X.fill();

      X.quadraticCurveTo(ex2, ey-ry*0.115, ex2+rx*0.155, ey-ry*0.035);
      X.quadraticCurveTo(ex2, ey+ry*0.085, ex2-rx*0.155, ey+ry*0.02);
      X.closePath(); X.fill();
    }
  }
  X.restore();
  // brows of shadow, driven down hard
  X.fillStyle= E? '#7a5106' : '#101234';
  for(const sgn of [-1,1]){
    X.beginPath();
    X.moveTo(cx+sgn*rx*0.50, ey-ry*0.26);
    X.lineTo(cx+sgn*rx*0.06, ey-ry*0.04);
    X.lineTo(cx+sgn*rx*0.06, ey-ry*0.17);
    X.lineTo(cx+sgn*rx*0.48, ey-ry*0.38);

  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.7;
  X.strokeStyle=C.lit; X.lineWidth=Math.max(2, rx*0.035); X.lineCap='round';
  X.beginPath();
  if(u.sw>0) X.arc(cx+dir*rx*0.03, cy+ry*0.22, rx*0.18, 1.08*Math.PI, 1.92*Math.PI);
  else { X.moveTo(cx-rx*0.17, cy+ry*0.26); X.lineTo(cx+rx*0.17, cy+ry*0.24); }
  X.stroke(); X.restore();

  // ---- the halo ----
  X.save(); X.globalCompositeOperation='lighter';
  const hy = cy - ry*1.12 - Math.sin(t*1.4+seed)*ry*0.03;
  X.globalAlpha=0.55+0.40*charge;
  X.translate(cx + dir*rx*0.02, hy); X.rotate(-0.10);
  X.strokeStyle=C.ray; X.lineWidth=rx*0.10;
  X.beginPath(); X.ellipse(0,0, rx*0.62, rx*0.20, 0, 0, 7); X.stroke();
  X.strokeStyle='#ffffff'; X.lineWidth=rx*0.035;
  X.beginPath(); X.ellipse(0,0, rx*0.62, rx*0.20, 0, 0, 7); X.stroke();
  X.restore();
  // a diadem of light spikes over the brow
  X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.45+0.45*charge;
  X.fillStyle=C.lit;
  for(let i=-2;i<=2;i++){
    const a = i*0.34, bxp = cx + Math.sin(a)*rx*0.72, byp = cy - ry*0.72 - Math.cos(a)*ry*0.16;
    const h2 = rx*(0.20 - Math.abs(i)*0.035);
    X.save(); X.translate(bxp, byp); X.rotate(a*1.1);
    X.beginPath(); X.moveTo(0,-h2); X.lineTo(rx*0.055,0); X.lineTo(0,h2*0.35); X.lineTo(-rx*0.055,0); X.closePath(); X.fill();
    X.restore();
  }
  X.restore();

  // ---- ring and shards in front ----
  ringArc(0, Math.PI, rx*0.075, 0.55+0.35*charge);
  for(let i=0;i<5;i++) shard(i*Math.PI*0.4, rx*1.34, 1-(i%2)*0.25, false);

  // arcs snapping off him once he is charged
  if(charge>0.6 && !u.dead){
    X.save(); X.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){
      if(Math.floor(t*9 + i*2 + seed)%3) continue;
      X.globalAlpha=0.45*charge; X.strokeStyle='#ffffff';
      X.lineWidth=Math.max(1.8, rx*0.028); X.lineCap='round';
      const a0 = -0.6 - i*0.7 + Math.sin(t*3+i)*0.2;
      let ax = cx + Math.cos(a0)*rx*0.85, ay = cy + Math.sin(a0)*ry*0.85;
      X.beginPath(); X.moveTo(ax, ay);
      for(let j=0;j<3;j++){
        ax += Math.cos(a0)*rx*0.22 + (j%2? rx*0.10 : -rx*0.10);
        ay += Math.sin(a0)*ry*0.22;
        X.lineTo(ax, ay);
      }
      X.stroke();
    }
    X.restore();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.030,4,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}

/* ---- THE DEVIL: he hangs in the air. Two colossal white horns, a black crest
   between them, a shaggy grey mantle, a small white face with a black slime
   head inside it — and two clawed hands floating free, building a purple orb. ---- */
function devilHand(hx, hy, r, sgn, open){
  X.save(); X.translate(hx, hy); X.scale(sgn, 1);
  const line='#4a4652';
  // banded wrist
  X.fillStyle='#ffffff'; X.strokeStyle=line; X.lineWidth=Math.max(2, r*0.11);
  rr(-r*0.52, r*0.10, r*1.04, r*0.92, r*0.24); X.fill(); X.stroke();
  X.strokeStyle='rgba(74,70,82,.55)'; X.lineWidth=Math.max(1.4, r*0.07);
  for(let i=1;i<=2;i++){ X.beginPath(); X.moveTo(-r*0.46, r*(0.30+i*0.22)); X.lineTo(r*0.46, r*(0.30+i*0.22)); X.stroke(); }
  // palm
  X.fillStyle='#ffffff'; X.strokeStyle=line; X.lineWidth=Math.max(2, r*0.11);
  X.beginPath(); X.ellipse(0, 0, r*0.72, r*0.62, 0, 0, 7); X.fill(); X.stroke();
  X.fillStyle='#e9e6ef';
  X.beginPath(); X.ellipse(0, r*0.10, r*0.34, r*0.28, 0, 0, 7); X.fill();
  // three heavy claws
  for(let i=-1;i<=1;i++){
    const a = -Math.PI/2 + i*0.70 - open*0.16*i;
    X.save(); X.translate(Math.cos(a)*r*0.62, Math.sin(a)*r*0.58); X.rotate(a+Math.PI/2);
    const g=X.createLinearGradient(0,-r*0.9,0,r*0.2);
    g.addColorStop(0,'#8e8a98'); g.addColorStop(1,'#d9d6e0');
    X.fillStyle=g; X.strokeStyle=line; X.lineWidth=Math.max(1.8, r*0.10);
    X.beginPath();
    X.moveTo(-r*0.30, r*0.16);
    X.quadraticCurveTo(-r*0.34, -r*0.62, 0, -r*1.02);
    X.quadraticCurveTo(r*0.34, -r*0.62, r*0.30, r*0.16);
    X.quadraticCurveTo(0, r*0.34, -r*0.30, r*0.16);
    X.closePath(); X.fill(); X.stroke();
    X.restore();
  }
  X.restore();
}
function drawDevil(u, cx, cy, rx, ry, dir, flash){
  const c=U.devil.c, t=T, seed=u.seed;
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, h = hitPoint(u, U.devil);
  const grow = p<0 ? 0 : (p<h ? Math.pow(p/h, 0.7) : 0);
  const burst = (p>=h) ? Math.min(1, (p-h)/(1-h)) : 0;
  const LINE='#4a4652';

  // ---- the shaggy grey mantle hanging behind and below him ----
  X.save();
  for(let i=0;i<11;i++){
    const a = Math.PI*0.10 + i*(Math.PI*0.80/10);          // fans across the lower half
    const len = ry*(1.15 + 0.45*Math.abs(Math.sin(i*1.9+seed)));
    const w = 0.13 + 0.04*Math.sin(i*2.7);
    X.fillStyle = i%2? '#6f6b7a' : '#57535f';
    X.beginPath();
    X.moveTo(cx + Math.cos(a-w)*rx*0.52, cy + Math.sin(a-w)*ry*0.42);
    X.lineTo(cx + Math.cos(a)*rx*0.92, cy + Math.sin(a)*len);
    X.lineTo(cx + Math.cos(a+w)*rx*0.52, cy + Math.sin(a+w)*ry*0.42);
    X.closePath(); X.fill();
  }
  for(let i=0;i<7;i++){                                     // and a ragged fringe out to the sides
    const sgn = i<4? -1 : 1, j = i%4;
    const a = sgn*(0.55 + j*0.34);
    const len = rx*(1.05 + 0.35*Math.abs(Math.sin(i*2.1+seed)));
    X.fillStyle = i%2? '#7a7687' : '#5e5a68';
    X.beginPath();
    X.moveTo(cx + Math.cos(a-0.16)*rx*0.5, cy - ry*0.10 + Math.sin(a-0.16)*ry*0.5);
    X.lineTo(cx + Math.cos(a)*len, cy - ry*0.10 + Math.sin(a)*len*0.75);
    X.lineTo(cx + Math.cos(a+0.16)*rx*0.5, cy - ry*0.10 + Math.sin(a+0.16)*ry*0.5);
    X.closePath(); X.fill();
  }
  X.restore();

  // ---- the black crest between the horns ----
  X.save();
  for(let i=0;i<9;i++){
    const a = -Math.PI*0.86 + i*(Math.PI*0.72/8);
    const len = ry*(1.02 + 0.30*Math.abs(Math.sin(i*2.3+seed*1.3)));
    X.fillStyle = i%2? '#15141c' : '#262433';
    X.beginPath();
    X.moveTo(cx + Math.cos(a-0.13)*rx*0.40, cy + Math.sin(a-0.13)*ry*0.40);
    X.lineTo(cx + Math.cos(a)*rx*0.62, cy + Math.sin(a)*len);
    X.lineTo(cx + Math.cos(a+0.13)*rx*0.40, cy + Math.sin(a+0.13)*ry*0.40);
    X.closePath(); X.fill();
  }
  X.restore();

  // ---- the horns: tall and slim, a gentle bow, a fine point ----
  for(const sgn of [-1,1]){
    X.save(); X.translate(cx + sgn*rx*0.28, cy + ry*0.02); X.scale(sgn, 1);
    const hg=X.createLinearGradient(-rx*0.1, ry*0.3, rx*0.5, -ry*1.9);
    hg.addColorStop(0,'#cdc7b8'); hg.addColorStop(0.35,'#f2efe6'); hg.addColorStop(1,'#ffffff');
    X.fillStyle=hg; X.strokeStyle=LINE; X.lineWidth=Math.max(2.2, rx*0.034);
    X.lineJoin='round';
    X.beginPath();
    X.moveTo(0, ry*0.28);                                         // inner root
    X.lineTo(rx*0.26, ry*0.26);                                   // a narrow base
    X.quadraticCurveTo(rx*0.58, -ry*0.60, rx*0.48, -ry*1.36);     // a gentle bow outwards
    X.quadraticCurveTo(rx*0.42, -ry*1.84, rx*0.20, -ry*2.04);     // in to the point
    X.quadraticCurveTo(rx*0.38, -ry*1.30, rx*0.22, -ry*0.62);     // back down the inside
    X.quadraticCurveTo(rx*0.12, -ry*0.10, 0, ry*0.28);
    X.closePath(); X.fill(); X.stroke();
    X.strokeStyle='rgba(110,102,88,.28)'; X.lineWidth=Math.max(1.2, rx*0.015);
    for(let i=1;i<=4;i++){
      const q=i/5.6;
      X.beginPath();
      X.moveTo(rx*(0.24-q*0.06), ry*(0.24-q*0.84));
      X.quadraticCurveTo(rx*(0.54-q*0.14), -ry*(0.60+q*0.84), rx*(0.46-q*0.22), -ry*(1.34+q*0.52));
      X.stroke();
    }
    X.restore();
  }

  // ---- the grey ruff, small in the middle of it all ----
  X.save();
  for(let i=0;i<10;i++){
    const a = i*Math.PI*2/10 + Math.sin(t*0.8+seed)*0.04;
    X.fillStyle = i%2? '#b9b7c2' : '#a3a1ad';
    X.beginPath(); X.arc(cx + Math.cos(a)*rx*0.38, cy + Math.sin(a)*ry*0.34, rx*0.21, 0, 7); X.fill();
  }
  X.fillStyle='#b9b7c2';
  X.beginPath(); X.ellipse(cx, cy, rx*0.44, ry*0.40, 0, 0, 7); X.fill();
  X.restore();
  // the third eye on his brow
  X.save();
  X.fillStyle='#15141c';
  X.beginPath(); X.ellipse(cx, cy - ry*0.44, rx*0.11, ry*0.07, 0, 0, 7); X.fill();
  X.fillStyle='#ff3b3b';
  X.beginPath(); X.ellipse(cx, cy - ry*0.44, rx*0.045, ry*0.032, 0, 0, 7); X.fill();
  X.restore();
  // the black slime head inside the ruff
  gooPath(cx, cy - ry*0.02, rx*0.33, ry*0.30, 0.055, 5, t, seed, true);
  const fg=X.createRadialGradient(cx-rx*0.09, cy-ry*0.14, rx*0.03, cx, cy, rx*0.44);
  fg.addColorStop(0,'#343040'); fg.addColorStop(0.6,'#1a1822'); fg.addColorStop(1,'#0a090f');
  X.fillStyle=fg; X.fill();
  X.lineWidth=Math.max(1.8, rx*0.028); X.strokeStyle='#07060b'; X.stroke();
  X.save(); X.globalCompositeOperation='lighter';
  for(const sgn of [-1,1]){
    const ex=cx+sgn*rx*0.12+dir*rx*0.02, ey=cy-ry*0.08;
    X.globalAlpha=0.45+0.25*Math.sin(t*4+seed);
    X.fillStyle='#ff2a2a';
    X.beginPath(); X.ellipse(ex, ey, rx*0.11, ry*0.085, 0,0,7); X.fill();
    X.globalAlpha=1; X.fillStyle='#ff4a4a';
    X.beginPath(); X.ellipse(ex, ey, rx*0.055, ry*0.042, 0,0,7); X.fill();
    X.fillStyle='#ffd6d6';
    X.beginPath(); X.ellipse(ex-rx*0.015, ey-ry*0.012, rx*0.020, ry*0.016, 0,0,7); X.fill();
  }
  X.restore();
  X.strokeStyle='#07060b'; X.lineWidth=Math.max(1.6, rx*0.022); X.lineCap='round';
  X.beginPath();
  X.moveTo(cx-rx*0.075, cy+ry*0.10); X.lineTo(cx+rx*0.075, cy+ry*0.09);
  X.moveTo(cx, cy+ry*0.03); X.lineTo(cx, cy+ry*0.095);

  // ---- the hands, floating free, and what they are making ----
  const reach = 1 - 0.40*grow;
  const hx1 = cx + dir*rx*(0.85 + 0.50*reach) - dir*rx*0.40*burst;
  const hx2 = cx - dir*rx*(0.80 + 0.35*reach) - dir*rx*0.30*burst;
  const hy1 = cy + ry*(0.62 - 0.22*grow) + ry*0.30*burst;
  const hy2 = cy + ry*(0.74 - 0.10*grow) + ry*0.30*burst;
  devilHand(hx1, hy1, rx*0.34, dir, grow);
  devilHand(hx2, hy2, rx*0.34, -dir, grow);

  // ---- the orb: it climbs out of the ground where it means to land, then falls in on itself ----
  const orbX = (u.lockX!=null) ? u.lockX : cx + dir*rx*1.30;
  const R0 = rx*0.85;
  if(p>=0 && burst<=0){
    const rise = grow;                                          // 0 at the first crack, 1 fully risen
    const imp = rise>0.90 ? (rise-0.90)/0.10 : 0;               // the last tenth is the collapse
    const orbR = R0 * (0.22 + 0.78*rise) * (imp>0 ? (1-0.88*imp*imp) : 1);
    const orbY = GY - 6 - 104*Math.pow(rise, 0.75);
    // the ground it is coming out of
    X.save(); X.globalCompositeOperation='lighter';
    X.globalAlpha=(0.30+0.45*rise)*(1-imp*0.5);
    const gg2=X.createRadialGradient(orbX, GY+2, 2, orbX, GY+2, R0*1.5);
    gg2.addColorStop(0,'#e8c8ff'); gg2.addColorStop(0.4,'rgba(150,60,240,.45)'); gg2.addColorStop(1,'rgba(110,16,190,0)');
    X.fillStyle=gg2; X.beginPath(); X.ellipse(orbX, GY+2, R0*1.5, R0*0.34, 0, 0, 7); X.fill();
    X.globalAlpha=0.5+0.4*rise; X.strokeStyle='#d9a6ff'; X.lineWidth=Math.max(2, rx*0.035); X.lineCap='round';
    for(let i=0;i<5;i++){                                        // cracks in the dirt
      const a2=-0.35 + i*0.175, len=R0*(0.5+0.5*rise);
      X.beginPath(); X.moveTo(orbX, GY+2);
      X.lineTo(orbX+Math.cos(Math.PI+a2)*len, GY+2+Math.sin(Math.PI+a2)*len*0.3); X.stroke();
      X.beginPath(); X.moveTo(orbX, GY+2);
      X.lineTo(orbX-Math.cos(Math.PI+a2)*len, GY+2+Math.sin(Math.PI+a2)*len*0.3); X.stroke();
    }
    X.restore();
    if(orbR > rx*0.02){
      X.save(); X.globalCompositeOperation='lighter';
      X.globalAlpha=0.25+0.55*rise;
      const og=X.createRadialGradient(orbX, orbY, orbR*0.1, orbX, orbY, orbR*2.6);
      og.addColorStop(0,'#f0dcff'); og.addColorStop(0.30,'rgba(168,84,255,.65)'); og.addColorStop(1,'rgba(110,16,190,0)');
      X.fillStyle=og; X.beginPath(); X.arc(orbX, orbY, orbR*2.6, 0, 7); X.fill();
      if(imp>0){                                                 // everything pouring inwards
        X.globalAlpha=0.75*imp; X.strokeStyle='#e8c8ff'; X.lineCap='round';
        for(let i=0;i<14;i++){
          const a2=i*0.4488+t*1.2, far=R0*(2.0-1.4*imp), near=orbR*1.1;
          X.lineWidth=rx*0.030*(1-imp*0.4);
          X.beginPath();
          X.moveTo(orbX+Math.cos(a2)*far, orbY+Math.sin(a2)*far*0.85);
          X.lineTo(orbX+Math.cos(a2)*near, orbY+Math.sin(a2)*near*0.85);
          X.stroke();
        }
        X.globalAlpha=0.8*imp; X.strokeStyle='#ffffff'; X.lineWidth=rx*0.035;
        X.beginPath(); X.arc(orbX, orbY, R0*(1.5-1.2*imp), 0, 7); X.stroke();
      }
      X.restore();
      X.save();
      const bg2=X.createRadialGradient(orbX-orbR*0.32, orbY-orbR*0.34, orbR*0.06, orbX, orbY, orbR);
      bg2.addColorStop(0,'#ffffff'); bg2.addColorStop(0.28,'#e3b4ff');
      bg2.addColorStop(0.62,'#8d2ae0'); bg2.addColorStop(1,'#3d0570');
      X.fillStyle=bg2; X.beginPath(); X.arc(orbX, orbY, orbR, 0, 7); X.fill();
      X.save(); X.beginPath(); X.arc(orbX, orbY, orbR, 0, 7); X.clip();
      X.globalCompositeOperation='lighter';
      for(let i=0;i<3;i++){
        X.globalAlpha=0.22+0.10*Math.sin(t*2+i);
        X.fillStyle= i%2? '#f0d6ff' : '#b163ff';
        X.beginPath();
        X.ellipse(orbX+Math.sin(t*0.9+i*2)*orbR*0.30, orbY+Math.cos(t*0.7+i)*orbR*0.24,
                  orbR*0.68, orbR*0.26, t*0.5+i, 0, 7); X.fill();
      }
      X.globalAlpha=0.9; X.fillStyle='#ffffff';
      X.beginPath(); X.arc(orbX, orbY, orbR*(0.10+0.28*(imp||0)), 0, 7); X.fill();
      X.restore();
      X.globalCompositeOperation='lighter';
      X.globalAlpha=0.8; X.strokeStyle='rgba(255,255,255,.9)'; X.lineWidth=Math.max(1.6, orbR*0.06);
      for(let i=0;i<3;i++){
        const a0=t*2.4+i*2.1;
        X.beginPath(); X.ellipse(orbX, orbY, orbR*(0.58+i*0.15), orbR*0.26, a0, 0, 7); X.stroke();
      }
      X.globalAlpha=0.55; X.strokeStyle='#ffffff'; X.lineWidth=Math.max(1.4, orbR*0.05);
      X.beginPath(); X.arc(orbX, orbY, orbR*0.96, -2.2, -0.6); X.stroke();
      X.restore();
    }
  }
  // ---- and then it all comes back out ----
  if(burst>0 && burst<1){
    const e=1-burst, orbY = GY - 110;
    X.save(); X.globalCompositeOperation='lighter';
    X.globalAlpha=e;
    const fg2=X.createRadialGradient(orbX, orbY, 0, orbX, orbY, R0*(0.6+2.6*burst));
    fg2.addColorStop(0,'rgba(255,255,255,'+(0.85*e)+')');
    fg2.addColorStop(0.35,'rgba(200,120,255,'+(0.55*e)+')');
    fg2.addColorStop(1,'rgba(110,16,190,0)');
    X.fillStyle=fg2; X.beginPath(); X.arc(orbX, orbY, R0*(0.6+2.6*burst), 0, 7); X.fill();
    X.strokeStyle='#ffffff'; X.lineWidth=rx*0.06*e;
    X.beginPath(); X.arc(orbX, orbY, R0*(0.3+2.2*burst), 0, 7); X.stroke();
    X.strokeStyle='#c98bff'; X.lineWidth=rx*0.11*e;
    X.beginPath(); X.arc(orbX, orbY, R0*(0.2+1.7*burst), 0, 7); X.stroke();
    X.fillStyle='#e8c8ff';
    for(let i=0;i<14;i++){
      const a2=i*0.4488+seed, d2=R0*(0.3+2.6*burst);
      X.save(); X.translate(orbX+Math.cos(a2)*d2, orbY+Math.sin(a2)*d2*0.8); X.rotate(a2+t*2);
      const sr=rx*0.13*e;
      X.beginPath(); X.moveTo(0,-sr); X.lineTo(sr*0.5,0); X.lineTo(0,sr); X.lineTo(-sr*0.5,0); X.closePath(); X.fill();
      X.restore();
    }
    X.restore();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.6;
    X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(cx, cy, rx*0.8, ry*0.75, 0,0,7); X.fill(); X.restore(); }
}

/* ---- RABBIT BLOB: what comes out of the hat — a blob with long ears ---- */
function drawRabbit(u, cx, cy, rx, ry, dir, flash){
  const c=U.rabbit.c, t=T, seed=u.seed;
  shadow(cx, rx*0.9, 0.22);
  // ears, behind the body so they read as sticking up
  for(const sgn of [-1,1]){
    const lean = sgn*0.20 + Math.sin(t*2.6 + seed + sgn)*0.07;
    X.save(); X.translate(cx + sgn*rx*0.30, cy - ry*0.66); X.rotate(lean);
    X.fillStyle=c[1]; X.strokeStyle=c[2]; X.lineWidth=Math.max(1.8, rx*0.085);
    rr(-rx*0.17, -ry*1.30, rx*0.34, ry*1.42, rx*0.17); X.fill(); X.stroke();
    X.fillStyle='#ffd3de';
    rr(-rx*0.08, -ry*1.16, rx*0.16, ry*1.02, rx*0.08); X.fill();
    X.restore();
  }
  // body
  gooPath(cx, cy, rx, ry, 0.024, 3, t, seed, true);
  const g=X.createRadialGradient(cx-rx*0.35, cy-ry*0.45, rx*0.12, cx, cy, rx*1.25);
  g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, shade(c[1],-11));
  X.fillStyle=g; X.fill();
  X.lineWidth=Math.max(2, rx*0.10); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='rgba(255,255,255,.55)';
  X.beginPath(); X.ellipse(cx-rx*0.40, cy-ry*0.52, rx*0.17, ry*0.10, -0.6, 0, 7); X.fill();
  // fluffy tail at the back
  X.fillStyle='#fffdfa'; X.strokeStyle=c[2]; X.lineWidth=Math.max(1.5, rx*0.07);
  X.beginPath(); X.arc(cx - dir*rx*0.92, cy + ry*0.30, rx*0.22, 0, 7); X.fill(); X.stroke();
  // face
  eyes(cx, cy-ry*0.10, rx, dir, 'round', u.blink>0, false);
  X.strokeStyle=INK; X.lineWidth=Math.max(2, rx*0.075); X.lineCap='round';
  X.beginPath();
  X.moveTo(cx+dir*rx*0.07, cy+ry*0.14); X.lineTo(cx+dir*rx*0.07, cy+ry*0.26);
  X.moveTo(cx+dir*rx*0.07, cy+ry*0.26); X.quadraticCurveTo(cx+dir*rx*0.20, cy+ry*0.34, cx+dir*rx*0.26, cy+ry*0.22);
  X.moveTo(cx+dir*rx*0.07, cy+ry*0.26); X.quadraticCurveTo(cx-dir*rx*0.06, cy+ry*0.34, cx-dir*rx*0.12, cy+ry*0.22);
  X.stroke();
  // whiskers
  X.lineWidth=Math.max(1, rx*0.04); X.strokeStyle='rgba(60,50,44,.5)';
  for(const sy of [-0.04, 0.06]){
    X.beginPath(); X.moveTo(cx+dir*rx*0.22, cy+ry*(0.18+sy)); X.lineTo(cx+dir*rx*0.72, cy+ry*(0.12+sy*2)); X.stroke();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.024,3,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}

/* ---- MAGICIAN BLOB: never throws a punch. It sets its top hat down and a
   rabbit blob climbs out. Evolved it is the HAT TRICK BLOB in an Argentina
   number 10 kit, and it kicks a ball open instead. ---- */
function topHat(x, y, s){
  X.fillStyle='#2a2140';
  rr(x-s*0.52, y-s*1.30, s*1.04, s*1.20, s*0.10); X.fill();      // crown
  X.beginPath(); X.ellipse(x, y-s*0.10, s*0.98, s*0.26, 0, 0, 7); X.fill();   // brim
  X.fillStyle='#c2496a'; rr(x-s*0.52, y-s*0.52, s*1.04, s*0.24, 0); X.fill(); // band
  X.fillStyle='rgba(255,255,255,.16)'; rr(x-s*0.42, y-s*1.20, s*0.20, s*0.62, s*0.08); X.fill();
  X.strokeStyle='#150f24'; X.lineWidth=Math.max(1.5, s*0.07);
  X.beginPath(); X.ellipse(x, y-s*0.10, s*0.98, s*0.26, 0, 0, 7); X.stroke();
}
function footBall(x, y, s, spin){
  X.save(); X.translate(x, y-s*0.58); X.rotate(spin||0);
  X.fillStyle='#ffffff'; X.beginPath(); X.arc(0, 0, s*0.58, 0, 7); X.fill();
  X.lineWidth=Math.max(1.4, s*0.07); X.strokeStyle='#33323a'; X.stroke();
  X.fillStyle='#33323a';
  X.beginPath();                                   // centre pentagon
  for(let i=0;i<5;i++){ const a=-Math.PI/2 + i*Math.PI*0.4;
    const px=Math.cos(a)*s*0.24, py=Math.sin(a)*s*0.24; i? X.lineTo(px,py):X.moveTo(px,py); }
  X.closePath(); X.fill();
  for(let i=0;i<5;i++){                            // edge patches
    const a=-Math.PI/2 + i*Math.PI*0.4 + Math.PI*0.2;
    X.beginPath(); X.ellipse(Math.cos(a)*s*0.46, Math.sin(a)*s*0.46, s*0.13, s*0.10, a, 0, 7); X.fill();
  }
  X.restore();
}
function drawMage(u, cx, cy, rx, ry, dir, flash){
  const evo = !!u.evo, c = evo? EVO.mage.c : U.mage.c, t=T, seed=u.seed;
  const p = (u.sw>0 && u.swT) ? 1-u.sw/u.swT : -1;        // trick progress, -1 when idle
  // the evolved one lunges into the kick
  let bx = cx;
  if(evo && p>0.42 && p<0.74) bx += dir*rx*0.34*Math.sin((p-0.42)/0.32*Math.PI);
  shadow(bx, rx*0.95, 0.24);

  // ---- body ----
  gooPath(bx, cy, rx, ry, 0.022, 3, t, seed, true);
  if(evo){
    X.fillStyle='#f4f9fd'; X.fill();
    X.save(); X.clip();                                   // Argentina stripes
    X.fillStyle='#7ec8ef';
    for(let i=-3;i<=3;i++) if(i%2===0) X.fillRect(bx+i*rx*0.30 - rx*0.15, cy-ry*1.3, rx*0.30, ry*2.6);
    X.restore();
  } else {
    const g=X.createRadialGradient(bx-rx*0.35, cy-ry*0.45, rx*0.12, bx, cy, rx*1.25);
    g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, shade(c[1],-11));
    X.fillStyle=g; X.fill();
  }
  X.lineWidth=Math.max(2, rx*0.10); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='rgba(255,255,255,.5)';
  X.beginPath(); X.ellipse(bx-rx*0.40, cy-ry*0.52, rx*0.17, ry*0.10, -0.6, 0, 7); X.fill();
  if(evo){                                                // the number 10
    X.save(); X.fillStyle='#24405c';
    X.font='900 '+Math.round(rx*0.52)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.textAlign='center'; X.fillText('10', bx - dir*rx*0.06, cy+ry*0.66);
    X.textAlign='left'; X.restore();
  }
  eyes(bx, cy-ry*0.12, rx, dir, 'round', u.blink>0, false);
  X.strokeStyle=INK; X.lineWidth=Math.max(2, rx*0.085); X.lineCap='round';
  X.beginPath();
  if(p>=0 && p<0.8) X.arc(bx+dir*rx*0.07, cy+ry*0.22, rx*0.22, 0.15*Math.PI, 0.85*Math.PI);
  else X.arc(bx+dir*rx*0.07, cy+ry*0.20, rx*0.17, 0.12*Math.PI, 0.88*Math.PI);
  X.stroke();

  // ---- the prop: hat on the head, or down on the ground mid-trick ----
  const hatS = rx*0.86;
  const headX = bx - dir*rx*0.04, headY = cy - ry*0.92;
  const gx = cx + dir*rx*1.45, gy = GY - 2;
  const lerp=(a,b,q)=>a+(b-a)*q;
  if(!evo){
    let px, py, sp=0;
    if(p<0){ px=headX; py=headY; }
    else if(p<0.40){ const q=Math.pow(p/0.40, 0.8); px=lerp(headX,gx,q); py=lerp(headY,gy,q); sp=q; }
    else if(p<0.72){ px=gx; py=gy; sp=1; }
    else { const q=(p-0.72)/0.28; px=lerp(gx,headX,q); py=lerp(gy,headY,q); sp=1-q; }
    // sparkles around the hat once it is on the ground
    if(sp>0.9 && p>0.45){
      X.save(); X.globalCompositeOperation='lighter';
      for(let i=0;i<5;i++){
        const a=t*3+i*1.3, rr2=rx*(0.9+0.25*Math.sin(t*6+i));
        X.globalAlpha=0.35+0.3*Math.sin(t*7+i*2);
        X.fillStyle='#ffe9a8';
        X.beginPath(); X.arc(px+Math.cos(a)*rr2, py-rx*0.5+Math.sin(a)*rx*0.45, rx*0.07, 0, 7); X.fill();
      }
      X.restore();
    }
    topHat(px, py, hatS);
  } else {
    // the ball is placed, then booted forward
    if(p>=0.05){
      let px, py, spin=0, al=1;
      if(p<0.42){ const q=Math.pow((p-0.05)/0.37, 0.8); px=lerp(headX,gx,q); py=lerp(headY,gy,q); spin=q*3; }
      else if(p<0.55){ px=gx; py=gy; }
      else { const q=(p-0.55)/0.45; px=gx + dir*rx*3.4*q; py=gy - Math.sin(q*Math.PI)*ry*1.1;
             spin=q*9; al=Math.max(0, 1-q*1.6); }
      X.save(); X.globalAlpha=al; footBall(px, py, hatS, dir*spin); X.restore();
      if(p>0.55 && p<0.75){                       // burst at the moment of contact
        X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=Math.max(0,1-(p-0.55)/0.2);
        X.strokeStyle='#ffffff'; X.lineWidth=Math.max(1.5, rx*0.09); X.lineCap='round';
        for(let i=0;i<6;i++){ const a=-0.9+i*0.36;
          X.beginPath(); X.moveTo(gx+Math.cos(a)*rx*0.5, gy-rx*0.55+Math.sin(a)*rx*0.5);
          X.lineTo(gx+Math.cos(a)*rx*1.0, gy-rx*0.55+Math.sin(a)*rx*1.0); X.stroke(); }
        X.restore();
      }
    }
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(bx,cy,rx,ry,0.022,3,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}

// shared goo base, used by the elites' big brothers below
function slimeBase(u, cx, cy, rx, ry, dir, c, wob){
  gooPath(cx, cy, rx, ry, wob||0.06, 5, T, u.seed, true);
  const g=X.createRadialGradient(cx-rx*0.3, cy-ry*0.4, rx*0.1, cx, cy, rx*1.3);
  g.addColorStop(0,c[0]); g.addColorStop(0.5,c[1]); g.addColorStop(1,shade(c[1],-11));
  X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2,rx*0.08); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='rgba(255,255,255,.45)';
  X.beginPath(); X.ellipse(cx-rx*0.36, cy-ry*0.5, rx*0.19, ry*0.10, -0.55,0,7); X.fill();
}

/* ---- SCRAPJAW: the rust yard's crane, a slime welded into a digger bucket ---- */
function drawScrapjaw(u, cx, cy, rx, ry, dir, flash){
  const c=U.scrapjaw.c, t=T, seed=u.seed;
  const p = u.sw>0? 1-u.sw/u.swT : -1;
  // jaw yawns open on the wind-up, slams shut on the hit
  const open = p<0 ? 0.18 : (p<0.62 ? 0.18+0.82*(p/0.62) : Math.max(0, 1-(p-0.62)/0.16));
  shadow(cx, rx*1.05, 0.30);
  // exhaust puffs from the stack
  X.save(); X.globalAlpha=0.18; X.fillStyle='#6b6b78';
  for(let i=0;i<3;i++){
    const ph=((t*0.9+i*0.33+seed*0.1)%1);
    X.globalAlpha=0.22*(1-ph);
    X.beginPath(); X.arc(cx-dir*rx*0.72, cy-ry*1.15-ph*ry*1.1, rx*(0.10+ph*0.22), 0, 7); X.fill();
  }
  X.restore();
  slimeBase(u, cx, cy, rx, ry, dir, c, 0.04);
  // riveted plating over the body
  X.save(); gooPath(cx, cy, rx, ry, 0.04, 5, t, seed, true); X.clip();
  X.fillStyle='rgba(70,44,18,.35)'; X.fillRect(cx-rx, cy-ry*0.15, rx*2, ry*0.62);
  X.strokeStyle='rgba(40,24,8,.5)'; X.lineWidth=Math.max(2, rx*0.05);
  X.beginPath(); X.moveTo(cx-rx, cy-ry*0.15); X.lineTo(cx+rx, cy-ry*0.15);
  X.moveTo(cx-rx, cy+ry*0.47); X.lineTo(cx+rx, cy+ry*0.47); X.stroke();
  X.fillStyle='#8d6a44';
  for(let i=0;i<7;i++){ X.beginPath(); X.arc(cx-rx*0.9+i*rx*0.30, cy+ry*0.16, rx*0.055, 0, 7); X.fill(); }
  X.restore();
  // exhaust stack
  X.fillStyle=shade(c[2],18); X.strokeStyle=c[2]; X.lineWidth=2;
  rr(cx-dir*rx*0.80, cy-ry*1.22, rx*0.20, ry*0.40, rx*0.05); X.fill(); X.stroke();
  // glowing eye slits under a plate brow
  X.fillStyle='#2a1a0c'; rr(cx-rx*0.62, cy-ry*0.62, rx*1.24, ry*0.30, rx*0.06); X.fill();
  X.save(); X.globalCompositeOperation='lighter';
  for(const sgn of [-1,1]){
    X.globalAlpha=0.75+0.2*Math.sin(t*5+seed);
    X.fillStyle='#ffc24d';
    X.beginPath(); X.ellipse(cx+sgn*rx*0.26+dir*rx*0.06, cy-ry*0.48, rx*0.16, ry*0.07, 0,0,7); X.fill();
  }
  X.restore();
  // the bucket: teeth lead the swing, raised on the wind-up then driven down
  const swing = p<0 ? 0.12
              : (p<0.62 ? 0.12 - 0.92*(p/0.62)
                        : -0.80 + 1.55*Math.min(1, (p-0.62)/0.18));
  X.save();
  X.translate(cx + dir*rx*0.50, cy - ry*0.08); X.scale(dir, 1); X.rotate(swing);
  // hydraulic arm back to the body
  X.strokeStyle='#4a2c10'; X.lineCap='round'; X.lineWidth=Math.max(4, rx*0.17);
  X.beginPath(); X.moveTo(-rx*0.34, -ry*0.10); X.lineTo(rx*0.22, ry*0.12); X.stroke();
  X.strokeStyle='#8d6a44'; X.lineWidth=Math.max(2, rx*0.09);
  X.beginPath(); X.moveTo(-rx*0.34, -ry*0.10); X.lineTo(rx*0.22, ry*0.12); X.stroke();
  // bucket, opening toward the target
  const jg=X.createLinearGradient(0,-ry*0.4,0,ry*0.5);
  jg.addColorStop(0,'#c99a63'); jg.addColorStop(1,'#6b4520');
  X.fillStyle=jg; X.strokeStyle='#3a2208'; X.lineWidth=Math.max(2, rx*0.07);
  X.beginPath();
  X.moveTo(rx*0.10, -ry*0.42);
  X.quadraticCurveTo(rx*0.86, -ry*0.34, rx*0.84, ry*0.14);
  X.quadraticCurveTo(rx*0.70, ry*0.50, rx*0.16, ry*0.46);
  X.quadraticCurveTo(-rx*0.04, ry*0.02, rx*0.10, -ry*0.42);
  X.closePath(); X.fill(); X.stroke();
  X.save(); X.clip();
  X.fillStyle='rgba(40,22,6,.35)'; X.fillRect(rx*0.30, -ry*0.5, rx*0.6, ry*0.42);
  X.restore();
  // the teeth, on the leading edge and pointing at whatever it is about to hit
  X.fillStyle='#ece2cc'; X.strokeStyle='#5a4a2c'; X.lineWidth=1.4;
  for(let i=0;i<4;i++){
    const ty = -ry*0.30 + i*ry*0.22;
    X.beginPath();
    X.moveTo(rx*0.80, ty - ry*0.07);
    X.lineTo(rx*1.16, ty + ry*0.02);
    X.lineTo(rx*0.80, ty + ry*0.11);
    X.closePath(); X.fill(); X.stroke();
  }
  X.restore();
  X.fillStyle='#4a2c10'; X.beginPath(); X.arc(cx+dir*rx*0.66, cy+ry*0.30, rx*0.11, 0, 7); X.fill();
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.04,5,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}

/* ---- THE OLD OAK: a slime grown into a tree, swinging a branch ---- */
function drawOak(u, cx, cy, rx, ry, dir, flash){
  const c=U.oak.c, t=T, seed=u.seed;
  const GY_ = u.mini ? cy + ry*0.98 : GY;      // a portrait has its own ground line
  const p = u.sw>0? 1-u.sw/u.swT : -1;
  const ss = x => x*x*(3-2*x);
  // it hauls both arms up, then drives them into the earth — the spikes come up elsewhere
  const dig = p<0 ? 0
            : p<0.34 ? -ss(p/0.34)                       // lift
            : p<0.50 ? -1 + 2*Math.pow((p-0.34)/0.16, 0.55)   // plunge
            : p<0.86 ? 1                                  // buried, holding
            : 1 - ss((p-0.86)/0.14);
  shadow(cx, rx*1.15, 0.30);
  // roots spreading onto the ground
  X.strokeStyle=c[2]; X.lineWidth=Math.max(3, rx*0.13); X.lineCap='round';
  for(const sgn of [-1,1]){
    for(let i=0;i<2;i++){
      X.beginPath(); X.moveTo(cx+sgn*rx*0.2, cy+ry*0.72);
      X.quadraticCurveTo(cx+sgn*rx*(0.7+i*0.35), cy+ry*0.90, cx+sgn*rx*(1.05+i*0.45), GY_-2); X.stroke();
    }
  }
  // trunk
  X.beginPath();
  X.moveTo(cx-rx*0.62, cy+ry*0.86);
  X.quadraticCurveTo(cx-rx*0.46, cy-ry*0.20, cx-rx*0.52, cy-ry*0.86);
  X.lineTo(cx+rx*0.52, cy-ry*0.86);
  X.quadraticCurveTo(cx+rx*0.46, cy-ry*0.20, cx+rx*0.62, cy+ry*0.86);
  X.closePath();
  const tg=X.createLinearGradient(cx-rx*0.6, 0, cx+rx*0.6, 0);
  tg.addColorStop(0, shade(c[1],-18)); tg.addColorStop(0.45, c[1]); tg.addColorStop(1, shade(c[1],-26));
  X.fillStyle=tg; X.fill(); X.lineWidth=Math.max(2, rx*0.07); X.strokeStyle=c[2]; X.stroke();
  X.save(); X.clip();
  X.strokeStyle='rgba(63,45,20,.45)'; X.lineWidth=Math.max(1.6, rx*0.04);
  for(let i=0;i<5;i++){
    X.beginPath(); X.moveTo(cx-rx*0.6+i*rx*0.26, cy-ry*0.9);
    X.quadraticCurveTo(cx-rx*0.5+i*rx*0.26, cy, cx-rx*0.62+i*rx*0.26, cy+ry*0.9); X.stroke();
  }
  X.fillStyle='rgba(120,160,90,.35)';                      // moss
  X.beginPath(); X.ellipse(cx-rx*0.34, cy+ry*0.45, rx*0.30, ry*0.22, 0.3, 0, 7); X.fill();
  X.restore();
  // ---- WOODEN SPIKES: eight of them burst out of the ground down the lane ----
  if(p>=0.46 && p<1){
    const rise = Math.min(1, Math.max(0, (p-0.46)/0.10));
    const fall = p>0.84 ? Math.max(0, 1-(p-0.84)/0.16) : 1;
    const g = rise*fall;
    if(g>0.01){
      const A = U.oak.aoe||180, ix = cx + dir*(U.oak.aoeOff||100);
      for(let i=0;i<8;i++){
        const q = (i-3.5)/3.5;
        const sxp = ix + q*A*0.94;
        const hgt = ry*(0.62 + 0.30*Math.sin(i*1.7+seed)) * g;
        const lean = (i%2? 0.10 : -0.08) + Math.sin(i+seed)*0.05;
        X.save(); X.translate(sxp, GY_+2); X.rotate(lean);
        X.beginPath();
        X.moveTo(-rx*0.16, 0);
        X.lineTo(-rx*0.055, -hgt*0.82);
        X.lineTo(0, -hgt);
        X.lineTo(rx*0.075, -hgt*0.74);
        X.lineTo(rx*0.17, 0);
        X.closePath();
        const sg=X.createLinearGradient(0,-hgt,0,0);
        sg.addColorStop(0,'#c9a86a'); sg.addColorStop(0.45,'#8a6a34'); sg.addColorStop(1,'#4a3316');
        X.fillStyle=sg; X.fill();
        X.lineWidth=Math.max(1.6, rx*0.035); X.strokeStyle='#2f2008'; X.stroke();
        X.strokeStyle='rgba(60,42,16,.55)'; X.lineWidth=Math.max(1.2, rx*0.022);
        X.beginPath(); X.moveTo(-rx*0.04, -hgt*0.14); X.lineTo(-rx*0.005, -hgt*0.76); X.stroke();
        // a barb off the side
        X.fillStyle='#8a6a34';
        X.beginPath(); X.moveTo(rx*0.05, -hgt*0.50); X.lineTo(rx*0.26, -hgt*0.40);
        X.lineTo(rx*0.06, -hgt*0.32); X.closePath(); X.fill(); X.stroke();
        X.restore();
        // soil thrown up around the base
        X.fillStyle='rgba(74,51,22,.75)';
        X.beginPath(); X.ellipse(sxp, GY_+1, rx*0.22*g, rx*0.07*g, 0, 0, 7); X.fill();
      }
    }
  }

  // leafy crown
  X.fillStyle='#5f8f3f'; X.strokeStyle='#3d6127'; X.lineWidth=Math.max(2, rx*0.06);
  for(const [ox,oy,r2] of [[-0.55,-1.10,0.48],[0,-1.34,0.58],[0.55,-1.08,0.46],[-0.22,-0.96,0.42],[0.26,-0.96,0.42]]){
    X.beginPath(); X.arc(cx+ox*rx, cy+oy*ry, rx*r2, 0, 7); X.fill();
  }
  X.save(); X.globalAlpha=0.25; X.fillStyle='#9fd06a';
  X.beginPath(); X.ellipse(cx-rx*0.3, cy-ry*1.3, rx*0.5, ry*0.2, -0.3, 0, 7); X.fill(); X.restore();
  // ---- arms: raised overhead, then buried in the ground up to the elbow ----
  for(const sgn of [-1,1]){
    const front = (sgn===dir);
    const base = front? -0.55 : -0.35;
    const ang = base + dig*(front? 2.05 : 1.85);          // swings down past vertical, into the soil
    X.save(); X.translate(cx + sgn*rx*0.62, cy - ry*0.52); X.scale(sgn, 1); X.rotate(ang);
    const reach = rx*(front? 1.15 : 1.00);
    X.strokeStyle=c[2]; X.lineCap='round'; X.lineWidth=Math.max(4, rx*0.18);
    X.beginPath(); X.moveTo(0,0); X.quadraticCurveTo(reach*0.52, -ry*0.10, reach, ry*0.12); X.stroke();
    X.strokeStyle=shade(c[1],-12); X.lineWidth=Math.max(2.5, rx*0.11);
    X.beginPath(); X.moveTo(0,0); X.quadraticCurveTo(reach*0.52, -ry*0.10, reach, ry*0.12); X.stroke();
    if(dig<0.6){                                           // leaves only show while it is above ground
      X.fillStyle='#6f9c4a';
      for(const [lx,ly] of [[0.62,-0.16],[0.84,0.02],[0.44,0.10]]){
        X.beginPath(); X.ellipse(reach*lx, ry*ly, rx*0.18, ry*0.11, 0.5, 0, 7); X.fill();
      }
    }
    X.restore();
  }
  if(dig>0.55){                                            // churned soil where the hands went in
    for(const sgn of [-1,1]){
      const hx = cx + sgn*rx*(0.62 + 0.14*dig);
      X.fillStyle='#4a3316';
      X.beginPath(); X.ellipse(hx, GY_-2, rx*0.30, rx*0.09, 0, 0, 7); X.fill();
      X.fillStyle='rgba(120,90,45,.55)';
      X.beginPath(); X.ellipse(hx, GY_-6, rx*0.22, rx*0.07, 0, 0, 7); X.fill();
    }
  }

  // face carved into the trunk — furious
  const fy = cy-ry*0.30;
  X.save(); X.globalCompositeOperation='lighter';      // the eyes smoulder amber
  X.globalAlpha=0.34+0.14*Math.sin(T*4+u.seed);
  X.fillStyle='#ff9a2a';
  for(const sgn of [-1,1]){
    X.beginPath(); X.ellipse(cx+sgn*rx*0.23+dir*rx*0.06, fy, rx*0.20, ry*0.15, 0,0,7); X.fill();
  }
  X.restore();
  eyes(cx, fy, rx*0.66, dir, 'slit', u.blink>0, false);
  // heavy bark brows driven down over the inner corners
  X.fillStyle='#31210b'; X.strokeStyle='#1b1204'; X.lineWidth=Math.max(1.6, rx*0.030);
  for(const sgn of [-1,1]){
    X.beginPath();
    X.moveTo(cx+sgn*rx*0.46, fy-ry*0.22);
    X.lineTo(cx+sgn*rx*0.03, fy+ry*0.02);
    X.lineTo(cx+sgn*rx*0.03, fy-ry*0.12);
    X.lineTo(cx+sgn*rx*0.44, fy-ry*0.34);
    X.closePath(); X.fill(); X.stroke();
  }
  // a snarling mouth: corners dragged down, splintered teeth top and bottom
  const my=cy+ry*0.14, mw=rx*0.36, mh=ry*0.13;
  X.fillStyle='#1d1305';
  X.beginPath();
  X.moveTo(cx-mw, my+mh*0.55);
  X.quadraticCurveTo(cx-mw*0.45, my-mh*0.85, cx, my-mh*0.50);
  X.quadraticCurveTo(cx+mw*0.45, my-mh*0.85, cx+mw, my+mh*0.45);
  X.quadraticCurveTo(cx, my+mh*1.25, cx-mw, my+mh*0.55);
  X.closePath(); X.fill();
  X.strokeStyle='#1d1305'; X.lineWidth=Math.max(2, rx*0.045); X.lineJoin='round'; X.stroke();
  X.save(); X.clip();
  X.fillStyle='#ded0ac';
  for(let i=0;i<4;i++){                                  // upper fangs
    const tx=cx-mw*0.70+i*mw*0.47;
    X.beginPath(); X.moveTo(tx-mw*0.15, my-mh*0.9); X.lineTo(tx+mw*0.15, my-mh*0.9);
    X.lineTo(tx, my+mh*0.25); X.closePath(); X.fill();
  }
  for(let i=0;i<3;i++){                                  // lower ones, offset
    const tx=cx-mw*0.46+i*mw*0.47;
    X.beginPath(); X.moveTo(tx-mw*0.14, my+mh*1.3); X.lineTo(tx+mw*0.14, my+mh*1.3);
    X.lineTo(tx, my+mh*0.30); X.closePath(); X.fill();
  }
  X.restore();
  // gnarled crease lines pulling the face into a scowl
  X.strokeStyle='rgba(30,19,5,.55)'; X.lineWidth=Math.max(1.5, rx*0.028); X.lineCap='round';
  for(const sgn of [-1,1]){
    X.beginPath(); X.moveTo(cx+sgn*rx*0.50, fy+ry*0.14);
    X.quadraticCurveTo(cx+sgn*rx*0.40, fy+ry*0.34, cx+sgn*rx*0.44, my-ry*0.06); X.stroke();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.55;
    X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(cx, cy-ry*0.2, rx*0.9, ry*1.3, 0,0,7); X.fill(); X.restore(); }
}

/* ---- ASSASSIN SLIME: a black slime that moves too fast to see properly,
   red eyes and a knife far longer than anything that size should carry ---- */
function drawKnife(px, py, len, dir, ang, sweep){
  X.save(); X.translate(px, py); X.scale(dir, 1); X.rotate(ang);
  if(sweep>0){                                   // the cut it leaves in the air
    X.save(); X.globalAlpha=0.55*(1-sweep*0.7); X.lineCap='round';
    X.strokeStyle='rgba(255,255,255,.95)'; X.lineWidth=len*0.055;
    X.beginPath(); X.arc(0,0, len*0.80, -1.75, -0.05); X.stroke();
    X.strokeStyle='rgba(255,70,70,.60)'; X.lineWidth=len*0.20;
    X.beginPath(); X.arc(0,0, len*0.80, -1.45, -0.20); X.stroke();
    X.restore();
  }
  const w = len*0.062;
  X.strokeStyle='#17171f'; X.lineCap='round'; X.lineWidth=w*1.5;        // grip
  X.beginPath(); X.moveTo(-len*0.17, 0); X.lineTo(0,0); X.stroke();
  X.strokeStyle='rgba(255,255,255,.10)'; X.lineWidth=w*0.5;
  X.beginPath(); X.moveTo(-len*0.15, -w*0.3); X.lineTo(-len*0.02, -w*0.3); X.stroke();
  X.fillStyle='#8f1f22'; X.beginPath(); X.arc(-len*0.20, 0, w*0.75, 0, 7); X.fill();
  X.fillStyle='#2a2a33'; X.strokeStyle='#101017'; X.lineWidth=1.4;      // guard
  rr(-w*0.30, -len*0.055, w*0.85, len*0.11, w*0.28); X.fill(); X.stroke();
  X.beginPath();                                                        // the absurd blade
  X.moveTo(w*0.4, -w*0.50);
  X.lineTo(len*0.93, -w*0.22);
  X.lineTo(len, 0);
  X.lineTo(len*0.90, w*0.20);
  X.lineTo(w*0.4, w*0.52);
  X.closePath();
  const bg=X.createLinearGradient(0,-w*0.5,0,w*0.5);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.40,'#c8d2dc');
  bg.addColorStop(0.58,'#5d6674'); bg.addColorStop(1,'#2b3038');
  X.fillStyle=bg; X.fill();
  X.strokeStyle='#14171c'; X.lineWidth=1.6; X.stroke();
  X.strokeStyle='rgba(255,255,255,.95)'; X.lineWidth=Math.max(1.2, w*0.22);
  X.beginPath(); X.moveTo(w*0.8, -w*0.30); X.lineTo(len*0.95, -w*0.14); X.stroke();
  X.strokeStyle='rgba(180,30,30,.45)'; X.lineWidth=Math.max(1, w*0.14);
  X.beginPath(); X.moveTo(w*0.8, w*0.22); X.lineTo(len*0.88, w*0.10); X.stroke();
  X.restore();
}
function drawAssassin(u, cx, cy, rx, ry, dir, flash){
  const c=U.assassin.c, t=T, seed=u.seed;
  shadow(cx, rx*1.0, 0.34);
  if(u.moving && !u.dead && !u.air){              // it outruns its own silhouette
    X.save();
    for(let i=1;i<=3;i++){
      X.globalAlpha=0.16/i;
      gooPath(cx - dir*rx*0.34*i, cy, rx*(1-0.05*i), ry*(1-0.05*i), 0.07, 5, t-i*0.04, seed, true);
      X.fillStyle=c[1]; X.fill();
    }
    X.restore();
  }
  gooPath(cx, cy, rx, ry, 0.075, 5, t, seed, true);
  const g=X.createRadialGradient(cx-rx*0.3, cy-ry*0.45, rx*0.1, cx, cy, rx*1.3);
  g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, c[2]);
  X.fillStyle=g; X.fill();
  X.lineWidth=Math.max(2, rx*0.075); X.strokeStyle='#000000'; X.stroke();
  X.save(); X.clip();
  X.globalAlpha=0.16; X.fillStyle='#6a6a7d';
  X.beginPath(); X.ellipse(cx-rx*0.25, cy-ry*0.30, rx*0.50, ry*0.30, -0.5, 0, 7); X.fill();
  X.globalAlpha=0.30; X.fillStyle='#3a3a48';
  for(let i=0;i<4;i++){
    const bx=cx+Math.sin(t*1.3+i*2.1+seed)*rx*0.45;
    const by=cy+ry*0.6-((t*26+i*37+seed*11)%(ry*1.5));
    X.beginPath(); X.arc(bx, by, rx*(0.05+0.03*(i%3)), 0, 7); X.fill();
  }
  X.restore();
  X.fillStyle='rgba(200,210,230,.30)';            // a cold gloss, not a friendly slime shine
  X.beginPath(); X.ellipse(cx-rx*0.34, cy-ry*0.52, rx*0.20, ry*0.08, -0.55, 0, 7); X.fill();
  // ---- knitted ski mask, pulled down over everything but the eyes and the mouth ----
  X.save();
  gooPath(cx, cy, rx, ry, 0.075, 5, t, seed, true); X.clip();
  X.fillStyle='#2c2c38';
  X.fillRect(cx-rx*1.3, cy-ry*1.4, rx*2.6, ry*1.78);            // the knit itself
  X.fillStyle='#3d3d4c';                                        // rolled hem along the bottom edge
  X.fillRect(cx-rx*1.3, cy+ry*0.30, rx*2.6, ry*0.11);
  X.fillStyle='rgba(0,0,0,.30)';
  X.fillRect(cx-rx*1.3, cy+ry*0.41, rx*2.6, ry*0.05);
  X.strokeStyle='rgba(255,255,255,.055)'; X.lineWidth=Math.max(1, rx*0.030); X.lineCap='round';
  for(let row=0; row<7; row++){                                 // rows of stitches
    const yy = cy - ry*1.05 + row*ry*0.20;
    for(let i=-5;i<=5;i++){
      const xx = cx + i*rx*0.20 + (row%2? rx*0.10 : 0);
      X.beginPath(); X.moveTo(xx-rx*0.05, yy-ry*0.035); X.lineTo(xx+rx*0.05, yy+ry*0.035); X.stroke();
    }
  }
  X.fillStyle='#14141b';                                        // the eye opening
  rr(cx-rx*0.64, cy-ry*0.38, rx*1.28, ry*0.44, ry*0.21); X.fill();
  X.strokeStyle='#4a4a5c'; X.lineWidth=Math.max(1.4, rx*0.038);
  rr(cx-rx*0.64, cy-ry*0.38, rx*1.28, ry*0.44, ry*0.21); X.stroke();
  X.fillStyle='#14141b';                                        // and the mouth opening
  rr(cx-rx*0.26, cy+ry*0.06, rx*0.52, ry*0.20, ry*0.10); X.fill();
  X.strokeStyle='#4a4a5c'; X.lineWidth=Math.max(1.2, rx*0.032);
  rr(cx-rx*0.26, cy+ry*0.06, rx*0.52, ry*0.20, ry*0.10); X.stroke();
  X.restore();
  // red eyes — narrow, mean, lit from inside
  const ey = cy-ry*0.16, dx = rx*0.30;
  X.save(); X.globalCompositeOperation='lighter';
  X.globalAlpha=0.40+0.18*Math.sin(t*5+seed);
  X.fillStyle='#ff2a2a';
  for(const sgn of [-1,1]){
    X.beginPath(); X.ellipse(cx+sgn*dx+dir*rx*0.08, ey, rx*0.22, ry*0.15, 0, 0, 7); X.fill();
  }
  X.restore();
  if(!(u.blink>0)){
    for(const sgn of [-1,1]){
      X.save(); X.translate(cx+sgn*dx+dir*rx*0.08, ey); X.rotate(sgn*dir*0.26);
      X.fillStyle='#ff3b3b';
      X.beginPath(); X.ellipse(0, 0, rx*0.155, ry*0.085, 0, 0, 7); X.fill();
      X.fillStyle='#ffd0d0';
      X.beginPath(); X.ellipse(dir*rx*0.03, -ry*0.012, rx*0.055, ry*0.035, 0, 0, 7); X.fill();
      X.restore();
    }
  } else {
    X.strokeStyle='#8f1f22'; X.lineWidth=Math.max(1.6, rx*0.05); X.lineCap='round';
    for(const sgn of [-1,1]){
      X.beginPath(); X.moveTo(cx+sgn*dx-rx*0.13+dir*rx*0.08, ey);
      X.lineTo(cx+sgn*dx+rx*0.13+dir*rx*0.08, ey); X.stroke();
    }
  }
  X.strokeStyle='#6b3a3a'; X.lineWidth=Math.max(2, rx*0.06); X.lineCap='round';
  X.beginPath();
  if(u.sw>0) X.arc(cx+dir*rx*0.02, cy+ry*0.12, rx*0.17, 1.10*Math.PI, 1.90*Math.PI);
  else { X.moveTo(cx-rx*0.16, cy+ry*0.17); X.lineTo(cx+rx*0.16, cy+ry*0.15); }
  X.stroke();
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.075,5,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}


/* ---- MIDNIGHT FRIGHTS cast ---- */
// a knapped obsidian blade on a buckskin-wrapped grip
function drawDagger(px, py, len, dir, ang, sweep){
  X.save(); X.translate(px, py); X.scale(dir, 1); X.rotate(ang);
  if(sweep>0){
    // a wide crescent that trails the blade, brightest at the leading edge
    X.save(); X.lineCap='round';
    const span = 2.5;
    for(let i=0;i<4;i++){
      const back = i*0.42, a = -0.10 - back;
      X.globalAlpha = (0.42 - i*0.09) * (1-sweep*0.55);
      X.strokeStyle = i? 'rgba(168,140,230,.9)' : 'rgba(236,226,255,.95)';
      X.lineWidth = len*(0.44 - i*0.07);
      X.beginPath(); X.arc(0, 0, len*(0.86 - i*0.05), a-span, a); X.stroke();
    }
    X.globalAlpha=0.9*(1-sweep*0.5);
    X.strokeStyle='#ffffff'; X.lineWidth=len*0.06;
    X.beginPath(); X.arc(0, 0, len*0.95, -0.35, -0.05); X.stroke();
    X.restore();
  }
  const w = len*0.17;
  // buckskin wrap: tan hide with binding turns and a short fringe
  X.strokeStyle='#a97a46'; X.lineCap='round'; X.lineWidth=w*0.95;
  X.beginPath(); X.moveTo(-len*0.30, 0); X.lineTo(0,0); X.stroke();
  X.strokeStyle='#7d5730'; X.lineWidth=w*0.22;
  for(let i=0;i<5;i++){ const t=-len*0.28+i*len*0.055;
    X.beginPath(); X.moveTo(t, -w*0.48); X.lineTo(t+len*0.02, w*0.48); X.stroke(); }
  X.strokeStyle='#c39a63'; X.lineWidth=w*0.16;
  for(let i=0;i<3;i++){ X.beginPath(); X.moveTo(-len*0.31, -w*0.2+i*w*0.2);
    X.lineTo(-len*0.44, -w*0.05+i*w*0.26); X.stroke(); }
  // obsidian blade: black glass with a chipped edge and a violet sheen
  X.beginPath();
  X.moveTo(w*0.30, -w*0.46);
  X.lineTo(len*0.42, -w*0.40); X.lineTo(len*0.60, -w*0.16);
  X.lineTo(len, 0);
  X.lineTo(len*0.58, w*0.20); X.lineTo(len*0.40, w*0.42);
  X.lineTo(w*0.30, w*0.46); X.closePath();
  const bg=X.createLinearGradient(0,-w*0.5,0,w*0.5);
  bg.addColorStop(0,'#6b6486'); bg.addColorStop(0.42,'#241f38');
  bg.addColorStop(0.58,'#12101e'); bg.addColorStop(1,'#3b3352');
  X.fillStyle=bg; X.fill();
  X.strokeStyle='#0a0912'; X.lineWidth=1.6; X.stroke();
  X.strokeStyle='rgba(198,170,255,.75)'; X.lineWidth=1.5;
  X.beginPath(); X.moveTo(w*0.5, -w*0.10); X.lineTo(len*0.86, -w*0.04); X.stroke();
  X.fillStyle='rgba(255,255,255,.22)';
  X.beginPath(); X.moveTo(w*0.5,-w*0.36); X.lineTo(len*0.5,-w*0.26); X.lineTo(len*0.42,-w*0.10); X.closePath(); X.fill();
  X.restore();
}

function drawWorker(u, cx, cy, rx, ry, dir, flash){
  const c=U.worker.c, g=['#e4f0c2','#8fbe62','#4f7a3a'], t=T, seed=u.seed;
  shadow(cx, rx*0.95, 0.24);
  // slime body
  gooPath(cx, cy, rx, ry, 0.05, 5, t, seed, true);
  const bg=X.createRadialGradient(cx-rx*0.3, cy-ry*0.4, rx*0.1, cx, cy, rx*1.3);
  bg.addColorStop(0,g[0]); bg.addColorStop(0.5,g[1]); bg.addColorStop(1,shade(g[1],-11));

  X.save(); gooPath(cx, cy, rx, ry, 0.05, 5, t, seed, true); X.clip();
  X.fillStyle=c[1]; X.fillRect(cx-rx, cy+ry*0.05, rx*2, ry);

  X.fillStyle=shade(c[1],-40); X.fillRect(cx-rx*0.16, cy+ry*0.05, rx*0.32, ry);
  X.restore();
  X.fillStyle='rgba(255,255,255,.5)';
  X.beginPath(); X.ellipse(cx-rx*0.38, cy-ry*0.5, rx*0.16, ry*0.09, -0.6,0,7); X.fill();
  eyes(cx, cy-ry*0.12, rx, dir, 'round', u.blink>0, false);
  X.strokeStyle=INK; X.lineWidth=Math.max(2,rx*0.08); X.lineCap='round';
  X.beginPath(); X.arc(cx+dir*rx*0.06, cy+ry*0.16, rx*0.15, 0.12*Math.PI, 0.88*Math.PI); X.stroke();
  // hard hat
  X.fillStyle=c[1]; X.strokeStyle=shade(c[1],-50); X.lineWidth=Math.max(1.6,rx*0.06);
  X.beginPath(); X.ellipse(cx, cy-ry*0.62, rx*0.98, ry*0.16, 0,0,7); X.fill(); X.stroke();
  X.beginPath(); X.ellipse(cx, cy-ry*0.66, rx*0.60, ry*0.46, 0, Math.PI, 0); X.fill(); X.stroke();
  X.fillStyle='rgba(255,255,255,.45)';
  X.beginPath(); X.ellipse(cx-rx*0.22, cy-ry*0.82, rx*0.16, ry*0.10, -0.4,0,7); X.fill();
  // it hoists a barricade overhead while winding up
  if(u.sw>0){
    const p=1-u.sw/u.swT, lift = p<0.6? p/0.6 : 1;
    X.save(); X.translate(cx+dir*rx*0.2, cy-ry*(1.15+0.5*lift)); X.rotate(dir*0.4*lift); X.scale(0.42,0.42);
    barrierProp(0, 0, rx*1.5, ry*1.2);
    X.restore();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.05,5,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}

// the barricade shape on its own, so the throw and the unit share it
function barrierProp(cx, cy, rx, ry){
  const c=U.barrier.c;
  X.strokeStyle='#5c5f6b'; X.lineWidth=Math.max(2.5, rx*0.10); X.lineCap='round';
  X.beginPath(); X.moveTo(cx-rx*0.55, cy+ry*0.05); X.lineTo(cx-rx*0.78, cy+ry*0.95);
  X.moveTo(cx+rx*0.55, cy+ry*0.05); X.lineTo(cx+rx*0.78, cy+ry*0.95); X.stroke();
  X.fillStyle=c[1]; X.strokeStyle=shade(c[1],-46); X.lineWidth=Math.max(2, rx*0.07);
  rr(cx-rx, cy-ry*0.52, rx*2, ry*0.62, ry*0.10); X.fill(); X.stroke();
  X.save(); rr(cx-rx, cy-ry*0.52, rx*2, ry*0.62, ry*0.10); X.clip();
  X.fillStyle='#fdf3e2';
  for(let i=-3;i<=3;i++){
    X.save(); X.translate(cx+i*rx*0.42, cy-ry*0.2); X.rotate(-0.55);
    X.fillRect(-rx*0.11, -ry*0.7, rx*0.22, ry*1.4); X.restore();
  }
  X.restore();
  // amber lamp on top
  const on = (Math.sin(T*4)>0);
  X.fillStyle= on? '#ffca4a' : '#8a6a20';
  X.beginPath(); X.arc(cx+rx*0.80, cy-ry*0.62, rx*0.13, 0, 7); X.fill();
  if(on){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.5;
    X.fillStyle='#ffca4a'; X.beginPath(); X.arc(cx+rx*0.80, cy-ry*0.62, rx*0.30, 0, 7); X.fill(); X.restore(); }
}
function drawBarrier(u, cx, cy, rx, ry, dir, flash){
  shadow(cx, rx*0.9, 0.24);
  barrierProp(cx, cy, rx, ry);
  if(flash>0){ X.save(); X.globalAlpha=flash*0.55; X.fillStyle='#ffffff';
    rr(cx-rx, cy-ry*0.52, rx*2, ry*0.62, ry*0.1); X.fill(); X.restore(); }
}

// a linebacker's build — pads, jersey, cleats — with slime behind the facemask
function qbBody(o){
  const c=U.qb.c, t=T, seed=o.seed||0, sw=o.sw||0;
  const JERSEY='#eef3f9', TRIM='#2f4d78', PANTS='#d3dae6', SOCK='#24405f', BOOT='#1a2231';
  const stride = o.run? Math.sin(t*9 + seed)*1 : Math.sin(t*2 + seed)*0.25;

  // ---- back arm ----
  limb(-10, -20, -26, -2, 11, shade(JERSEY,-34), TRIM);
  X.fillStyle=shade(JERSEY,-34); X.beginPath(); X.arc(-28, 2, 7, 0, 7); X.fill();

  // ---- legs: thigh, shin, cleat ----
  for(const sgn of [-1,1]){
    const st = stride*sgn*7, lx = sgn*9;
    limb(lx, 12, lx+sgn*3+st, 30, 16, PANTS, TRIM);
    limb(lx+sgn*3+st, 30, lx+sgn*4+st*1.4, 42, 12, SOCK, TRIM);
    X.fillStyle=BOOT; X.strokeStyle=TRIM; X.lineWidth=2.5;
    X.beginPath(); X.ellipse(lx+sgn*8+st*1.4, 45, 11, 5, 0, 0, 7); X.fill(); X.stroke();
  }
  X.fillStyle=TRIM;                                   // side stripe on the pants
  X.fillRect(-2, 14, 3, 18);

  // ---- torso in the jersey ----
  X.beginPath();
  X.moveTo(-20, -24); X.quadraticCurveTo(0, -30, 20, -24);
  X.quadraticCurveTo(25, -4, 17, 14);
  X.quadraticCurveTo(0, 19, -17, 14);
  X.quadraticCurveTo(-25, -4, -20, -24); X.closePath();
  X.fillStyle=JERSEY; X.fill(); X.lineWidth=3; X.strokeStyle=TRIM; X.stroke();
  X.fillStyle=TRIM; X.fillRect(-20, -24, 40, 5);       // collar
  X.save(); X.scale(-1,1);                             // number reads the right way round
  X.fillStyle=TRIM; X.font='900 17px ui-rounded, Trebuchet MS, sans-serif';
  X.textAlign='center'; X.fillText('7', 0, 2); X.textAlign='left'; X.restore();

  // ---- shoulder pads ----
  for(const sgn of [-1,1]){
    X.fillStyle= sgn<0? shade(JERSEY,-18) : JERSEY;
    X.strokeStyle=TRIM; X.lineWidth=3;
    X.beginPath(); X.ellipse(sgn*20, -21, 13, 10, sgn*0.25, 0, 7); X.fill(); X.stroke();
  }

  // ---- front arm, thrown forward for the hit ----
  const reach = 0.5 + (sw>0? 0.5 : 0);
  const ex = 20 + 16*reach, ey = -14 + 6*(1-reach);
  limb(16, -18, ex, ey, 12, JERSEY, TRIM);
  limb(ex, ey, ex+14, ey+3, 10, JERSEY, TRIM);
  X.fillStyle=shade(JERSEY,-20); X.strokeStyle=TRIM; X.lineWidth=2.5;
  X.beginPath(); X.arc(ex+18, ey+4, 7, 0, 7); X.fill(); X.stroke();

  // ---- helmet, with slime showing through the opening ----
  const hy = -42;
  X.fillStyle=c[1]; X.strokeStyle='#16273f'; X.lineWidth=3;
  X.beginPath(); X.arc(0, hy, 19, Math.PI*0.98, Math.PI*2.10); X.fill(); X.stroke();
  // the face hole: goo, eyes and a shine
  X.save();
  X.beginPath(); X.ellipse(7, hy+5, 13, 12, 0, 0, 7); X.clip();
  const gg=X.createRadialGradient(2, hy, 2, 7, hy+5, 18);
  gg.addColorStop(0,'#dff0ff'); gg.addColorStop(0.45,'#7fb2dd'); gg.addColorStop(1,'#3d6f98');
  X.fillStyle=gg; X.fillRect(-8, hy-12, 30, 28);
  for(let i=0;i<3;i++){                                // bubbles in the goo
    const bx=2+((t*14+i*11+seed*5)%16), by=hy+10-((t*18+i*9)%18);
    X.fillStyle='rgba(223,240,255,.55)'; X.beginPath(); X.arc(bx, by, 1.6+(i%2), 0, 7); X.fill();
  }
  X.restore();
  X.save(); X.scale(-1,1);
  eyes(-7, hy+2, 11, -1, 'slit', o.blink, true);
  X.restore();
  X.fillStyle=JERSEY; X.fillRect(-19, hy-4, 38, 4);    // helmet stripe
  X.fillStyle=c[2]; X.beginPath(); X.arc(-7, hy+2, 5, 0, 7); X.fill();   // ear hole
  // facemask
  X.strokeStyle='#e9eef6'; X.lineWidth=2.6; X.lineCap='round';
  X.beginPath();
  X.moveTo(6, hy-7); X.quadraticCurveTo(23, hy-2, 20, hy+13);
  X.lineTo(4, hy+16); X.stroke();
  X.beginPath(); X.moveTo(8, hy+2); X.lineTo(21, hy+4); X.stroke();
  X.beginPath(); X.moveTo(7, hy+9); X.lineTo(20, hy+10); X.stroke();
  X.beginPath(); X.moveTo(14, hy-4); X.lineTo(13, hy+14); X.stroke();
  // chin strap
  X.strokeStyle='#cfd8e6'; X.lineWidth=2;
  X.beginPath(); X.moveTo(-8, hy+10); X.quadraticCurveTo(2, hy+18, 8, hy+14); X.stroke();
}
function drawQB(u, cx, cy, rx, ry, dir, flash){
  const d=U.qb, sc=0.9;
  const sx = sc*rx/(d.r*(d.wide||1)), sy = sc*ry/(d.r*1.02);
  shadow(cx, rx*0.9, 0.28);
  X.save(); X.translate(cx, cy+ry*0.10); X.scale(dir*sx, sy);
  qbBody({seed:u.seed, blink:u.blink>0, run:u.moving||!!u.running, sw:u.sw});
  X.restore();
  if(flash>0){
    X.save(); X.globalAlpha=flash*0.5; X.globalCompositeOperation='lighter';
    X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(cx, cy, rx*0.95, ry*1.25, 0,0,7); X.fill(); X.restore();
  }
}

/* THE MIDNIGHT MAN — a tall silhouette until he goes over a barricade, after
   which he is plainly three slimes in a suit */
function drawMIB(u, cx, cy, rx, ry, dir, flash){
  const t=T, seed=u.seed;
  shadow(cx, rx*0.9, 0.30);
  // ---- revealed: three slimes in a suit ----
  const g=['#e4f0c2','#8fbe62','#4f7a3a'];
  const rev = 1;
  const sizes=[1.0, 0.82, 0.62], gap=[0, 1.15, 2.05];
  for(let i=2;i>=0;i--){
    const sr = rx*sizes[i]*0.74, sy = cy + ry*0.30 - gap[i]*ry*0.78;
    const wob = Math.sin(t*2.4 + i*1.6 + seed)*0.03;
    gooPath(cx + Math.sin(t*1.8+i)*rx*0.04, sy, sr*(1+wob), sr*0.94, 0.06, 5, t, seed+i*3, true);
    const bg=X.createRadialGradient(cx-sr*0.3, sy-sr*0.4, sr*0.1, cx, sy, sr*1.3);
    bg.addColorStop(0,g[0]); bg.addColorStop(0.5,g[1]); bg.addColorStop(1,shade(g[1],-11));
    X.fillStyle=bg; X.fill(); X.lineWidth=Math.max(2,sr*0.10); X.strokeStyle=g[2]; X.stroke();
  }
  // the suit hangs over the bottom two
  X.save(); X.globalAlpha=rev;
  X.fillStyle='#181a2e';
  X.beginPath();
  X.moveTo(cx-rx*0.70, cy+ry*0.95);
  X.lineTo(cx-rx*0.60, cy-ry*0.95);
  X.quadraticCurveTo(cx, cy-ry*1.15, cx+rx*0.60, cy-ry*0.95);
  X.lineTo(cx+rx*0.70, cy+ry*0.95); X.closePath(); X.fill();
  X.fillStyle='#f2f3f8';                                  // shirt
  X.beginPath(); X.moveTo(cx-rx*0.20, cy-ry*0.95); X.lineTo(cx+rx*0.20, cy-ry*0.95);
  X.lineTo(cx, cy+ry*0.35); X.closePath(); X.fill();
  X.fillStyle='#8f1f2e';                                  // tie
  X.beginPath(); X.moveTo(cx-rx*0.07, cy-ry*0.86); X.lineTo(cx+rx*0.07, cy-ry*0.86);
  X.lineTo(cx+rx*0.04, cy+ry*0.10); X.lineTo(cx, cy+ry*0.22); X.lineTo(cx-rx*0.04, cy+ry*0.10); X.closePath(); X.fill();
  X.fillStyle='#22243c';                                  // lapels
  for(const sgn of [-1,1]){
    X.beginPath(); X.moveTo(cx+sgn*rx*0.22, cy-ry*0.95);
    X.lineTo(cx+sgn*rx*0.06, cy+ry*0.10); X.lineTo(cx+sgn*rx*0.52, cy-ry*0.55); X.closePath(); X.fill();
  }
  X.restore();
  // top slime keeps the shades and the hat
  const ty = cy + ry*0.30 - gap[2]*ry*0.78, tr = rx*sizes[2]*0.74;
  eyes(cx, ty-tr*0.10, tr, dir, 'slit', u.blink>0, true);
  X.fillStyle='#14162b';
  for(const sgn of [-1,1]){
    X.beginPath(); X.ellipse(cx+sgn*tr*0.36, ty-tr*0.12, tr*0.34, tr*0.22, -sgn*0.12, 0, 7); X.fill();
  }
  X.fillRect(cx-tr*0.14, ty-tr*0.18, tr*0.28, tr*0.08);
  X.fillStyle='#0d0f1f';
  X.beginPath(); X.ellipse(cx, ty-tr*0.72, tr*1.30, tr*0.20, 0,0,7); X.fill();
  rr(cx-tr*0.62, ty-tr*1.34, tr*1.24, tr*0.66, tr*0.10); X.fill();
  X.fillStyle='#2b2f4d'; rr(cx-tr*0.62, ty-tr*0.88, tr*1.24, tr*0.18, tr*0.04); X.fill();
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.7;
    X.fillStyle='#ffffff'; X.beginPath(); X.ellipse(cx, cy, rx*1.05, ry*1.5, 0,0,7); X.fill(); X.restore(); }
}

/* ---- BALLOON BLOB: the evolved baby blob dangles under five balloons and
   swings itself forward on the strings to hit ---- */
const BALLOON_COLS = ['#ff9fb4','#ffd479','#9fe0ff','#b7f5a8','#d9b0ff'];
function drawBalloon(u, cx, cy, rx, ry, dir, flash){
  const c = EVO.baby.c, t=T, seed=u.seed;
  const pivotY = cy - ry*2.15;                       // the knot it hangs from
  shadow(cx, rx*0.72, 0.18);

  const tug = -(u.balloonA||0)*rx*0.16;            // the bunch drags against the swing
  for(let i=0;i<5;i++){
    const sp=(i-2)*0.42, bob=Math.sin(t*1.9 + i*1.25 + seed)*ry*0.12;
    const bx=cx + sp*rx*0.95 - dir*rx*0.10 + dir*tug;
    const by=pivotY - ry*1.55 - (1-Math.abs(sp)*0.35)*ry*0.35 + bob;
    const col=BALLOON_COLS[i];
    X.strokeStyle='rgba(70,60,72,.5)'; X.lineWidth=Math.max(1, rx*0.05); X.lineCap='round';
    X.beginPath(); X.moveTo(cx, pivotY);
    X.quadraticCurveTo(bx - sp*rx*0.30, (pivotY+by)/2 + ry*0.12, bx, by + ry*0.70); X.stroke();
    const g=X.createRadialGradient(bx-rx*0.20, by-ry*0.34, rx*0.04, bx, by, rx*0.85);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.38, col); g.addColorStop(1, shade(col,-46));
    X.fillStyle=g;
    X.beginPath(); X.ellipse(bx, by, rx*0.54, ry*0.66, sp*0.22, 0, 7); X.fill();
    X.lineWidth=Math.max(1.4, rx*0.055); X.strokeStyle=shade(col,-62); X.stroke();
    X.fillStyle=shade(col,-52);
    X.beginPath(); X.moveTo(bx-rx*0.08, by+ry*0.62); X.lineTo(bx+rx*0.08, by+ry*0.62);
    X.lineTo(bx, by+ry*0.80); X.closePath(); X.fill();
    X.fillStyle='rgba(255,255,255,.6)';
    X.beginPath(); X.ellipse(bx-rx*0.18, by-ry*0.30, rx*0.12, ry*0.16, -0.45, 0, 7); X.fill();
  }

  // motion arc through the fast part of the swing
  if(u.swingHot && u.sw>0){
    const armR = cy - pivotY, a0 = -0.75, a1 = u.balloonA||0;
    X.save(); X.globalAlpha=0.30; X.lineCap='round';
    X.translate(cx, pivotY); X.scale(dir, 1);
    X.strokeStyle='rgba(255,255,255,.9)'; X.lineWidth=rx*0.30;
    X.beginPath(); X.arc(0, 0, armR, Math.PI/2 + a0, Math.PI/2 + a1); X.stroke();
    X.strokeStyle='rgba(190,235,255,.8)'; X.lineWidth=rx*0.60;
    X.beginPath(); X.arc(0, 0, armR, Math.PI/2 + a0*0.7, Math.PI/2 + a1*0.9); X.stroke();
    X.restore();
  }
  X.save();
  X.translate(cx, pivotY); X.rotate(dir*(u.balloonA||0)); X.translate(-cx, -pivotY);
  X.strokeStyle='rgba(70,60,72,.6)'; X.lineWidth=Math.max(1.4, rx*0.07);
  X.beginPath(); X.moveTo(cx, pivotY); X.lineTo(cx, cy-ry*0.75); X.stroke();
  gooPath(cx, cy, rx, ry, 0.026, 3, t, seed, true);
  const bg=X.createRadialGradient(cx-rx*0.35, cy-ry*0.45, rx*0.12, cx, cy, rx*1.25);
  bg.addColorStop(0, c[0]); bg.addColorStop(0.5, c[1]); bg.addColorStop(1, shade(c[1],-11));
  X.fillStyle=bg; X.fill();
  X.lineWidth=Math.max(2, rx*0.11); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='rgba(255,255,255,.55)';
  X.beginPath(); X.ellipse(cx-rx*0.40, cy-ry*0.52, rx*0.17, ry*0.10, -0.6, 0, 7); X.fill();
  eyes(cx, cy-ry*0.10, rx, dir, 'round', u.blink>0, false);
  X.strokeStyle=INK; X.lineWidth=Math.max(2, rx*0.085); X.lineCap='round';
  X.beginPath();
  if(u.sw>0) X.arc(cx+dir*rx*0.07, cy+ry*0.22, rx*0.22, 0.15*Math.PI, 0.85*Math.PI);
  else X.arc(cx+dir*rx*0.07, cy+ry*0.20, rx*0.17, 0.12*Math.PI, 0.88*Math.PI);
  X.stroke();
  if(flash>0){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.026,3,t,seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore();
  }
  X.restore();
}

/* ---- SLIME (gooier: wobblier outline, translucent core, no drips) ---- */
function drawSlime(u, cx, cy, rx, ry, dir, flash){
  const c = U[u.k].c;
  shadow(cx, rx*1.05, 0.28);
  // ground ooze puddle
  X.save(); X.globalAlpha=0.35; X.fillStyle=c[2];
  X.beginPath(); X.ellipse(cx, GY+1, rx*0.95+Math.sin(T*2+u.seed)*2, rx*0.19, 0,0,7); X.fill(); X.restore();

  const wob = 0.075, fq = 5;
  // outer goo aura
  X.save(); X.globalAlpha=0.22;
  gooPath(cx,cy,rx*1.09,ry*1.06,wob,fq,T*1.1,u.seed+1,true); X.fillStyle=c[1]; X.fill(); X.restore();
  // main body
  gooPath(cx,cy,rx,ry,wob,fq,T,u.seed,true);
  const g = X.createRadialGradient(cx-rx*0.3, cy-ry*0.4, rx*0.1, cx, cy, rx*1.3);
