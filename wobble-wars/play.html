<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wobble Wars</title>
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0;}
  html,body{height:100dvh; overscroll-behavior:none;}   /* no swipe-back / bounce from the page itself */
  body{
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; overscroll-behavior:none;
    background:#07101c;
    background-image:radial-gradient(1200px 700px at 50% -10%, #16354f 0%, #07101c 65%);
    color:#dff2ff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family: ui-rounded, "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  /* 1000 x 560 = 1.7857 : 1 — fill whichever axis runs out first */
  #wrap{ width:min(100vw, 178.5vh); width:min(100vw, 178.5dvh); }
  /* phones held upright: ask for sideways, but let them play anyway */
  #rot{ position:fixed; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center; background:#07101cf2; color:#dff2ff; font-weight:800; font-size:20px; }
  #rot .ph{ width:56px; height:96px; border:5px solid #9fe0ff; border-radius:12px; position:relative;
    animation:turn 2.2s ease-in-out infinite; }
  #rot .ph::after{ content:""; position:absolute; left:50%; bottom:6px; width:12px; height:4px; margin-left:-6px;
    border-radius:2px; background:#9fe0ff; }
  #rot small{ font-size:14px; font-weight:700; color:#8fb4cd; }
  #rot button{ font:inherit; font-size:15px; color:#dff2ff; background:#1a3a55; border:2px solid #3f7aa3;
    border-radius:12px; padding:10px 18px; margin-top:6px; }
  @keyframes turn{ 0%,20%{ transform:rotate(0) } 50%,80%{ transform:rotate(-90deg) } 100%{ transform:rotate(0) } }
  @media (orientation:portrait) and (pointer:coarse){ body:not(.anyway) #rot{ display:flex; } }
  canvas{
    width:100%; height:auto; display:block; cursor:pointer;
    background:#0b1a2a; touch-action:none;
  }
</style>
</head>
<body>


<div id="wrap">
  <canvas id="cv" width="1000" height="560"></canvas>
</div>
<div id="rot">
  <div class="ph"></div>
  <div>Turn your phone sideways<br>to play Wobble Wars</div>
  <small>it fits the whole screen that way</small>
  <button type="button" onclick="document.body.classList.add('anyway')">play upright anyway</button>
</div>

<script>
(function(){
"use strict";

/* ================================================================
   WOBBLE WARS  —  blobs vs slimes lane warfare
   ================================================================ */

const cv = document.getElementById('cv');
let X = cv.getContext('2d', {alpha:false});   // `let`: drawUnit briefly points it at an offscreen buffer

/* ---- render resolution: the canvas backing store is drawn at up to 4K and
   the whole game keeps using 1000x560 logical coordinates via setTransform ---- */
const QUALITY = [
  {nm:'NATIVE', s:0,          mul:1},     // exactly one canvas pixel per device pixel
  {nm:'HIGH',   s:2560/1000,  mul:1.25},
  {nm:'4K',     s:3840/1000,  mul:1.5},
  {nm:'ULTRA',  s:5120/1000,  mul:2}
];
const Q_CAP = 6.0;                        // must clear ULTRA (5.12) or it renders as 4K
let RS = 1, qSlow = 0, qCap = Q_CAP;
const W = 1000, H = 560;
const GY = 424;            // ground line (feet)
const BAR_Y = 452;         // bottom UI bar
const P_FRONT = 132, P_BASE_X = 74;     // your side is always at the field's left edge
const ARENA = {small:1, medium:1.8, big:2.3, huge:3.0};
let FIELD = W, E_FRONT = 872, E_BASE_X = 930;   // set per battle from the level's arena size
function setArena(size){
  FIELD   = Math.round(W * (ARENA[size]||1));
  E_FRONT = FIELD - 128;
  E_BASE_X= FIELD - 70;
}
const MUZ = {x: 196, y: GY-146};   // cannon muzzle (pivot 108, GY-128)

let T = 0;                 // global time
let scene = 'menu';
let shake = 0, flashScreen = 0, hitStop = 0;

/* ================================================================
   AUDIO  —  procedural sfx + chiptune music (no hiss)
   ================================================================ */
let AC=null, MG=null, SG=null, MUG=null, nbuf=null;
let sfxScale = 1;             // scales a sound as it is scheduled (the menu brawl runs at half)
let muted = false;            // kept in step with the SOUND slider sitting at zero
function sfxVol(){ return (save.vol && save.vol.sfx!=null)? save.vol.sfx : 1; }
function musVol(){ return (save.vol && save.vol.mus!=null)? save.vol.mus : 0; }
function applyVol(){
  muted = sfxVol()<=0; musOn = musVol()>0;
  if(SG)  SG.gain.value  = 1.10 * sfxVol() * (scene==='cap'? 0.55 : 1);
  if(MUG) MUG.gain.value = 0.60 * musVol();
  if(musEl) musEl.volume = musElVol();
  if(!musOn) stopMusic();
  else if(!musKind) startMusic(scene==='battle'? 'battle':'menu');
}
function setVol(which, v){
  v = Math.max(0, Math.min(1, v));
  if(!save.vol) save.vol = {sfx:1, mus:0.5};
  save.vol[which] = v; persist(); applyVol();
}

function A(){
  try{
  if(!AC){
    AC = new (window.AudioContext||window.webkitAudioContext)();
    MG = AC.createGain(); MG.gain.value = 0.9;
    const LIM = AC.createDynamicsCompressor();     // keeps the louder mix from clipping
    LIM.threshold.value=-8; LIM.knee.value=8; LIM.ratio.value=12;
    LIM.attack.value=0.003; LIM.release.value=0.25;
    MG.connect(LIM); LIM.connect(AC.destination);
    SG = AC.createGain(); SG.gain.value = 1.10 * sfxVol(); SG.connect(MG);   // sfx bus
    MUG= AC.createGain(); MUG.gain.value= 0.60 * musVol(); MUG.connect(MG);  // music bus
  }
  if(AC.state === 'suspended') AC.resume();
  }catch(e){ return null; }
  return AC;
}
function quietly(f){ const s0=sfxScale; sfxScale=s0*0.5; try{ f(); } finally { sfxScale=s0; } }
function setMute(m){ setVol('sfx', m? 0 : 1); }

function tone(freq, dur, type, vol, slide, delay, dest){
  const ac=A(); if(!ac) return; const t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(18,slide), t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,(vol||0.25)*sfxScale), t0+Math.min(0.02,dur*0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(dest||SG); o.start(t0); o.stop(t0+dur+0.06);
}
function nB(){
  if(!nbuf){ const ac=A(); nbuf=ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  return nbuf;
}
// band-limited noise only (keeps it wet, never hissy)
function noise(dur, vol, f1, f2, q, delay){
  const ac=A(); if(!ac) return; const t0=ac.currentTime+(delay||0);
  const s=ac.createBufferSource(); s.buffer=nB(); s.loop=true;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=q||1.4;
  f.frequency.setValueAtTime(f1,t0); f.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t0+dur);
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200;
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol*sfxScale),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(lp); lp.connect(g); g.connect(SG);
  s.start(t0); s.stop(t0+dur+0.06);
}

const SFX = {
  click(){ tone(660,0.06,'square',0.10,880); },
  deny(){ tone(180,0.10,'square',0.12,110); tone(120,0.14,'triangle',0.10,90,0.05); },
  spawn(){ tone(260,0.16,'sine',0.22,620); tone(520,0.12,'triangle',0.10,900,0.06); noise(0.12,0.08,900,300,1.6); },
  punch(){   // blob bonk: body thump + squish
    tone(240,0.14,'sine',0.30,80); tone(520,0.06,'square',0.10,180);
    noise(0.18,0.24,1700,300,1.1); noise(0.09,0.12,3200,900,2.2,0.02);
  },
  slam(){    // chonk: heavy, low, wet
    tone(110,0.30,'sine',0.42,34); tone(190,0.16,'square',0.16,50);
    noise(0.34,0.30,1100,140,0.8); noise(0.12,0.16,2600,600,1.6,0.03);
  },
  slimeHit(){ // wet slap
    tone(170,0.17,'triangle',0.22,62); noise(0.24,0.24,800,150,0.85);
    tone(900,0.05,'sine',0.08,320,0.01);
  },
  bossRoar(){
    tone(64,1.1,'sawtooth',0.34,26); tone(96,0.9,'square',0.16,38,0.03);
    tone(200,0.7,'sawtooth',0.10,50,0.06);
    noise(1.0,0.26,900,90,0.7); noise(0.45,0.20,2600,300,0.9,0.02);
    tone(52,0.9,'sine',0.30,24,0.05);
  },
  whoosh(ally){ // short air swipe on a wind-up — blobs swipe high, slimes low and wet
    noise(0.13, ally?0.10:0.12, ally?2600:1500, ally?700:380, 1.2);
    tone(ally?430:300, 0.09, 'triangle', 0.07, ally?250:170);
  },
  whump(){ tone(150,0.22,'sine',0.26,46); noise(0.2,0.16,900,200,1.0); },
  bounce(){ tone(320,0.10,'sine',0.16,120); noise(0.06,0.06,1800,700,2); },
  thunder(){ tone(58,0.7,'sawtooth',0.30,22); tone(140,0.35,'square',0.12,44,0.02);
             noise(0.55,0.30,2600,120,0.7); noise(0.10,0.26,6000,2200,1.2); },
  upgrade(){ [523.25,698.46,880].forEach((f,i)=>tone(f,0.28,'triangle',0.18,null,i*0.07)); },
  splat(){ noise(0.38,0.26,1000,110,0.8); tone(140,0.24,'sine',0.16,48); },
  baseHit(){ tone(90,0.22,'square',0.16,50); noise(0.2,0.14,500,120,0.9); },
  ready(){ tone(660,0.10,'triangle',0.16); tone(880,0.12,'triangle',0.16,null,0.09); tone(1320,0.26,'triangle',0.15,null,0.19); },
  charge(){ tone(120,0.5,'sawtooth',0.10,600); },
  cannon(){   // sweeping beam: charge thump, rising sweep, tail crack
    tone(62,0.5,'sine',0.38,30); tone(150,0.35,'square',0.16,60);
    tone(180,1.25,'sawtooth',0.20,1500); tone(360,1.25,'square',0.08,3000);
    noise(1.25,0.22,300,5200,1.1); noise(0.3,0.22,1800,200,0.8,1.15);
    tone(90,0.4,'sine',0.26,34,1.15);
  },
  boom(){ tone(60,0.4,'sine',0.35,24); noise(0.3,0.22,1200,120,0.8); },
  win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.45,'triangle',0.20,null,i*0.13)); },

  lose(){ [392,349.23,293.66,220].forEach((f,i)=>tone(f,0.5,'sawtooth',0.14,null,i*0.17)); },
  unlock(){ [659.25,880,1174.66].forEach((f,i)=>tone(f,0.5,'square',0.12,null,i*0.1)); },
  godlyTease(){ tone(180,1.6,'sawtooth',0.10,1400); tone(90,1.6,'sine',0.20,300); noise(1.6,0.12,300,6000,1.2); },
  godly(){   // the jingle: a quick run up, a big bright chord, and sparkles falling off the top
    tone(55,0.9,'sine',0.40,30); noise(0.5,0.22,2400,160,0.8);
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,0.20,'square',0.10,null,0.05+i*0.07));
    [1046.5,1318.5,1567.98].forEach(f=>{ tone(f,1.3,'triangle',0.16,null,0.45); tone(f/2,1.3,'square',0.05,null,0.45); });
    [2093,2637,3136,2637,3520,4186].forEach((f,i)=>tone(f,0.16,'sine',0.07,null,0.62+i*0.09));
    [783.99,1046.5,1318.5,1567.98].forEach((f,i)=>tone(f,0.9,'triangle',0.12,null,1.35+i*0.05));
  }
};

/* --- music: 16th-step sequencer, two tracks --- */
const ROOTS=[110.00, 87.31, 130.81, 98.00];          // Am F C G
const ARP  =[[0,3,7,12,7,3],[0,4,7,12,7,4],[0,4,7,12,7,4],[0,4,7,12,7,4]];
// battle hook — one line of melody per bar, -1 = rest (16th steps)
const HOOK =[
  [12,-1,-1,15, -1,14,-1,12, -1,-1,10,-1, 12,-1,-1,-1],
  [ 9,-1,-1,12, -1,14,-1,12, -1,-1, 9,-1,  7,-1,-1,-1],
  [12,-1,-1,16, -1,19,-1,16, -1,-1,12,-1, 14,-1,-1,-1],
  [14,-1,-1,17, -1,19,-1,17, -1,-1,14,-1, 12,-1,-1,-1]
];
/* Real tracks live next to the page. A kind with no file here — or a file that
   fails to load — falls back to the chiptune generator below. */
const MUSIC_FILES = { menu:'menu.mp3', battle:'battle.mp3', boss:'boss.mp3', miniboss:'miniboss.mp3', victory:'victory.mp3', defeat:'defeat.mp3', casino:'casino.mp3' };
const MUSIC_GAIN  = { menu:0.5, battle:0.42, boss:1, miniboss:1.1, victory:0.75, defeat:0.8, casino:0.6 };   // per-track trim: tracks are not mastered alike
const MUSIC_ONCE  = { victory:1, defeat:1 };      // a sting plays once; everything else loops
function musElVol(){ return Math.max(0, Math.min(1, 0.55 * musVol() * (MUSIC_GAIN[musElKind] || 1))); }
const musFail = {};
let musEl=null, musElKind=null, musWanted=null;
function musFile(kind){
  const src = MUSIC_FILES[kind];
  if(!src || musFail[kind]) return false;
  if(!musEl){
    musEl = new Audio(); musEl.loop = true; musEl.preload = 'auto';
    musEl.addEventListener('error', ()=>{ musFail[musElKind]=1; musElKind=null; startMusic(musWanted); });
  }
  if(musElKind!==kind){ musElKind=kind; musEl.src=src; }
  musEl.loop = !MUSIC_ONCE[kind];
  musEl.volume = musElVol();
  const pr = musEl.play();
  if(pr && pr.catch) pr.catch(()=>{ if(musKind===kind) musKind=null; });   // blocked before the first click: let the next one retry
  return true;
}
function musFileStop(){ if(musEl){ try{ musEl.pause(); }catch(e){} } }
function musPreload(kind){                     // buffer a track before the screen needs it
  const src = MUSIC_FILES[kind];
  if(!src || musFail[kind] || musElKind===kind) return;
  try{ const a=new Audio(); a.preload='auto'; a.src=src; }catch(e){}
}
let musKind=null, musStep=0, musNext=0, musTimer=null;
let musOn = false;            // background music is OFF until you ask for it, and the choice sticks
const st=(r,s)=> r*Math.pow(2,s/12);

function startMusic(kind){
  if(!musOn || !kind) return;
  musWanted = kind;
  if(musKind===kind) return;
  if(musFile(kind)){ musKind=kind; return; }   // a real track for this screen
  musFileStop();
  if(!A()) return;
  musKind=kind; musStep=0; musNext=AC.currentTime+0.06;
  if(!musTimer) musTimer=setInterval(musTick,25);
}
function stopMusic(){ musKind=null; musFileStop(); }
function setMusic(on){ if(on) A(); setVol('mus', on? 0.8 : 0); }
function musTick(){
  if(!AC||!musKind) return;
  if(MUSIC_FILES[musKind] && !musFail[musKind]) return;   // a real track is playing — stay out of its way
  const bpm = musKind==='boss'?152 : musKind==='battle'?136 : 92;
  const spb = 60/bpm/4;
  while(musNext < AC.currentTime+0.14){ musPlay(musStep, musNext); musNext+=spb; musStep=(musStep+1)%64; }
}
function musPlay(s, t0){
  const bar = (s>>4)&3, i = s&15, root=ROOTS[bar], arp=ARP[bar];
  const d = t0-AC.currentTime;
  if(musKind==='menu'){   // the chiptune fallback: boss plays the battle pattern, faster
    if(i===0||i===8) tone(root/2,0.9,'triangle',0.16,null,d,MUG);
    if(i%4===0){ const n=arp[(s>>2)%arp.length]; tone(st(root*2,n),0.55,'sine',0.10,null,d,MUG); }
    if(i===6) tone(st(root*4,arp[2]),0.4,'triangle',0.05,null,d,MUG);
  } else {
    // bass
    if(i===0||i===3||i===6||i===8||i===11||i===14) tone(root/2,0.16,'square',0.14,null,d,MUG);
    // arp bed
    if(i%2===0){ const n=arp[(s>>1)%arp.length]; tone(st(root*2,n),0.13,'square',0.052,null,d,MUG); }
    // melody hook
    const hn=HOOK[bar][i];
    if(hn>=0){ tone(st(root*2,hn),0.19,'square',0.085,null,d,MUG);
               tone(st(root*4,hn),0.12,'triangle',0.028,null,d,MUG); }
    // drums (kick = pitched sine, snare/hat = filtered noise, no hiss)
    if(i===0||i===8||i===6) tone(120,0.13,'sine',0.30,44,d,MUG);
    if(i===4||i===12) noise(0.11,0.10,1400,400,1.2,d);
    if(i%2===0) noise(0.035,0.032,5000,3500,3,d);
  }
}

/* ================================================================
   DATA
   ================================================================ */
const U = {
  blob:  {nm:'BLOB',   team:1,  hp:35,  dmg:8.8, rate:1.5, spd:42, rng:56, r:26, cost:50,  cd:1.9,

  hitman:{nm:'HIT MAN BLOB', team:1, hp:5, dmg:25, rate:0.7, spd:0, rng:9999, r:27, cost:800, cd:20,

          c:['#e6ebf4','#8f9bb3','#3b4357']},       // dynamites himself across the map, then shoots back down the lane
  baby:  {nm:'BABY BLOB', abil:[{t:'weak', vs:['dark','fire']}, {t:'freeze', chance:0.20, time:1}], team:1, hp:35, dmg:7, rate:1.0, spd:84, rng:48, r:18, cost:65, cd:1.6,
          hpUp:7, dmgUp:1.4, wide:1, swT:0.30, hitP:0.45, baby:1, kbStep:0.5,
          c:['#e6f9ff','#6fd8ef','#357f96']},
  mage:  {nm:'MAGICIAN BLOB', team:1, hp:70, dmg:0, rate:4.0, spd:8.4, rng:60, r:27, cost:650, cd:20,
          hpUp:14, dmgUp:0, wide:1, swT:1.10, hitP:0.55, mage:1, noKB:1, summon:'rabbit',
          c:['#e6dcff','#8a6fd6','#4a3a86']},
  rabbit:{nm:'RABBIT BLOB', team:1, hp:35, dmg:7, rate:1.0, spd:40, rng:52, r:20, cost:0, cd:0,
          hpUp:0, dmgUp:0, wide:1, swT:0.32, hitP:0.48, rabbit:1,
          c:['#fffaf4','#efdcc6','#a08a70']},
  chonk: {nm:'BIG BLOB', team:1,  hp:105, dmg:35,   rate:4.0, spd:27, rng:64, r:35, cost:100, cd:3,
          hpUp:21, dmgUp:7, wide:1.42, swT:0.66, hitP:0.80, flop:1, kbStep:0.5, aoe:98, aoeOff:34,
          c:['#ffe4bd','#ff9745','#a05523']},
  sword: {nm:'SWORD BLOB', team:1, hp:84, dmg:18, rate:1.0, spd:50, rng:78, r:28, cost:150, cd:2.4,
          hpUp:17, dmgUp:3.5, wide:1, swT:0.50, hitP:0.55, sword:1,
          c:['#ffd3ca','#ff4c39','#933329']},
  dino:  {nm:'DINO BLOB', abil:[{t:'kb', chance:0.40, vs:['fire','dark']}], team:1, hp:280, dmg:21, rate:3.0, spd:22, rng:241, r:34, cost:400, cd:6,
          hpUp:56, dmgUp:4.2, wide:1, swT:0.80, hitP:0.52, bite:1, kbStep:0.25,
          c:['#d0f5da','#57c27b','#36704d']},
  jumper:{nm:'JUMPER BLOB', abil:[{t:'massdef', vs:['normal','angelic']}], team:1, hp:81.6, dmg:38.5, rate:1.1, spd:0, rng:274, r:28, cost:200, cd:5,
          hpUp:16.32, dmgUp:7.7, wide:1, swT:0.85, hitP:0.80, kbStep:0.5,

/* DEV MODE (CHEAT only): every distinct-looking enemy as a SHADOW you can field — free, no cooldown.
   Left out: workers/barricades (their barricades land on the slime side). Things that only make
   sense for the slimes are stripped: bosses don't announce themselves, the Devil doesn't call
   assassins, Scrapjaw doesn't burst into slime-side scrap. */
const SHADOW_OF = ['angel','phoenix','magma','sludge','assassin'];   // the user's picks
const SHADOW_KEYS = SHADOW_OF.map(k => {
  const key = 'sh_'+k, b = U[k];
  U[key] = Object.assign({}, b, { nm:'SHADOW '+b.nm.replace(/^THE /,''), team:1, cost:0, cd:0,
    shadowOf:k, boss:0, onKB:undefined, splitInto:undefined, hpUp:0, dmgUp:0 });
  return key;
});
function isShadow(k){ return !!(k && U[k] && U[k].shadowOf); }
function owned(k){ return !!k && (save.lv[k] > 0 || (save.cheat && isShadow(k))); }

const ECO_MAX = 10;                         // ...and past that, five more levels at double price
const FINALIZE_XP = 12000;                  // ...and then one last +30%
function reinfOn(k){ return !!(save.reinf && save.reinf[k]); }
function finOn(k){ return !!(save.fin && save.fin[k]); }
const REINF_KEYS = ['cannon','armour','flow','tank'];
function isEco(k){ return REINF_KEYS.indexOf(k) >= 0; }
function ecoMax(k){ return (isEco(k) && reinfOn(k)) ? ECO_MAX : UPG[k].max; }
function reinfAvail(k){ return isEco(k) && save.lv[k] >= UPG[k].max && !reinfOn(k); }
function finAvail(k){ return isEco(k) && reinfOn(k) && save.lv[k] >= ECO_MAX && !finOn(k); }
function finMul(k){ return finOn(k)? 1.3 : 1; }
function baseHP(){ return Math.round((BASE_HP0 + 80*(save.lv.armour||0)) * (reinfOn('armour')?1.5:1) * finMul('armour')); }

function evoOn(k){ return !!(save.evo && save.evo[k]); }
function swingT(u, d){ const e = u.evo && EVO[u.k]; return (e && e.swT!=null)? e.swT : (d.swT||0.34); }
function hitPoint(u, d){ if(u.hitP!=null) return u.hitP;
  const e = u.evo && EVO[u.k]; return (e && e.hitP!=null)? e.hitP : (d.hitP||0.48); }
function uname(k){ return evoOn(k) ? EVO[k].nm : U[k].nm; }
function ucol(k){ return evoOn(k) && EVO[k] ? EVO[k].c : U[k].c; }
function evoAvail(k){ return !!EVO[k] && save.lv[k] >= UPG[k].max && !evoOn(k); }

function lvOf(k){ return (U[k].team>0 && save.lv && save.lv[k]) ? save.lv[k] : 1; }
function uhp(k){ return Math.round((U[k].hp + (U[k].hpUp||0)*(lvOf(k)-1)) * (evoOn(k)? EVO[k].hpMul : 1)); }
function udmg(k){ return Math.round((U[k].dmg + (U[k].dmgUp||0)*(lvOf(k)-1)) * (evoOn(k)&&EVO[k].dmgMul? EVO[k].dmgMul : 1)); }
function ucd(k){ return U[k].cd * (evoOn(k) && EVO[k].cdMul ? EVO[k].cdMul : 1); }   // an evolution can stretch the cooldown
function uspd(k){ return U[k].spd * (evoOn(k)? (EVO[k].spdMul||1) : 1); }
function income(){ return INCOME[(save.lv.flow||1)-1] * (reinfOn('flow')?1.35:1) * finMul('flow'); }
function juiceCap(){ return Math.round(CAPS[(save.lv.tank||1)-1] * (reinfOn('tank')?1.35:1) * finMul('tank')); }
function isLocked(k){ return !!UPG[k].unlockCost && save.lv[k]===0; }
function capLocked(k){ return !!UPG[k].capsule && save.lv[k]===0; }      // only the capsule hands these out
function isGated(k){ return isLocked(k) && save.best < (UPG[k].gate||1); }
function upgCost(k){
  const u=UPG[k], l=save.lv[k];
  if(capLocked(k)) return null;
  if(isLocked(k)) return u.unlockCost;
  if(evoAvail(k)) return EVO[k].cost;
  if(reinfAvail(k)) return REINFORCE_XP;
  if(finAvail(k)) return FINALIZE_XP;
  const mx = ecoMax(k);
  if(l>=mx) return null;
  const min = (u.min===undefined?1:u.min);
  const step = u.costs[Math.min(l - min, u.costs.length-1)];
  return (l >= u.max) ? step*2 : step;          // past the old ceiling every level costs double
}
function canBuy(k){
  const c=upgCost(k); if(c===null) return false;
  if(isGated(k)) return false;
  return save.xp >= c;
}
function buyUpg(k){
  if(!canBuy(k)) { SFX.deny(); return; }
  if(evoAvail(k)){                       // EVOLVE instead of another level
    save.xp -= EVO[k].cost; save.evo[k]=1; persist();
    SFX.unlock(); SFX.upgrade();
    return;
  }
  if(reinfAvail(k)){                     // REINFORCE: the tier past maxed
    save.xp -= REINFORCE_XP; save.reinf[k]=1; persist();
    SFX.unlock(); SFX.upgrade(); SFX.ready();
    return;
  }
  if(finAvail(k)){                       // FINALIZE: the last word, +30%
    save.xp -= FINALIZE_XP; if(!save.fin) save.fin={}; save.fin[k]=1; persist();
    SFX.unlock(); SFX.upgrade(); SFX.ready();
    return;
  }
  const wasLocked = (save.lv[k]||0)===0;
  save.xp -= upgCost(k); save.lv[k] = (save.lv[k]||0) + 1;
  if(wasLocked && UPG[k].kind==='unit') autoEquip(k);
  persist();
  (wasLocked || save.lv[k]===1)? SFX.unlock() : SFX.upgrade();
}

// closed wobbly organic shape
function gooPath(cx,cy,rx,ry,amp,freq,tt,seed,squat){
  X.beginPath();
  const N=52;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const w = 1 + amp*Math.sin(a*freq + tt*2.6 + seed) + amp*0.55*Math.sin(a*(freq+3) - tt*1.9 + seed*1.7);
    let px = cx + Math.cos(a)*rx*w;
    let py = cy + Math.sin(a)*ry*w;
    if(squat && Math.sin(a)>0) py = cy + Math.sin(a)*ry*w*(1-0.30*Math.sin(a));
    i? X.lineTo(px,py) : X.moveTo(px,py);
  }
  X.closePath();
}
function shadow(cx, w, a){
  X.save(); X.globalAlpha=a||0.26; X.fillStyle='#0a2a12';
  X.beginPath(); X.ellipse(cx, GY+4, w, w*0.26, 0,0,7); X.fill(); X.restore();
}
function eyes(cx, cy, r, dir, kind, blink, angry){
  const dx = r*0.34, ey = cy;
  for(let s=-1;s<=1;s+=2){
    const x = cx + s*dx + dir*r*0.10, y = ey;
    const ew = r*0.235, eh = blink? r*0.03 : r*0.30;
    X.fillStyle='#ffffff';
    X.beginPath(); X.ellipse(x,y,ew,eh,0,0,7); X.fill();
    if(!blink){
      X.fillStyle=INK;
      if(kind==='slit'){ X.beginPath(); X.ellipse(x+dir*ew*0.30, y+eh*0.08, ew*0.30, eh*0.72, 0,0,7); X.fill(); }
      else { X.beginPath(); X.arc(x+dir*ew*0.33, y+eh*0.16, ew*0.55, 0,7); X.fill();
             X.fillStyle='rgba(255,255,255,.95)'; X.beginPath(); X.arc(x+dir*ew*0.18, y-eh*0.30, ew*0.24,0,7); X.fill(); }
    }
    if(angry){ // angry brow
      X.strokeStyle=INK; X.lineWidth=Math.max(2,r*0.10); X.lineCap='round';
      X.beginPath(); X.moveTo(x - s*ew*1.1, y-eh*1.5 - s*dir*0); X.lineTo(x + s*ew*1.0, y-eh*(s===dir?2.0:1.1)); X.stroke();
    }
  }
}

/* ---- BLOB ---- */
function drawBlob(u, cx, cy, rx, ry, dir, flash){
  const E = (u.evo && EVO[u.k]) ? EVO[u.k] : null;
  const c = E ? E.c : U[u.k].c;
  if(E && E.godly && !u.dead){                 // a halo, and the light it sheds
    X.save(); X.globalCompositeOperation='lighter';
    const hal = 0.55 + 0.20*Math.sin(T*2.2+u.seed);
    const rg=X.createRadialGradient(cx, cy-ry*0.2, rx*0.2, cx, cy-ry*0.2, rx*2.6);
    rg.addColorStop(0,'rgba(255,240,170,.50)'); rg.addColorStop(0.45,'rgba(255,220,110,.20)');
    rg.addColorStop(1,'rgba(255,200,60,0)');
    X.globalAlpha=hal; X.fillStyle=rg;
    X.beginPath(); X.ellipse(cx, cy-ry*0.2, rx*2.6, ry*2.4, 0, 0, 7); X.fill();
    for(let i=0;i<9;i++){                      // slow rays turning behind it
      const a = T*0.35 + i*Math.PI*2/9;
      X.globalAlpha=0.10+0.05*Math.sin(T*3+i);
      X.strokeStyle='#ffeaa0'; X.lineWidth=rx*0.10; X.lineCap='round';
      X.beginPath(); X.moveTo(cx+Math.cos(a)*rx*1.15, cy-ry*0.2+Math.sin(a)*ry*1.05);
      X.lineTo(cx+Math.cos(a)*rx*2.1, cy-ry*0.2+Math.sin(a)*ry*1.9); X.stroke();
    }
    X.restore();
  }
  if(u.evo){                                   // evolved aura
    const aur = (EVO[u.k] && EVO[u.k].aura) || c[1];
    X.save(); X.globalCompositeOperation='lighter';
    X.globalAlpha = 0.26 + 0.10*Math.sin(T*3+u.seed);
    const ag=X.createRadialGradient(cx,cy,rx*0.35,cx,cy,rx*1.9);
    ag.addColorStop(0, aur); ag.addColorStop(0.45, aur); ag.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=ag; X.beginPath(); X.ellipse(cx,cy,rx*1.9,ry*1.8,0,0,7); X.fill(); X.restore();
  }
  shadow(cx, rx*0.95, 0.24);
  // body
  gooPath(cx,cy,rx,ry,0.022,3,T,u.seed,true);
  const g = X.createRadialGradient(cx-rx*0.35, cy-ry*0.45, rx*0.12, cx, cy, rx*1.25);
  g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, shade(c[1],-11));
  if(E && E.ghost && !u.dead){                 // you can see the battlefield through him
    X.save(); X.globalAlpha=E.ghost; X.fillStyle=g; X.fill(); X.restore();
  } else { X.fillStyle=g; X.fill(); }
  X.lineWidth=Math.max(2, rx*0.10); X.strokeStyle=c[2];
  if(E && E.ghost && !u.dead){ X.save(); X.globalAlpha=0.75; X.stroke(); X.restore(); }
  else X.stroke();
  // jelly inner glow
  X.save(); X.clip();
  X.globalAlpha=0.15; X.fillStyle=c[0];
  X.beginPath(); X.ellipse(cx-rx*0.30, cy-ry*0.34, rx*0.44, ry*0.30, -0.5,0,7); X.fill();
  X.globalAlpha=0.08; X.fillStyle='#ffffff';
  X.beginPath(); X.ellipse(cx+rx*0.32, cy+ry*0.42, rx*0.5, ry*0.24, 0.3,0,7); X.fill();
  X.restore();
  // shine
  X.fillStyle='rgba(255,255,255,.55)';
  X.beginPath(); X.ellipse(cx-rx*0.40, cy-ry*0.52, rx*0.17, ry*0.10, -0.6, 0,7); X.fill();
  // face
  const joy = !u.mini && cheerHop(u);
  if(joy){                                     // ^ ^ eyes and a big open grin
    X.strokeStyle=INK; X.lineWidth=Math.max(2,rx*0.09); X.lineCap='round'; X.lineJoin='round';
    for(const s2 of [-1,1]){ const ex=cx+s2*rx*0.34+dir*rx*0.10, ey=cy-ry*0.12;
      X.beginPath(); X.moveTo(ex-rx*0.15, ey+ry*0.06); X.lineTo(ex, ey-ry*0.10); X.lineTo(ex+rx*0.15, ey+ry*0.06); X.stroke(); }
    X.fillStyle=INK; X.beginPath(); X.arc(cx+dir*rx*0.07, cy+ry*0.14, rx*0.20, 0.05*Math.PI, 0.95*Math.PI); X.closePath(); X.fill();
    X.fillStyle='#ff8fa0'; X.beginPath(); X.ellipse(cx+dir*rx*0.07, cy+ry*0.27, rx*0.10, ry*0.05, 0, 0, 7); X.fill();
  } else {
  eyes(cx, cy-ry*0.12, rx, dir, 'round', u.blink>0, false);
  }
  if(u.evo) evoFace(u.k, cx, cy-ry*0.12, rx, ry, dir);
  X.strokeStyle=INK; X.lineWidth=Math.max(2,rx*0.085); X.lineCap='round';
  X.beginPath();
  if(joy){}
  else if(u.sw>0) X.arc(cx+dir*rx*0.07, cy+ry*0.22, rx*0.22, 0.15*Math.PI, 0.85*Math.PI);
  else X.arc(cx+dir*rx*0.07, cy+ry*0.20, rx*0.17, 0.12*Math.PI, 0.88*Math.PI);
  X.stroke();
  if(E && E.godly && !u.dead){                 // motes of light drifting off him
    X.save(); X.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){
      const ph=((T*0.35 + i*0.167 + u.seed*0.1)%1);
      X.globalAlpha=0.55*(1-ph);
      X.fillStyle= i%2? '#fff4c0' : '#ffd63a';
      X.beginPath(); X.arc(cx + (i/2.5-1)*rx*0.7 + Math.sin(T*1.6+i)*rx*0.12,
                           cy - ry*0.3 - ph*ry*2.0, rx*0.055*(1-ph*0.4), 0, 7); X.fill();
    }
    X.restore();
  }
  if(flash>0){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=flash*0.8;
    gooPath(cx,cy,rx,ry,0.022,3,T,u.seed,true); X.fillStyle='#ffffff'; X.fill(); X.restore(); }
}

/* ---- BOOMERANG BLOB's throwing arm: a bent wooden boomerang, or, once he is
   old enough to need it, the cane he never stopped throwing anyway ---- */
function boomerProp(px, py, len, dir, ang, evo){
  X.save(); X.translate(px, py); X.scale(dir, 1); X.rotate(ang);
  const LW = Math.max(2, len*0.075);
  if(evo){
    // a walking cane: dark shaft, gold collar, a hook at the top
    X.lineCap='round'; X.lineJoin='round';
    X.strokeStyle='#4a2f1a'; X.lineWidth=len*0.20;
    X.beginPath(); X.moveTo(0, len*0.46); X.lineTo(0, -len*0.28);
    X.arc(len*0.17, -len*0.28, len*0.17, Math.PI, 0, true); X.stroke();
    X.strokeStyle='#8a5a30'; X.lineWidth=len*0.13;
    X.beginPath(); X.moveTo(0, len*0.46); X.lineTo(0, -len*0.28);
    X.arc(len*0.17, -len*0.28, len*0.17, Math.PI, 0, true); X.stroke();
    X.strokeStyle='rgba(255,236,190,.45)'; X.lineWidth=len*0.04;
    X.beginPath(); X.moveTo(-len*0.03, len*0.40); X.lineTo(-len*0.03, -len*0.22); X.stroke();
    X.fillStyle='#e8c05a'; X.strokeStyle='#7a5a14'; X.lineWidth=LW*0.8;   // the collar
    rr(-len*0.10, len*0.02, len*0.20, len*0.11, len*0.04); X.fill(); X.stroke();
    X.fillStyle='#2b1c10';                                               // rubber foot
    rr(-len*0.08, len*0.42, len*0.16, len*0.10, len*0.04); X.fill();
  } else {
    // a boomerang: two thick arms meeting at a blunt elbow
    X.lineCap='round'; X.lineJoin='round';
    const path=()=>{ X.beginPath();
      X.moveTo(-len*0.46, -len*0.34);
      X.quadraticCurveTo(len*0.06, -len*0.16, len*0.30, len*0.08);
      X.quadraticCurveTo(len*0.06, len*0.30, -len*0.30, len*0.50); };
    X.strokeStyle='#5e3d1c'; X.lineWidth=len*0.34; path(); X.stroke();
    X.strokeStyle='#c9a06a'; X.lineWidth=len*0.22; path(); X.stroke();
    X.strokeStyle='rgba(255,246,224,.55)'; X.lineWidth=len*0.055;
    X.beginPath();
    X.moveTo(-len*0.34, -len*0.30);
    X.quadraticCurveTo(len*0.02, -len*0.14, len*0.22, len*0.06);
    X.stroke();
  }
  X.restore();
}
/* one of them in flight — spinning, with the arc it just cut through the air */
function drawCoin(c){
  const q = Math.abs(c.x-c.x0)/c.dist;
  const y = GY - 54 - Math.sin(Math.min(1,q)*Math.PI)*26;
  const len = c.evo? 46 : 40;
  X.save();
  X.globalAlpha=0.30;                                  // the trail it leaves behind
  for(let i=1;i<=4;i++){
    const tx = c.x - c.team*(c.back?-1:1)*i*13;
    X.globalAlpha=0.26-i*0.05;
    boomerProp(tx, y+i*1.5, len*(1-i*0.07), c.team, c.spin - i*0.5, c.evo);
  }
  X.restore();
  boomerProp(c.x, y, len, c.team, c.spin, c.evo);
}
/* ---- BOOMERANG BLOB / BOOMER BLOB ---- */
function drawBoomerang(u, cx, cy, rx, ry, dir, flash){
  drawBlob(u, cx, cy, rx, ry, dir, flash);
  if(u.dead) return;
  if(!u.evo){                                          // a sweatband, for the throwing arm
    X.save();
    gooPath(cx, cy, rx, ry, 0.022, 3, T, u.seed, true); X.clip();
    X.fillStyle='#f4fffb'; X.fillRect(cx-rx*1.2, cy-ry*0.74, rx*2.4, ry*0.22);
    X.fillStyle=U.boom.c[2]; X.fillRect(cx-rx*1.2, cy-ry*0.60, rx*2.4, ry*0.06);
    X.restore();
  }
  if(u.hold!==0){                                      // held, unless it is out there somewhere
    const p = u.sw>0 ? 1-u.sw/u.swT : -1;
    const ang = p<0 ? -0.45
              : p<0.45 ? -0.45 - 1.70*(p/0.45)
                       : -2.15 + 3.50*Math.pow((p-0.45)/0.55, 0.6);
    boomerProp(cx + dir*rx*(u.evo?1.06:0.92), cy + ry*(u.evo?0.42:0.26), rx*(u.evo?1.45:1.05), dir, ang, !!u.evo);
  }
}
/* ---- ANGELIC DEMON: a demon with no legs, riding a small cloud, swinging a
   hammer whose head is more weather than metal. The halo is not his. ---- */
function cloudHammer(px, py, len, dir, ang, sweep){
  X.save(); X.translate(px, py); X.scale(dir, 1); X.rotate(ang);
  if(sweep>0){                                   // the circle it tears through the air
    X.save(); X.lineCap='round';
    X.globalAlpha=0.30*(1-sweep*0.55);
    X.strokeStyle='rgba(226,236,255,.9)'; X.lineWidth=len*0.34;
    X.beginPath(); X.arc(0,0, len*0.82, -Math.PI*2*Math.min(1,sweep*1.6), 0); X.stroke();
    X.globalAlpha=0.55*(1-sweep*0.7);
    X.strokeStyle='rgba(255,255,255,.95)'; X.lineWidth=len*0.14;
    X.beginPath(); X.arc(0,0, len*0.82, -1.5, 0); X.stroke();
    X.restore();
  }
  X.strokeStyle='#4a3a2a'; X.lineWidth=len*0.13; X.lineCap='round';   // the haft
  X.beginPath(); X.moveTo(0, len*0.10); X.lineTo(0, -len*0.78); X.stroke();
  X.strokeStyle='#8a6a48'; X.lineWidth=len*0.08;
  X.beginPath(); X.moveTo(0, len*0.08); X.lineTo(0, -len*0.76); X.stroke();
  // the head: a bank of cloud, packed tight
  X.save(); X.translate(0, -len*0.86);
  const puffs=[[-0.34,0.04,0.30],[0.34,0.04,0.30],[-0.14,-0.18,0.32],[0.16,-0.16,0.30],[0,0.14,0.30]];
  X.fillStyle='#4e5568';                                  // a thundercloud, not a fair-weather one
  for(const [ox,oy,pr] of puffs){ X.beginPath(); X.arc(ox*len, oy*len, pr*len*1.10, 0, 7); X.fill(); }
  X.fillStyle='#8792a8';
  for(const [ox,oy,pr] of puffs){ X.beginPath(); X.arc(ox*len, oy*len-len*0.04, pr*len, 0, 7); X.fill(); }
  X.fillStyle='rgba(216,226,244,.75)';
  for(const [ox,oy,pr] of puffs.slice(2)){ X.beginPath(); X.arc(ox*len, oy*len-len*0.10, pr*len*0.62, 0, 7); X.fill(); }
  X.fillStyle='rgba(30,34,46,.40)';
  X.beginPath(); X.ellipse(0, len*0.18, len*0.46, len*0.13, 0, 0, 7); X.fill();
  X.fillStyle='#ffe27a';                                  // a spark of lightning caught in it
  X.beginPath();
  X.moveTo(-len*0.06, -len*0.16); X.lineTo(len*0.06, -len*0.02);
  X.lineTo(-len*0.01, 0); X.lineTo(len*0.05, len*0.18);
  X.lineTo(-len*0.08, 0.02*len); X.lineTo(-len*0.01, 0); X.closePath(); X.fill();
  X.restore();
  X.restore();
}
function drawAngel(u, cx, cy, rx, ry, dir, flash){
  const c=U.angel.c, t=T, seed=u.seed;
  // the hammer's own clock: over the shoulder, up, then down through whatever is in front
  const p = u.sw>0 ? 1-u.sw/u.swT : -1;
  const REST=-0.78, BACK=-1.40, END=1.70+Math.PI*2, ss=x=>x*x*(3-2*x);
  const arm = p<0    ? REST                                   // a short wind back, then all the way round
            : p<0.22 ? REST + (BACK-REST)*ss(p/0.22)
            : p<0.62 ? BACK + (END-BACK)*Math.pow((p-0.22)/0.40, 0.85)
                     : END - 0.22*ss((p-0.62)/0.38);
  const sweep = (p>0.22 && p<0.62) ? (p-0.22)/0.40 : 0;
  const hx = cx + dir*rx*0.52, hy = cy + ry*0.52, hl = rx*2.20;   // giant — it is most of him   // both hands, low on the body
  const behind = arm < -0.55;                                     // over the shoulder: draw it first
  shadow(cx, rx*0.85, 0.16);
  // ---- the cloud he rides, instead of legs ----
  if(!u.dead){
    X.save();
    const cyy = cy + ry*0.86, drift=Math.sin(t*1.4+seed)*rx*0.04;
    X.fillStyle='#c6cddc';
    for(const [ox,oy,pr] of [[-0.86,0.10,0.40],[0.86,0.12,0.38],[-0.36,-0.06,0.50],[0.40,-0.08,0.48],[0,0.14,0.46]])
      { X.beginPath(); X.ellipse(cx+ox*rx+drift, cyy+oy*ry, pr*rx*1.06, pr*ry*0.86, 0, 0, 7); X.fill(); }
    X.fillStyle='#ffffff';
    for(const [ox,oy,pr] of [[-0.86,0.06,0.40],[0.86,0.08,0.38],[-0.36,-0.12,0.50],[0.40,-0.14,0.48],[0,0.08,0.46]])
      { X.beginPath(); X.ellipse(cx+ox*rx+drift, cyy+oy*ry, pr*rx, pr*ry*0.82, 0, 0, 7); X.fill(); }
    for(let i=0;i<3;i++){                       // wisps trailing off the back
      const ph=((t*0.5 + i*0.33 + seed*0.1)%1);
      X.globalAlpha=0.30*(1-ph);
      X.beginPath(); X.ellipse(cx - dir*rx*(1.0+ph*0.9), cyy + ry*0.10 - ph*ry*0.2,
                               rx*0.22*(1-ph*0.4), ry*0.16*(1-ph*0.4), 0, 0, 7); X.fill();
    }
    X.restore();
  }
  // ---- the halo, hanging over him and lighting nothing ----
  if(!u.dead){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.30+0.10*Math.sin(t*2.4+seed);
    X.fillStyle='#ffe9a0';
    X.beginPath(); X.ellipse(cx, cy-ry*1.52, rx*0.80, ry*0.30, 0, 0, 7); X.fill();
    X.restore();
    X.strokeStyle='#ffd23a'; X.lineWidth=Math.max(3.5, rx*0.14);
    X.beginPath(); X.ellipse(cx, cy-ry*1.52, rx*0.60, ry*0.19, 0, 0, 7); X.stroke();
    X.strokeStyle='rgba(255,252,220,.95)'; X.lineWidth=Math.max(1.4, rx*0.05);
    X.beginPath(); X.ellipse(cx, cy-ry*1.53, rx*0.60, ry*0.19, 0, -2.6, -0.6); X.stroke();
  }
  // ---- the horns, behind the head ----
  if(!u.dead){
    for(const sgn of [-1,1]){
      X.save(); X.translate(cx + sgn*rx*0.46, cy - ry*0.66); X.scale(sgn, 1);
      X.fillStyle='#2b1a44'; X.strokeStyle='#1a0f2c'; X.lineWidth=Math.max(1.8, rx*0.05);
      X.beginPath();
      X.moveTo(-rx*0.12, ry*0.26);
      X.quadraticCurveTo(rx*0.46, -ry*0.16, rx*0.30, -ry*0.90);
      X.quadraticCurveTo(rx*0.04, -ry*0.34, -rx*0.30, ry*0.18);
      X.closePath(); X.fill(); X.stroke();
      X.restore();
    }
  }
  if(!u.dead && behind) cloudHammer(hx, hy, hl, dir, arm, sweep);
  // ---- the body ----
  gooPath(cx, cy, rx, ry, 0.040, 4, t, seed, true);
  const g=X.createRadialGradient(cx-rx*0.32, cy-ry*0.42, rx*0.12, cx, cy, rx*1.25);
  g.addColorStop(0, c[0]); g.addColorStop(0.45, c[1]); g.addColorStop(1, shade(c[1],-16));
  X.fillStyle=g; X.fill();
  X.lineWidth=Math.max(2, rx*0.09); X.strokeStyle=c[2]; X.stroke();
  X.fillStyle='rgba(255,255,255,.42)';
  X.beginPath(); X.ellipse(cx-rx*0.38, cy-ry*0.48, rx*0.18, ry*0.10, -0.55, 0, 7); X.fill();
  // face: slit eyes with a red burn behind them, and a flat hard mouth
  eyes(cx, cy-ry*0.10, rx, dir, 'slit', u.blink>0, true);
  if(!u.dead){
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.55;
    X.fillStyle='#ff5a5a';
    for(const sgn of [-1,1]){
      X.beginPath(); X.ellipse(cx+sgn*rx*0.24+dir*rx*0.03, cy-ry*0.10, rx*0.13, ry*0.09, 0, 0, 7); X.fill();
    }
    X.restore();
  }
  X.strokeStyle=INK; X.lineCap='round'; X.lineWidth=Math.max(2.5, rx*0.11);
  for(const sgn of [-1,1]){                       // hard angry brows
    X.beginPath();
    X.moveTo(cx + sgn*rx*0.44 + dir*rx*0.03, cy - ry*0.34);
    X.lineTo(cx + sgn*rx*0.10 + dir*rx*0.03, cy - ry*0.18);
    X.stroke();
  }
  X.lineWidth=Math.max(2, rx*0.08);
  X.beginPath();
  X.moveTo(cx-rx*0.22, cy+ry*0.30); X.quadraticCurveTo(cx, cy+ry*0.20, cx+rx*0.22, cy+ry*0.30);
  X.stroke();
  if(flash>0){ X.save(); X.globalAlpha=flash*0.55; X.fillStyle='#ffffff';
    gooPath(cx, cy, rx, ry, 0.040, 4, t, seed, true); X.fill(); X.restore(); }
  // ---- the hammer, in both hands, out to the side ----
  if(!u.dead && !behind) cloudHammer(hx, hy, hl, dir, arm, sweep);
}
/* ---- THE GODLY PHOENIX: a great blue bird that never lands. It climbs, its talons
   and wingtips heat to red over five seconds, then it pours a beam onto whoever is
   nearest — and onto the next one, and the next ---- */
function drawPhoenix(u, cx, cy, rx, ry, dir, flash){
  const c=U.phoenix.c, t=T, seed=u.seed, ss=x=>x*x*(3-2*x);
  const p = u.sw>0 ? 1-u.sw/u.swT : -1;
  const t0 = U.phoenix.beam.t0;                            // where the charge ends and the beam begins
  const charge = p<0 ? 0 : p<t0 ? ss(p/t0) : 1;
  const beaming = p>=t0 && !u.mini;
  const flap = p<0 ? Math.sin(t*7.5+seed)*0.55
             : beaming ? -0.55 + Math.sin(t*16)*0.04
             : Math.sin(t*7.5+seed)*0.55*(1-ss(Math.min(1,p*6))) - 0.95*ss(Math.min(1,p*6)) + Math.sin(t*30)*0.04*charge;
  if(!u.mini) shadow(cx, rx*0.9, 0.12);
  X.save(); X.globalCompositeOperation='lighter';            // it is lit from inside
  X.globalAlpha = 0.45 + 0.12*Math.sin(t*2.4+seed) + 0.35*charge;
  const ag=X.createRadialGradient(cx, cy-ry*0.2, rx*0.2, cx, cy-ry*0.2, rx*2.2);
  ag.addColorStop(0, charge>0.3? 'rgba(255,170,140,.55)' : 'rgba(140,215,255,.55)');
  ag.addColorStop(0.5,'rgba(90,170,255,.18)'); ag.addColorStop(1,'rgba(60,140,255,0)');
  X.fillStyle=ag; X.beginPath(); X.arc(cx, cy-ry*0.2, rx*2.2, 0, 7); X.fill();
  if(!u.mini) for(let i=0;i<7;i++){                          // embers drifting up off it
    const ph2=((t*0.45 + i*0.143 + seed*0.1)%1);
    const ex = cx + Math.sin(i*2.3+seed)*rx*1.3 - dir*ph2*rx*0.6, ey = cy - ph2*ry*2.2;
    X.globalAlpha = 0.8*(1-ph2);
    X.fillStyle = i%2? '#bfeaff' : (charge>0.3? '#ffb08a' : '#8fd6ff');
    X.beginPath(); X.arc(ex, ey, rx*0.05*(1-ph2*0.5), 0, 7); X.fill();
  }
  X.restore();

  const shX = cx - dir*rx*0.10, shY = cy - ry*0.18;         // where the wings meet the body
  function wing(back){
    X.save(); X.translate(shX, shY); X.scale(dir, 1);
    const L = rx*1.85*(back? 0.90 : 1);
    for(let i=0;i<6;i++){                                     // the long primaries, fanned
      const a = -2.30 + i*0.24 - (back? 0.10 : 0) - flap*(1 - i*0.10);
      const len = L*(1 - i*0.11), w = rx*(0.30 - i*0.02);
      X.save(); X.rotate(a);
      const g=X.createLinearGradient(0,0,len,0);
      g.addColorStop(0, back? shade(c[1],-30) : c[1]);
      g.addColorStop(0.75, back? shade(c[1],-10) : '#7fd0ff');
      g.addColorStop(1, back? '#5fb4f0' : '#d8f3ff');
      X.fillStyle=g; X.strokeStyle= back? c[2] : '#d9a93a'; X.lineWidth=Math.max(1.4, rx*(back? 0.028 : 0.032));
      X.beginPath(); X.ellipse(len*0.5, 0, len*0.5, w*0.5, 0, 0, 7); X.fill(); X.stroke();
      if(!back){ X.strokeStyle='rgba(255,236,170,.75)'; X.lineWidth=Math.max(1, rx*0.014);
        X.beginPath(); X.moveTo(len*0.12, 0); X.lineTo(len*0.92, 0); X.stroke(); }   // the gold quill
      if(charge>0){                                           // the tips heating up
        X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=charge*(0.55+0.25*Math.sin(t*9+i));
        const rg=X.createRadialGradient(len*0.92,0,1,len*0.92,0,w*1.4);
        rg.addColorStop(0,'rgba(255,90,60,.95)'); rg.addColorStop(1,'rgba(255,40,20,0)');
        X.fillStyle=rg; X.beginPath(); X.arc(len*0.92, 0, w*1.4, 0, 7); X.fill(); X.restore();
      }
      X.restore();
    }
    // coverts over the root of the feathers
    X.fillStyle= back? shade(c[1],-22) : c[1]; X.strokeStyle=c[2]; X.lineWidth=Math.max(1.4, rx*0.03);
    X.save(); X.rotate(-1.75 - flap*0.8);
    X.beginPath(); X.ellipse(L*0.24, 0, L*0.28, rx*0.26, 0, 0, 7); X.fill(); X.stroke();
    X.restore();
    X.restore();
  }

  wing(true);

  // ---- the tail: long streamers of blue fire behind it ----
  for(let i=0;i<5;i++){
    const sway = Math.sin(t*3.0 + i*0.9 + seed)*0.20;
    const len = rx*(2.5 - i*0.26), bx = cx - dir*rx*0.55, by = cy + ry*0.12;
    const ang = 0.12 + i*0.17 + sway;
    const ex = bx - dir*len*Math.cos(ang), ey = by + len*Math.sin(ang);
    const g=X.createLinearGradient(bx,by,ex,ey);
    g.addColorStop(0, c[1]); g.addColorStop(0.55,'#7fd0ff'); g.addColorStop(0.85,'#e6f8ff'); g.addColorStop(1,'rgba(255,220,140,0)');
    X.fillStyle=g;
    X.beginPath(); X.moveTo(bx, by - ry*0.12);
    X.quadraticCurveTo((bx+ex)/2 + dir*rx*0.1, (by+ey)/2 - ry*0.30, ex, ey);
    X.quadraticCurveTo((bx+ex)/2, (by+ey)/2 + ry*0.12, bx, by + ry*0.14);
    X.closePath(); X.fill();
    X.fillStyle='rgba(255,216,106,.85)';                     // a gold eye near each tip
    const mx = bx - dir*len*0.80*Math.cos(ang), my = by + len*0.80*Math.sin(ang);
    X.beginPath(); X.ellipse(mx, my, rx*0.07, rx*0.05, ang*(-dir), 0, 7); X.fill();
  }

  // ---- talons, hanging below: the "hands" that glow ----
  for(const sgn of [-1,1]){
    const lx = cx + dir*rx*0.12 + sgn*rx*0.14, ly = cy + ry*0.52;
    X.strokeStyle='#e0a83a'; X.lineWidth=Math.max(2, rx*0.06); X.lineCap='round';
    X.beginPath(); X.moveTo(lx, ly); X.lineTo(lx + dir*rx*0.04, ly + ry*0.32); X.stroke();
    for(let k=-1;k<=1;k++){
      X.beginPath(); X.moveTo(lx + dir*rx*0.04, ly + ry*0.32);
      X.lineTo(lx + dir*rx*(0.04 + 0.10*k) , ly + ry*0.44); X.stroke();
    }
    if(charge>0){
      X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=charge*(0.7+0.3*Math.sin(t*11+sgn));
      const rg=X.createRadialGradient(lx, ly+ry*0.38, 1, lx, ly+ry*0.38, rx*0.30);
      rg.addColorStop(0,'rgba(255,110,70,1)'); rg.addColorStop(0.5,'rgba(255,50,30,.55)'); rg.addColorStop(1,'rgba(255,0,0,0)');
      X.fillStyle=rg; X.beginPath(); X.arc(lx, ly+ry*0.38, rx*0.30, 0, 7); X.fill(); X.restore();
    }
  }

  // ---- the body ----
  X.save(); X.translate(cx, cy); X.rotate(-dir*0.18);
  const bg=X.createRadialGradient(-dir*rx*0.1, -ry*0.2, rx*0.1, 0, 0, rx*0.85);
  bg.addColorStop(0, c[0]); bg.addColorStop(0.45, '#7fd0ff'); bg.addColorStop(1, c[1]);
  X.fillStyle=bg; X.strokeStyle=c[2]; X.lineWidth=Math.max(2, rx*0.05);
  X.beginPath(); X.ellipse(0, 0, rx*0.70, ry*0.58, 0, 0, 7); X.fill(); X.stroke();
  X.fillStyle='rgba(255,255,255,.55)';                       // the pale breast
  X.beginPath(); X.ellipse(dir*rx*0.22, ry*0.12, rx*0.34, ry*0.34, 0, 0, 7); X.fill();
  X.restore();

  // ---- head, crest, beak ----
  const hx = cx + dir*rx*0.64, hy = cy - ry*0.46, hr = rx*0.33;
  if(!u.mini){                                               // a sun-ring behind the head
    X.save(); X.strokeStyle='rgba(255,210,90,.85)'; X.lineWidth=Math.max(2.5, rx*0.05);
    X.beginPath(); X.arc(hx - dir*hr*0.15, hy - hr*0.10, hr*1.55, 0, 7); X.stroke();
    X.strokeStyle='rgba(255,240,190,.45)'; X.lineWidth=Math.max(1.5, rx*0.025);
    X.beginPath(); X.arc(hx - dir*hr*0.15, hy - hr*0.10, hr*1.80, -2.8, -0.4); X.stroke();
    X.restore();
  }
  for(let i=0;i<5;i++){                                      // a crown of blue flame
    const sw = Math.sin(t*5 + i + seed)*0.12;
    const a = -Math.PI/2 - dir*(0.10 + i*0.30) + sw;
    const len = hr*(2.8 - i*0.32);
    const tx = hx + Math.cos(a)*len, ty = hy + Math.sin(a)*len;
    const g=X.createLinearGradient(hx,hy,tx,ty);
    g.addColorStop(0,c[1]); g.addColorStop(0.55,'#6cc6ff'); g.addColorStop(1,'#ffd86a');
    X.fillStyle=g; X.strokeStyle=c[2]; X.lineWidth=Math.max(1.4, rx*0.026);
    X.beginPath(); X.moveTo(hx - hr*0.40, hy - hr*0.2);
    X.quadraticCurveTo(tx - dir*hr*0.45, ty + hr*0.55, tx, ty);
    X.quadraticCurveTo(tx + dir*hr*0.35, ty + hr*0.95, hx + hr*0.40, hy - hr*0.3);
    X.closePath(); X.fill(); X.stroke();
  }
  const hg=X.createRadialGradient(hx-dir*hr*0.3, hy-hr*0.35, hr*0.1, hx, hy, hr*1.1);
  hg.addColorStop(0, c[0]); hg.addColorStop(1, c[1]);
  X.fillStyle=hg; X.strokeStyle=c[2]; X.lineWidth=Math.max(2, rx*0.045);
  X.beginPath(); X.arc(hx, hy, hr, 0, 7); X.fill(); X.stroke();
  // beak
  const bkx = hx + dir*hr*1.55, bky = hy + hr*0.30;
  X.fillStyle='#ffc93c'; X.strokeStyle='#9a6a10'; X.lineWidth=Math.max(1.4, rx*0.03);
  X.beginPath(); X.moveTo(hx + dir*hr*0.70, hy - hr*0.18);
  X.quadraticCurveTo(hx + dir*hr*1.30, hy - hr*0.10, bkx, bky);
  X.quadraticCurveTo(hx + dir*hr*1.10, hy + hr*0.42, hx + dir*hr*0.70, hy + hr*0.30);
  X.closePath(); X.fill(); X.stroke();
  // a hard, narrow eye
  X.fillStyle='#ffffff';
  X.beginPath(); X.ellipse(hx + dir*hr*0.30, hy - hr*0.08, hr*0.30, hr*0.22, 0, 0, 7); X.fill();
  X.fillStyle= charge>0.6 ? '#ff4a3a' : '#0d1c33';
  X.beginPath(); X.arc(hx + dir*hr*0.40, hy - hr*0.06, hr*0.13, 0, 7); X.fill();
  X.strokeStyle='#0d1c33'; X.lineWidth=Math.max(2, rx*0.05); X.lineCap='round';
  X.beginPath(); X.moveTo(hx - dir*hr*0.05, hy - hr*0.42); X.lineTo(hx + dir*hr*0.62, hy - hr*0.22); X.stroke();

  wing(false);

  if(flash>0){ X.save(); X.globalAlpha=flash*0.45; X.fillStyle='#ffffff';
    X.beginPath(); X.ellipse(cx, cy, rx*0.72, ry*0.6, 0, 0, 7); X.fill(); X.restore(); }

  // ---- the gathering spark at the beak, then the beam itself ----
  if(!u.mini && charge>0.75 && !beaming){
    const q=(charge-0.75)/0.25;
    X.save(); X.globalCompositeOperation='lighter';
    const rg=X.createRadialGradient(bkx, bky, 1, bkx, bky, rx*0.45*q);
    rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(0.4,'rgba(140,220,255,.7)'); rg.addColorStop(1,'rgba(60,160,255,0)');
    X.fillStyle=rg; X.beginPath(); X.arc(bkx, bky, rx*0.45*q, 0, 7); X.fill(); X.restore();
  }
  if(beaming && u.beamX!=null){
    // a shadow phoenix is being drawn into the small tint buffer, which would clip and blacken
    // the beam — hand it to drawUnit to draw on the real canvas afterwards
    if(u.undead) u._beam = {bkx, bky, ex:u.beamX, ey:u.beamY, rx};
    else drawPhoenixBeam(bkx, bky, u.beamX, u.beamY, rx, false);
  }
}
function drawPhoenixBeam(bkx, bky, ex, ey, rx, shadow){
  const fl=0.85+Math.sin(T*60)*0.15;
  const C = shadow ? ['rgba(60,20,110,.55)','rgba(150,90,255,.75)','rgba(236,220,255,.95)','rgba(150,90,255,.75)','rgba(60,20,110,0)']
                   : ['rgba(60,160,255,.30)','rgba(120,215,255,.65)','rgba(255,255,255,.95)','rgba(140,220,255,.75)','rgba(60,160,255,0)'];
  X.save(); X.lineCap='round';
  X.globalCompositeOperation = shadow ? 'source-over' : 'lighter';   // a dark beam can't be added onto a bright sky
  X.strokeStyle=C[0]; X.lineWidth=34*fl; X.beginPath(); X.moveTo(bkx,bky); X.lineTo(ex,ey); X.stroke();
  X.strokeStyle=C[1]; X.lineWidth=16*fl; X.beginPath(); X.moveTo(bkx,bky); X.lineTo(ex,ey); X.stroke();
  X.strokeStyle=C[2]; X.lineWidth=5*fl;  X.beginPath(); X.moveTo(bkx,bky); X.lineTo(ex,ey); X.stroke();
  for(const [px,py,pr] of [[bkx,bky,rx*0.42],[ex,ey,rx*0.62]]){
    const rg=X.createRadialGradient(px,py,1,px,py,pr*fl);
    rg.addColorStop(0,C[2]); rg.addColorStop(0.35,C[3]); rg.addColorStop(1,C[4]);
    X.fillStyle=rg; X.beginPath(); X.arc(px,py,pr*fl,0,7); X.fill();
  }
  X.restore();
}
/* ---- ELDERLY BLOB: a big old blob, bald on top, spectacles and a white beard,
   leaning on a cane that he lifts high and brings down on whatever is in front ---- */
function elderCane(u, d){
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, ss=x=>x*x*(3-2*x), h=d.hitP||0.72;
  // angles are in the facing-forward frame: the rubber foot is the striking end
  const REST = -0.25, UP = 2.50, DOWN = REST + Math.PI*2;       // DOWN draws exactly like REST
  if(p<0) return REST + Math.sin(T*1.6+u.seed)*0.04;            // leaning on it
  if(p<h-0.10) return REST + (UP-REST)*ss(p/(h-0.10));          // swing it back, up over his head
  if(p<h)      return UP + (DOWN-UP)*Math.pow((p-(h-0.10))/0.10, 0.6);   // over the top and DOWN
  const q=(p-h)/(1-h);
  return DOWN + 0.35*Math.sin(q*Math.PI)*(1-q);                 // a little bounce off the ground
}
function elderLift(u, d){                             // how high his hand is: 0 at his side, 1 over his head
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, ss=x=>x*x*(3-2*x), h=d.hitP||0.72;
  if(p<0) return 0;
  if(p<h-0.10) return ss(p/(h-0.10));
  if(p<h) return 1 - Math.pow((p-(h-0.10))/0.10, 0.6);
  return 0;
}
function drawElder(u, cx, cy, rx, ry, dir, flash){
  const d=U.elder, evo=!!u.evo;
  drawBlob(u, cx, cy, rx, ry, dir, flash);
  if(u.dead) return;
  const ey = cy - ry*0.12;
  X.save();
  // bald crown shine, and white tufts over the ears
  X.fillStyle='rgba(255,255,255,.55)';
  X.beginPath(); X.ellipse(cx - dir*rx*0.05, cy - ry*0.78, rx*0.30, ry*0.10, -0.2*dir, 0, 7); X.fill();
  X.fillStyle='#f6f4ef'; X.strokeStyle='#bdb6aa'; X.lineWidth=Math.max(1.5, rx*0.03);
  for(const sgn of [-1,1]){
    for(let i=0;i<3;i++){
      X.beginPath(); X.arc(cx + sgn*rx*(0.80 - i*0.05), cy - ry*(0.42 - i*0.14), rx*0.13, 0, 7); X.fill(); X.stroke();
    }
  }
  const dx=rx*0.30, off=dir*rx*0.08, gr=rx*0.22;
  if(evo){
    // OLD TIMER: a burgundy cardigan, buttoned, over the lower half
    X.save(); gooPath(cx, cy, rx, ry, 0.022, 3, T, u.seed, true); X.clip();
    X.fillStyle='#7a2c34'; X.fillRect(cx-rx*1.2, cy+ry*0.05, rx*2.4, ry*1.2);
    X.strokeStyle='rgba(255,255,255,.12)'; X.lineWidth=Math.max(1, rx*0.02);
    for(let i=-5;i<=5;i++){ X.beginPath(); X.moveTo(cx+i*rx*0.2, cy+ry*0.05); X.lineTo(cx+i*rx*0.2, cy+ry*1.2); X.stroke(); }  // the knit
    X.fillStyle='#5e1f26'; X.fillRect(cx-rx*1.2, cy+ry*0.05, rx*2.4, ry*0.08);
    X.restore();
    // a monocle on the front eye, on a gold chain
    const mx=cx+dir*dx+off;
    X.save(); X.globalAlpha=0.28; X.fillStyle='#fff6d8'; X.beginPath(); X.arc(mx, ey, gr*1.08, 0, 7); X.fill(); X.restore();
    X.strokeStyle='#c9a13a'; X.lineWidth=Math.max(2.2, rx*0.06); X.beginPath(); X.arc(mx, ey, gr*1.08, 0, 7); X.stroke();
    X.strokeStyle='rgba(201,161,58,.8)'; X.lineWidth=Math.max(1, rx*0.025);
    X.beginPath(); X.moveTo(mx, ey+gr*1.08); X.quadraticCurveTo(mx+dir*rx*0.25, cy+ry*0.35, mx+dir*rx*0.05, cy+ry*0.55); X.stroke();
  } else {
    // round spectacles
    X.save(); X.globalAlpha=0.28; X.fillStyle='#dff2ff';
    for(const sgn of [-1,1]){ X.beginPath(); X.arc(cx+sgn*dx+off, ey, gr, 0, 7); X.fill(); }
    X.restore();
    X.strokeStyle='#4a4336'; X.lineWidth=Math.max(2, rx*0.05);
    for(const sgn of [-1,1]){ X.beginPath(); X.arc(cx+sgn*dx+off, ey, gr, 0, 7); X.stroke(); }
    X.beginPath(); X.moveTo(cx-dx+off+gr, ey); X.lineTo(cx+dx+off-gr, ey); X.stroke();
  }
  // big white brows
  X.strokeStyle='#f6f4ef'; X.lineWidth=Math.max(3, rx*0.10); X.lineCap='round';
  for(const sgn of [-1,1]){ X.beginPath();
    X.moveTo(cx + sgn*rx*0.46 + off, ey - ry*0.30); X.quadraticCurveTo(cx + sgn*rx*0.30 + off, ey - ry*0.40, cx + sgn*rx*0.12 + off, ey - ry*0.28); X.stroke(); }
  // a long white beard, covering the mouth
  const bg=X.createLinearGradient(0, cy+ry*0.05, 0, cy+ry*0.95);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#d9d4ca');
  X.fillStyle=bg; X.strokeStyle='#bdb6aa'; X.lineWidth=Math.max(1.5, rx*0.03);
  const bl = evo ? 1.42 : 0.98;                        // OLD TIMER's beard nearly reaches the ground
  X.beginPath();
  X.moveTo(cx - rx*0.52 + off, cy + ry*0.06);
  X.quadraticCurveTo(cx - rx*0.42 + off, cy + ry*(bl-0.18), cx + off, cy + ry*(bl + Math.sin(T*2+u.seed)*0.02));
  X.quadraticCurveTo(cx + rx*0.42 + off, cy + ry*(bl-0.18), cx + rx*0.52 + off, cy + ry*0.06);
  X.quadraticCurveTo(cx + off, cy + ry*0.28, cx - rx*0.52 + off, cy + ry*0.06);
  X.closePath(); X.fill(); X.stroke();
  if(evo){                                            // OLD TIMER: a tweed flat cap as well
    X.fillStyle='#8a6a44'; X.strokeStyle='#4a3620'; X.lineWidth=Math.max(2, rx*0.05);
    X.beginPath(); X.ellipse(cx - dir*rx*0.05, cy - ry*0.80, rx*0.55, ry*0.20, 0, Math.PI, 0); X.fill(); X.stroke();
    X.beginPath(); X.moveTo(cx + dir*rx*0.10, cy - ry*0.80);
    X.quadraticCurveTo(cx + dir*rx*0.75, cy - ry*0.78, cx + dir*rx*0.70, cy - ry*0.68);
    X.lineTo(cx + dir*rx*0.05, cy - ry*0.72); X.closePath(); X.fill(); X.stroke();
  }
  X.restore();
  // the cane — boomerProp's walking stick, bigger — held in a hand that rises over his head
  const lift = elderLift(u, d);
  const hx = cx + dir*rx*(0.82 - 0.50*lift), hy = cy + ry*(0.10 - 1.25*lift);
  if(lift>0.05){                                       // a stubby arm reaching up to it
    X.save(); X.strokeStyle=U.elder.c[1]; X.lineWidth=rx*0.22; X.lineCap='round';
    X.beginPath(); X.moveTo(cx + dir*rx*0.55, cy - ry*0.05); X.lineTo(hx, hy); X.stroke();
    X.strokeStyle=U.elder.c[2]; X.lineWidth=Math.max(1.5, rx*0.035);
    X.beginPath(); X.moveTo(cx + dir*rx*0.55, cy - ry*0.05); X.lineTo(hx, hy); X.stroke();
    X.restore();
  }
  boomerProp(hx, hy, rx*1.55, dir, elderCane(u, d), true);
}

/* ---- REAPER BLOB: a big hooded blob with a scythe taller than it is ---- */
function reaperScythe(u, d){
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, ss=x=>x*x*(3-2*x), h=d.hitP||0.62;
  if(p<0) return 0.30 + Math.sin(T*1.4+u.seed)*0.05;
  if(p<h-0.12) return 0.30 - 1.95*ss(p/(h-0.12));               // draw it back
  if(p<h+0.06) return -1.65 + 3.95*Math.pow((p-(h-0.12))/0.18, 0.55);   // the sweep
  return 2.30 - 2.00*ss((p-(h+0.06))/(1-h-0.06));
}
function drawReaper(u, cx, cy, rx, ry, dir, flash){
  const E = (u.evo && EVO.reaper) ? EVO.reaper : null, c = E? E.c : U.reaper.c, t=T, seed=u.seed;
  const d=U.reaper, ang=reaperScythe(u, d);
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, sweep = (p>=d.hitP-0.12 && p<d.hitP+0.08);
  const grim = !!u.evo;
  if(!u.mini) shadow(cx, rx*0.95, grim? 0.14 : 0.24);
  if(grim){                                            // GRIM: it no longer touches the ground
    if(!u.mini) cy -= ry*0.32 + Math.sin(t*1.8+seed)*4;
    rx *= 1.08; ry *= 1.08;
    X.save(); X.fillStyle='#0e0b16';                   // a tattered hem trailing beneath it
    for(let i=0;i<7;i++){
      const hx = cx - rx*0.85 + i*rx*0.283, sway = Math.sin(t*3+i*1.3+seed)*rx*0.06;
      X.beginPath(); X.moveTo(hx - rx*0.16, cy + ry*0.55);
      X.lineTo(hx + sway, cy + ry*(1.05 + 0.18*((i*7)%3)/2));
      X.lineTo(hx + rx*0.16, cy + ry*0.55); X.closePath(); X.fill();
    }
    X.restore();
  }
  if(u.evo && !u.dead){                               // GRIM: a violet chill hangs around it
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.30+0.1*Math.sin(t*2.5+seed);
    const ag=X.createRadialGradient(cx,cy,rx*0.3,cx,cy,rx*1.9);
    ag.addColorStop(0,'#b58cff'); ag.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=ag; X.beginPath(); X.ellipse(cx,cy,rx*1.9,ry*1.8,0,0,7); X.fill(); X.restore();
  }
  // the scythe behind the body when it is drawn back
  const drawScythe = ()=>{
    X.save(); X.translate(cx + dir*rx*0.55, cy + ry*0.10); X.scale(dir,1); X.rotate(ang);
    const L = rx*2.3;
    if(sweep && !u.mini){                              // the arc it cuts
      X.save(); X.globalAlpha=0.45; X.strokeStyle='rgba(210,200,255,.9)'; X.lineWidth=L*0.12; X.lineCap='round';
      X.beginPath(); X.arc(0,0, L*0.92, -2.2, 0.2); X.stroke(); X.restore();
    }
    X.strokeStyle='#2a1c12'; X.lineWidth=Math.max(3, rx*0.13); X.lineCap='round';
    X.beginPath(); X.moveTo(0, L*0.35); X.lineTo(0, -L*0.78); X.stroke();
    X.strokeStyle='#6a4a2c'; X.lineWidth=Math.max(2, rx*0.08);
    X.beginPath(); X.moveTo(0, L*0.33); X.lineTo(0, -L*0.76); X.stroke();
    // the blade: a long hooked crescent off the top
    const bl=X.createLinearGradient(0,-L*0.8, L*0.7, -L*0.5);
    bl.addColorStop(0,'#f4f6fb'); bl.addColorStop(0.6,'#aeb6c8'); bl.addColorStop(1,'#6d7488');
    X.fillStyle=bl; X.strokeStyle='#3c4150'; X.lineWidth=Math.max(1.5, rx*0.035);
    X.beginPath();
    X.moveTo(-L*0.02, -L*0.80);
    X.quadraticCurveTo(L*0.38, -L*0.98, L*0.78, -L*0.58);
    X.quadraticCurveTo(L*0.44, -L*0.78, L*0.02, -L*0.66);
    X.closePath(); X.fill(); X.stroke();
    X.strokeStyle='rgba(255,255,255,.75)'; X.lineWidth=Math.max(1, rx*0.02);
    X.beginPath(); X.moveTo(L*0.05, -L*0.80); X.quadraticCurveTo(L*0.40, -L*0.93, L*0.70, -L*0.62); X.stroke();
    if(grim){                                          // GRIM's blade burns violet along its edge
      X.save(); X.globalCompositeOperation='lighter'; X.lineCap='round';
      X.strokeStyle='rgba(170,110,255,.55)'; X.lineWidth=Math.max(4, rx*0.10);
      X.beginPath(); X.moveTo(-L*0.02, -L*0.80); X.quadraticCurveTo(L*0.38, -L*0.98, L*0.78, -L*0.58); X.stroke();
      X.strokeStyle='rgba(230,210,255,.9)'; X.lineWidth=Math.max(1.5, rx*0.03);
      X.beginPath(); X.moveTo(-L*0.02, -L*0.80); X.quadraticCurveTo(L*0.38, -L*0.98, L*0.78, -L*0.58); X.stroke();
      X.restore();
    }
    X.restore();
  };
  if(ang < -0.4) drawScythe();
  // body
  gooPath(cx, cy, rx, ry, 0.03, 4, t, seed, true);
  const g=X.createRadialGradient(cx-rx*0.3, cy-ry*0.4, rx*0.1, cx, cy, rx*1.25);
  g.addColorStop(0,c[0]); g.addColorStop(0.5,c[1]); g.addColorStop(1,shade(c[1],-14));
  X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2, rx*0.09); X.strokeStyle=c[2]; X.stroke();
  // the hood: a dark cowl over the top two thirds, the face lost in shadow
  X.save();
  gooPath(cx, cy, rx, ry, 0.03, 4, t, seed, true); X.clip();
  X.fillStyle='#14121b';
  X.beginPath(); X.moveTo(cx - rx*1.1, cy + ry*0.30);
  X.quadraticCurveTo(cx - rx*0.9, cy - ry*1.3, cx + dir*rx*0.1, cy - ry*1.15);
  X.quadraticCurveTo(cx + rx*1.1, cy - ry*1.0, cx + rx*1.1, cy + ry*0.30);
  X.quadraticCurveTo(cx, cy + ry*0.05, cx - rx*1.1, cy + ry*0.30);
  X.closePath(); X.fill();
  X.fillStyle='#050408';                              // the opening of the hood
  X.beginPath(); X.ellipse(cx + dir*rx*0.12, cy - ry*0.14, rx*0.46, ry*0.36, 0, 0, 7); X.fill();
  X.restore();
  if(grim && !u.dead){                                // a skull looking out of the hood
    const sx=cx + dir*rx*0.12, sy=cy - ry*0.14;
    X.save(); X.fillStyle='#e9e4d8'; X.strokeStyle='#8f887a'; X.lineWidth=Math.max(1.5, rx*0.03);
    X.beginPath(); X.ellipse(sx, sy-ry*0.03, rx*0.33, ry*0.27, 0, 0, 7); X.fill(); X.stroke();
    X.beginPath(); X.ellipse(sx, sy+ry*0.20, rx*0.20, ry*0.11, 0, 0, 7); X.fill(); X.stroke();    // the jaw
    X.strokeStyle='#8f887a';
    for(let i=-2;i<=2;i++){ X.beginPath(); X.moveTo(sx+i*rx*0.06, sy+ry*0.12); X.lineTo(sx+i*rx*0.06, sy+ry*0.28); X.stroke(); }
    X.fillStyle='#120812';
    for(const sgn of [-1,1]){ X.beginPath(); X.ellipse(sx+sgn*rx*0.14, sy-ry*0.05, rx*0.09, ry*0.09, 0, 0, 7); X.fill(); }
    X.beginPath(); X.moveTo(sx, sy+ry*0.04); X.lineTo(sx-rx*0.03, sy+ry*0.10); X.lineTo(sx+rx*0.03, sy+ry*0.10); X.closePath(); X.fill();
    X.restore();
  }
  // two cold eyes in the dark (red, once it is GRIM)
  if(!u.dead){
    X.save(); X.globalCompositeOperation='lighter';
    for(const sgn of [-1,1]){
      const ex=cx + dir*rx*0.12 + sgn*rx*(grim? 0.14 : 0.17), eyy=cy - ry*(grim? 0.19 : 0.16);
      const eg=X.createRadialGradient(ex,eyy,1,ex,eyy,rx*0.16);
      if(grim){ eg.addColorStop(0,'rgba(255,220,200,1)'); eg.addColorStop(0.4,'rgba(255,60,50,.85)'); eg.addColorStop(1,'rgba(200,0,0,0)'); }
      else { eg.addColorStop(0,'rgba(210,255,240,1)'); eg.addColorStop(0.4,'rgba(120,255,200,.8)'); eg.addColorStop(1,'rgba(40,200,150,0)'); }
      X.fillStyle=eg; X.beginPath(); X.arc(ex,eyy,rx*0.16,0,7); X.fill();
    }
    X.restore();
  }
  if(flash>0){ X.save(); X.globalAlpha=flash*0.5; X.fillStyle='#ffffff';
    gooPath(cx, cy, rx, ry, 0.03, 4, t, seed, true); X.fill(); X.restore(); }
  if(ang >= -0.4) drawScythe();
}
function drawSword(px, py, len, dir, ang, evo, sweep){
  X.save(); X.translate(px, py); X.scale(dir, 1); X.rotate(ang);
  // swing trail
  if(sweep>0){
    X.save(); X.globalAlpha=0.5*(1-sweep*0.75); X.lineCap='round';
    X.strokeStyle='rgba(255,255,255,.9)'; X.lineWidth=len*0.26;
    X.beginPath(); X.arc(0,0, len*0.78, -1.5, -0.1); X.stroke();
    X.strokeStyle= evo? 'rgba(255,214,120,.75)' : 'rgba(210,235,255,.65)'; X.lineWidth=len*0.5;
    X.beginPath(); X.arc(0,0, len*0.78, -1.2, -0.3); X.stroke();
    X.restore();
  }
  const w = len*0.13;
  // grip + pommel
  X.strokeStyle='#5a3418'; X.lineCap='round'; X.lineWidth=w*0.9;
  X.beginPath(); X.moveTo(-len*0.20, 0); X.lineTo(0,0); X.stroke();
  X.fillStyle= evo? '#ffd86a' : '#c9a227';
  X.beginPath(); X.arc(-len*0.23, 0, w*0.62, 0, 7); X.fill();
  // crossguard
  X.fillStyle= evo? '#ffd86a' : '#c9a227'; X.strokeStyle='#7a5a08'; X.lineWidth=1.6;
  rr(-w*0.35, -len*0.20, w*0.9, len*0.40, w*0.35); X.fill(); X.stroke();
  // blade
  X.beginPath();
  X.moveTo(w*0.5, -w*0.52); X.lineTo(len*0.86, -w*0.34);
  X.lineTo(len, 0); X.lineTo(len*0.86, w*0.34); X.lineTo(w*0.5, w*0.52); X.closePath();
  const bg=X.createLinearGradient(0,-w*0.5,0,w*0.5);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.45, evo? '#ffeeb0' : '#dfeaf2');
  bg.addColorStop(0.55,'#8fa6b8'); bg.addColorStop(1,'#5d7183');
  X.fillStyle=bg; X.fill();
  X.strokeStyle='#44566a'; X.lineWidth=1.8; X.stroke();
  X.strokeStyle='rgba(255,255,255,.85)'; X.lineWidth=1.6;
  X.beginPath(); X.moveTo(w*0.9, -w*0.06); X.lineTo(len*0.82, -w*0.06); X.stroke();
  X.restore();
}

/* ---- HIT MAN BLOB: dark suit, red tie, fedora, shades and a revolver. Faces HOME once he has landed ---- */
/* ---- AERO BLOB: a little mecha with a blob at the controls under a glass dome. Rockets on its
   back carry it down the lane at ten times a blob's pace; it punches by firing its fist. ---- */
function aeroFlame(x, y, ang, len, wid, seed){       // one rocket jet, pointing along ang
  const fl = len*(0.85 + 0.18*Math.sin(T*47+seed) + 0.10*Math.sin(T*83+seed*3));
  X.save(); X.translate(x, y); X.rotate(ang); X.globalCompositeOperation='lighter';
  const g = X.createLinearGradient(0, 0, fl, 0);
  g.addColorStop(0, 'rgba(255,255,240,.95)'); g.addColorStop(0.25, 'rgba(255,220,90,.9)');
  g.addColorStop(0.6, 'rgba(255,120,40,.6)'); g.addColorStop(1, 'rgba(255,70,20,0)');
  X.fillStyle=g; X.beginPath(); X.moveTo(0, -wid); X.quadraticCurveTo(fl*0.55, -wid*0.9, fl, 0);
  X.quadraticCurveTo(fl*0.55, wid*0.9, 0, wid); X.closePath(); X.fill();
  X.fillStyle='rgba(255,255,255,.85)'; X.beginPath(); X.ellipse(fl*0.12, 0, fl*0.16, wid*0.45, 0, 0, 7); X.fill();
  X.restore();
}
function aeroFist(x, y, R, c, lit, seed){            // the fist, knuckles forward, a rocket cuff behind it
  if(lit) aeroFlame(x - R*0.30, y, Math.PI, R*1.05, R*0.13, seed);
  X.fillStyle='#59606c'; rr(x - R*0.34, y - R*0.17, R*0.16, R*0.34, R*0.05); X.fill();          // cuff / nozzle
  X.fillStyle=c[1]; X.strokeStyle=c[2]; X.lineWidth=Math.max(1.5, R*0.05);
  rr(x - R*0.20, y - R*0.24, R*0.46, R*0.48, R*0.13); X.fill(); X.stroke();
  X.strokeStyle=shade(c[2], 10); X.lineWidth=Math.max(1, R*0.035);                               // knuckles
  for(let i=-1;i<=1;i++){ X.beginPath(); X.moveTo(x + R*0.12, y + i*R*0.12); X.lineTo(x + R*0.24, y + i*R*0.12); X.stroke(); }
  X.fillStyle='#ffd23a'; X.fillRect(x - R*0.20, y - R*0.24, R*0.07, R*0.48);                     // a hazard band on the wrist
  X.fillStyle='rgba(255,255,255,.45)'; X.beginPath(); X.ellipse(x - R*0.02, y - R*0.13, R*0.13, R*0.05, 0, 0, 7); X.fill();
}
function drawAero(u, cx, cy, rx, ry, dir, flash){
  const evo = !!u.evo, c = evo? EVO.aero.c : U.aero.c, seed = u.seed||1, R = rx;
  const p = u.sw>0 ? 1-u.sw/u.swT : -1, ss = x=>x*x*(3-2*x);
  // the fist: a short wind-up, then it fires out, holds on the hit, and flies home
  let ext = 0, lunge = 0;
  if(p>=0 && evo){                                   // JETSTREAM: no fist, the whole mecha rams forward
    if(p<0.30) lunge = -0.30*ss(p/0.30);
    else if(p<0.50) lunge = -0.30 + 1.30*Math.pow((p-0.30)/0.20, 0.6);
    else if(p<0.60) lunge = 1;
    else lunge = 1 - ss((p-0.60)/0.40);
  } else if(p>=0){
    if(p<0.30) ext = -0.18*ss(p/0.30);
    else if(p<0.50) ext = -0.18 + 1.18*Math.pow((p-0.30)/0.20, 0.6);
    else if(p<0.62) ext = 1;
    else ext = 1 - ss((p-0.62)/0.38);
  }
  const zoom = u.moving && !u.mini;
  if(!u.mini) shadow(cx, rx*0.75, 0.16);
  X.save(); X.translate(cx + dir*lunge*R*0.95, cy); X.scale(dir, 1);
  if(zoom) X.rotate(0.10);
  if(lunge>0) X.rotate(0.16*lunge);                  // shoulder down into the bump                           // nose down when it is flying flat out
  X.lineJoin='round'; X.lineCap='round';
  // speed lines streaming off it
  if(zoom){
    X.save(); X.strokeStyle='rgba(255,255,255,.55)'; X.lineWidth=Math.max(1.5, R*0.05);
    for(let i=0;i<4;i++){ const ph=((T*3.2 + i*0.27 + seed*0.13)%1), yy=(-0.5 + i*0.33)*ry;
      X.globalAlpha=0.6*(1-ph); X.beginPath(); X.moveTo(-R*(1.3+ph*1.6), yy); X.lineTo(-R*(1.9+ph*1.6), yy); X.stroke(); }
    X.restore();
  }
  // rocket jets: the big ones off the back pack, small ones under the feet
  aeroFlame(-R*1.18, -ry*0.12, Math.PI + (zoom? 0.05 : 0.45), R*(zoom? 1.9 : 1.0), ry*0.20, seed);
  aeroFlame(-R*1.10, ry*0.20, Math.PI + (zoom? 0.12 : 0.65), R*(zoom? 1.5 : 0.8), ry*0.15, seed+2);
  for(const fx of [-0.36, 0.22]) aeroFlame(R*fx, ry*1.02, Math.PI/2, R*0.55, ry*0.09, seed+fx*9);
  if(evo){                                           // JETSTREAM: swept wings and an afterburner
    aeroFlame(-R*1.22, -ry*0.62, Math.PI + (zoom? 0.02 : 0.30), R*(zoom? 2.4 : 1.2), ry*0.16, seed+5);
    X.fillStyle=shade(c[1], -8); X.strokeStyle=c[2]; X.lineWidth=Math.max(1.5, R*0.05);
    X.beginPath(); X.moveTo(R*0.30, -ry*0.10); X.lineTo(-R*0.95, -ry*0.95); X.lineTo(-R*1.25, -ry*0.88);
    X.lineTo(-R*0.55, -ry*0.05); X.closePath(); X.fill(); X.stroke();
    X.fillStyle='#ffffff'; X.beginPath(); X.moveTo(-R*0.70, -ry*0.62); X.lineTo(-R*1.02, -ry*0.86); X.lineTo(-R*1.14, -ry*0.83); X.lineTo(-R*0.86, -ry*0.58); X.closePath(); X.fill();
    X.fillStyle='#4a515d'; rr(-R*1.30, -ry*0.72, R*0.20, ry*0.20, R*0.05); X.fill();      // the afterburner nozzle
  }
  // back arm, tucked behind the hull
  X.fillStyle=shade(c[2], 8); rr(-R*0.30, ry*0.05, R*0.30, ry*0.42, R*0.10); X.fill();
  // the rocket pack
  X.fillStyle='#4a515d'; rr(-R*1.22, -ry*0.30, R*0.18, ry*0.36, R*0.05); X.fill();               // nozzles
  X.fillStyle='#4a515d'; rr(-R*1.15, ry*0.08, R*0.14, ry*0.26, R*0.04); X.fill();
  const pg = X.createLinearGradient(0, -ry*0.5, 0, ry*0.45);
  pg.addColorStop(0, '#d9dee6'); pg.addColorStop(1, '#7d8696');
  X.fillStyle=pg; X.strokeStyle='#3b4150'; X.lineWidth=Math.max(1.5, R*0.05);
  rr(-R*1.08, -ry*0.48, R*0.50, ry*0.90, R*0.20); X.fill(); X.stroke();
  X.fillStyle='#e0412f'; X.fillRect(-R*1.06, -ry*0.12, R*0.46, ry*0.10);                         // red stripe
  // legs: short, hanging, little thrusters for feet
  for(const lx of [-0.36, 0.22]){
    X.fillStyle=shade(c[2], 4); rr(R*lx - R*0.10, ry*0.40, R*0.20, ry*0.42, R*0.06); X.fill();
    X.fillStyle='#4a515d'; X.beginPath(); X.moveTo(R*lx - R*0.16, ry*0.80); X.lineTo(R*lx + R*0.16, ry*0.80);
    X.lineTo(R*lx + R*0.11, ry*1.02); X.lineTo(R*lx - R*0.11, ry*1.02); X.closePath(); X.fill();
  }
  // the hull
  const hg = X.createLinearGradient(0, -ry*0.45, 0, ry*0.65);
  hg.addColorStop(0, c[0]); hg.addColorStop(0.5, c[1]); hg.addColorStop(1, shade(c[1], -18));
  X.fillStyle=hg; X.strokeStyle=c[2]; X.lineWidth=Math.max(2, R*0.07);
  rr(-R*0.78, -ry*0.40, R*1.56, ry*0.98, ry*0.34); X.fill(); X.stroke();
  X.fillStyle='rgba(255,255,255,.35)'; rr(-R*0.62, -ry*0.32, R*0.95, ry*0.12, ry*0.06); X.fill();  // shine along the top
  // hazard stripes across the belly
  X.save(); rr(-R*0.78, -ry*0.40, R*1.56, ry*0.98, ry*0.34); X.clip();
  X.fillStyle='#ffd23a'; X.fillRect(-R*0.8, ry*0.30, R*1.6, ry*0.14);
  X.fillStyle='#2a2f38';
  for(let i=-6;i<6;i++){ X.beginPath(); X.moveTo(i*R*0.16, ry*0.30); X.lineTo(i*R*0.16+R*0.08, ry*0.30);
    X.lineTo(i*R*0.16+R*0.02, ry*0.44); X.lineTo(i*R*0.16-R*0.06, ry*0.44); X.closePath(); X.fill(); }
  X.restore();
  // rivets and a chest light
  X.fillStyle=c[2]; for(const [a,b] of [[-0.62,0.08],[0.62,0.08],[-0.62,-0.20],[0.62,-0.20]]){ X.beginPath(); X.arc(R*a, ry*b, R*0.035, 0, 7); X.fill(); }
  X.fillStyle = (Math.sin(T*6+seed)>0) ? '#7dffb0' : '#2ea866'; X.beginPath(); X.arc(R*0.40, ry*0.10, R*0.07, 0, 7); X.fill();
  // the cockpit: a blob at the controls under a glass dome
  const dx = R*0.02, dy = -ry*0.40, dw = R*0.56, dh = ry*0.62;
  X.save(); X.beginPath(); X.ellipse(dx, dy, dw, dh, 0, Math.PI, 0); X.closePath(); X.clip();
  X.fillStyle='rgba(30,60,90,.55)'; X.fillRect(dx-dw, dy-dh, dw*2, dh);
  const bw = dw*0.72, bh = dh*0.70, by = dy - bh*0.42;
  const bg = X.createRadialGradient(dx-bw*0.3, by-bh*0.4, bw*0.1, dx, by, bw*1.2);
  bg.addColorStop(0, '#d6f0ff'); bg.addColorStop(0.5, '#53b9ff'); bg.addColorStop(1, '#3f95d6');
  X.fillStyle=bg; X.beginPath(); X.ellipse(dx, by + bh*0.15, bw, bh, 0, 0, 7); X.fill();
  X.strokeStyle='#326ea0'; X.lineWidth=Math.max(1.5, R*0.05); X.stroke();
  eyes(dx, by - bh*0.05, bw*0.95, 1, 'round', u.blink>0, p>=0.25 && p<0.65);
  X.strokeStyle=INK; X.lineWidth=Math.max(1.5, bw*0.08);
  X.beginPath(); X.arc(dx + bw*0.10, by + bh*0.40, bw*0.16, 0.12*Math.PI, 0.88*Math.PI); X.stroke();
  X.restore();
  X.fillStyle='rgba(200,235,255,.22)'; X.beginPath(); X.ellipse(dx, dy, dw, dh, 0, Math.PI, 0); X.closePath(); X.fill();
  X.strokeStyle='rgba(255,255,255,.75)'; X.lineWidth=Math.max(1.5, R*0.05);
  X.beginPath(); X.ellipse(dx, dy, dw*0.80, dh*0.80, 0, Math.PI*1.12, Math.PI*1.42); X.stroke();     // glass glint
  X.fillStyle='#5b6474'; rr(dx-dw-R*0.04, dy-ry*0.05, dw*2+R*0.08, ry*0.12, ry*0.05); X.fill();     // the dome's collar
  // front arm and the rocket fist
  const sx = R*0.56, sy = ry*0.10;
  const fx = R*1.05 + ext*R*1.25, fy = ry*0.22 + Math.max(0, ext)*ry*0.25;
  X.fillStyle='#5b6474'; X.beginPath(); X.arc(sx, sy, R*0.17, 0, 7); X.fill();                         // shoulder
  X.strokeStyle=c[2]; X.lineWidth=R*0.20; X.beginPath(); X.moveTo(sx, sy); X.lineTo(R*0.86, ry*0.22); X.stroke();
  X.strokeStyle=c[1]; X.lineWidth=R*0.13; X.beginPath(); X.moveTo(sx, sy); X.lineTo(R*0.86, ry*0.22); X.stroke();
  if(ext > 0.04){                                    // fired: a smoky trail back to the arm
    X.save(); X.globalAlpha=0.45; X.fillStyle='#dfe3ea';
    for(let i=1;i<=4;i++){ const q=i/5; X.beginPath(); X.arc(R*0.86 + (fx-R*0.86)*q, ry*0.22 + (fy-ry*0.22)*q + Math.sin(T*20+i)*R*0.03, R*(0.06+0.03*i), 0, 7); X.fill(); }
    X.restore();
    X.fillStyle='#4a515d'; X.beginPath(); X.arc(R*0.88, ry*0.22, R*0.10, 0, 7); X.fill();              // the empty wrist socket
  }
  aeroFist(fx, fy, R, c, ext > 0.04, seed);
  X.restore();
}
function drawHitman(u, cx, cy, rx, ry, dir, flash){
