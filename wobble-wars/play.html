          } else if(U[u.k].sludge){                    // the jaw comes down: purple splash, the ground jumps
            SFX.slam(); tone(70,0.35,'square',0.18,34); noise(0.35,0.24,700,120,0.8);
            shake=Math.max(shake,16); hitStop=Math.max(hitStop,0.05);
            ring(ix, GY-8, '#c58ae6', 14, 120, 0.42, 9);
            for(let q=0;q<22;q++) B.parts.push({x:ix+(Math.random()-0.5)*50, y:GY-10-Math.random()*30,
              vx:(Math.random()-0.5)*320, vy:-80-Math.random()*240, r:3+Math.random()*6,
              life:0.45+Math.random()*0.4, t:0, col: Math.random()<0.5?'#b879e0':'#6b3496', g:520});
          } else if(U[u.k].ram){
            SFX.slam();
            ring(ix, GY-10, '#bfe4ff', 10, d.aoe*1.9, 0.36, 6);
            ring(ix, iy, '#dcf0ff', 8, d.aoe*1.2, 0.28, 4);
            for(let q=0;q<10;q++) B.parts.push({x:ix+(Math.random()-0.5)*30, y:GY-4,
              vx:(Math.random()-0.5)*260, vy:-40-Math.random()*140, r:3+Math.random()*4,
              life:0.35+Math.random()*0.35, t:0, col:'#dbeeff', g:420});
          } else if(U[u.k].aero && u.evo){             // JETSTREAM: a body bump — a heavy thud, no explosion
            SFX.slam(); tone(150,0.14,'square',0.13,70);
            shake=Math.max(shake,10); hitStop=Math.max(hitStop,0.04);
            ring(ix, iy, '#ffe2dc', 10, d.aoe*1.5, 0.30, 6);
            for(let q=0;q<12;q++) B.parts.push({x:ix, y:iy+(Math.random()-0.5)*40,
              vx:u.team*(80+Math.random()*240), vy:-40-Math.random()*200, r:2.5+Math.random()*4,
              life:0.3+Math.random()*0.35, t:0, col: Math.random()<0.5?'#ffffff':'#ffb3a8', g:420});
          } else if(U[u.k].aero){                      // the rocket fist goes off like a shell
            SFX.boom(); tone(240,0.12,'square',0.12,90); noise(0.16,0.16,2600,500,1.4);
            shake=Math.max(shake,12); hitStop=Math.max(hitStop,0.04);
            ring(ix, iy, '#fff1c2', 10, d.aoe*1.5, 0.32, 7);
            ring(ix, iy, '#ff8a2a', 8, d.aoe*2.1, 0.42, 5);
            for(let q=0;q<18;q++){ const a2=Math.random()*Math.PI*2;
              B.parts.push({x:ix, y:iy, vx:Math.cos(a2)*(100+Math.random()*260), vy:Math.sin(a2)*(100+Math.random()*260)-50,
                r:2.5+Math.random()*5, life:0.3+Math.random()*0.4, t:0,
                col: Math.random()<0.35?'#fff3c0' : Math.random()<0.6?'#ff8a2a':'#8d939e', g:380}); }
          } else if(U[u.k].elderCane){                 // the cane hits the dirt and a shockwave rolls out
            SFX.slam(); tone(90,0.24,'square',0.14,44); shake=Math.max(shake,12); hitStop=Math.max(hitStop,0.03);
            const x0 = u.x + u.team*40;
            for(let q=0;q<5;q++){ const f=q/4, sx=x0 + (ix+u.team*d.aoe*0.6 - x0)*f;
              ring(sx, GY-6, '#f1e6cf', 6+q*2, 36+q*14, 0.30+q*0.05, 5); }
            ring(ix, GY-6, '#ffffff', 12, d.aoe*1.6, 0.42, 7);
            for(let q=0;q<24;q++) B.parts.push({x:x0+(ix+u.team*d.aoe - x0)*Math.random(), y:GY-4,
              vx:u.team*(40+Math.random()*200), vy:-60-Math.random()*200, r:2.5+Math.random()*5,
              life:0.35+Math.random()*0.45, t:0, col: Math.random()<0.5?'#efe4cf':'#a9906a', g:480});
          } else if(u.team>0) SFX.punch(); else SFX.slimeHit();
          shake=Math.max(shake, d.r*(u.k==='chonk'?0.22:0.10));
          hitStop=Math.max(hitStop, u.k==='chonk'?0.05:0.02);
        }
      }
      if(u.sw<=0) u.sw=0;
      continue;
    }
    if(d.still){ u.moving=false; continue; }      // barricades just sit there
    if(d.jump){                                   // the jumper only jumps — moving and hitting are one act
      u.moving=false;
      u.atk-=udt;
      if(u.atk<=0){
        u.atk=d.rate; u.dealt=false; u.dealt2=false;
        const J=d.jump;
        let first=null, fd=1e9;                    // pull up at the first thing in the lane
        for(const o of B.units){
          if(o.team===u.team || o.dead || o.dying) continue;
          const gap = (u.team>0? o.x-u.x : u.x-o.x);
          if(gap>0 && gap<fd){ fd=gap; first=o; }
        }
        const lim = u.team>0 ? E_FRONT-10 : P_FRONT+10;
        const toWall = Math.abs(lim - u.x);
        let hop = J.run ? Math.min(J.max||1400, toWall)     // a runner goes until something stops him
                        : J.dist * (u.evo? 1.3 : 1);
        if(first){
          // they close on each other, so aim at where they will actually meet
          const vt = first.team>0 ? uspd(first.k) : (U[first.k].spd||0);
          const sp = J.run ? (J.speed||700) : 1e9;
          const meet = fd * sp/(sp+vt);
          if(J.run){
            // a runner (the quarterback) stops where the bodies touch; already touching = tackle on the spot
            const touch = d.r*0.5*(u.rs||1) + U[first.k].r*0.6*(first.rs||1);
            hop = Math.min(hop, Math.max(0, meet - touch));
          } else {
            hop = Math.min(hop, Math.max(26, meet - U[first.k].r*0.6*(first.rs||1)));   // a hopper always hops — the pogo can bounce right past (on purpose)
          }
        }
        if(tgt==='base') hop = 0;                  // already at the wall: swing on the spot
        u.jx0 = u.x;
        u.jx1 = u.team>0 ? Math.min(u.x+hop, lim) : Math.max(u.x-hop, lim);
        if(J.run){                                 // the run stretches to fit the ground he has to cover
          const tC = Math.max(0.14, hop/(J.speed||700)), tR = (J.rec!=null? J.rec : 0.5);
          u.sw = u.swT = tC + tR;
          u.hitP = tC/(tC+tR);
        } else { u.sw = u.swT = swingT(u,d); }
        SFX.whoosh(u.team>0?1:0);
      }
      continue;
    }
    if(tgt && d.heal){ u.moving=false; }            // it hangs back and mends
    else if(tgt && !d.summon){
      u.moving=false;
      u.atk-=udt;
      if(u.atk<=0){
        u.atk=d.rate; u.sw=u.swT=swingT(u,d); u.dealt=false; u.dealt2=false;
        if(d.beam){ u.beamAcc=0; u.beamT=null; u.beamX=null; SFX.charge(); }
        if(d.tongue){ u.dealt=true; u.grabT = pickBack(u, d); u.grabbed0=false; u.grabHit=false; u.tongueX=null; }
        if(d.tsunami){ u.dealt=true; u.waved=false; u.charged0=false; }
        if(d.aoeTarget){                              // the ground he picks now is the ground he hits
          u.lockX = (tgt && tgt!=='base') ? tgt.x : (u.team>0 ? E_FRONT-24 : P_FRONT+24);
        }
        if(d.bolts){
          // he marks the ground the moment he rears back — anything quick enough can walk out of it
          u.dealt=true;
          const bdmg = unitDmg(u);
          const tx = (tgt && tgt!=='base') ? tgt.x : (u.team>0 ? E_FRONT-24 : P_FRONT+24);
          const lead = u.swT*hitPoint(u,d);
          if(tgt && u.team<0) B.hits[u.k] = (B.hits[u.k]||0) + 1;
          for(let i=0;i<d.bolts.n;i++){
            B.strikes.push({x: tx + (i-(d.bolts.n-1)/2)*(d.bolts.spread||30) * u.team,
                            t: lead + i*(d.bolts.gap||1), dmg:bdmg, team:u.team,
                            aoe:d.bolts.aoe||80, fired:0, flash:0, src:u});
          }
          SFX.charge(); tone(180,0.5,'sawtooth',0.12,900);
        }
        if(d.spit && tgt && tgt!=='base'){            // lob the goo so it lands on the hit
          const fly = u.swT*(1-hitPoint(u,d));
          B.spits.push({x0:u.x+u.team*U[u.k].r*0.6, y0:GY-U[u.k].r*1.1,
                        x1:tgt.x, y1:GY-U[tgt.k].r*0.9, t:-u.swT*hitPoint(u,d), dur:fly, col:d.c[1]});
        }
      }
    } else if(tgt && d.summon){
      u.moving=false;                    // it stops when something is in front, but only ever conjures
    } else {
      u.moving=true;
      if(!d.summon) u.atk = Math.max(0, u.atk - udt);   // keep reloading on the march
      u.x += u.team * (u.team>0 ? uspd(u.k) : espec(u.k,'spd')) * (u.spdMul||1) * udt;
      u.x = Math.max(P_FRONT-30, Math.min(E_FRONT+30, u.x));
    }
  }
  B.units = B.units.filter(u=>!(u.dead && u.dt<=0));

  // sweeping beam
  for(const s of B.shots){
    s.t+=dt;
    s.vx += s.ax*dt;
    s.x += s.vx*dt;
    s.trail.push({x:s.x, a:1}); if(s.trail.length>26) s.trail.shift();
    for(const tr of s.trail) tr.a-=dt*2.4;
    shake=Math.max(shake, 4);
    // sparks off the ground contact
    s.sparkT-=dt;
    if(s.sparkT<=0){ s.sparkT=0.02;
      for(let i=0;i<3;i++) B.parts.push({x:s.x+(Math.random()-0.5)*20, y:GY-6,
        vx:(Math.random()-0.5)*260, vy:-80-Math.random()*280, r:2+Math.random()*4,
        life:0.3+Math.random()*0.4, t:0, col: Math.random()<0.5?'#ffffff':cannonTone().spark, g:520});
    }
    // everything the beam sweeps past takes 25
    for(const u of B.units){
      if(u.team>0 || u.dead || u.dying || s.hit.has(u)) continue;
      if(u.x <= s.x + U[u.k].r*0.6){
        s.hit.add(u);
        dmgUnit(u, s.dmg, 1);
        if(!u.air && !u.dead) knockback(u, 0.85, false);
        const ct2=cannonTone();
        ring(u.x, GY-U[u.k].r, ct2.hit, 8, 80, 0.32, 6);
        splat(u.x, GY-U[u.k].r, ct2.splat, 14, 240);
        SFX.boom(); shake=Math.max(shake,13); flashScreen=Math.max(flashScreen,0.12);
      }
    }
    if(s.x>FIELD+120) s.done=true;
  }
  B.shots=B.shots.filter(s=>!s.done);

  // boomerangs and canes — out to the end of the throw, then home again
  for(const c of B.coins){
    c.spin += dt*15;
    const step = c.speed*dt;
    if(!c.back){
      c.x += c.team*step;
      if(Math.abs(c.x-c.x0) >= c.dist) c.back=1;
    } else {
      c.x -= c.team*step;
      if((c.team>0 && c.x <= c.x0) || (c.team<0 && c.x >= c.x0)) c.done=1;
    }
    const seen = c.back? c.hitBack : c.hitOut;      // one hit per pass, so a front-liner takes two
    for(const o of B.units){
      if(o.team===c.team || o.dead || o.dying || seen.has(o)) continue;
      if(Math.abs(o.x-c.x) <= c.hr + U[o.k].r*0.5*(o.rs||1)){
        seen.add(o); dmgUnit(o, c.dmg, c.team, c.src);
        SFX.punch();
        ring(o.x, GY-U[o.k].r*0.9, c.evo? '#ffe3a8' : '#d8fbf3', 4, 44, 0.24, 4);
        for(let q=0;q<5;q++) B.parts.push({x:o.x, y:GY-U[o.k].r*0.9+(Math.random()-0.5)*22,
          vx:c.team*(60+Math.random()*180), vy:(Math.random()-0.5)*200, r:2+Math.random()*3.5,
          life:0.22+Math.random()*0.28, t:0, col: c.evo?'#ffd88a':'#9ff0e2', g:320});
      }
    }
    const wall = c.team>0 ? E_FRONT : P_FRONT;      // it clatters off the nest and turns for home
    if(!c.back && Math.abs(wall-c.x) <= c.hr){
      if(c.team>0) B.ebHP=Math.max(0,B.ebHP-c.dmg); else B.pbHP=Math.max(0,B.pbHP-c.dmg);
      SFX.baseHit(); shake=Math.max(shake,5); c.back=1;
    }
    if(c.done && c.src && !c.src.dead) c.src.hold=1;
  }
  B.coins = B.coins.filter(c=>!c.done);

  // camera: MANUAL ONLY — no autoscroll. drag or two-finger scroll the field.
  const camMax = Math.max(0, FIELD-W);
  B.camT = Math.max(0, Math.min(camMax, B.camT));
  B.camX += (B.camT - B.camX) * Math.min(1, dt*14);

  updateFX(dt);

  // win / lose
  if(!B.over){
    if(B.ebHP<=0){ B.over='win'; B.overT=0; stopMusic(); SFX.win();
      // campaign stages pay out once — the XP LEVELS are the only place to farm
      const first = B.isXp || B.li+1 > save.best;
      const gain = first ? (B.L.xp||1000) : 0;
      save.xp += gain; B.xpGain = gain;
      if(first && B.L.ticket){ save.tickets = (save.tickets||0) + B.L.ticket; B.ticketGain = B.L.ticket; }
      if(first && B.L.rareTicket){ save.rare = (save.rare||0) + B.L.rareTicket; B.rareGain = B.L.rareTicket; }
      if(!B.isXp && B.li+1>save.best) save.best=B.li+1;
      persist();
      result = {win:true, xp:gain, kills:B.kills, li:B.li, isXp:B.isXp, first, t:0,
                ticket:B.ticketGain||0, rare:B.rareGain||0, nm:B.L.nm, time:B.time};
      // the scoreboard waits a moment: first your blobs get to celebrate on the field
      B.winT = T; for(const u of B.units) if(u.team>0) u.sw = 0;
      stopMusic(); startMusic('victory');
      shake=18; flashScreen=0.8;
      for(let i=0;i<40;i++) puff(E_BASE_X+(Math.random()-0.5)*140, GY-Math.random()*160, '#9ce85c',-140);
    }
    else if(B.pbHP<=0){ B.over='lose'; B.overT=0; stopMusic(); SFX.lose(); shake=16;
      result = {win:false, xp:0, kills:B.kills, li:B.li, isXp:B.isXp, first:false, t:0,
                ticket:0, rare:0, nm:B.L.nm, time:B.time};
      scene='result'; startMusic('defeat'); }
  }
}

function fireCannon(){
  if(!B || B.over || B.paused) return;
  const C=B.cannon;
  if(C.ch<100){ SFX.deny(); return; }
  C.ch=0; C.ready=false; C.recoil=1;
  if(B.tut && B.tut.step===2) tutNext();
  // a beam that sweeps the whole lane, accelerating as it goes
  B.shots.push({ x:300, vx:120, ax:900, dmg:cannonDmg(), hit:new Set(), trail:[], t:0, sparkT:0, done:false });
  SFX.cannon(); shake=12; flashScreen=0.30;
  const ct=cannonTone();
  ring(MUZ.x, MUZ.y, ct.ring, 10, 120, 0.4, 8);
  for(let i=0;i<20;i++){
    B.parts.push({x:MUZ.x, y:MUZ.y, vx:60+Math.random()*200, vy:(Math.random()-0.5)*180,
      r:3+Math.random()*6, life:0.35+Math.random()*0.4, t:0, col: ct.part, g:120});
  }
}

/* ================================================================
   BATTLE RENDER
   ================================================================ */
// reaped units are drawn into this small buffer, tinted there (only their own pixels), and stamped back.
// Far cheaper than a canvas filter, which re-processes the whole screen for every unit.
const SHADE_CV = document.createElement('canvas'), SHADE = SHADE_CV.getContext('2d');
const SHADE_BOX = 230;                                   // half-width of the buffer, in world px
const CONFETTI = ['#ffd23a','#ff5a6e','#4fb3ff','#7dffb0','#c08bff','#ffffff'];
// VICTORY: every surviving blob hops for joy, each to its own beat
function cheerHop(u){
  if(!B || B.over!=='win' || B.winT==null || u.team<=0 || u.dead || u.dying || u.air || u.fly || U[u.k].still) return null;
  const q = ((T - B.winT)*2.3 + u.seed*0.37) % 1;
  return {hop: Math.sin(q*Math.PI)*30*(u.rs||1), sq: Math.max(0, 1 - q/0.14)*0.22};
}
function drawUnit(u){
  const d=U[u.k], dir=u.team;
  const wf=(d.wide||1)*(u.rs||1), vf=(u.rs||1);
  let rx=d.r*wf, ry=d.r*1.02*vf, cx=u.x, cy=GY-d.r*0.98*vf, rot=0;
  let a=1;
  // spawn pop
  if(u.spawnA<1){ const p=u.spawnA; const s=1+Math.sin(p*Math.PI)*0.28; rx*=s*(0.5+0.5*p); ry*=(0.5+0.5*p)/ (s*0.6+0.5); a=p; }
  // death: flatten into a puddle
  if(u.dead){ const p=1-Math.max(0,u.dt)/0.5; rx*=1+p*0.85; ry*=Math.max(0.04,1-p*1.05); cy=GY-ry*1.0; a=1-p*0.9; }
  else if(u.air){
    // knocked back: tumbling, squashing on every bounce (clouds included — they stop
    // hovering the moment something launches them)
    rot = -dir*0.5*Math.sin(u.kbT*10.5);
    const sq=u.squish;
    rx *= 1 + 0.40*sq; ry *= 1 - 0.36*sq;
    cy = GY - ry*0.98 - u.z;
  }
  else{
    // walk bounce / idle jiggle
    const amp = u.moving? 0.085 : 0.045, sp = u.moving? 8.5 : 3.4;
    const w = Math.sin(T*sp + u.ph);
    rx *= 1 - w*amp*0.55; ry *= 1 + w*amp;
    cy = GY - ry*0.98 - Math.max(0, w)*(u.moving?6:2);
    const ch = cheerHop(u);
    if(ch){ rx *= 1 + ch.sq; ry *= 1 - ch.sq*0.9; cy = GY - ry*0.98 - ch.hop; }
    if(d.cloud) cy -= 36 + Math.sin(T*1.6+u.seed)*5;
    if(u.sw>0){
      const p = 1-u.sw/u.swT;
      if(d.cloud){
        if(p<0.52){ const q=p/0.52; u.puff=q; u.blow=0; rx*=1+0.22*q; ry*=1+0.22*q; }
        else { const q=(p-0.52)/0.48; u.puff=Math.max(0,1-q*2.2);
               u.blow=Math.max(0, 1-Math.max(0,(q-0.55))*2.6);
               const sc=1.22-0.34*Math.min(1,q*2.6); rx*=sc; ry*=sc; }
        cy = GY - ry*0.98 - 36;
      }
      else if(d.mage){ cy = GY - ry*0.98; }
      else if(d.baby && u.evo){
        // wind back on the strings, then swing through
        // a pendulum: eases into the backswing, hangs a beat, whips through the
        // bottom at full speed, then swings out and rocks back to rest
        const ss = x => x*x*(3-2*x);
        if(p<0.32){        u.balloonA = -0.70*ss(p/0.32); }                       // backswing
        else if(p<0.40){   u.balloonA = -0.70 - 0.05*ss((p-0.32)/0.08); }         // hang at the top
        else if(p<0.66){   u.balloonA = -0.75 + 1.90*ss((p-0.40)/0.26); }         // foreswing
        else {             const q=(p-0.66)/0.34;                                 // follow through
                           u.balloonA = 1.15*Math.exp(-3.4*q)*Math.cos(q*5.6); }
        u.swingHot = (p>0.40 && p<0.72) ? 1 : 0;
        cy = GY - ry*0.98;
      }
      else if(d.bite){
        // rear back with the jaws open, then a hard fast snap
        if(p<0.55){ const q=p/0.55; u.bite = q; cx -= dir*10*q; ry *= 1+0.05*q; }
        else { const q=(p-0.55)/0.45; u.bite = Math.max(0, 1-q*3.2);
               cx += dir*(-10 + 34*Math.min(1,q*2.4)); ry *= 1-0.06*Math.min(1,q*2.4); }
        cy = GY - ry*0.98;
      }
      else if(d.tackle){
        // dig in, sprint, then leave his feet and smash through
        const lead = d.jump? 0 : 1;              // when the body really travels, do not fake it as well
        const h = hitPoint(u,d), dig = h*0.20;
        if(p<dig){ const q=p/dig; cx -= dir*18*q*lead; rx*=1+0.12*q; ry*=1-0.10*q; }
        else if(p<h){                            // running — upright, leaning into it
          const q=(p-dig)/(h-dig);
          u.running = 1;
          cx += dir*(-18+60*q)*lead; rot = dir*0.20; rx*=1.03; ry*=0.99;
        }
        else {                                   // the tackle itself, then he picks himself up
          const q=(p-h)/(1-h), e=1-q;
          cx += dir*42*e*lead; rot = dir*1.45*e; rx*=1+0.24*e; ry*=1-0.22*e;
        }
        cy = GY - ry*0.98;
      }
      else if(d.needle || d.spear){
        // draw the syringe back, jab it in, pull it out
        const h = d.hitP||0.55;
        if(p < h-0.14){ const q=p/(h-0.14); u.stab = -0.35*q; cx -= dir*5*q; }
        else if(p < h){ const q=(p-(h-0.14))/0.14; u.stab = -0.35 + 1.35*q; cx += dir*(-5 + 19*q); }
        else { const q=(p-h)/(1-h); u.stab = 1-q; cx += dir*14*(1-q); }
        cy = GY - ry*0.98;
      }
      else if(d.sword || d.dagger || d.knife){
        // overhead wind-up, then a fast downward slash — the dagger swings wider
        const back = d.dagger? -2.95 : d.knife? -2.60 : -2.20, thru = d.dagger? 4.35 : d.knife? 3.90 : 3.15;
        u.swordA = p<0.40 ? -0.55 + (back+0.55)*(p/0.40)
                          : back + thru*Math.pow((p-0.40)/0.60, 0.6);
        u.swordSweep = p>0.40 ? (p-0.40)/0.60 : 0;
        cx += dir*(p<0.40? -5*(p/0.40) : 13*Math.sin(((p-0.40)/0.60)*Math.PI));
        ry *= 1 + (p<0.40? 0.05*(p/0.40) : -0.06*Math.sin(((p-0.40)/0.60)*Math.PI));
        cy = GY - ry*0.98;
      }
      else if(d.golem){
        // heave the slab arm overhead, drive it down, haul it up and do it again
        const ss = x => x*x*(3-2*x);
        let ga;
        if(p<0.22)      ga = -ss(p/0.22);
        else if(p<0.34) ga = -1 + 2*Math.pow((p-0.22)/0.12, 0.55);
        else if(p<0.44) ga = 1 - 0.30*ss((p-0.34)/0.10);
        else if(p<0.62) ga = 0.70 - 1.70*ss((p-0.44)/0.18);
        else if(p<0.74) ga = -1 + 2*Math.pow((p-0.62)/0.12, 0.55);
        else            ga = 1 - ss((p-0.74)/0.26);
        u.golemA = ga;
        u.golemSweep = ((p>0.24 && p<0.40) || (p>0.64 && p<0.80)) ? 1 : 0;
        cx += dir*rx*0.10*Math.max(0, ga);
        ry *= 1 - 0.05*Math.max(0, ga);
        cy = GY - ry*0.98;
      }
      else if(d.phoenix || d.aero){ cy = GY - ry*0.98; }
      else if(d.elderCane || d.reap){ cy = GY - ry*0.98; }
      else if(d.hammer){
        // heave the hammer up over his head, then bring it down with everything he has
        const ss = x => x*x*(3-2*x);
        u.armA = p<0.46 ? -2.35*ss(p/0.46)
                        : -2.35 + 3.55*Math.pow((p-0.46)/0.54, 0.55);
        u.armSweep = p>0.46 ? (p-0.46)/0.54 : 0;
        cx += dir*(p<0.46? -6*ss(p/0.46) : 18*Math.sin(((p-0.46)/0.54)*Math.PI));
        ry *= 1 + (p<0.46? 0.05*(p/0.46) : -0.06*Math.sin(((p-0.46)/0.54)*Math.PI));
        cy = GY - ry*0.98;
      }
      else if(d.humanoid){
        // wind the arm back, then hook it forward through the target
        u.armA = p<0.45 ? -2.1*(p/0.45)
                        : -2.1 + 3.3*Math.pow((p-0.45)/0.55, 0.65);
        u.armSweep = p>0.45 ? (p-0.45)/0.55 : 0;
        cx += dir*(p<0.45? -7*(p/0.45) : 16*Math.sin(((p-0.45)/0.55)*Math.PI));
        ry *= 1 + (p<0.45? 0.04*(p/0.45) : -0.05*Math.sin(((p-0.45)/0.55)*Math.PI));
        cy = GY - ry*0.98;
      }
      else if(d.ram){
        // heavy ram: coil back, launch forward low, slam
        if(p<0.40){ const q=p/0.40; cx -= dir*16*q; rx*=1+0.12*q; ry*=1-0.10*q; rot=-dir*0.10*q; }
        else if(p<0.62){ const q=(p-0.40)/0.22; cx += dir*(-16+q*52);
          rx*=1+0.26*q; ry*=1-0.20*q; rot=dir*0.18*q; }
        else { const q=(p-0.62)/0.38, e=1-q; cx += dir*36*e;
          rx*=1+0.34*e; ry*=1-0.26*e; rot=dir*0.18*e; }
        cy = GY - ry*0.98;
      }
      else if(d.jump){
        // crouch right down, fling itself up the arc, pancake on landing
        const t0=d.jump.t0, t1=hitPoint(u,d);
        let hop=0;
        if(p<t0){ const q=p/t0; rx*=1+0.28*q; ry*=1-0.32*q; }
        else if(p<t1){
          const q=(p-t0)/(t1-t0), st=Math.sin(q*Math.PI);
          hop = st*d.jump.up*(u.evo?1.15:1);
          rx *= 1-0.17*st; ry *= 1+0.24*st;
        }
        else { const e=1-(p-t1)/(1-t1); rx*=1+0.32*e; ry*=1-0.30*e; }
        cy = GY - ry*0.98 - hop;
      }
      else if(d.storm){
        // he hauls himself backwards a country mile, then heaves forward as the sky cracks
        const h=hitPoint(u,d);
        if(p<h){ const q=Math.pow(p/h, 0.7); cx -= dir*190*q; rx*=1+0.06*q; ry*=1+0.04*q; }
        else { const q=(p-h)/(1-h); cx -= dir*190*(1-q)*(1-q); rx*=1+0.10*(1-q); ry*=1-0.06*(1-q); }
        cy = GY - ry*0.98;
      }
      else if(d.flop){
        // BELLY FLOP: squat, leap, tip over, pancake onto the target
        let hop=0;
        if(p<0.30){                      // squat & wind up
          const q=p/0.30; rx*=1+0.18*q; ry*=1-0.24*q; cx-=dir*6*q;
        } else if(p<0.64){               // launch
          const q=(p-0.30)/0.34;
          hop=Math.sin(q*Math.PI*0.92)*60; cx+=dir*(4+q*22);
          rx*=0.94; ry*=1.09; rot=dir*0.62*q;
        } else if(p<0.80){               // dive, tipping face-down
          const q=(p-0.64)/0.16;
          hop=(1-q)*34; cx+=dir*(26+q*10);
          rx*=1+0.30*q; ry*=1-0.34*q; rot=dir*(0.62+0.55*q);
        } else {                         // SPLAT, then peel off the ground
          const q=(p-0.80)/0.20, e=1-q;
          cx+=dir*(36-q*10); rx*=1+0.62*e; ry*=1-0.50*e; rot=dir*0.22*e;
        }
        cy = GY - ry*0.98 - hop;
      } else {
        // jab: pull back then snap forward
        let e, sq;
        if(p<0.45){ e = -(p/0.45)*0.9; sq=-0.10*(p/0.45); }
        else { const q=(p-0.45)/0.55; e = Math.sin(q*Math.PI)*2.6; sq=0.20*Math.sin(q*Math.PI); }
        cx += e*10*dir; rx *= 1+sq*0.9; ry *= 1-sq*0.55; cy = GY-ry*0.98;
      }
    }
  }
  if(!u.air && !(u.sw>0)){
    u.running = 0;
    u.balloonA = (u.balloonA||0)*0.80;
    u.puff=(u.puff||0)*0.8; u.blow=(u.blow||0)*0.7;
    u.bite = (u.bite||0)*0.7;
    u.armA=(u.armA||0)*0.82; u.armSweep=0;
    u.golemA=(u.golemA||0)*0.80; u.golemSweep=0;
    u.swordA = (u.swordA===undefined? -0.55 : u.swordA + (-0.55-u.swordA)*0.18);
    u.swordSweep = 0;
  }
  // gooPath/moltenPath flatten the belly, so the drawn bottom sits ~0.28*ry above cy+ry —
  // without this the blobs hover over their own shadow instead of standing on the ground
  if(!d.humanoid && !d.golem && (!d.cloud || u.air || u.dead)) cy += ry*0.28;
  if(d.baby && u.evo && !u.dead) cy -= ry*1.05 + Math.sin(T*1.8+u.seed)*3;   // the balloons hold it up
  if(d.jump && u.evo && !u.dead) cy -= ry*0.62;                              // the pogo spring holds it up
  if(d.aero && !u.dead) cy -= ry*0.62 + Math.sin(T*3+u.seed)*4;           // it never touches the ground
  if(d.devil && !u.dead) cy -= ry*0.62 + Math.sin(T*1.5+u.seed)*5;           // the devil never stands on anything
  if(d.angel && !u.dead) cy -= ry*0.50 + Math.sin(T*1.8+u.seed)*4;           // he rides the cloud instead
  if(d.phoenix && !u.dead){                                                   // never lands; climbs to strike
    let lift = ry*1.25 + Math.sin(T*2.2+u.seed)*7;
    if(u.sw>0){ const pp=1-u.sw/u.swT, ss=x=>x*x*(3-2*x);
      lift += 120 * (pp<0.14 ? ss(pp/0.14) : pp>0.95 ? 1-ss((pp-0.95)/0.05) : 1); }
    cy -= lift;
  }
  if(u.rise>0) cy += ry*2.3*u.rise*u.rise;             // climbing up out of the dirt
  X.save(); X.globalAlpha=a*(u.undead? 0.92 : 1);
  if(u.rise>0){ X.beginPath(); X.rect(-1e4, -1e4, 3e4, GY+6+1e4); X.clip(); }
  if(u.undead && !u.dead){                             // a reaped thing: a shadow of what it was
    X.save(); X.globalAlpha=0.55+0.1*Math.sin(T*3+u.seed);
    const ug=X.createRadialGradient(cx,cy,rx*0.3,cx,cy,rx*1.8);
    ug.addColorStop(0,'rgba(24,10,40,.75)'); ug.addColorStop(0.6,'rgba(40,16,70,.35)'); ug.addColorStop(1,'rgba(20,0,40,0)');
    X.fillStyle=ug; X.beginPath(); X.ellipse(cx,cy+ry*0.1,rx*1.8,ry*1.6,0,0,7); X.fill(); X.restore();
  }
  let shadeMain = null;                                  // swap onto the buffer for the body and its props
  if(u.undead && !u.dead){
    const m = X.getTransform(), sc2 = m.a, px = Math.ceil(SHADE_BOX*2*sc2);
    if(SHADE_CV.width !== px){ SHADE_CV.width = px; SHADE_CV.height = px; }
    SHADE.setTransform(1,0,0,1,0,0); SHADE.globalCompositeOperation='source-over'; SHADE.globalAlpha=1;
    SHADE.clearRect(0,0,px,px);
    const ox = cx - SHADE_BOX, oy = cy - SHADE_BOX;
    SHADE.setTransform(sc2,0,0,sc2, -ox*sc2, -oy*sc2);
    shadeMain = {main:X, ox, oy};
    X = SHADE;
  }
  if(rot){ X.translate(cx,cy); X.rotate(rot); X.translate(-cx,-cy); }
  if(d.humanoid) drawBrute(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.cloud) drawBlower(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.golem) drawGolem(u,cx,cy,rx,ry,dir,u.flash);   // before d.molten — the golem is its own build
  else if(d.molten) drawMagma(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.bite) drawDino(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.baby && u.evo) drawBalloon(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.mage) drawMage(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.devil) drawDevil(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.phoenix) drawPhoenix(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.angel) drawAngel(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.mib) drawMIB(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.worker) drawWorker(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.barrier) drawBarrier(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.storm) drawFierce(u,cx,cy,rx,ry,dir,u.flash);
  else if(d.tackle) drawQB(u,cx,cy,rx,ry,dir,u.flash);       // before d.jump — the quarterback charges too

  if(d.sword && !u.dead)

  if(d.knife && !u.dead)

  if(shadeMain){                                         // tint only what was drawn, then stamp it back
    SHADE.save(); SHADE.setTransform(1,0,0,1,0,0);

  }
  if(u.undead && !u.dead){

    for(let i=0;i<6;i++){
      const ph=((T*0.55 + i*0.167 + (u.seed||0)*0.13)%1);
      const wx = cx + Math.sin(i*2.1+(u.seed||0)+ph*3)*rx*0.55, wy = cy - ry*0.3 - ph*ry*1.6;
      X.globalAlpha = 0.55*(1-ph);

      X.beginPath(); X.arc(wx, wy, rx*(0.16+0.18*ph), 0, 7); X.fill();
    }
    X.globalCompositeOperation='lighter';                // two cold violet eyes where its eyes were
    // the sludge's eyes ride up with its head
    const sop = d.sludge ? sludgeOpen(u) : 0, shy = d.sludge ? (cy + ry*0.02) - ry*0.34 - sop*ry*2.1 - ry*0.22 : 0;
    for(const sgn of [-1,1]){
      const ex = d.sludge ? cx + dir*rx*0.24 + sgn*rx*0.25 : cx + dir*rx*0.10 + sgn*rx*0.26,
            eyy = d.sludge ? shy : cy - ry*0.16;
      const eg=X.createRadialGradient(ex,eyy,0.5,ex,eyy,rx*0.14);
      eg.addColorStop(0,'rgba(230,200,255,1)'); eg.addColorStop(0.45,'rgba(170,110,255,.8)'); eg.addColorStop(1,'rgba(120,60,255,0)');
      X.globalAlpha=0.9; X.fillStyle=eg; X.beginPath(); X.arc(ex,eyy,rx*0.14,0,7); X.fill();
    }
    X.restore();
  }
  if(d.hpbar && !u.dead && !u.dying)

  if(!u.dead && !u.dying && !u.rise && u.team<0 && d.traits){               // what it is, at a glance
    const tr=d.traits, iy = cy - ry*(d.lord? 2.75 : d.phoenix||d.devil? 1.6 : 1.30) - 8;
    tr.forEach((t,i)=> traitIcon(t, cx + (i-(tr.length-1)/2)*15, iy, 6));
  }
  if(u.freezeT>0 && !u.dead){                            // frozen: an ice shell over it
    X.save(); X.globalAlpha=0.55; X.fillStyle='#bfeaff';
    X.beginPath(); X.ellipse(cx, cy, rx*1.08, ry*1.05, 0, 0, 7); X.fill();
    X.globalAlpha=0.9; X.strokeStyle='#ffffff'; X.lineWidth=Math.max(1.5, rx*0.05);
    for(let i=0;i<5;i++){ const a=i*1.26+0.3, r1=rx*0.3, r2=rx*0.95;
      X.beginPath(); X.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1*0.9); X.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2*0.9); X.stroke(); }
    X.restore();
  }
  if(u.poisonT>0 && !u.dead){                            // poisoned: green bubbles fizzing off it
    X.save(); X.globalAlpha=0.22; X.fillStyle='#7bdc3a';
    X.beginPath(); X.ellipse(cx, cy, rx*1.0, ry*0.98, 0, 0, 7); X.fill();
    for(let i=0;i<5;i++){ const ph2=((T*0.9+i*0.21+u.seed)%1), bx=cx+(i-2)*rx*0.34+Math.sin(T*3+i)*rx*0.06;
      X.globalAlpha=0.85*(1-ph2); X.fillStyle= i%2? '#b6ff6a' : '#6bd23a';
      X.beginPath(); X.arc(bx, cy-ry*(0.2+ph2*1.1), rx*(0.07+0.05*(1-ph2)), 0, 7); X.fill(); }
    X.restore();
  }
  if(u.slowT>0 && !u.dead){                              // slowed: sludge dripping off it
    X.save(); X.globalAlpha=0.55; X.fillStyle='#6a4bb0';
    for(let i=0;i<4;i++){ const dx=(i-1.5)*rx*0.45, ph2=((T*0.8+i*0.27)%1);
      X.beginPath(); X.ellipse(cx+dx, cy+ry*(0.3+ph2*0.7), rx*0.08, ry*0.14*(1-ph2*0.5), 0, 0, 7); X.fill(); }
    X.globalAlpha=0.25; X.beginPath(); X.ellipse(cx, cy, rx*1.02, ry*1.0, 0, 0, 7); X.fill();
    X.restore();
  }
  X.restore();
}

function drawShot(s){
  const C = cannonTone().beam;                      // blue, violet once reinforced, red once finalized
  const mx=MUZ.x, my=MUZ.y, gx=Math.min(FIELD+40,s.x), gy=GY-4;
  const ang=Math.atan2(gy-my, gx-mx);
  const len=Math.hypot(gx-mx, gy-my);
  const flick=0.86+Math.sin(T*70)*0.14;
  X.save();
  X.globalCompositeOperation=C.blend||'lighter';
  // fading wall the sweep leaves behind
  for(const tr of s.trail){
    if(tr.a<=0) continue;
    X.globalAlpha=tr.a*0.17;
    const tg=X.createLinearGradient(0,GY-210,0,GY);
    tg.addColorStop(0, C.dim); tg.addColorStop(1, C.trail);
    X.fillStyle=tg; X.fillRect(tr.x-5, GY-210, 10, 208);
  }
  X.globalAlpha=1;
  // the beam itself, muzzle -> ground contact
  X.translate(mx,my); X.rotate(ang);
  const wide=X.createLinearGradient(0,-46,0,46);
  wide.addColorStop(0, C.dim); wide.addColorStop(0.5, C.mid+(0.42*flick)+')');
  wide.addColorStop(1, C.dim);
  X.fillStyle=wide; X.beginPath(); X.moveTo(0,-13); X.lineTo(len,-40); X.lineTo(len,40); X.lineTo(0,13); X.closePath(); X.fill();
  const core=X.createLinearGradient(0,-14,0,14);
  core.addColorStop(0, C.pale+'0)'); core.addColorStop(0.45, C.core+flick+')');
  core.addColorStop(0.55, C.core+flick+')'); core.addColorStop(1, C.pale+'0)');
  X.fillStyle=core; X.beginPath(); X.moveTo(0,-5); X.lineTo(len,-15); X.lineTo(len,15); X.lineTo(0,5); X.closePath(); X.fill();
  // crackle along the beam
  X.strokeStyle=C.core+'.75)'; X.lineWidth=2;
  X.beginPath();
  for(let i=0;i<=10;i++){ const p=i/10; const yy=Math.sin(T*40+i*2.2)*(6+p*10);
    i? X.lineTo(p*len, yy) : X.moveTo(0, yy); }
  X.stroke();
  X.restore();
  // ground contact flare
  X.save(); X.globalCompositeOperation=C.blend||'lighter';
  const mg=X.createRadialGradient(mx,my,2,mx,my,70);
  mg.addColorStop(0, C.core+'.85)'); mg.addColorStop(0.4, C.soft);
  mg.addColorStop(1, C.edge);
  X.fillStyle=mg; X.beginPath(); X.arc(mx,my,70,0,7); X.fill();
  const fg=X.createRadialGradient(gx,gy,2,gx,gy,90);
  fg.addColorStop(0, C.core+'.82)'); fg.addColorStop(0.35, C.soft);
  fg.addColorStop(1, C.edge);
  const fsz=1+Math.min(0.5, s.vx/2600);
  X.fillStyle=fg; X.beginPath(); X.ellipse(gx,gy,84*fsz,58*fsz,0,0,7); X.fill();
  X.fillStyle=C.core+'.9)'; X.beginPath(); X.ellipse(gx,gy,16+Math.sin(T*40)*3,9,0,0,7); X.fill();
  // scorch column
  const cg2=X.createLinearGradient(0,GY-230,0,GY);
  cg2.addColorStop(0, C.dim); cg2.addColorStop(1, C.wash);
  X.fillStyle=cg2; X.fillRect(gx-16, GY-230, 32, 228);
  X.restore();
  // speed read-out streaks
  X.save(); X.globalAlpha=0.5; X.strokeStyle='#ffffff'; X.lineWidth=3; X.lineCap='round';
  const st=Math.min(220, s.vx*0.12);
  for(let i=0;i<4;i++){ const yy=GY-40-i*46;
    X.beginPath(); X.moveTo(gx-st-i*14, yy); X.lineTo(gx-14-i*8, yy); X.stroke(); }
  X.restore();
}

function drawFX(){
  if(B.waves && B.waves.length) drawWaves();
  for(const tr of (B.tracers||[])){                  // revolver shots: a bright streak, gone in a blink
    const a = 1 - tr.t/0.14;
    X.save(); X.globalAlpha=a; X.lineCap='round';
    X.strokeStyle = tr.gold? '#ffd23a' : '#fff1b0'; X.lineWidth=3;
    X.beginPath(); X.moveTo(tr.x0, tr.y0); X.lineTo(tr.x1, tr.y1); X.stroke();
    X.fillStyle='#fff6d0'; X.beginPath(); X.arc(tr.x0, tr.y0, 7*a+2, 0, 7); X.fill();
    X.restore();
  }
  for(const sc of (B.spores||[])){
    const a = Math.min(1, sc.t/0.3) * Math.min(1, (sc.life-sc.t)/0.8);
    X.save();
    for(let i=0;i<7;i++){
      const ang = i*0.9 + sc.seed, dr = sc.r*(0.35+0.25*Math.sin(sc.t*0.8+i));
      const px = sc.x + Math.cos(ang)*dr, py = GY - 34 - Math.abs(Math.sin(ang))*26 + Math.sin(sc.t*1.3+i)*5;
      X.globalAlpha = 0.20*a; X.fillStyle = i%2? '#cbbd7a' : '#a8b86a';
      X.beginPath(); X.arc(px, py, sc.r*(0.42+0.08*(i%3)), 0, 7); X.fill();
    }
    X.globalAlpha = 0.75*a; X.fillStyle='#f3e8b0';                    // drifting specks
    for(let i=0;i<14;i++){ const ph=((sc.t*0.35 + i*0.071 + sc.seed)%1);
      X.beginPath(); X.arc(sc.x + Math.sin(i*2.7+sc.seed)*sc.r*0.9, GY - 8 - ph*90, 1.6+ (i%3), 0, 7); X.fill(); }
    X.restore();
  }
  for(const st of B.strikes){
    if(!st.fired){                              // the ground lights up shortly before it lands
      const LEAD = 0.45;                        // a beat after he rears back, not the instant he does
      if(st.t > LEAD) continue;
      const q = Math.max(0, Math.min(1, 1 - st.t/LEAD));
      X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.16+0.30*q*q;
      X.fillStyle='#9fb0ff';
      X.beginPath(); X.ellipse(st.x, GY+2, st.aoe*0.9, st.aoe*0.22, 0, 0, 7); X.fill();
      X.globalAlpha=0.30+0.40*q; X.strokeStyle='#dfe6ff'; X.lineWidth=2.5;
      X.beginPath(); X.ellipse(st.x, GY+2, st.aoe*0.9*(1-0.25*q), st.aoe*0.22*(1-0.25*q), 0, 0, 7); X.stroke();
      X.restore();
      continue;
    }
    const a = Math.max(0, st.flash/0.30);       // the bolt itself
    X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=a;
    const seedx = st.x*0.37;
    for(const [wd, col] of [[13,'rgba(150,175,255,.55)'], [6,'rgba(220,230,255,.9)'], [2.5,'#ffffff']]){
      X.strokeStyle=col; X.lineWidth=wd; X.lineCap='round'; X.lineJoin='round';
      X.beginPath(); X.moveTo(st.x, -20);
      let bx=st.x;
      for(let yy=-20; yy<GY; yy+=44){
        bx += Math.sin(yy*0.11 + seedx) * 20 + (Math.random()-0.5)*8;
        X.lineTo(bx, yy+44);
      }
      X.lineTo(st.x, GY);
      X.stroke();
    }
    X.globalAlpha=a*0.5; X.fillStyle='#dfe6ff';
    X.beginPath(); X.ellipse(st.x, GY, st.aoe*1.1, st.aoe*0.30, 0, 0, 7); X.fill();
    X.restore();
  }
  for(const w of B.shock){                    // a bowed wall of dust tearing down the lane
    const q = w.t/w.life, x = w.x0 + w.dir*w.speed*w.t, h = 190*(1-q*0.30);
    X.save(); X.globalAlpha = Math.max(0, 1-q)*0.85;
    const g=X.createLinearGradient(x - w.dir*90, 0, x + w.dir*30, 0);
    g.addColorStop(0, 'rgba(210,210,215,0)');
    g.addColorStop(0.55, w.col2);
    g.addColorStop(1, '#d8d8dd');
    X.fillStyle=g;
    X.beginPath();
    X.moveTo(x + w.dir*16, GY+8);
    X.quadraticCurveTo(x + w.dir*40, GY-h*0.55, x + w.dir*2, GY-h);
    X.lineTo(x - w.dir*80, GY-h*0.86);
    X.quadraticCurveTo(x - w.dir*52, GY-h*0.34, x - w.dir*108, GY+8);
    X.closePath(); X.fill();
    X.globalAlpha = Math.max(0, 1-q);
    X.strokeStyle='#dedee2'; X.lineWidth=5; X.lineCap='round';
    X.beginPath(); X.moveTo(x + w.dir*14, GY+6);
    X.quadraticCurveTo(x + w.dir*38, GY-h*0.55, x + w.dir*2, GY-h*0.98); X.stroke();
    X.globalAlpha = Math.max(0, 1-q)*0.55;    // dust skirt along the ground
    X.fillStyle=w.col;
    X.beginPath(); X.ellipse(x - w.dir*40, GY+2, 90, 16, 0, 0, 7); X.fill();
    X.restore();
  }
  for(const sp of B.spits){                  // brine arcing toward its mark
    if(sp.t<0) continue;
    const q=Math.min(1, sp.t/sp.dur);
    const x=sp.x0+(sp.x1-sp.x0)*q, y=sp.y0+(sp.y1-sp.y0)*q - Math.sin(q*Math.PI)*70;
    X.save();
    X.globalAlpha=0.35; X.fillStyle=sp.col;
    for(let i=1;i<=3;i++){ const qq=Math.max(0,q-i*0.07);
      const tx=sp.x0+(sp.x1-sp.x0)*qq, ty=sp.y0+(sp.y1-sp.y0)*qq - Math.sin(qq*Math.PI)*70;
      X.beginPath(); X.arc(tx, ty, 7-i*1.6, 0, 7); X.fill(); }
    X.globalAlpha=1; X.fillStyle=sp.col;
    X.beginPath(); X.ellipse(x, y, 9, 7.5, q*3, 0, 7); X.fill();
    X.fillStyle='rgba(255,255,255,.55)';
    X.beginPath(); X.ellipse(x-3, y-3, 3, 2.2, -0.5, 0, 7); X.fill();
    X.restore();
  }
  for(const c of B.coins) drawCoin(c);       // boomerangs on their way out and back
  for(const th of B.throws){                 // barricades arcing through the air
    const q=Math.min(1, th.t/th.dur);
    const x=th.x0+(th.x1-th.x0)*q;
    const y=th.y0 - Math.sin(q*Math.PI)*(120+Math.abs(th.x1-th.x0)*0.10) + q*q*18;
    X.save(); X.translate(x, y); X.rotate(th.rot*(th.x1<th.x0?-1:1)); X.scale(0.5,0.5);
    barrierProp(0, 0, 40, 34);
    X.restore();
  }
  for(const p of B.parts){
    const k=1-p.t/p.life;
    X.globalAlpha=Math.max(0,k);
    X.fillStyle=p.col;
    X.beginPath(); X.ellipse(p.x,p.y,p.r*(0.5+k*0.9), p.r*(0.5+k*0.9)*0.85, 0,0,7); X.fill();
  }
  X.globalAlpha=1;
  for(const r of B.rings){
    const k=r.t/r.life, rad=r.r0+(r.r1-r.r0)*k;
    X.globalAlpha=1-k; X.strokeStyle=r.col; X.lineWidth=r.lw*(1-k)+1;
    X.beginPath(); X.ellipse(r.x,r.y,rad,rad*0.82,0,0,7); X.stroke();
  }
  X.globalAlpha=1;
  X.globalAlpha=1; X.textAlign='left';
}

/* ---- UI ---- */
let buttons=[], mouse={x:-99,y:-99,down:false};
function btn(x,y,w,h,label,fn,o){
  o=o||{};
  const hov = mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  const dis = !!o.disabled;
  buttons.push({x,y,w,h,fn,dis});
  const lift = hov&&!dis? 3:0;
  X.save();
  X.fillStyle='rgba(4,14,24,.55)'; rr(x+3, y+6-lift, w, h, o.r||14); X.fill();
  const g=X.createLinearGradient(0,y-lift,0,y+h-lift);
  const c1=o.c1||'#3fb0f5', c2=o.c2||'#1a5c9e';
  if(dis){ g.addColorStop(0,'#44586b'); g.addColorStop(1,'#26333f'); }
  else { g.addColorStop(0, hov? shade(c1,22):c1); g.addColorStop(1, hov? shade(c2,18):c2); }
  X.fillStyle=g; rr(x,y-lift,w,h,o.r||14); X.fill();
  X.strokeStyle=dis?'#1b242c':shade(c2,-26); X.lineWidth=3; X.stroke();
  X.fillStyle='rgba(255,255,255,'+(dis?0.06:0.24)+')'; rr(x+6,y+5-lift,w-12,h*0.34,8); X.fill();
  X.fillStyle=dis?'#8c9aa6':'#ffffff';
  X.font='800 '+(o.fs||22)+'px ui-rounded, Trebuchet MS, sans-serif';
  X.textAlign='center'; X.textBaseline='middle';
  X.fillText(label, x+w/2, y+h/2-lift+1);
  X.textAlign='left'; X.textBaseline='alphabetic';
  X.restore();
  return hov;
}

  X.fillText('BLOB JUICE', 16, BAR_Y+22);
  X.fillStyle='#0a1d2b'; rr(14, BAR_Y+28, 178, 24, 12); X.fill();

  X.fillStyle=jg; rr(16, BAR_Y+30, Math.max(4,174*jp), 20, 10); X.fill();
  X.font='800 16px ui-rounded, Trebuchet MS, sans-serif'; X.textAlign='center';

  X.textAlign='left';
  X.fillStyle='#6f9cb8'; X.font='700 12px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText('+'+(Math.round(B.inc*10)/10)+' / sec', 16, BAR_Y+70);

  // ---- WEALTHY BLOB: in-battle economy upgrade ----
  (function(){
    const x=198, y=BAR_Y+12, w=96, h=82;

    const afford = !maxed && B.juice>=cost && !B.over;
    const hov = mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
    buttons.push({x,y,w,h,fn:buyWealth,dis:false});
    X.save();
    X.fillStyle='rgba(4,14,24,.5)'; rr(x+3,y+4,w,h,12); X.fill();
    const cg=X.createLinearGradient(0,y,0,y+h);
    cg.addColorStop(0, afford? (hov?'#7ef3c0':'#54d9a0') : '#3a4c5c');
    cg.addColorStop(1, afford? '#12694c' : '#222e39');
    X.fillStyle=cg; rr(x,y-(hov&&afford?2:0),w,h,12); X.fill();
    X.strokeStyle= afford? '#0d5138':'#18222b'; X.lineWidth=3; X.stroke();
    X.textAlign='center';
    X.fillStyle= afford? '#ffffff':'#8c9aa6'; X.font='800 11px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText('WEALTHY', x+w/2, y+18); X.fillText('BLOB', x+w/2, y+31);
    // level pips
    for(let i=0;i<WEALTH_COST.length;i++){
      X.fillStyle = i<B.wealth? '#ffd86a' : 'rgba(255,255,255,.18)';
      rr(x+11+i*15, y+38, 11, 6, 3); X.fill();
    }
    X.fillStyle= afford? '#ffffff' : '#8c9aa6'; X.font='800 15px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(maxed? 'MAX' : '¤'+cost, x+w/2, y+62);
    X.fillStyle='rgba(255,255,255,.65)'; X.font='700 10px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(maxed? 'flow maxed' : '+flow +cap', x+w/2, y+75);
    X.textAlign='left'; X.restore();
  })();

  // ---- unit cards ----
  const list=teamUnits(), n=list.length;
  // cards shrink to fit between the wealth button and the cannon once a 5th unit joins
  const gapC=n>=8?4:6, w=Math.min(120, Math.floor((800-302-(n-1)*gapC)/n)), compact=n>=4, tiny=n>=8;   // 4+: name under the portrait. 8+: no room for names
  list.forEach((k,i)=>{
    const d=U[k], h=82, x=302+i*(w+gapC), y=BAR_Y+12;
    if(i===0) TUT_AT.card = {x, y, w, h};
    const spent = !!(d.once && B.used[k]);
    const cdp = B.cd[k]/ucd(k), afford = B.juice>=d.cost && B.cd[k]<=0 && !B.over && !spent;
    const hov = mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
    buttons.push({x,y,w,h,fn:()=>tryDeploy(k),dis:false});
    X.save();
    X.fillStyle='rgba(4,14,24,.5)'; rr(x+3,y+4,w,h,12); X.fill();
    const cg=X.createLinearGradient(0,y,0,y+h);
    cg.addColorStop(0, afford? shade(d.c[1], hov?24:6) : '#3a4c5c'); cg.addColorStop(1, afford? d.c[2] : '#222e39');
    X.fillStyle=cg; rr(x,y-(hov&&afford?2:0),w,h,12); X.fill();
    X.strokeStyle=afford? shade(d.c[2],-24):'#18222b'; X.lineWidth=3; X.stroke();
    const lift=(hov&&afford?2:0), nm=uname(k);
    const pr = Math.min(1, d.r/26);            // a tiny unit gets a tiny portrait
    if(tiny){
      // a full squad of ten: portrait and price only
      X.save(); rr(x,y-lift,w,h,12); X.clip();
      X.globalAlpha=afford?1:0.55;
      stillMini(k, x+w/2, y+34-lift, 13*pr, 1, i*3+1);
      X.restore();
      X.textAlign='center';
      X.fillStyle='#d8f6ff'; X.font='800 12px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('\u00a4'+d.cost, x+w/2, y+72);
      X.textAlign='left';
    } else if(compact){
      // portrait on top, name and cost stacked under it
      X.save(); rr(x,y-lift,w,h,12); X.clip();
      X.globalAlpha=afford?1:0.55;
      stillMini(k, x+w/2-6, y+26-lift, 15*pr, 1, i*3+1);
      X.restore();
      X.textAlign='center';
      let fs=11; X.font='800 11px ui-rounded, Trebuchet MS, sans-serif';
      while(fs>7 && X.measureText(nm).width > w-10){ fs--; X.font='800 '+fs+'px ui-rounded, Trebuchet MS, sans-serif'; }
      X.fillStyle='#ffffff'; X.fillText(nm, x+w/2, y+56);
      X.fillStyle='#d8f6ff'; X.font='800 14px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('\u00a4'+d.cost, x+w/2, y+74);
      X.textAlign='left';
    } else {
      X.save(); rr(x,y-lift,w,h,12); X.clip();
      X.globalAlpha=afford?1:0.55;
      stillMini(k, x+30, y+46-lift, 22*pr, 1, i*3+1);
      X.restore();
      const tx = x+56;
      let fs=13; X.font='800 13px ui-rounded, Trebuchet MS, sans-serif';

      X.fillStyle='#ffffff'; X.fillText(nm, tx, y+24);
      X.fillStyle='#d8f6ff'; X.font='800 16px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText('\u00a4'+d.cost, tx, y+48);
      X.fillStyle='rgba(255,255,255,.72)'; X.font='700 10px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText(d.bolts? d.bolts.n+' BOLTS' : d.coin? 'OUT + BACK' : d.aoe?'AREA':'SINGLE', tx, y+66);
    }
    const bdg = tiny? 8 : 9;
    X.fillStyle='rgba(6,20,30,.55)'; X.beginPath(); X.arc(x+w-bdg-4, y+bdg+4, bdg, 0, 7); X.fill();
    X.fillStyle='rgba(255,255,255,.85)'; X.font='800 '+(tiny?9:11)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.textAlign='center'; X.fillText(String((i+1)%10), x+w-bdg-4, y+bdg+8); X.textAlign='left';
    if(spent){
      X.fillStyle='rgba(6,16,26,.80)'; rr(x,y,w,h,12); X.fill();
      X.fillStyle='#9fd8ff'; X.font='800 '+(tiny?12:15)+'px ui-rounded, Trebuchet MS, sans-serif'; X.textAlign='center';
      X.fillText('SPENT', x+w/2, y+h/2+5); X.textAlign='left';

      X.fillStyle='#4fd1ff'; rr(x+6, y+h-14, (w-12)*(1-cdp), 8, 4); X.fill();

  // ---- cannon ----
  const C=B.cannon, cx=808, cy=BAR_Y+12, cw=180, ch=82;

  X.fillStyle=bg; rr(cx,cy-(hov&&ready?2:0),cw,ch,14); X.fill();

  const pg=X.createLinearGradient(cx,0,cx+cw,0); pg.addColorStop(0,'#7ef3ff'); pg.addColorStop(1,'#3f9bff');
  X.fillStyle=pg; rr(cx+16, cy+44, Math.max(3,(cw-32)*(C.ch/100)), 16, 8); X.fill();
  X.fillStyle= ready? '#ffffff':'#bcd9ec'; X.font='800 12px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText(ready? 'READY — SPACE' : 'CHARGING '+Math.floor(C.ch)+'%', cx+cw/2, cy+76);
  X.textAlign='left'; X.restore();
}

// the deploy cards hold still: their portraits are drawn with the clock stopped
function stillMini(k, cx, cy, r, dir, seed){ const t0=T; T=0; try { drawMini(k, cx, cy, r, dir, seed); } finally { T=t0; } }
// small portrait renderer used by cards/menus (independent of GY)
function drawMini(k, cx, cy, r, dir, seed){
  const d=U[k], c=ucol(k), rw=r*(d.wide||1);
  if(d.elderCane){ drawElder({k, seed:seed||1, sw:0, swT:1, blink:0, ph:0, mini:1, evo:evoOn(k)}, cx, cy, r*0.95*(d.wide||1), r*0.97, dir, 0); return; }
  if(d.aero){ drawAero({k, seed:seed||1, sw:0, swT:1, blink:0, ph:0, mini:1, evo:evoOn(k)}, cx - dir*r*0.05, cy - r*0.10, r*1.0*(d.wide||1), r*1.0, dir, 0); return; }
  if(d.reap){ drawReaper({k, seed:seed||1, sw:0, swT:1, blink:0, ph:0, mini:1, evo:evoOn(k)}, cx, cy, r*0.95*(d.wide||1), r*0.97, dir, 0); return; }
  if(d.bite){
    drawDino({seed:seed||1, evo:evoOn(k), bite:0.25, blink:0}, cx, cy+r*0.15, r*0.82, r*0.8, dir, 0);
    return;
  }
  if(d.cloud){ drawBlower({seed:seed||1, puff:0, blow:0}, cx, cy, r*0.92, r*0.8, dir, 0); return; }
  if(d.angel){ drawAngel({seed:seed||1, sw:0, blink:0, armA:-0.5}, cx, cy, r*0.86, r*0.84, dir, 0); return; }
  if(d.molten){ drawMagma({seed:seed||1, sw:0, mini:1}, cx, cy, r*0.92, r*0.94, dir, 0); return; }
  if(d.storm){ drawFierce({seed:seed||1, sw:0, blink:0, mini:1, evo:evoOn(k)}, cx, cy, r*0.90, r*0.86, dir, 0); return; }
  {                                                // the rest of the named enemies, drawn properly
    const SPECIAL = [[ 'phoenix', drawPhoenix, 0.62, 0.62],
                     [ 'golem', drawGolem, 0.92, 0.94],
                     [ 'jaw',   drawScrapjaw, 0.92, 0.90],
                     [ 'oak',   drawOak,   0.86, 0.86],
                     [ 'sludge',drawSludge,0.80, 0.80],
                     [ 'toad',  drawToad,  0.78, 0.80],
                     [ 'lord',  drawLord,  0.62, 0.62],
                     [ 'shroom',drawShroom,0.92, 0.92],
                     [ 'spear', drawFrog,  0.92, 0.92],
                     [ 'goop',  drawGoop,  0.92, 0.92],
                     [ 'mib',   drawMIB,   0.86, 0.90],
                     [ 'devil', drawDevil, 0.80, 0.80],
                     [ 'worker',drawWorker,0.92, 0.92],
                     [ 'barrier',drawBarrier,0.95,0.95],
                     [ 'knife', drawAssassin, 0.88, 0.90]];
    for(const [flag, fn, fx, fy] of SPECIAL){
      if(!d[flag]) continue;
      const u2={k, seed:seed||1, sw:0, swT:1, blink:0, ph:0, mini:1, armA:0, golemA:0, hold:1, lockX:null};
      X.save();                                  // anything anchored to the battlefield ground gets cut
      X.beginPath(); X.rect(cx-r*2.2, cy-r*2.8, r*4.4, r*4.0); X.clip();
      fn(u2, cx, cy, r*fx*(d.wide||1), r*fy, dir, 0);
      if(flag==='knife') drawKnife(cx + dir*r*0.62, cy - r*0.04, r*3.0, dir, -0.55, 0);
      X.restore();
      return;
    }
  }
  if(d.humanoid){
    X.save(); X.translate(cx, cy); const s2=r/d.r*1.25; X.scale(dir*s2, s2);
    bruteBody({seed:seed||1, arm:0, blink:false}); X.restore(); return;
  }
  if(d.tackle){
    X.save(); X.translate(cx, cy+r*0.10); const s3=r/d.r*1.15; X.scale(dir*s3, s3);
    qbBody({seed:seed||1, blink:false, run:false, sw:0}); X.restore(); return;
  }
  const fake={k, seed:seed||1, sw:0, blink:0, ph:0};
  X.save();
  if(k==='rabbit' || k==='mage'){                  // ears / hat need to sit behind the body
    if(k==='rabbit'){
      for(const sgn of [-1,1]){
        X.save(); X.translate(cx+sgn*r*0.30, cy-r*0.66); X.rotate(sgn*0.20);
        X.fillStyle=c[1]; X.strokeStyle=c[2]; X.lineWidth=Math.max(1.5, r*0.08);
        rr(-r*0.17, -r*1.30, r*0.34, r*1.42, r*0.17); X.fill(); X.stroke();
        X.fillStyle='#ffd3de'; rr(-r*0.08, -r*1.16, r*0.16, r*1.02, r*0.08); X.fill();
        X.restore();
      }
    } else if(!evoOn(k)) topHat(cx - dir*r*0.04, cy - r*0.92, r*0.78);
  }
  if(k==='baby' && evoOn(k)){                      // balloons ride above the portrait
    for(let i=0;i<5;i++){
      const sp=(i-2)*0.40, col=BALLOON_COLS[i];
      const bx=cx+sp*r*0.80, by=cy-r*1.75-(1-Math.abs(sp)*0.4)*r*0.22;
      X.strokeStyle='rgba(70,60,72,.5)'; X.lineWidth=Math.max(1,r*0.05);
      X.beginPath(); X.moveTo(cx, cy-r*0.55); X.lineTo(bx, by+r*0.42); X.stroke();
      X.fillStyle=col; X.beginPath(); X.ellipse(bx, by, r*0.34, r*0.42, sp*0.2, 0, 7); X.fill();
      X.lineWidth=Math.max(1,r*0.05); X.strokeStyle=shade(col,-60); X.stroke();
      X.fillStyle='rgba(255,255,255,.55)';
      X.beginPath(); X.ellipse(bx-r*0.11, by-r*0.16, r*0.08, r*0.11, -0.4, 0, 7); X.fill();
    }
  }
  if(d.team>0 && !d.shadowOf){
    gooPath(cx,cy,rw,r*1.02,0.022,3,T,seed,true);
    const g=X.createRadialGradient(cx-r*0.35,cy-r*0.45,r*0.12,cx,cy,rw*1.25);
    g.addColorStop(0,c[0]); g.addColorStop(0.5,c[1]); g.addColorStop(1,shade(c[1],-11));
    X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2,r*0.1); X.strokeStyle=c[2]; X.stroke();
    X.fillStyle='rgba(255,255,255,.52)'; X.beginPath(); X.ellipse(cx-r*0.4,cy-r*0.5,r*0.17,r*0.1,-0.6,0,7); X.fill();
    eyes(cx,cy-r*0.12,r,dir,'round',false,false);
    if(evoOn(k)) evoFace(k, cx, cy-r*0.12, rw, r, dir);
    if(d.sword) drawSword(cx + dir*rw*0.72, cy + r*0.10, rw*1.5, dir, -0.55, evoOn(k), 0);
    if(d.needle) drawDoctorKit(cx, cy, rw, r, dir, evoOn(k), 0);
    if(d.hitman) drawHitmanKit(cx, cy, rw, r, dir, evoOn(k), 0, seed||1);
    if(d.coin){
      if(!evoOn(k)){
        X.save(); gooPath(cx,cy,rw,r*1.02,0.022,3,T,seed,true); X.clip();
        X.fillStyle='#f4fffb'; X.fillRect(cx-rw*1.2, cy-r*0.74, rw*2.4, r*0.22);
        X.fillStyle=U.boom.c[2]; X.fillRect(cx-rw*1.2, cy-r*0.60, rw*2.4, r*0.06);
        X.restore();
      }
      boomerProp(cx + dir*rw*(evoOn(k)?1.02:0.92), cy + r*(evoOn(k)?0.40:0.26), rw*(evoOn(k)?1.30:1.00), dir, -0.45, evoOn(k));
    }
    if(k==='mage' && evoOn(k)){                    // the kit: stripes and a number 10
      X.save(); gooPath(cx,cy,rw,r*1.02,0.022,3,T,seed,true); X.clip();
      X.fillStyle='#7ec8ef';
      for(let i=-3;i<=3;i++) if(i%2===0) X.fillRect(cx+i*r*0.30 - r*0.15, cy-r*1.3, r*0.30, r*2.6);
      X.restore();
      X.save(); X.fillStyle='#24405c'; X.font='900 '+Math.round(r*0.5)+'px ui-rounded, Trebuchet MS, sans-serif';
      X.textAlign='center'; X.fillText('10', cx, cy+r*0.66); X.restore(); X.textAlign='left';
      eyes(cx, cy-r*0.12, r, dir, 'round', false, false);
    }
    if(k==='jumper'){
      X.save(); gooPath(cx,cy,rw,r*1.02,0.022,3,T,seed,true); X.clip();
      X.fillStyle= evoOn(k)? '#ffd34a' : '#ffffff';
      X.fillRect(cx-rw*1.2, cy-r*0.62, rw*2.4, r*0.20);
      X.fillStyle= evoOn(k)? '#8f2358' : c[2];
      X.fillRect(cx-rw*1.2, cy-r*0.50, rw*2.4, r*0.05);
      X.restore();
    }
    X.strokeStyle=INK; X.lineWidth=Math.max(2,r*0.085);
    X.beginPath(); X.arc(cx+dir*r*0.07, cy+r*0.2, r*0.17, 0.12*Math.PI, 0.88*Math.PI); X.stroke();
  } else {
    X.save(); X.globalAlpha=0.22; gooPath(cx,cy,r*1.09,r*1.06,0.075,5,T*1.1,seed+1,true); X.fillStyle=c[1]; X.fill(); X.restore();
    gooPath(cx,cy,r,r*1.02,0.075,5,T,seed,true);
    const g=X.createRadialGradient(cx-r*0.3,cy-r*0.4,r*0.1,cx,cy,r*1.3);
    g.addColorStop(0,c[0]); g.addColorStop(0.5,c[1]); g.addColorStop(1,shade(c[1],-11));
    X.fillStyle=g; X.fill(); X.lineWidth=Math.max(2,r*0.075); X.strokeStyle=c[2]; X.stroke();
    X.fillStyle='rgba(255,255,255,.46)'; X.beginPath(); X.ellipse(cx-r*0.36,cy-r*0.5,r*0.2,r*0.1,-0.55,0,7); X.fill();
    eyes(cx,cy-r*0.14,r,dir,'slit',false,true);
    X.strokeStyle=INK; X.lineWidth=Math.max(2,r*0.08);
    X.beginPath(); X.moveTo(cx-r*0.2,cy+r*0.26); X.quadraticCurveTo(cx,cy+r*0.14,cx+r*0.2,cy+r*0.26); X.stroke();
  }
  X.restore();
}

/* ---- LEVEL 1 TUTORIAL: a few pointers, the first time only ---- */
const TUT_AT = {card:null};
const TUT_STEPS = [
  {title:'TAP A BLOB TO DEPLOY IT', sub:'each blob costs blob juice (\u00a4)'},
  {title:'BLOB JUICE BUILDS UP OVER TIME', sub:'spend it on more blobs \u00b7 WEALTHY BLOB speeds it up', ok:1, auto:7},
  {title:'CHARGE THE CANNON', sub:'it fills up by itself \u2014 tap it when it glows', wait:1},
  {title:'KNOCK DOWN THE SLIME NEST!', sub:'break the nest on the right to win the level', ok:1, auto:6}
];
function tutNext(){
  if(!B || !B.tut) return;
  B.tut.step++; B.tut.t = 0;
  if(B.tut.step >= TUT_STEPS.length) tutDone();
  else SFX.click();
}
function tutDone(){ save.tut = 1; persist(); if(B) B.tut = null; }
function drawTut(dt){
  const tu=B.tut, st=TUT_STEPS[tu.step];
  tu.t += dt;
  if(st.auto && tu.t > st.auto){ tutNext(); return; }
  // what it points at
  let tg;
  if(tu.step===0) tg = TUT_AT.card || {x:302, y:BAR_Y+12, w:120, h:82};
  else if(tu.step===1) tg = {x:10, y:BAR_Y+8, w:186, h:70};
  else if(tu.step===2) tg = {x:808, y:BAR_Y+12, w:180, h:82};
  else tg = {x:E_BASE_X-B.camX-70, y:GY-190, w:140, h:196};
  const ready = B.cannon.ch>=100;
  let title=st.title, sub=st.sub;
  if(tu.step===2 && ready){ title='THE CANNON IS CHARGED!'; sub='tap BLOB CANNON to blast every slime in the lane'; }
  const pop = Math.min(1, tu.t/0.25), sc = 0.85 + 0.15*(1 - Math.pow(1-pop, 3));
  X.save();
  // the glowing outline round the thing to press
  const pul = 0.5 + 0.5*Math.sin(T*6);
  X.strokeStyle = 'rgba(255,227,106,'+(0.55+0.45*pul)+')'; X.lineWidth = 4 + pul*2;
  rr(tg.x-6, tg.y-6, tg.w+12, tg.h+12, 16); X.stroke();
  // the bubble: above the bar, or above the nest
  const bw=470, bh=st.ok? 116 : 94;
  const tcx = tg.x + tg.w/2;
  const bx = Math.max(14, Math.min(W-14-bw, tcx - bw/2));
  const by = tu.step===3 ? 122 : BAR_Y - bh - 44;
  X.translate(bx+bw/2, by+bh/2); X.scale(sc, sc); X.translate(-(bx+bw/2), -(by+bh/2));
  X.globalAlpha = pop;
  X.fillStyle='rgba(4,14,24,.45)'; rr(bx+4, by+6, bw, bh, 16); X.fill();
  X.fillStyle='rgba(8,26,44,.96)'; rr(bx, by, bw, bh, 16); X.fill();
  X.strokeStyle='#ffe36a'; X.lineWidth=3; X.stroke();
  // the arrow, bobbing toward the target
  const bob = Math.sin(T*6)*6, ax = Math.max(bx+30, Math.min(bx+bw-30, tcx));
  X.fillStyle='#ffe36a'; X.beginPath();

/* ---- POP-UPS: the cheat passcode and "are you sure?" before a reset ---- */
let modal = null;                                   // {kind:'cheat'|'reset', t, code, bad}
const CHEAT_CODE = 'FROG';                          // capitals or not, it doesn't matter
const codeIn = document.createElement('input');     // an invisible box so a phone brings up its keyboard
codeIn.type='text'; codeIn.autocomplete='off'; codeIn.spellcheck=false; codeIn.maxLength=12;
codeIn.setAttribute('autocapitalize','characters'); codeIn.setAttribute('autocorrect','off');
codeIn.setAttribute('aria-label','passcode'); codeIn.setAttribute('enterkeyhint','go');
codeIn.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none;';
document.body.appendChild(codeIn);
let codeFocus = false;                              // focus again on finger-up: some phones only allow it there
function focusCode(){ codeFocus = true; try{ codeIn.focus({preventScroll:true}); }catch(e){ codeIn.focus(); } }
codeIn.addEventListener('input', ()=>{
  if(!modal || modal.kind!=='cheat') return;
  modal.code = codeIn.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  codeIn.value = modal.code; modal.bad = 0;
});
codeIn.addEventListener('keydown', e=>{
  e.stopPropagation();                              // typing here never steers the game
  if(e.key==='Enter'){ e.preventDefault(); submitCode(); }
  else if(e.key==='Escape'){ e.preventDefault(); closeModal(); }
});
function openModal(kind){
  modal = {kind, t:0, code:'', bad:0, shake:0}; codeIn.value='';
  if(kind==='cheat') focusCode();
}
function closeModal(){ modal = null; codeFocus = false; codeIn.value=''; codeIn.blur(); }
function submitCode(){
  if(!modal || modal.kind!=='cheat') return;
  if(modal.code === CHEAT_CODE){ closeModal(); cheatAll(); }
  else { modal.bad = 1; modal.shake = 0.45; modal.code=''; codeIn.value=''; SFX.deny(); }
}
function modalKey(e){                               // a real keyboard, when the hidden box lost focus
  if(e.key==='Escape'){ closeModal(); return; }
  if(!modal || modal.kind!=='cheat'){ if(e.key==='Enter' && modal){ /* reset needs a tap */ } return; }
  if(e.key==='Enter'){ e.preventDefault(); submitCode(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); modal.code = modal.code.slice(0,-1); codeIn.value=modal.code; return; }
  if(e.key.length===1 && /[a-z0-9]/i.test(e.key) && modal.code.length<8){
    modal.code += e.key.toUpperCase(); codeIn.value=modal.code; modal.bad=0;
  }
}

/* ---- BASE-SCREEN CHROME: wood panels, chunky gold buttons, count badges ---- */
function woodPanel(x, y, w, h, r, dark){
  const g=X.createLinearGradient(0, y, 0, y+h);
  if(dark){ g.addColorStop(0,'#7a4a20'); g.addColorStop(0.5,'#5e3616'); g.addColorStop(1,'#46270f'); }
  else    { g.addColorStop(0,'#a9713a'); g.addColorStop(0.5,'#8a5628'); g.addColorStop(1,'#6b4019'); }
  X.fillStyle=g; rr(x,y,w,h,r); X.fill();
  X.strokeStyle='#3a1f0b'; X.lineWidth=3; X.stroke();
  X.save(); rr(x+2,y+2,w-4,h-4,Math.max(0,r-2)); X.clip();
  X.fillStyle='rgba(255,220,170,.20)'; X.fillRect(x, y+2, w, Math.min(8, h*0.22));
  X.fillStyle='rgba(40,18,4,.20)'; X.fillRect(x, y+h-6, w, 6);
  X.restore();
}
// the big slabs down the left: thick brown rim, gold face, hard shadow
function chunkyBtn(x, y, w, h, label, fn, o){
  o=o||{};
  const hov = mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  const dis = !!o.disabled;
  buttons.push({x,y,w,h,fn,dis});
  const lift = hov&&!dis? 3:0, yy=y-lift;
  X.save();
  X.fillStyle='rgba(30,14,2,.45)'; rr(x+5, yy+7, w, h, 14); X.fill();     // drop shadow
  X.fillStyle= dis? '#5b5450' : '#65340c';                                 // outer rim
  rr(x, yy, w, h, 14); X.fill();
  const g=X.createLinearGradient(0, yy, 0, yy+h);
  if(dis){ g.addColorStop(0,'#9a958f'); g.addColorStop(1,'#6e6862'); }
  else {
    const c1=o.c1||'#ffd94a', c2=o.c2||'#f0a013';
    g.addColorStop(0, hov? shade(c1,14):c1); g.addColorStop(0.55, c2); g.addColorStop(1, shade(c2,-26));
  }
  X.fillStyle=g; rr(x+5, yy+5, w-10, h-10, 10); X.fill();
  X.fillStyle='rgba(255,255,255,.42)'; rr(x+9, yy+8, w-18, (h-10)*0.34, 7); X.fill();
  X.font='900 '+(o.fs||27)+'px ui-rounded, Trebuchet MS, sans-serif';
  X.textAlign='center'; X.textBaseline='middle';
  X.lineWidth=5; X.lineJoin='round'; X.strokeStyle='#65340c';
  if(!dis) X.strokeText(label, x+w/2, yy+h/2+1);
  X.fillStyle= dis? '#cfcac5' : '#fffdf2';
  X.fillText(label, x+w/2, yy+h/2+1);
  X.textAlign='left'; X.textBaseline='alphabetic';
  X.restore();
  return hov;
}

function cheatAll(){
  const order = ['blob','chonk','sword','dino','boom','jumper','fierce','golden','baby','mage','doctor','hitman','elder','reaper','aero'];
  for(const k of order.concat(Object.keys(UPG)))           // the main blobs get first claim on the squad
    if(UPG[k] && UPG[k].kind==='unit' && !(save.lv[k]>0)){ save.lv[k]=1; autoEquip(k); }

  save.slots = TEAM_SLOTS - FREE_SLOTS;           // all ten squad slots

  persist(); SFX.unlock(); SFX.upgrade(); SFX.ready(); flashScreen = 0.8;
}

function fmt(n){ return (n%1) ? n.toFixed(1) : String(n); }

function xpPill(x, y){

function ecoIcon(kind, cx, cy, r){
  X.save();
  if(kind==='flow'){
    // juice droplet with speed lines
    X.beginPath(); X.moveTo(cx, cy-r*1.15);
    X.bezierCurveTo(cx+r*0.95, cy-r*0.15, cx+r*0.8, cy+r*0.9, cx, cy+r*0.9);
    X.bezierCurveTo(cx-r*0.8, cy+r*0.9, cx-r*0.95, cy-r*0.15, cx, cy-r*1.15);
    X.closePath();
    const g=X.createLinearGradient(0,cy-r,0,cy+r);
    g.addColorStop(0,'#bff4ff'); g.addColorStop(0.5,'#3fe0ff'); g.addColorStop(1,'#1470a8');
    X.fillStyle=g; X.fill(); X.lineWidth=3; X.strokeStyle='#0d4f7a'; X.stroke();
    X.fillStyle='rgba(255,255,255,.8)';
    X.beginPath(); X.ellipse(cx-r*0.28, cy+r*0.1, r*0.16, r*0.26, -0.3,0,7); X.fill();
    X.strokeStyle='#9fe6ff'; X.lineWidth=3; X.lineCap='round';
    for(let i=0;i<3;i++){ const yy=cy-r*0.4+i*r*0.45;
      X.beginPath(); X.moveTo(cx-r*1.75, yy); X.lineTo(cx-r*1.25+i*4, yy); X.stroke(); }
  } else if(kind==='armour'){

    X.lineTo(cx+r*0.95, cy-r*0.75); X.lineTo(cx+r*0.8, cy+r*0.35);
    X.quadraticCurveTo(cx, cy+r*1.35, cx-r*0.8, cy+r*0.35);
    X.lineTo(cx-r*0.95, cy-r*0.75); X.closePath();
    const g=X.createLinearGradient(0,cy-r,0,cy+r);
    g.addColorStop(0,'#fff0b8'); g.addColorStop(0.5,'#ffd24a'); g.addColorStop(1,'#9c6a08');
    X.fillStyle=g; X.fill(); X.lineWidth=3; X.strokeStyle='#7a4f05'; X.stroke();
    X.fillStyle='rgba(255,255,255,.65)';
    X.beginPath(); X.ellipse(cx-r*0.3, cy-r*0.35, r*0.22, r*0.4, -0.2,0,7); X.fill();
  } else if(kind==='cannon'){
    // barrel + muzzle flash
    X.save(); X.translate(cx,cy); X.rotate(-0.28);
    X.fillStyle='#2b4a68'; rr(-r*1.1,-r*0.55, r*2.1, r*1.1, r*0.35); X.fill();
    const bg=X.createLinearGradient(0,-r*0.5,0,r*0.5);
    bg.addColorStop(0,'#b7d6ea'); bg.addColorStop(0.45,'#5a83a8'); bg.addColorStop(1,'#20364d');
    X.fillStyle=bg; rr(-r*0.95,-r*0.42, r*1.9, r*0.85, r*0.3); X.fill();
    X.fillStyle='#11212f'; X.beginPath(); X.ellipse(r*0.85,0,r*0.2,r*0.42,0,0,7); X.fill();
    X.save(); X.globalCompositeOperation='lighter';
    const fg=X.createRadialGradient(r*1.0,0,1,r*1.0,0,r*0.9);
    fg.addColorStop(0,'rgba(255,255,255,.95)'); fg.addColorStop(1,'rgba(120,220,255,0)');
    X.fillStyle=fg; X.beginPath(); X.arc(r*1.0,0,r*0.9,0,7); X.fill(); X.restore();
    X.restore();
  } else {
    // juice tank with a fill gauge
    X.fillStyle='#22405a'; rr(cx-r*0.8, cy-r*0.95, r*1.6, r*1.9, r*0.3); X.fill();
    X.save(); rr(cx-r*0.8, cy-r*0.95, r*1.6, r*1.9, r*0.3); X.clip();
    const g=X.createLinearGradient(0,cy-r*0.2,0,cy+r);
    g.addColorStop(0,'#8affc9'); g.addColorStop(1,'#1fb0d8');
    X.fillStyle=g; X.fillRect(cx-r*0.8, cy-r*0.15, r*1.6, r*1.2);
    X.fillStyle='rgba(255,255,255,.35)';
    X.beginPath(); X.ellipse(cx, cy-r*0.15, r*0.8, r*0.14, 0,0,7); X.fill();
    X.restore();
    X.lineWidth=3; X.strokeStyle='#8fd0f7'; rr(cx-r*0.8, cy-r*0.95, r*1.6, r*1.9, r*0.3); X.stroke();
    X.fillStyle='#8fd0f7'; rr(cx-r*0.35, cy-r*1.2, r*0.7, r*0.3, r*0.12); X.fill();
  }
  X.restore();
}

function pips(x, y, lv, max, col){

const LAB_TABS = [
  {nm:'BLOBS',      keys:['blob','chonk','sword','dino','boom','jumper','fierce']},
  {nm:'RARE BLOBS', keys:['golden','baby','mage','doctor','hitman']},
  {nm:'GODLY BLOBS', keys:['elder','reaper','aero']},
  {nm:'UPGRADES',   keys:['flow','tank','armour','cannon']}
];
let labTab = 0, labIdx = 0, labPos = 0;
// a unit you cannot unlock yet is not shown at all — no teasers in the lab
function labKeys(){ return LAB_TABS[labTab].keys.filter(k => !isGated(k) || UPG[k].preview); }
function setLabTab(i){ if(i===labTab) return; labTab=i; labIdx=0; labPos=0; }

function labAccent(k, canEvo){
  if(reinfOn(k)) return '#c06bff';
  if(canEvo || reinfAvail(k)) return '#ffd86a';
  return {blob:'#3fb0f5', golden:'#e2b64a', baby:'#6fd8ef', mage:'#8a6fd6', doctor:'#5fd47a', hitman:'#8f9bb3', chonk:'#ff9236', sword:'#ff5a46', dino:'#35b36a', flow:'#3fe0ff', tank:'#8affc9',
          armour:'#ffd86a', cannon:'#b07dff'}[k] || '#3fb0f5';
}
function labStats(k){
  const U_=UPG[k], lv=save.lv[k], locked=isLocked(k)||capLocked(k);
  const canEvo=evoAvail(k), evolved=evoOn(k);
  let now='', next='';
  if(UPG[k].kind==='unit'){
    const base=U[k], l=Math.max(1,lv);
    const hpRaw=base.hp+base.hpUp*(l-1), dgN=base.dmg+base.dmgUp*(l-1);
    const hpN=Math.round(hpRaw*(evolved?EVO[k].hpMul:1));
    const dgShown=Math.round(dgN*(evolved&&EVO[k].dmgMul?EVO[k].dmgMul:1));
    const hitKind = (base.bolts? base.bolts.n+' BOLTS' : base.coin? 'OUT + BACK' : base.aoe? 'AREA' : 'SINGLE') + (base.once? '  ·  ONCE A BATTLE' : '');
    now  = fmt(hpN)+' HP  ·  '+fmt(dgShown)+' dmg / '+fmt(base.rate)+'s  ·  '+hitKind;
    next = canEvo ? '★ '+EVO[k].nm+':  '+EVO[k].note
                  : fmt(hpRaw+base.hpUp)+' HP  ·  '+fmt(dgN+base.dmgUp)+' dmg';
    if(locked) now = base.hp+' HP  ·  '+base.dmg+' dmg  ·  '+hitKind+'  ·  ¤'+base.cost;
  } else {
    const tag = finOn(k)? '   \u2605 FINALIZED' : reinfOn(k)? '   \u2605 REINFORCED' : '';
    const mul = (reinfOn(k)?(k==='armour'||k==='cannon'?1.5:1.35):1) * finMul(k);
    if(k==='flow'){        now=fmt(income())+' juice / sec'+tag;
                           next= reinfAvail(k)? '\u2605 REINFORCE:  +35% juice per second'
                               : finAvail(k)? '\u2605 FINALIZE:  +30% juice per second'
                               : fmt(Math.round((INCOME[lv]||0)*mul*100)/100)+' juice / sec'; }
    else if(k==='tank'){   now=juiceCap()+' juice max'+tag;
                           next= reinfAvail(k)? '\u2605 REINFORCE:  +35% juice ceiling'
                               : finAvail(k)? '\u2605 FINALIZE:  +30% juice ceiling'
                               : Math.round((CAPS[lv]||0)*mul)+' juice max'; }
    else if(k==='armour'){ now='base '+baseHP()+' HP'+tag;
                           next= reinfAvail(k)? '\u2605 REINFORCE:  +50% base HP, plated'
                               : finAvail(k)? '\u2605 FINALIZE:  +30% base HP'
                               : Math.round((BASE_HP0+80*(lv+1))*mul)+' HP   (+80)'; }
    else {                 now='beam '+cannonDmg()+' dmg'+tag;
                           next= reinfAvail(k)? '\u2605 REINFORCE:  +50% beam, purple'
                               : finAvail(k)? '\u2605 FINALIZE:  +30% beam, red'
                               : Math.round(CANNON_DMG0*(1+0.2*(lv+1))*mul)+' dmg   (+20%)'; }
  }
  return {now, next};
}
function labPortrait(k, cx, cy, r, dim){
  X.save(); X.globalAlpha = dim;
  X.fillStyle='rgba(4,16,26,.55)'; X.beginPath(); X.arc(cx, cy, r, 0, 7); X.fill();
  X.save(); X.beginPath(); X.arc(cx, cy, r, 0, 7); X.clip();
  if(UPG[k].kind==='unit'){
    if(isLocked(k)||capLocked(k)) X.globalAlpha = dim*0.45;
    drawMini(k, cx, cy+r*0.10, r*(k==='chonk'?0.52:0.66), 1, k==='blob'?2:9);
  } else ecoIcon(k, cx, cy, r*0.55);
  X.restore();
  X.strokeStyle='rgba(150,220,255,.30)'; X.lineWidth=2; X.beginPath(); X.arc(cx,cy,r,0,7); X.stroke();
  X.restore();
}

const UNIT_BLURB = {
  chonk:  'Belly-flops on a whole crowd at once.',
  sword:  'Quick, long slash. Fast on its feet.',
  dino:   'Huge reach and one big bite.',
  boom:   'Throws from the back. Hits going out and coming back.',

  aero:   'Rockets in at 10x speed and smashes with a rocket fist. Only 400 HP.'
};
// one carousel card. f = 0 when dead centre, 1 when a full step away
function labCard(k, cx, f){
  const U_=UPG[k], lv=save.lv[k], min=(U_.min===undefined?1:U_.min);
  const cap=capLocked(k), locked=isLocked(k)||cap, gated=isGated(k);
  const canEvo=evoAvail(k)||reinfAvail(k), evolved=evoOn(k)||reinfOn(k);
  const accent=labAccent(k, canEvo);
  const sc = 1 - Math.min(1,f)*0.36, al = 1 - Math.min(1,f)*0.55;
  const w = 340*sc, h = 268*sc, x = cx-w/2, y = 240-h/2;
  const focus = f < 0.55;

  X.save(); X.globalAlpha = al;
  X.fillStyle='rgba(6,22,38,.92)'; rr(x, y, w, h, 18*sc); X.fill();
  X.strokeStyle = focus? accent : 'rgba(140,200,240,.22)'; X.lineWidth = focus?3.5:2; X.stroke();
  if(focus && canEvo){ X.save(); X.globalAlpha=0.10+0.06*Math.sin(T*4);
    X.fillStyle=accent; rr(x,y,w,h,18*sc); X.fill(); X.restore(); }

  // name tab
  const title = (evolved && EVO[k]) ? EVO[k].nm : U_.nm;   // eco tracks reinforce but never evolve
  X.fillStyle='rgba(9,30,48,.95)'; rr(x+14*sc, y-16*sc, w-28*sc, 38*sc, 12*sc); X.fill();
  X.strokeStyle= focus? accent:'rgba(140,200,240,.25)'; X.lineWidth=2; X.stroke();
  X.textAlign='center';
  X.fillStyle = evolved? '#ffe9a8' : '#ffffff';
  X.font='900 '+Math.round((title.length>10?19:23)*sc)+'px ui-rounded, Trebuchet MS, sans-serif';
  X.fillText(title, cx, y+11*sc);

  labPortrait(k, cx, y+92*sc, 52*sc, al);

  // level
  const hiTier = isEco(k) && reinfOn(k);                 // past REINFORCE the row counts 6-10
  const pipLv = hiTier ? Math.max(0, lv-5) : lv, pipMax = hiTier ? 5 : U_.max;
  const pw = pipMax*24*sc;
  if(locked){
    X.fillStyle= gated? '#7f94a6' : '#ffd86a';
    X.font='800 '+Math.round(13*sc)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(cap? 'WIN IT FROM THE BLOB CAPSULE' : gated? 'CLEAR LEVEL '+(UPG[k].gate||1)+' FIRST' : 'READY TO UNLOCK', cx, y+168*sc);
  } else {
    X.save(); X.translate(cx-pw/2, y+158*sc); X.scale(sc,sc);
    pips(0, 0, pipLv, pipMax, evolved? '#ffd86a' : accent); X.restore();
    X.fillStyle= finOn(k)? '#8affc9' : evolved? (reinfOn(k)? '#c06bff':'#ffd86a') : '#a8dcff';
    X.font='800 '+Math.round(13*sc)+'px ui-rounded, Trebuchet MS, sans-serif';
    X.fillText(finOn(k)? 'FINALIZED  \u2605  LEVEL 10 / 10'
             : reinfOn(k)? 'REINFORCED  \u00b7  LEVEL '+lv+' / 10'
             : evolved? 'EVOLVED' : 'LEVEL '+lv+' / '+U_.max, cx, y+190*sc);
  }

  if(focus && UPG[k].kind==='unit'){                     // its abilities, if it has any
    const ab = abilsOfKey(k, evolved);
    if(ab.length){
      X.fillStyle='#ffd9a8'; X.font='800 '+Math.round(11*sc)+'px ui-rounded, Trebuchet MS, sans-serif';
      X.fillText(ab.map(abilText).join('   \u00b7   '), cx, y+262*sc);
    }
  }
  if(focus){
    const st = labStats(k);
    // every line shrinks until it fits inside the card
    const fit = (txt, ty, wt, fs)=>{ const mw = w-28;
      X.font=wt+' '+fs+'px ui-rounded, Trebuchet MS, sans-serif';
      while(fs>8 && X.measureText(txt).width > mw){ fs-=0.5; X.font=wt+' '+fs+'px ui-rounded, Trebuchet MS, sans-serif'; }
      X.fillText(txt, cx, ty); };
    X.fillStyle='#dff2ff'; fit(st.now, y+218*sc, 800, 15);
    if(!(lv>=U_.max && !canEvo) && !locked){
      X.fillStyle= canEvo? '#ffd86a' : '#8ce03e';
      fit((canEvo?'':'▶  ')+st.next, y+244*sc, 800, canEvo?13:14);
    } else if(locked && !gated){
      X.fillStyle='#ffd86a'; fit(UNIT_BLURB[k]||'', y+244*sc, 700, 13);
    }
  }
  X.textAlign='left'; X.restore();
  if(newBlobs().indexOf(k) >= 0) bangBadge(x+w-14*sc, y+4*sc, 15*sc);
  return {x, y, w, h};
}

function drawUpg(dt){
  drawBG(MENU_L, dt);
  X.fillStyle='rgba(6,20,34,.80)'; X.fillRect(0,0,W,H);
  const KEYS = labKeys();
  labIdx = Math.max(0, Math.min(KEYS.length-1, labIdx));
  labPos += (labIdx - labPos) * Math.min(1, dt*12);
  if(Math.abs(labIdx-labPos) < 0.002) labPos = labIdx;

  X.textAlign='center';
  X.font='900 30px ui-rounded, Trebuchet MS, sans-serif';
  X.lineWidth=7; X.strokeStyle='#08192a'; X.strokeText('BLOB LAB', 500, 42);
  const tg=X.createLinearGradient(0,16,0,48); tg.addColorStop(0,'#ffffff'); tg.addColorStop(1,'#b08fff');
  X.fillStyle=tg; X.fillText('BLOB LAB', 500, 42);
  X.textAlign='left';

  buttons=[];
  xpPill(W-196, 12);

  // category tabs
  (function(){
    const tw=142, gap=10, tot=LAB_TABS.length*tw+(LAB_TABS.length-1)*gap, x0=(W-tot)/2, y=56, h=30;
    LAB_TABS.forEach((tb,i)=>{
      const x=x0+i*(tw+gap), on=(i===labTab);
      const hov = mouse.x>=x&&mouse.x<=x+tw&&mouse.y>=y&&mouse.y<=y+h;
      buttons.push({x,y,w:tw,h,fn:()=>{ SFX.click(); setLabTab(i); },dis:false});
      X.save();
      X.fillStyle = on? 'rgba(176,141,255,.92)' : (hov? 'rgba(20,46,70,.95)' : 'rgba(12,32,52,.85)');
      rr(x,y,tw,h,10); X.fill();
      X.strokeStyle = on? '#e2d3ff' : 'rgba(140,200,240,.28)'; X.lineWidth=2; X.stroke();
      X.fillStyle = on? '#ffffff' : '#9dc4de';
      X.font='800 13px ui-rounded, Trebuchet MS, sans-serif';
      X.textAlign='center'; X.fillText(tb.nm, x+tw/2, y+20); X.textAlign='left';
      X.restore();
    });
  })();

  // page dots — under the carousel, clear of the card's name tab
  const n=KEYS.length, dx0=500-(n-1)*11;
  if(n>1) for(let i=0;i<n;i++){
    const on = (i===labIdx);
    X.fillStyle = on? '#ffd86a' : 'rgba(255,255,255,.25)';
    X.beginPath(); X.arc(dx0+i*22, 392, on?5.5:4, 0, 7); X.fill();
  }

  // cards: far ones first so the focused one lands on top
  const order=[];
  for(let i=0;i<n;i++){ const f=Math.abs(i-labPos); if(f<2.2) order.push({i,f}); }
  order.sort((a,b)=> b.f-a.f);
  for(const o of order){
    const cx = 500 + (o.i-labPos)*312;
    const box = labCard(KEYS[o.i], cx, o.f);
    if(o.f > 0.35) buttons.push({x:box.x, y:box.y, w:box.w, h:box.h, fn:()=>{ SFX.click(); labIdx=o.i; }, dis:false});
  }

  // arrows
  const arrow=(x, dir, on)=>{
    const hov = mouse.x>=x-26&&mouse.x<=x+26&&mouse.y>=212&&mouse.y<=268;
    if(on) buttons.push({x:x-26,y:212,w:52,h:56,fn:()=>{ SFX.click(); labIdx+=dir; },dis:false});
    X.save(); X.globalAlpha = on? (hov?1:0.8) : 0.18;
    X.fillStyle='rgba(9,30,48,.9)'; rr(x-26,212,52,56,14); X.fill();
    X.strokeStyle='#7fd0f7'; X.lineWidth=2; X.stroke();
    X.strokeStyle='#cfeeff'; X.lineWidth=6; X.lineCap='round'; X.lineJoin='round';
    X.beginPath(); X.moveTo(x-dir*8, 225); X.lineTo(x+dir*8, 240); X.lineTo(x-dir*8, 255); X.stroke();
    X.restore();
  };
  arrow(40, -1, labIdx>0);
  arrow(W-40, +1, labIdx<n-1);

  // action row
  const k=KEYS[labIdx], U_=UPG[k], lv=save.lv[k];
  const cap=capLocked(k), locked=isLocked(k)||cap, gated=isGated(k);
  const canRe=reinfAvail(k), canFin=finAvail(k), canEvo=evoAvail(k)||canRe, evolved=evoOn(k)||reinfOn(k);
  const maxed = lv>=ecoMax(k) && !canEvo && !canFin, cost=upgCost(k), buy=canBuy(k);
  const accent=labAccent(k, canEvo);
  const label = cap? 'CAPSULE ONLY'
              : maxed? (finOn(k)? 'FINALIZED' : reinfOn(k)? 'REINFORCED' : evolved? 'FULLY EVOLVED' : 'MAXED OUT')
              : gated? 'LOCKED'
              : locked? (buy?'UNLOCK — ':'NEED ')+cost+' XP'
              : canFin? (buy?'FINALIZE!! — ':'FINALIZE NEEDS ')+cost.toLocaleString()+' XP'
              : canRe? (buy?'REINFORCE!! — ':'REINFORCE NEEDS ')+cost.toLocaleString()+' XP'
              : canEvo? (buy?'EVOLVE!! — ':'EVOLVE NEEDS ')+cost+' XP'
              : (buy?'UPGRADE!! — ':'NEED ')+cost+' XP';

/* ================================================================
   BLOB CAPSULE  —  spend a blob ticket, roll a new blob
   ================================================================ */
const CAPSULE_POOL = ['golden','baby','mage','doctor','hitman'];   // RARE — nine pulls in ten
const GODLY_POOL   = ['elder','reaper','aero'];          // GODLY — one pull in ten
const GODLY_CHANCE = 0.10;
function isGodly(k){ return GODLY_POOL.indexOf(k) >= 0; }
let capState = {phase:'idle', t:0, spin:0, spinV:0, prize:null};
const EXCHANGE_XP = 10000, EXCHANGE_GODLY_XP = 15000;   // trade a pull away: rare 10k, godly 15k
function tradeXP(k){ return isGodly(k)? EXCHANGE_GODLY_XP : EXCHANGE_XP; }
function rareKeys(){ return LAB_TABS[1].keys; }
function ownedRares(){ return rareKeys().filter(k => save.lv[k] > 0); }
function unownedRares(){ return rareKeys().filter(k => !save.lv[k]); }
function exchangeNow(cs){
  // only while it is still in your hand: hand it straight back for XP
  const k=cs.prize;
  if(!k || cs.choice) { SFX.deny(); return; }
  if(cs.got==='new'){ save.lv[k]=0; if(save.evo) save.evo[k]=0; }
  else if(cs.got==='level'){ save.lv[k]=Math.max(1, save.lv[k]-1); }
  else { SFX.deny(); return; }
  save.xp += tradeXP(k); persist();
  cs.choice='sold'; SFX.upgrade(); SFX.unlock();
}

function capsuleRoll(useRare){
  if(capState.phase!=='idle' && capState.phase!=='done') return;
  if(!CAPSULE_POOL.length){ SFX.deny(); return; }
  if(useRare){ if((save.rare||0) <= 0){ SFX.deny(); return; } }
  else if((save.tickets||0) <= 0){ SFX.deny(); return; }
  // which shelf: one pull in ten comes off the godly one
  let godly = Math.random() < GODLY_CHANCE;
  let pool = godly ? GODLY_POOL : CAPSULE_POOL;
  if(useRare){                                    // a rare ticket never hands you a duplicate
    const fresh = pool.filter(k => !save.lv[k]);
    if(fresh.length) pool = fresh;
    else {                                        // that shelf is full: try the other one
      const other = (godly? CAPSULE_POOL : GODLY_POOL).filter(k => !save.lv[k]);
      if(other.length){ pool = other; godly = !godly; }
    }
    save.rare--;
  } else save.tickets--;
  persist();
  capState = {phase:'spin', t:0, spin:0, spinV:0, gold:!!useRare, godly,
              prize: pool[(Math.random()*pool.length)|0]};
  SFX.charge();
}

// hand over the prize: first copy unlocks it, a duplicate levels it up, a maxed duplicate pays XP
function capsuleGrant(cs){
  const k=cs.prize;
  if(save.lv[k]===0){ save.lv[k]=1; autoEquip(k); cs.got='new'; }
  else if(save.lv[k] < UPG[k].max){ save.lv[k]++; cs.got='level'; }
  else { save.xp += isGodly(k)? 5000 : 1500; cs.got='xp'; }
  persist();
  if(isGodly(k)){ flashScreen = Math.max(flashScreen, 0.6); shake = Math.max(shake, 10); }   // the jingle already played at the crack
}
/* ---- capsule confetti: only a godly pull gets the full show ---- */
let capFx = [], capRings = [];
const GOD_COLS = ['#ffe36a','#fff6c8','#ffb0f0','#8affc9','#9fe0ff','#ffa94d'];
function capBurst(x, y){
  for(let i=0;i<110;i++){
    const a=Math.random()*Math.PI*2, v=160+Math.random()*520;
    capFx.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-120, r:4+Math.random()*6, t:0, life:1.4+Math.random()*1.2,
      col:GOD_COLS[(Math.random()*GOD_COLS.length)|0], g:520, rot:Math.random()*6, vr:(Math.random()-0.5)*14, conf:Math.random()<0.7});
  }
  capRings.push({x, y, r0:20, r1:420, t:0, life:0.7, col:'#fff6c8', lw:14});
  capRings.push({x, y, r0:10, r1:300, t:0, life:0.55, col:'#ffe36a', lw:8});
  capRings.push({x, y, r0:10, r1:520, t:-0.12, life:0.9, col:'#ffb0f0', lw:5});
}
function drawCapFx(dt){
  for(const q of capRings){
    q.t += dt; if(q.t<0) continue;
    const p=Math.min(1, q.t/q.life), e=1-Math.pow(1-p,3);
    X.save(); X.globalAlpha=(1-p)*0.9; X.strokeStyle=q.col; X.lineWidth=q.lw*(1-p)+1;
    X.beginPath(); X.arc(q.x, q.y, q.r0+(q.r1-q.r0)*e, 0, 7); X.stroke(); X.restore();
  }
  capRings = capRings.filter(q=>q.t<q.life);
  for(const f of capFx){
    f.t += dt; f.vy += f.g*dt; f.vx *= (1-1.2*dt); f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    const a = Math.min(1, (f.life-f.t)/0.4);
    X.save(); X.globalAlpha=Math.max(0,a); X.translate(f.x, f.y); X.rotate(f.rot); X.fillStyle=f.col;
    if(f.conf){ X.fillRect(-f.r, -f.r*0.45, f.r*2, f.r*0.9); }
    else { X.beginPath(); for(let i=0;i<4;i++){ const aa=i*Math.PI/2; X.lineTo(Math.cos(aa)*f.r*1.3, Math.sin(aa)*f.r*1.3);
             X.lineTo(Math.cos(aa+Math.PI/4)*f.r*0.35, Math.sin(aa+Math.PI/4)*f.r*0.35); } X.closePath(); X.fill(); }
    X.restore();
  }
  capFx = capFx.filter(f=>f.t<f.life && f.y<H+40);
}

function drawCapsuleMachine(cx, cy, r, spin, open, glow){
