<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrestling Legends · frogarcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; background:#0b0b10; overflow:hidden}
  body{display:flex; flex-direction:column; height:100dvh; font-family:'Space Grotesk',system-ui,sans-serif; color:#f4f4f8}
  .bar{flex:none; height:48px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
    padding:0 12px; padding-left:max(12px, env(safe-area-inset-left)); padding-right:max(12px, env(safe-area-inset-right));
    background:linear-gradient(180deg,#15151d,#0f0f15); border-bottom:1px solid #ffffff14}
  .back{justify-self:start; display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 14px 0 10px;
    border-radius:99px; border:1px solid #ffffff26; background:#ffffff0a; color:#f4f4f8; text-decoration:none;
    font-size:15px; font-weight:600; transition:background .15s, border-color .15s}
  .back:hover,.back:focus-visible{background:#ffffff18; border-color:#ffffff40; outline:none}
  .back svg{width:16px; height:16px}
  .title{color:#a2a2b5; font-size:14px; font-weight:500; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  iframe{flex:1; width:100%; border:0; display:block; background:#000}
  @media (max-height:500px){ .bar{height:38px} .back{height:28px; font-size:14px} }
</style>
</head>
<body>
  <header class="bar">
    <a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Games</a>
    <span class="title">Wrestling Legends</span>
    <span></span>
  </header>
  <iframe id="game" src="play.html" title="Wrestling Legends" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <script>
    // send the keyboard straight into the game
    const f = document.getElementById('game');
    f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) {} });
  </script>
</body>
</html>
